services:
  nesupe:
    build: .
    ports:
      # 既定ではネットワーク上の他の端末（サーバ）からも接続できます。認証はないので、
      # 信頼できるネットワークでのみ使ってください。このPCからのみにする場合は
      # BIND=127.0.0.1 を指定してください。
      - "${BIND:-0.0.0.0}:${PORT:-18420}:8080"
    volumes:
      # 解答・履歴などの保存先（./data/state.json）
      - ./data:/data
    restart: unless-stopped
