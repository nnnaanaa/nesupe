  var MODEL_DATA = {"h1-1-1": {"a": "SHA-1", "e": "MD5と並んで、衝突（同じハッシュ値になる別データ）が見つかり安全性が不十分とされるハッシュアルゴリズムです。TLS 1.2以上ではSHA-256以上を使えるため、これらを使わずに済みます。"}, "h1-1-2": {"a": "1.2", "e": "TLS 1.2からは、ハンドシェイクや鍵導出でMD5・SHA-1の組合せに頼らず、SHA-256などのハッシュを使えます。そのため「MD5又はSHA-1を使わないで済む最低限のバージョン」は1.2です。"}, "h1-1-3": {"a": "Client_Hello", "e": "SSL/TLSのハンドシェイクは、クライアントがClient_Helloで「使えるバージョンと暗号スイートの一覧」を送るところから始まります。"}, "h1-1-4": {"a": "Server_Hello", "e": "サーバがServer_Helloで、クライアントの候補の中から使用するバージョンと暗号スイートを選んで返します。これで以降に使う暗号スイートが決まります。"}, "h1-1-5": {"a": "リバースプロキシ", "e": "SSL-VPNの動作方式は、リバースプロキシ方式（Webアプリ中心）、ポートフォワーディング方式（指定ポートのTCP通信）、L2フォワーディング方式（レイヤ2の中継）の3つです。"}, "h1-2-1": {"a": "暗号アルゴリズム：①鍵交換 ②認証\nハッシュアルゴリズム：メッセージ認証", "e": "暗号スイートは「鍵交換」「認証（署名）」「アプリケーション層の暗号化」「ハッシュ（メッセージ認証）」の組合せです。設問の「2種類の暗号アルゴリズム」は、アプリ層の暗号化以外の鍵交換と認証にあたり、ハッシュはメッセージ認証（改ざん検出）に使われます。"}, "h1-2-2": {"a": "顧客システムは、様々なプロトコルを利用している。", "e": "リバースプロキシ方式やポートフォワーディング方式は、対応するアプリ・ポートが限られます。H社の顧客システムは利用プロトコルが様々なので、プロトコルを問わず通せるL2フォワーディング方式が適します。"}, "h1-2-3": {"a": "vNIC", "e": "L2フォワーディング方式では、PCに仮想NIC（vNIC）が作られ、SSL/TLSトンネル上でレイヤ2の中継を行います。認証に応じて割り当てられたIPアドレスは、この仮想NICに設定されます（物理NICは元のネットワーク用のまま）。"}, "h1-3-1": {"a": "内部LAN", "e": "表1の1行目は、内部LANからDMZ（プロキシサーバ経由でインターネットへ向かう通信）のルールです。"}, "h1-3-2": {"a": "DMZ", "e": "内部LAN→DMZのルールです。内部LANのWebアクセスはDMZのプロキシサーバを経由します。"}, "h1-3-3": {"a": "172.16.0.0/16", "e": "送信元は内部LAN全体（172.16.0.0/16）です。"}, "h1-3-4": {"a": "202.y.44.2/32", "e": "インターネットからDMZへ許可するTCP/443は、SSL-VPN装置（202.y.44.2）宛のみです。DMZ内のほかの機器には通さないよう、宛先を1ホスト（/32）に絞ります。"}, "h1-4-1": {"a": "②，③，④，⑤", "e": "表2は「172.16.0.0/16宛を禁止、それ以外は許可」です。開発LAN（VLAN101＝⑤）から顧客システム構築ネットワークへの直接アクセスと、顧客システム構築ネットワーク同士（VLAN1〜3＝②③④）の通信を、それぞれの入力方向で止めるため、②③④⑤に設定します。"}, "h1-4-2": {"a": "顧客システム構築ネットワークから他社の顧客システム構築ネットワークへの通信", "e": "表2を②③④（顧客システム構築ネットワーク側）の入力方向に設定すると、「それ以外の不正な通信」として、ある顧客のネットワークから他社の顧客のネットワークへの通信が禁止されます。"}, "h1-4-3": {"a": "⑥", "e": "VPN-PCはSSL-VPN装置の内側（VLAN201）経由で入ってきます。この入口にあたる⑥の入力方向に表3を設定し、自社に対応する顧客システム構築ネットワーク以外へのアクセスを禁止します。"}, "h2-1-1": {"a": "バーストトラフィック", "e": "一時的に大量の帯域を使う、瞬間的に集中する通信のことです。プリントデータの送信がこれにあたります。"}, "h2-2-1": {"a": "導入前：ファイル転送通信\n導入後：画面転送通信、プリント通信", "e": "VDI導入後は、ファイル転送はVDIサーバとファイルサーバの間（本社内）で完結し、インターネット通信も本社の仮想PCから出るため、広域イーサ網を通らなくなります。支店のTCと本社のVDIサーバの間では画面転送通信が流れ、プリント通信は本社の仮想PCから支店のプリントサーバへ流れます。"}, "h2-2-2": {"a": "1.25", "e": "現行の安全率＝契約帯域÷ピーク時の必要帯域です。支店は100M÷（800M÷10支店＝80M）＝1.25、本社は1G÷800M＝1.25で、どちらも1.25です。"}, "h2-2-3": {"a": "100", "e": "VDI導入後に広域イーサ網を通る必要帯域は、画面転送通信のみです。支店は40人×200kビット/秒＝8Mなので、全10支店で80Mです。安全率1.25を掛けて80M×1.25＝100M。"}, "h2-2-4": {"a": "10", "e": "各支店は40人×200kビット/秒＝8Mビット/秒。安全率1.25を掛けて8M×1.25＝10Mビット/秒です。"}, "h2-2-5": {"a": "理由：インターネット通信は本社の仮想PCから行われるから。\n利点：情報セキュリティ対策を本社で集中的に行うことができる。", "e": "仮想PCは本社のVDIサーバ上にあり、インターネットへの通信は本社の仮想PCから出ます。そのため支店のインターネット回線は不要です。出口が本社の1か所になり、UTMなどの対策を集中して行えます（設問が「利点」を問うているので、利点も必ず書きます）。"}, "h2-3-1": {"a": "プリント通信が画面転送通信を圧迫するから。", "e": "プリント通信は帯域を確保しない（量も把握できない）ため、一時的に大量の帯域を使い、同じ広域イーサ網を通る画面転送通信の帯域を奪います。その結果TCの画面更新が遅れ、操作性が悪化します。"}, "h2-3-2": {"a": "送出タイミングを調整する。", "e": "シェーピングは、超過分を破棄せずバッファに溜めて送出タイミングを遅らせ、契約帯域に収める制御です。「パケットを破棄する」はポリシングの動作なので誤りです（採点講評でも誤答が多かった点として挙げられています）。"}, "h2-4-1": {"a": "仮想SW", "e": "仮想PCは仮想SWとの接続で外部と通信するので、隔離するには仮想SWから切り離します（物理的にLANケーブルを抜くことの代わり）。"}, "h2-4-2": {"a": "任意", "e": "感染した仮想PCだけでなく、他の仮想PCも含めてC&Cサーバへの通信を防ぐので、送信元は特定せず「任意」とします。"}, "h2-4-3": {"a": "C&Cサーバ", "e": "標的型攻撃対策装置が特定したC&CサーバのIPアドレスを宛先に指定し、インターネット方向の通信を拒否します。"}, "h3-1-1": {"a": "NAPT", "e": "プライベートIPアドレスの端末がインターネットに出るとき、IPアドレスとポート番号を同時に変換する仕組みです（IPマスカレード）。"}, "h3-1-2": {"a": "事前共有鍵", "e": "IKEフェーズ1の認証方式の一つで、両方の機器にあらかじめ同じ鍵（PSK）を設定します。"}, "h3-1-3": {"a": "AS", "e": "同じルーティングポリシで管理されるルータの集まりが自律システム（AS）で、BGPはAS間で経路交換を行うプロトコルです。AS番号が割り当てられます。"}, "h3-1-4": {"a": "TCP", "e": "BGPはTCPのポート179番を使い、BGPピアのコネクションを確立して経路情報を交換します。"}, "h3-1-5": {"a": "ICMP", "e": "pingはICMPのecho requestを送り、echo replyが返ることで到達性を確認します（RFC 792）。"}, "h3-1-6": {"a": "echo reply", "e": "監視対象が返すICMPのパケットはecho replyです。"}, "h3-2-1": {"a": "暗号化対象の通信がグローバルIPアドレス間の通信だから。", "e": "トランスポートモードは元のIPヘッダを残したままペイロードを暗号化します。今回はIP in IPで外側にVPNルータ間のグローバルIPアドレスのヘッダが付いており、IPsecで暗号化する通信そのものがグローバルIPアドレス間の通信です。新たにIPヘッダを付けるトンネルモードは不要になります。"}, "h3-2-2": {"a": "フラグメントとリアセンブルの処理が発生する。", "e": "IP in IPで外側のIPヘッダが加わり、さらにIPsecで暗号化すると、1,500バイトのMTUを超えます。そのためVPNルータでIPパケットの分割（フラグメント）と再構成（リアセンブル）が必要になり、処理負荷と遅延が増えます。"}, "h3-3-1": {"a": "BGPによって回線断や機器障害を検知し、トラフィックをう回できる。", "e": "静的経路では、障害が起きても経路が自動で切り替わりません。BGPでは、ピアの断絶を検知して経路を取り消し、別の経路（スタンバイ側）へ自動的に迂回できます。"}, "h3-3-2": {"a": "Helloパケットを出さない。", "e": "OSPFのパッシブインタフェースは、Helloパケットを送らず、隣接関係（ネイバー）を作りません。ただし、そのインタフェースのネットワークは経路として広告できます。トンネルインタフェースは経路交換が不要なので、パッシブにします。"}, "h3-3-3": {"a": "大きく", "e": "OSPFではコストが小さい経路が優先されます。VPNb1側をスタンバイにするには、VPNa1側よりコストを大きくします。"}, "h3-3-4": {"a": "eBGPからOSPFへ再配布された経路を、再びeBGPへ再配布しない。", "e": "OSPFとBGPの間で相互に再配布すると、経路情報がぐるぐる回るループが生じ得ます。BGPで受けてOSPFに再配布した経路を、再びBGPへ戻さないよう制御します。IPの経路制御でもループは起こり得ます（STPはレイヤ2のループ対策なので誤りです）。"}, "h3-4-1": {"a": "ネットワーク接続の冗長構成が失われたことを検出するため。", "e": "VPNトンネルは常用側とスタンバイ側の2本あります。片方のトンネルが切れても通信は続きますが、冗長が失われた状態を放置すると次の障害で全断になります。そのため両方を常に監視し、冗長構成の喪失を検知します。"}, "s1-1-1": {"a": "リバースプロキシ", "e": "SSOの方式は、各サーバにエージェントを入れるエージェント方式と、SSOサーバが全ての通信を中継するリバースプロキシ方式に分かれます。"}, "s1-1-2": {"a": "リダイレクト", "e": "アクセスチケットがない場合、Webアプリケーションサーバ内のエージェントはHTTPのリダイレクトでPCをSSOサーバへ誘導します。認証後にSSOサーバが元のサーバへ戻すときも、同じくリダイレクトです。"}, "s1-1-3": {"a": "Set-Cookie", "e": "サーバがCookieを発行するときはHTTP応答のSet-Cookieヘッダを使います。ここにDomain属性が付いていないと、Cookieが発行元のサーバにしか送られず、営業システムと広告システムに共通で使えません。"}, "s1-1-4": {"a": "内部DNS", "e": "PCがsso.a-sha.example.jpを引いたときにLBのVIPが返るよう、内部DNSサーバに登録します（図1に内部DNSサーバがあります）。"}, "s1-1-5": {"a": "ループバック", "e": "DSR方式では、SSOサーバはVIP宛のパケットを受け取れる必要があります。ただしVIPに対するARPには応答させたくないので、VIPは物理NICではなくループバックインタフェースに付与します。"}, "s1-2-1": {"a": "⑤", "e": "⑤で、SSOサーバがUserIDとPasswordの確認後にアクセスチケットを発行し、Cookieに含めてPCへ応答します。PCはこの時点でアクセスチケットを得ます。"}, "s1-3-1": {"a": "a-sha.example.jp", "e": "表1のURLは、sso／eigyou／koukokuの各ホスト名の後ろが共通の「a-sha.example.jp」です。この親ドメインをDomain属性に指定すると、3つのサーバのどれに接続してもCookieが送られ、SSOが成立します。"}, "s1-3-2": {"a": "CookieにSecure属性を付ける。", "e": "Secure属性付きのCookieは、ブラウザがHTTPS接続でしか送りません。予期しないHTTP接続が発生しても、Cookieが平文で流れません。（単に「通信を暗号化する」では不十分です。採点講評でも、Secure属性の仕組みの理解が課題とされています）"}, "s1-4-1": {"a": "SYNパケットにはレイヤ7情報が含まれていないから。", "e": "DSR方式のLBは、TCPコネクション確立のSYNパケットが届いた時点で振り分け先を決めます（要点(2)）。この時点ではCookieなどのレイヤ7情報がまだ届いていないので、それらに基づく振り分けはできません。"}, "s1-4-2": {"a": "Gratuitous ARP（GARP）", "e": "IPアドレスの重複検知には、自分のIPアドレスを問い合わせるGratuitous ARPを使います。応答があれば、同じIPアドレスを持つ機器が他にあると分かります。"}, "s1-4-3": {"a": "VIPアドレスに対するARPリクエストに応答しないように設定する。", "e": "ループバックにVIPを付けたSSOサーバがVIPのARPに応答すると、LBとSSOサーバがVIPに対して応答することになり、重複エラーになります。そのためSSOサーバ側でVIPのARPには応答しないよう設定します。"}, "f1-1-1": {"a": "スループット", "e": "LBの仕様には、1秒当たりの転送データ量としてスループット（bps）が書かれています。"}, "f1-1-2": {"a": "パケット", "e": "LBが1秒に処理できるパケット数（pps）には上限があります。そのため、パケット長が短いと、実際に出せる最大スループットは仕様値より小さくなります。"}, "f1-1-3": {"a": "維持", "e": "Active-Active構成では、FWの故障時に別のFWへ振り分けられます。ただしFWのステートフルインスペクションのセッション情報は引き継がれないので、既存のセッションを維持できません。"}, "f1-2-1": {"a": "(A) 宛先IPアドレス：機器b\n(A) 宛先MACアドレス：FW1\n(B) 宛先IPアドレス：機器b\n(B) 宛先MACアドレス：FW2", "e": "ルータaの経路表では、サブネットb1宛のゲートウェイはFW1です。そのためルータaはFW1のMACアドレスを宛先にして送ります（A）。LBaはこれをブリッジのように中継しつつ、宛先MACアドレスだけを振り分け先のFW2のものに書き換えます（B）。IPアドレスは書き換えません。"}, "f1-2-2": {"a": "宛先IPアドレスを書き換えられない。", "e": "FWはセッションの終端ノードではなく、通過するだけです。そのため、サーバ負荷分散のように仮想IPアドレスから実IPアドレスへ宛先を書き換える方式は使えず、MACアドレスの書き換えで振り分けます。"}, "f1-2-3": {"a": "セッション単位に、2台のLBが同じFWを選択する。", "e": "FWはステートフルインスペクションを行うため、行きと戻りのパケットが同じFWを通らなければ、戻りのパケットが不正と判断されて破棄されます。LBaとLBbが同じセッションに同じFWを選ぶ必要があります。"}, "f1-3-1": {"a": "故障発生時の性能を不足させないため。", "e": "必要な処理能力が現行の1.4倍以上なので、2台のActive-Activeでは1台が故障すると不足します。3台にすれば、1台故障しても残り2台で性能を満たせます。"}, "f1-3-2": {"a": "あ：99\nい：180", "e": "LB3はインターネット側にあるので、インターネット⇔社内NW（89）とインターネット⇔DMZ（10）を扱い、あ＝99です。LB4は社内NW側で、社内NWの通信は全てProxyを経由するため、PC→Proxyの通信とProxy→FW方向の通信の両方を扱います。社内NW⇔(インターネット・DMZ)の90が二重になり、い＝180です（採点講評でも「LB4が最も高負荷」と説明されています）。"}, "f1-3-3": {"a": "FWを経由するLB間の経路の障害を検出できる。", "e": "下線④は、対向するLBとの間で、経由するFWを変えながらヘルスチェックパケットをやり取りする方式です。FWそのものの故障だけでなく、FWを経由するLB間の経路の障害も検出できます。LBが直接FWに送る方式ではそこまで分かりません。"}, "f1-3-4": {"a": "タイムアウトを待たずにコネクションの切断を検知できる。", "e": "両端のノードにRSTを送ると、各ノードはFWの故障で届かなくなったコネクションを、タイムアウトを待たずに切断として認識し、すぐに再接続できます。"}, "i1-1-1": {"a": "アノマリ（異常検知）", "e": "IDSの検知方式には、既知の攻撃パターンで検知するシグネチャ型と、正常な状態や仕様からの逸脱を検知するアノマリ型（異常検知型）があります。"}, "i1-1-2": {"a": "ミラー（ミラーリング）", "e": "IDSはSWのミラーポート（ミラーリングポート）に接続し、監視対象の通信のコピーを受け取ります。"}, "i1-1-3": {"a": "プロミスキャス", "e": "プロミスキャスモードにすると、宛先が自分宛でないフレームも取り込めます。"}, "i1-1-4": {"a": "IP", "e": "監視用のポートにIPアドレスを付けなければ、そのポートはL3レベルで通信できず、IDS自体が攻撃を受けることを避けられます。"}, "i1-1-5": {"a": "unreachable", "e": "UDPの不正パケットには送信元へICMPのport unreachable（宛先ポート到達不能）を返し、攻撃の抑止を試みます。"}, "i1-2-1": {"a": "追加する通信の範囲：インターネット⇔内部LAN\nSW1：○　SW2：×　SW3：○", "e": "表1に無い組合せは「インターネット⇔内部LAN」です。この通信は、インターネット側のSW1と内部LAN側のSW3を通りますが、DMZ側のSW2は通りません。"}, "i1-2-2": {"a": "FWのACLを動的に変更して、遮断の対象とする送信元アドレスを追加する。", "e": "IDSが不正を検知すると、FWにそのアドレスを通知し、FWのアクセス制御リストに遮断対象の送信元アドレスを動的に追加させます。"}, "i1-2-3": {"a": "不正アクセスの送信元アドレスが偽装されている可能性があるから。", "e": "送信元アドレスが偽装されていると、抑止のICMPパケットが無関係な第三者に届き、その第三者への攻撃になりかねません（本文の「他のサイトへの攻撃となることもある」）。"}, "i1-3-1": {"a": "保護する機器にセキュリティパッチを適用するまでの間、脆弱性を悪用する攻撃の通信を遮断する。", "e": "いわゆる仮想パッチです。サーバに新しい脆弱性が見つかり、影響確認に時間が掛かって実パッチをすぐ当てられない間、IPSが脆弱性を突く通信を遮断して時間を稼ぎます。"}, "i1-3-2": {"a": "通信をそのまま通過させ、遮断しない機能。", "e": "IPSは通信の経路上に置かれるので、IPSが故障すると通信全体が止まります。そのため、故障時には通信をそのまま通過させるバイパス（フェイルオープン）の機能を使います。"}, "i1-3-3": {"a": "不正アクセスへの対応を最適化するために、ログを取得して解析する。", "e": "IDS・IPSは誤検知（フォールスポジティブ）と見逃し（フォールスネガティブ）が起こり得ます。管理用PCでログを収集・解析して、設定やシグネチャを見直し、対応を継続的に最適化します。"}, "t1-1-1": {"a": "MX", "e": "他のドメイン宛のメールの配送先は、DNSのMXレコードで決まります。"}, "t1-1-2": {"a": "MSV3", "e": "DNS3が答えるMXレコードはA社のメールサーバ（MSV3）です。社内PCはMSV3に届いたメールをPOP3で取得します。"}, "t1-1-3": {"a": "MSV2", "e": "B社はQ社のメールサービスを使っており、Q社のメールサーバはMSV2です。"}, "t1-1-4": {"a": "SMTP-AUTH", "e": "SMTPプロトコル上でユーザ認証を行う方式はSMTP-AUTHです。"}, "t1-2-1": {"a": "不正メールの踏み台にされてしまうリスク。", "e": "認証なしにa-sha.co.jp以外宛のメールを転送する設定だと、誰でも外部宛のメールを中継させられるオープンリレーになり、迷惑メールの踏み台にされます。"}, "t1-2-2": {"a": "ルータ4", "e": "OP25Bは、サービスネットワーク内の動的IPアドレスのホストから、サービスネットワーク外へ向かう宛先ポート25のSMTPを禁止します。サービスネットワークとインターネットの境界は、Q社のルータ4です。"}, "t1-2-3": {"a": "オ：TCP\nカ：a.b.0.0/20\nキ：25", "e": "項番1は「禁止」で、TCPのポート25宛、送信元はQ社が動的に割り当てるアドレスブロック（a.b.0.0/20）です。項番2で、それ以外のIP通信を許可します。"}, "t1-2-4": {"a": "サブミッションポート", "e": "メールクライアントからメールサーバへ送信するときは、認証付きのサブミッションポート（TCP 587）を使います。"}, "t1-2-5": {"a": "110\n587", "e": "外部（B社）からDMZのMSV3へは、受信のPOP3（110番）と、送信のサブミッション（587番）の2種類を通します。本文でSTARTTLS方式（平文で接続して途中で暗号化に切り替える方式）とされているので、暗号化専用のポート（POP3Sの995、SMTPSの465）ではなく、元のポートです（採点講評でも誤答が多い点とされています）。"}, "t1-3-1": {"a": "MAIL FROM", "e": "SMTP通信の中でやり取りされる送信元（エンベロープの送信元）は、MAIL FROMコマンドで通知されます。"}, "t1-3-2": {"a": "送信元メールサーバのIPアドレス", "e": "SPFは、DNSのSPFレコードに登録された正当なメールサーバのIPアドレスと、実際にSMTP接続してきた送信元メールサーバのIPアドレスを照合します。"}, "q1-1-1": {"a": "AES", "e": "WPA2は、暗号化にAES（CCMP）を必須とした最初の方式です。（WPAはTKIPです）"}, "q1-1-2": {"a": "事前共有鍵", "e": "あらかじめ同じパスフレーズ（鍵）を設定する認証は、事前共有鍵（PSK）方式です。"}, "q1-1-3": {"a": "SIMカード", "e": "通信事業者が契約者を識別するための情報（IMSIなど）は、SIMカードに記録されています。"}, "q1-1-4": {"a": "APN", "e": "LTE回線で接続先のネットワークを指定する情報は、APN（Access Point Name）です。"}, "q1-1-5": {"a": "NAPT", "e": "プライベートIPアドレスのタブレットが、1つのグローバルIPアドレスでインターネットと通信するため、IPアドレスとポート番号を変換するNAPTが行われます。"}, "q1-1-6": {"a": "CONNECT", "e": "HTTPSプロキシは、クライアントのHTTP CONNECTメソッドの要求で、接続先へのTLSトンネルを中継します。"}, "q1-2-1": {"a": "定期的に送信するビーコン信号を停止する。", "e": "ステルス機能は、アクセスポイントがビーコンにSSIDを載せて発信するのをやめる機能です（クライアントの一覧にSSIDが出ない、というクライアント側の効果ではなく、アクセスポイント側の動作を答えます）。"}, "q1-2-2": {"a": "SSIDやMACアドレスは暗号化できず、傍受されるから。", "e": "無線LANは電波で通信するので、誰でも傍受できます。WPA2の暗号化は通信データを守るものですが、SSIDやMACアドレスは暗号化の対象にできず、そのまま見えてしまいます。"}, "q1-2-3": {"a": "E", "e": "タブレットはDHCPで（A）のプライベートIPアドレスをもらい、VPN接続後は（E）のプライベートIPアドレスが割り当てられます。（A）と（E）のアドレスが重複すると、タブレットはE社内への通信を自分のネットワーク（A）宛と判断して、VPNに送らなくなります。"}, "q1-3-1": {"a": "VPN接続の利用者IDを停止する。", "e": "端末とハードウェアトークンの両方が紛失している場合、利用者IDが悪用されるおそれがあるため、直ちにそのIDを使えないようにします。"}, "q1-3-2": {"a": "プロキシサーバと内部DNSサーバへの通信", "e": "本文では、タブレットから販売管理サーバ及びインターネットへの通信は、プロキシサーバ経由、名前解決は内部DNSサーバと決められています。VPN接続で許可するのは、この2つへの通信に絞ります。"}, "q1-4-1": {"a": "機能名：プロキシ認証\n設定内容：営業員ごとに利用者IDを登録する。", "e": "プロキシサーバのログから営業員を特定するには、プロキシ認証を行い、営業員ごとに利用者IDを登録して、ログに利用者IDが残るようにします。"}, "q1-4-2": {"a": "接続先ホスト名\n接続先ポート番号", "e": "HTTPSでは、プロキシが見えるのはCONNECTメソッドのRequest-URI（ホスト名:ポート番号）だけで、TLSトンネルの中のURLやデータは見えません。"}, "t3-1-1": {"a": "a：ゾーン転送\nb：SMTP", "e": "セカンダリDNSは、NOTIFYを受け取ると、プライマリDNSにゾーン転送を要求して、ゾーン情報を更新します。表1の項番1と2は、MGWとMSVの間のメール転送で、プロトコルはSMTPです。"}, "t3-1-2": {"a": "DNS1", "e": "項番3の送信元はDNS3（セカンダリ）で、プライマリDNSは、セカンダリDNSとだけ通信します。DNS3の通信相手はプライマリのDNS1です。"}, "t3-1-3": {"a": "公開ゾーン情報の更新通知", "e": "項番4のDNS1→DNS3は、プライマリDNSからセカンダリDNSへのNOTIFYです。DNS3は公開ゾーン情報だけを持つので、公開ゾーン情報の更新通知が送られます。"}, "t3-1-4": {"a": "条件：送信元が少数の場合\n理由：送信元は、DNSのキャッシュが生存している間、宛先を変えないから。", "e": "MGWからMSVへの送信元はMGWの2台だけなので、DNSのキャッシュが生存する間はどちらもキャッシュした同じ宛先に送り続け、宛先が偏ります。PCからMSVへの通信と違い、送信元が少数だとラウンドロビンの平準化効果が働きません。"}, "t3-2-1": {"a": "d：新MSV1\ne：新MSV2", "e": "VRRPを2グループ設定します。VRRPg1は新MSV1の優先度を高く、VRRPg2は新MSV2の優先度を高くして、2台でActive-Activeにします。"}, "t3-2-2": {"a": "msvc：VIP1\nmsvc：VIP2", "e": "PCが共通のホスト名msvcを引くと、VIP1とVIP2の2つが順番に返るよう、同じホスト名のAレコードを2件登録します（DNSラウンドロビン）。"}, "t3-3-1": {"a": "機器名：FW\n設定変更内容：新MSVとMGWとの間のSMTP通信を、双方向とも許可する。", "e": "表1のFWの許可ルールは旧MSV（MSV1～3）が対象です。移行中NWでは新MSVとMGWの間でもSMTPが流れるので、FWに許可を追加します（MGWの転送先変更とDNSの設定変更は設問で除かれています）。"}, "t3-3-2": {"a": "送信元：メール送受信サーバの変更を実施済みの社員、又は社外\n宛先：未変更社員", "e": "移行工程では、開始工程でMGWの転送先がVIP1（新MSV1）に変わっています。新MSVに届いた未変更社員宛のメールは、MBOXがまだ旧MSVにあるので、新MSVがLDAPの情報でメールルーティングして旧MSVへ回す必要があります。"}, "t3-3-3": {"a": "(A)：新MSV→旧MSV\n(B)：旧MSV", "e": "(ア)：社外→MGW→新MSV1（転送先がVIP1）→未変更社員のMBOXがある旧MSVへ、LDAPを使ってルーティング。(イ)：未変更社員のPCは旧MSVを使い続けているので、PC→旧MSV→MGW→宛先となります。"}, "t3-3-4": {"a": "申請者のメールアドレスに対応するメールサーバが、新MSVに変更される。", "e": "LDAPには、メールアドレスと、そのMBOXを収容するMSVとの対応が登録されています。社員が申告すると、その社員のアドレスに対応するMSVが旧MSVから新MSVに書き換えられます。"}, "a1-1-1": {"a": "帯域幅（通信速度）", "e": "ルータのOSPFコストは、標準では物理ポートの帯域幅（通信速度）を基準に自動計算されます（帯域が大きいほどコストが小さい）。この設問では、経路を方針どおりにするため、コストを図1の値（cost 20、cost 10）に手動で設定しています。"}, "a1-1-2": {"a": "0", "e": "OSPFのバックボーンエリアのエリア番号は0（0.0.0.0）で、必ず存在しなければならず、他のエリアは必ずバックボーンに隣接します。"}, "a1-1-3": {"a": "TOS", "e": "DiffServは、IPv4ヘッダのTOSフィールド（8ビット）をDSフィールドとして再定義し、上位6ビットのDSCPで優先度を示します。"}, "a1-1-4": {"a": "DiffServ（Differentiated Services）", "e": "RFC 2474で規定された、パケットごとにDSCPで優先度を示す、クラス単位のQoSモデルです。"}, "a1-1-5": {"a": "高く", "e": "PBRは、宛先だけでなくパケットの種類（プロトコルや通信の内容）で経路を選ぶ機能です。CIFSのパケットをWASへ回すためには、通常の経路制御（OSPF）よりPBRを優先させる必要があるので、優先度は「高く」します。"}, "a1-2-1": {"a": "デフォルトゲートウェイの設定：業務系セグメントに対応した仮想ルータのIPアドレス\nVRRPの設定：業務系セグメントの仮想ルータがルータ3でアクティブになるようにプライオリティ値を設定する。", "e": "PCのデフォルトゲートウェイを、ルータ3・4の実IPアドレスでなく、業務系セグメントのVRRPの仮想ルータのIPアドレスにします。そうすれば、ルータが切り替わってもPCの設定を変えずに済みます。通常時に業務系セグメントの通信を「ルータ1とルータ3」経由にするため、業務系セグメントの仮想ルータはルータ3でアクティブになるよう、ルータ3のプライオリティを高く設定します（動画系はルータ4）。採点講評でも、単に通信経路を説明しただけの解答が多かったとされています。"}, "a1-2-2": {"a": "10.1.0.0/16", "e": "支部1のセグメントは、業務系10.1.1.0/24と動画系10.1.2.0/24です。本文「ABRで最もプレフィックスが短くなるように経路情報の集約を行う」とあるので、両方を含む最も短いプレフィックスの10.1.0.0/16に集約します。"}, "a1-2-3": {"a": "a：ルータ1 → ルータ3\nb：ルータ2 → ルータ1 → ルータ3", "e": "通常は「動画サーバ → L2SW → ルータ2 → ルータ4 → L2SW → PC」です。a：ルータ2本体が故障すると、動画系の通信は、動画系セグメント側のL2SWからルータ1へ出て、広域イーサ網1経由でルータ3に入ります（動画系も業務系の経路を使う）。b：ルータ4のp10（広域イーサ網2側のポート）が故障すると、ルータ2からは、ルータ1を回って広域イーサ網1経由でルータ3に入ります。"}, "a1-2-4": {"a": "利用者をグループ化して使用時間帯をずらす。", "e": "広域イーサ網の一方が使えないとき、業務系のアクセスが集中して応答が悪化するのを防ぐ運用上の方策です。利用者をグループに分けて、アクセスする時間帯をずらします。（採点講評では(4)の正答率は高かったとされています）"}, "a1-3-1": {"a": "IPアドレス\nポート番号", "e": "CIFS（SMB）のパケットを識別するには、宛先IPアドレス（FSのアドレス）と、宛先ポート番号（TCP 445など）を使います。第3層はIPアドレス、第4層はポート番号です。"}, "a1-3-2": {"a": "ラウンドトリップ時間が大きい場合", "e": "WASは、一方のWASが代理応答（FS側の代わりにクライアントへ応答）して、データをまとめて送ります。ラウンドトリップ時間（遅延）が大きいほど、1回ずつ待ち合わせる通信のむだが大きいので、まとめ送りと代理応答の効果が大きくなります。"}, "a1-3-3": {"a": "片側のWASが故障した場合", "e": "データの高速化処理はWAS間で対向して行われます。片側のWASが故障すると、対向のWASが処理できず通信が止まるので、高速化処理を自動的に停止して、通常の（高速化なしの）通信に切り替える機能が必要です。"}, "b1-1-1": {"a": "NAPT", "e": "ネットワークアドレス（IPアドレス）とポート番号を同時に変換する機能は、NAPT（IPマスカレード）です。"}, "b1-1-2": {"a": "ステートフル", "e": "FWの管理情報（コネクションテーブルなど）を主系から副系へ引き継ぐフェールオーバが、ステートフルフェールオーバです。これがないとフェールオーバ後に既存の通信が切れます。採点講評で、この設問（イ）の正答率が低かった点とされています。"}, "b1-1-3": {"a": "物理（第1）", "e": "リンクLEDは、ケーブルでつながって信号が届いている状態を示すので、OSI基本参照モデルの物理層（第1層）の正常接続を表します。"}, "b1-1-4": {"a": "Gratuitous ARP（GARP）", "e": "自分のIPアドレスに対するARP要求をブロードキャストして、接続機器のARPテーブルを更新させるのがGratuitous ARPです。FWにはこれを使った更新の機能がなかったので、交換後のMACアドレスの変更を反映させる手動操作が必要でした。"}, "b1-1-5": {"a": "タグ（Tag）", "e": "1本のリンクに複数のVLANを収容するトランク接続では、IEEE 802.1Qのタグ（VLAN ID）をフレームに付けて、VLANを識別します。タグVLANです。"}, "b1-2-1": {"a": "SW3とL3SWの間", "e": "企画部と営業部のVLANは、SW3とL3SWの両方にまたがって存在しています。この2台の間は、1本のリンクで複数のVLANを通す必要があるので、トランク接続にしなければなりません。"}, "b1-2-2": {"a": "TCPの再送機能", "e": "FWのフェールオーバ中に落ちたパケットを、TCPが再送することで補い、アプリケーションのデータが失われず、通信を継続できます（採点講評では、FWに着目せず、TCPの信頼性のある通信を実現する機能を端的に答える設問と説明されています）。"}, "b1-2-3": {"a": "一方のポート故障による対向ポートのリンク断を防ぎ、どちらのFWの障害か特定が容易になる。", "e": "FW同士をケーブルで直結すると、片方のポートが故障したとき、対向のポートのリンクも切れてしまい、どちらが故障したか分かりにくくなります。SW2を挟めば、第2層（通信）は透過しつつ第1層（物理リンク）は分離され、故障側のFW接続ポートだけがリンク断になります。"}, "b1-2-4": {"a": "MACアドレステーブル", "e": "下線③の「切り替わったことを通知するフレーム」を受けたスイッチが更新するのは、MACアドレステーブル（学習テーブル）です。主系のIPアドレスとMACアドレスを副系が引き継ぐ方式なので、スイッチは同じMACアドレスのポートが変わったと学習し直します。"}, "b1-2-5": {"a": "a：ルータ、DNSサーバ、Webサーバ\nb：FW1から設定情報が同期されたこと", "e": "FW1の交換でFW1の各ポートのMACアドレスが変わったので、FWを経由して通信する機器のARPテーブルを初期化します（表の(5)に書かれているL3SWに加えて、aに三つの機器）。図1で、FWの外側（インターネット側）につながるルータと、DMZのDNSサーバ・Webサーバが対象です。bは、FW1と同様、交換後のFW2が起動時にStandby動作に入り、Active動作のFW1から設定情報が同期されたことの確認です（今回の事故は、交換後のFW1が相手のFWを認識できずにActiveになり、設定が失われたことが原因でした）。"}, "b1-3-1": {"a": "SW4とL3SWを相互に入れ替える。", "e": "公式解答例のとおりです。本文では、仮想FWの導入にあたり、企画部と営業部のVLAN間通信を廃止し、DNSサーバ・Webサーバは現状のまま、トランク接続は使わない、新たな機器は購入しない、という条件があります。この条件の下で、2台のスイッチ（図1のSW4とL3SW）を相互に入れ替えることで、仮想FWのVLAN構成に合わせます。"}, "b1-3-2": {"a": "・FW1で企画部用の仮想FWを、FW2で営業部用の仮想FWを、それぞれActiveにする。\n・FW2で企画部用の仮想FWを、FW1で営業部用の仮想FWを、それぞれActiveにする。", "e": "公式解答例は、この2つを両方挙げた形です。仮想FWごとにActive・Standbyを設定でき、企画部用と営業部用でActiveにする物理FWを分けると、2台の物理FWの両方が通信を処理でき、物理FW間で負荷分散できます。採点講評では、目的の説明に終始して、配置の具体性（どの仮想FWをどの物理FWでActiveにするか）に欠ける解答が散見されたとされています。"}, "c1-1-1": {"a": "分散", "e": "多数のコンピュータから一斉に攻撃する分散型（DDoS）です。発信元の特定が難しく、被害が大きくなります。"}, "c1-1-2": {"a": "フラッド", "e": "SYNフラッド攻撃、UDPフラッド攻撃です。大量のパケットを送って、標的の処理能力を使い切らせます。"}, "c1-1-3": {"a": "再帰", "e": "問合せを受けたDNSサーバが、他のDNSサーバへ問い合わせて最終的な結果を返す方式が、再帰的な問合せです。"}, "c1-1-4": {"a": "リフレクタ", "e": "送信元IPアドレスを標的のアドレスに偽装して問合せを送り、DNSサーバから標的へ応答（増幅された大きな応答）を送らせる攻撃が、DNSリフレクタ攻撃です。"}, "c1-1-5": {"a": "ペネトレーション", "e": "実際に侵入を試みて、脆弱性を確かめるテストが、ペネトレーションテストです。"}, "c1-2-1": {"a": "踏み台", "e": "オープンリゾルバは、誰からの再帰的な問合せにも応答するDNSサーバで、DNSリフレクタ攻撃の踏み台にされます。自分が攻撃の踏み台にならないよう、再帰問合せを受け付ける範囲を制限します。"}, "c1-2-2": {"a": "断片化されたエコーパケットを許可しない機能", "e": "大きなサイズのICMPパケットは、MTUを超えるため断片化（フラグメント）されます。断片化された大きなエコー応答を大量に送りつける攻撃を防ぐため、FWで断片化されたICMPエコーパケットを通さない（許可しない）機能が必要です。"}, "c1-3-1": {"a": "DNSキャッシュが改ざんされる。", "e": "DMZのDNSサーバでキャッシュ機能を有効にしていると、キャッシュポイズニング攻撃で、偽の情報をキャッシュさせられるおそれがあります。そのためDMZの外部向けDNSは、キャッシュ機能を無効にして使います。"}, "c1-3-2": {"a": "DMZの空欄：DNS-S（外部向けのセカンダリ。内部のDNS-Pからゾーン転送を受ける）\n内部セグメントの空欄：DNS-C（PCからの問合せを受けるキャッシュDNS）と、DNS-S（内部向けのセカンダリ）\n矢印：DNS-P→DMZのDNS-S（ゾーン転送）、DNS-C→DMZのDNS-S（DNS問合せ）", "e": "公式解答例の図に基づきます。PCからの問合せは、内部セグメントのキャッシュDNS（DNS-C）が受け、DNS-Cが内部のDNS-S、DMZのDNS-S、インターネットへ問い合わせます。プライマリDNS-Pには問合せが来ないようにし、ゾーン転送の宛先は、自行内のセカンダリ（内部のDNS-SとDMZのDNS-S）に限ります。"}, "c1-3-3": {"a": "内部から外部への通信に対する遮断ルールを設定する。\nFWで遮断した通信の結果ログを監視する。", "e": "外部からの不正アクセスだけでなく、内部から外部への通信（マルウェアの通信など）も、不要な通信は遮断するルールを設定して防ぎます。また、遮断された通信のログを監視することで、内部の不審な動き（感染の兆候）を早期に見つけられます。"}, "c1-4-1": {"a": "ネットワークの切断", "e": "セキュリティ担当者の対応の「(3)」は、被害の拡大を防ぐためにネットワークの切断（感染機器の隔離）を行う作業です。(2)対処方法の確認のあと、原因を調べる(4)の前に行います。"}, "c1-4-2": {"a": "対処結果の評価を行い、インシデントの対処方法を見直す。", "e": "PDCAサイクルのとおり、対処結果を評価して、手順（対処方法）を見直すことで、将来のインシデントへの対応力を高めます（採点講評でも、PDCAに従った改善手法の重要性が述べられています）。"}, "r1-1-1": {"a": "HELLO", "e": "SSLのハンドシェイクは、ClientHello／ServerHelloのHELLOメッセージで、暗号化アルゴリズムなどを決めるところから始まります。採点講評では、アとイの正答率が低かったとされています。"}, "r1-1-2": {"a": "127.255.255.254", "e": "127.0.0.0/8がループバックアドレスの範囲で、127.255.255.255はブロードキャストアドレスにあたるので、利用できる最大は127.255.255.254です。"}, "r1-1-3": {"a": "FQDN", "e": "hostsファイルに「127.0.1.10 shisankanri.example.com」と書くので、ループバックアドレスは資産管理サーバのFQDN（完全修飾ドメイン名）に対応付けます。"}, "r1-1-4": {"a": "第三者認証局", "e": "サーバ証明書が、信頼できる第三者認証局（CA）から発行されていることを、PC側で検証します。"}, "r1-2-1": {"a": "外部からの不正利用が発生しない。", "e": "ループバックアドレスは自分自身（PC）の中でしか使えないので、外部のホストからはJavaアプレットが待ち受けるポートにアクセスできません。社内のプライベートアドレスを使うと、そのアドレスで外部から接続される可能性が残ります。"}, "r1-2-2": {"a": "サーバ側のポート番号が変化する。", "e": "ポートフォワード方式は、待受けポートと転送先ポートの対応（ポートマッピングテーブル）をあらかじめ決めて転送します。FTPのデータ転送のように、サーバ側のポート番号が通信の途中で変化するアプリケーションは、対応表で転送できないので使えません。"}, "r1-2-3": {"a": "IPアドレス：127.0.1.10\nポート番号：6310\nTCPコネクション：\n・Javaアプレット と SSL-VPN装置 間\n・SSL-VPN装置 と 資産管理サーバ 間", "e": "資産管理サーバ（AP1）宛は、図2のポートマッピングテーブルより待受けポートは6310、IPアドレスは本文で資産管理サーバに対応付けた127.0.1.10です。TCPコネクションは、PCのJavaアプレットとSSL-VPN装置の間（SSLトンネル）、SSL-VPN装置と資産管理サーバの間の2本に分かれます。"}, "r1-2-4": {"a": "SSLセッション確立による負荷を、軽減させるため。", "e": "SSLセッションのキャッシュ時間を延ばすと、利用が増えても、毎回ハンドシェイクを行ってSSLセッションを確立し直す必要が減り、SSL-VPN装置の負荷を軽減できます。"}, "r1-3-1": {"a": "202.y.63.10", "e": "表1の1行目は外部LAN→DMZの宛先ポート53（DNS）なので、宛先はDNSサーバの202.y.63.10です。"}, "r1-3-2": {"a": "443", "e": "B社のPCから、グローバルIPアドレス202.y.63.11のSSL-VPN装置へは、HTTPS（SSL）のポート443です。"}, "r1-3-3": {"a": "202.y.63.11", "e": "DMZ→内部LANは、SSL-VPN装置（202.y.63.11）から、資産管理サーバ（AP1）、テスト環境サーバ（AP2、AP3）への通信です。送信元は3つとも、SSL-VPN装置のアドレスです。"}, "r1-3-4": {"a": "202.y.63.11", "e": "AP2用（宛先10.10.10.2のポート23）の送信元も、SSL-VPN装置の202.y.63.11です。"}, "r1-3-5": {"a": "202.y.63.11", "e": "AP3用（宛先10.10.10.2のポート13000）の送信元も、SSL-VPN装置の202.y.63.11です。"}, "r1-4-1": {"a": "クライアント証明書の有効期限", "e": "クライアント証明書を管理する運用担当者が自動で通知を受ける情報は、証明書の有効期限です。期限切れ前に更新や失効の対応を行えます。"}, "r1-4-2": {"a": "ログイン時：ウイルス対策ソフトの定義ファイルの適用状態を確認する機能\nログアウト時：PCからリモート接続時のキャッシュ情報や履歴情報を削除する機能", "e": "B社のPCからのウイルス感染や情報漏えいを防ぐ要件を満たすための、Javaアプレットの機能です。ログイン時は、PCのウイルス対策ソフトの定義ファイルが最新かを確認し、ログアウト時は、リモート接続中のキャッシュや履歴をPCに残さないよう削除します。採点講評では、設問4は全体として正答率が低かったとされています。"}, "d1-1-1": {"a": "リレーエージェント", "e": "DHCPサーバと異なるセグメントの端末に割り当てるには、ルータでDHCPリレーエージェントを動作させ、端末のブロードキャストをDHCPサーバへユニキャストで中継します。"}, "d1-1-2": {"a": "ARP", "e": "ルータやWebサーバのARPテーブルから、IPアドレスとMACアドレスの対応を調べます。"}, "d1-1-3": {"a": "製造者", "e": "MACアドレスの上位24ビットのOUIは、NICの製造者（ベンダ）に固有の値です。"}, "d1-1-4": {"a": "ミラー", "e": "トラフィックモニタには、通信のコピーを受け取るミラーポート（ポートミラーリング）を設定して接続します。"}, "d1-1-5": {"a": "DHCPDISCOVER", "e": "端末が最初にDHCPサーバを探すために、ブロードキャストで送るメッセージがDHCPDISCOVERです。"}, "d1-2-1": {"a": "5", "e": "IEEE 802.11aは5GHz帯の電波を使います（802.11b/gは2.4GHz帯）。"}, "d1-2-2": {"a": "IPアドレスの重複割当て", "e": "情報管理課の許可なく割り当てたIPアドレスが、他のPCのIPアドレスと重複し、他のPCの通信に障害が出ました。"}, "d1-2-3": {"a": "PCを接続すべきポート", "e": "公式解答例は「PCを接続すべきポート」です。BBルータは、インターネット側（WAN）に接続するポートと、PCなどを接続するLAN側のポートを持ちます。本文では、BBルータのうちSWに接続したポートが、本来、PCを接続すべきポートだったため、そのポート経由でSWにDHCPサーバ（BBルータ内蔵）が接続された状態になり、商品本部のPCに不正なIPアドレスが割り当てられました。採点講評では、一般的なBBルータの構成の知識があれば導けるが、この設問の正答率は低かったとされています。"}, "d1-3-1": {"a": "b：24\nc：6", "e": "MACアドレスは48ビットで、上位24ビットがOUI（製造者を示す）、下位24ビットが製造者が付ける番号です。cは、DHCPの正規のやり取り（DISCOVER・OFFER・REQUEST・ACK）が4メッセージですが、折り返し転送された結果、重複して送受信され、6メッセージになったことを示します。"}, "d1-3-2": {"a": "固定IPアドレスの割当て：MACアドレスに対応付けたIPアドレスを割り当てる。\n暫定運用中の対処：MACアドレスが未登録でもIPアドレスを割り当てる。", "e": "固定IPアドレスが必要な端末には、MACアドレスとIPアドレスを対応付けて登録し、その端末には常に同じIPアドレスを割り当てます。暫定運用中は、端末登録システムに登録が完了していない端末でも、通信できるように、MACアドレスが未登録でもIPアドレスを割り当てる運用を認めます。"}, "d1-3-3": {"a": "SW1とSW2の間でのブロードキャストフレームの折り返し", "e": "本文のとおり、SW1とSW2が、自SWに接続していない端末向けのDHCPのブロードキャストフレームを受信すると、折り返して転送する不具合があり、SW5の増設で表面化しました。"}, "d1-3-4": {"a": "SW単位にVLANを設定し、VLAN間経路制御とDHCPリレーを行う構成", "e": "L2SWの代わりにL3SWを使い、スイッチごとにVLAN（ブロードキャストドメイン）を分けて、VLAN間の通信はL3SWで経路制御し、DHCPはリレーします。1つのVLANの障害（ブロードキャストの折り返しなど）を他のVLANに波及させません。採点講評では、SWに複数のVLANを設定してタグVLANで結ぶ構成は、1つのVLANがブロードキャストで飽和するとスイッチ間リンクも飽和するので、不適切とされています。"}, "v1-1-1": {"a": "タグ", "e": "IEEE 802.1QのVLANタグは、32ビット（TPID 16ビット＋TCI 16ビット）で、TCIの中にVID（VLAN ID）が入ります。"}, "v1-1-2": {"a": "12", "e": "VID（VLAN ID）は12ビットなので、4,096通り（実際に使えるのは4,094個）に限られます。採点講評では、この設問の正答率が低かったとされています。数だけでなく、12ビットという理由まで理解しておく必要があります。"}, "v1-1-3": {"a": "帯域", "e": "リンクアグリゲーションは、複数のリンクを1本の論理リンクとして扱うので、リンクの冗長化に加えて、帯域の有効活用ができます。"}, "v1-1-4": {"a": "ルータ", "e": "VRFは、1台のルータ（L3SW）の中に、独立した経路表を持つ仮想ルータを複数動かす機能です。"}, "v1-1-5": {"a": "スタック", "e": "複数の筐体を接続して1台のスイッチとして動かす機能は、スタック（スタッキング）です。複数の筐体を1つのIPアドレスで管理できます。"}, "v1-2-1": {"a": "MACアドレス", "e": "イーサネットフレームのDA（宛先アドレス）とSA（送信元アドレス）は、MACアドレスです。"}, "v1-2-2": {"a": "フレーム①：DA＝SV2、SA＝SV1\nフレーム②：DA＝SV2、SA＝SV1\nフレーム③：DA＝SV2、SA＝SV1", "e": "図2のとおり、同一セグメント上の異なるフロアにある顧客αのサーバ間通信です。顧客のVLANタグ付けやNW基盤側でのタグの追加（カプセル化）があっても、内側のイーサネットフレームのDA・SAは変わらず、DA＝SV2、SA＝SV1のままです（L3SWがL2SWとしても動作するので、MACアドレスの書き換えは起きません）。採点講評では、(2)(3)の正答率が低く、L3SWがL2SWとしても動作することを理解しておくこととされています。"}, "v1-2-3": {"a": "TPID と TCI（外側のVLANタグを、この2つのフィールドに分割して記入する）", "e": "公式解答例の図では、フレーム③は「DA｜SA｜TPID｜TCI｜TPID｜…」の順です。網掛け部分（DAとSAの後ろ）に、外側のVLANタグであるTPIDとTCIの2つのフィールドが入ります。IEEE 802.1ad（QinQ）のカプセル化で、顧客のVLANタグ（内側のTPID・TCI）の前に、NW基盤が外側のタグを付けます。"}, "v1-2-4": {"a": "・別々の顧客で使用しているVLAN IDが重複する。\n・VLAN数に制限があるが、これを超える。", "e": "物理的に共用するNWで、顧客ごとにVLAN IDを管理してきた場合、顧客間でVLAN IDが重複して衝突します。また、VLAN IDは12ビット（4,094個）までなので、顧客が増えるとVLAN数の制限を超えます。そこで、IEEE 802.1Qトンネリング（QinQ）で顧客のVLANを外側のタグでカプセル化します。"}, "v1-3-1": {"a": "L3SWにFW（稼働系）とFW（待機系）の2台、L2SWを3台つなぐ（3台のうち、太線で追加された2台は、NW基盤の冗長構成のL2SW）", "e": "公式解答例の図に基づきます。2台のFW（稼働系・待機系）がL3SWにつながり、L3SWの下にL2SWが3台つながります。図3は、監視システム上のマップで、冗長化された機器を並べて表現するための図です。この設問は作図なので、文章で説明しています。"}, "v1-3-2": {"a": "・STPを動作させ、ブロックポートを設ける。\n・リンクアグリゲーションで、単一のリンクとして扱う。", "e": "顧客システムのL2SWから2本のケーブルをNW基盤の別々のL2SWの筐体に接続すると、ループが発生するおそれがあります。対応方法は2つあり、STPを動作させて片方をブロックポートにする方法と、リンクアグリゲーションで2本を単一の論理リンクとして扱う方法です（スタックで筐体が単一のスイッチとして動作する場合に可能）。"}, "v1-3-3": {"a": "複数の独立したFW機能を、1台のFW装置で稼働させる機能", "e": "仮想FW（バーチャルFW）です。顧客システムごとに独立したFW機能を、1台のFW装置の中に複数作って稼働させるので、それぞれが独立した環境を維持できます。"}, "k1-1-1": {"a": "暗号化", "e": "TLSの三つの機能は、盗聴を防ぐ「暗号化」、改ざんを見つける「改ざん検知」、通信相手を確かめる「認証」です。"}, "k1-1-2": {"a": "検知", "e": "改ざんそのものは防げないので、メッセージ認証コード（MAC）などで改ざんされたことを「検知」します。"}, "k1-1-3": {"a": "認証", "e": "サーバ証明書（必要ならクライアント証明書）で、通信相手が正しい相手かを「認証」します。"}, "k1-1-4": {"a": "TCP", "e": "工場内の機器はクライアントとして、X社のサーバに向けてTCPコネクションを確立します（インターネット側から工場へは確立しません）。"}, "k1-1-5": {"a": "X社が運用・保守を行う機器からX社FWの方向に確立されるTCPコネクションだけを許可する。", "e": "図1の「通信装置内のFW」は、工場側からX社への通信だけを通せば足ります。コネクションの確立要求は工場からX社の方向にだけ行われるので、逆方向（外部から工場）の新規接続を拒否すれば、外部からの侵入を防げます。"}, "k1-1-6": {"a": "クライアント証明書を配布してクライアント認証を行う。", "e": "「なりすまし」対策です。サーバ証明書だけだと、X社側がデバイスやエッジサーバの正当性を確かめられません。TLSのクライアント認証（クライアント証明書）を使えば、証明書を持つ機器だけを接続させられます。"}, "k1-2-1": {"a": "TCPの送信処理中に、デバイスの電源断などでTCPコネクションが開放された場合", "e": "QoS 0は、MQTT層で送達確認をしません。TCPの再送はコネクションが維持されている間しか働かないので、送信の途中でコネクションが切れる（電源断など）と、未送達のPUBLISHは再送されず消失します。"}, "k1-2-2": {"a": "メッセージの重複を防止する。", "e": "図3の注記2のとおり、受信者は処理開始後に受信したPUBLISHを新しいパケットとみなします。PUBRECを返しても、PUBRELが来るまでは処理を始めないことで、PUBRECが届かず送信者がPUBLISHを再送してきた場合でも、同じメッセージを2回処理せずに済みます。"}, "k1-2-3": {"a": "SUBSCRIBE", "e": "デバイスが、設定情報を受け取るために、あらかじめ交換サーバに購読要求（SUBSCRIBE）を送っておきます。購読しておくから、業務サーバが発行したPUBLISHが交換サーバ経由でデバイスに配信されます。"}, "k1-2-4": {"a": "config/Di", "e": "図4の項番1のトピック名です。デバイスごとに異なるので、DiはデバイスのIDになります。"}, "k1-2-5": {"a": "デバイスDi", "e": "交換サーバがデバイスDiに配信している最中に、受信側のデバイスDiの電源が切れた場合の話です。"}, "k1-2-6": {"a": "交換サーバ", "e": "QoS 2では、送信者がPUBLISHを保存して再送に備えます。ここでの送信者は交換サーバなので、デバイスが復帰した後に、交換サーバが保存しておいたPUBLISHを再送します。"}, "k1-2-7": {"a": "業務サーバ", "e": "項番2はデバイス→交換サーバ→業務サーバ／エッジサーバの流れで、QoS 0を使います。受信先の業務サーバとエッジサーバは安定して稼働するので、メッセージが失われにくいと見込めます。"}, "k1-2-8": {"a": "業務サーバ、交換サーバ", "e": "図5の概算では、t1（業務サーバが次のメッセージを送れるようになるまでの時間）を、LANのRTT 20ミリ秒の2倍としています。業務サーバが次の送信に進めるのは、交換サーバからPUBRECが返ってきた時点で、ここが業務サーバと交換サーバの間の区間です。そのため、この区間がLANである前提が成り立つように、業務サーバと交換サーバを同一拠点（X社内）に置く必要があります。交換サーバとデバイスの間（t2）は、WANのRTT 200ミリ秒で見積もっています。"}, "k1-3-1": {"a": "認可", "e": "図6の(a)の宛先は認可サーバです。有効なトークンがなければ、WebAPはブラウザを認可サーバにリダイレクトします。"}, "k1-3-2": {"a": "WebAP", "e": "認可応答（302）のLocationは、認可要求のredirect_uriに指定したWebAPのURIです。ブラウザがそこにリダイレクトされるので、認可コードはWebAPに渡ります。"}, "k1-3-3": {"a": "リフレッシュトークン", "e": "アクセストークンの有効期間が切れていても、リフレッシュトークンが有効なら、利用者の確認なしに新しいアクセストークンを発行できます。図6の(III)の流れです。"}, "k1-3-4": {"a": "認可応答", "e": "認可コードは認可応答（Locationの?code=…）に含まれます。redirect_uriが書き換えられると、認可コードが攻撃者の指定した宛先に渡ってしまいます。"}, "k1-3-5": {"a": "認可", "e": "認可サーバが、認可要求のredirect_uriと、事前に登録されている絶対URIが一致するかを確認します。"}, "k1-3-6": {"a": "10", "e": "アクセストークンは有効期間が10分で、有効期間内のトークンは認可サーバに確認せずに使われます。X社がトークンを変更しても、顧客サーバが古いトークンを持っている間は変更が反映されません。最長で、アクセストークンの有効期間の10分後です（その後はリフレッシュトークンで新しいトークンを取得し、変更が有効になります）。"}, "k1-3-7": {"a": "WebAPのURIを固定にし、絶対URIを事前に通知してもらう。", "e": "redirect_uriの確認は、事前に登録した絶対URIとの一致で行います。そのため、顧客には、WebAPのURIを変えないこと、及びその絶対URIを事前にX社へ通知することを依頼します。"}, "k1-4-1": {"a": "送信元IPアドレスをNATルータ-Pに、宛先IPアドレスをエッジサーバ-Pに、それぞれ変換する。", "e": "顧客サーバは、NATルータ-P’のアドレス（顧客ネットワーク側から見たエッジサーバの代わりのアドレス）に接続します。NATルータは、宛先IPアドレスをエッジサーバ-P（Xシステム側のアドレス）に、送信元IPアドレスを顧客サーバ-P’から、NATルータ-Pに変換します。"}, "k1-4-2": {"a": "顧客サーバ-P’からNATルータ-P’のポート8883番への通信", "e": "顧客サーバはクライアントとして、エッジサーバのMQTTサーバ機能に接続します。MQTTをTLSで使う場合の標準のポートは8883です。顧客FWは、顧客サーバから、NATルータ-P’（エッジサーバに対応するアドレス）の8883番への通信を許可する必要があります。"}, "k1-4-3": {"a": "config/Di、status/Di", "e": "MQTTブリッジで交換サーバと送受信するトピックは、図4で定義した、デバイスに設定情報を送るconfig/Diと、稼働情報を集めるstatus/Diです。Confidential/Diは顧客の内部情報なので、X社には送りません。"}, "k1-4-4": {"a": "1：1静的双方向NATの設定をNATルータに追加する。", "e": "顧客サーバを1台増やすと、その台数分のNATの対応（プライベートアドレスの変換）が必要です。1:1の静的NATなので、追加した顧客サーバ用の変換設定をNATルータに追加します。"}, "k1-4-5": {"a": "通信を許可するルールを通信装置内のFWに追加する。", "e": "追加した顧客サーバから、エッジサーバに対する通信（NATで変換されたアドレス）を通すために、通信装置内のFWにも許可ルールを追加します（①②は順不同）。"}, "k2-1-1": {"a": "スタック", "e": "2台のL2SWをケーブルで接続して、1台のL2SWとして動作させる機能がスタックです。2台の機器を1台に見せることで、機器をまたいだリンクアグリゲーションができます。"}, "k2-1-2": {"a": "ステートフル", "e": "セッション情報（接続状態）を、アクティブからスタンバイに引き継ぐ方式です。切り替わっても既存の通信が継続するので、ステートフルフェールオーバと呼びます。"}, "k2-1-3": {"a": "負荷分散", "e": "クラスタグループごとに、仮想IPアドレスと負荷分散アルゴリズム（ラウンドロビンや最小接続数など）を設定します。"}, "k2-1-4": {"a": "チーミング", "e": "2枚のNICをまとめて使う、サーバ側の機能です。スイッチ側のリンクアグリゲーションに対応する機能です。"}, "k2-2-1": {"a": "顧客ごとに異なるフィルタリングの設定が必要であるから（又は、顧客ごとにルーティングの設定が必要であるから）", "e": "顧客ごとにネットワークの要件（通せる通信の条件や経路）が違います。1台のFWで複数の顧客を収容するには、顧客ごとに独立したフィルタリング設定とルーティングが必要です。それを、仮想FWとして分けて稼働させます。"}, "k2-2-2": {"a": "FWbによるFWaの稼働状態", "e": "冗長構成のFWは、互いの稼働状態（ハートビート）を監視します。"}, "k2-2-3": {"a": "FWaによるL2SWaへの接続ポートのリンク状態", "e": "アクティブのFWは、自分のポートのリンク状態を監視します。リンクがダウンしたら切り替えます。"}, "k2-2-4": {"a": "FWaによるLBaへの接続ポートのリンク状態", "e": "三つのうち、どの三つでも正解です（例：FWbによるFWaの稼働状態、FWaによるFWbの稼働状態、FWaによるL2SWa／LBaへの接続ポートのリンク状態、FWbによるL2SWb／LBbへの接続ポートのリンク状態）。"}, "k2-2-5": {"a": "物理サーバへの接続ポートに、全ての顧客の仮想サーバに設定されたVLAN IDを設定する。", "e": "仮想サーバを別の物理サーバに移動（マイグレーション）しても通信できるように、どの物理サーバへの接続ポートにも、全顧客のVLAN IDを通す設定（タグVLAN）をL2SWc、L2SWdに入れておきます。"}, "k2-3-1": {"a": "OFCのIPアドレス、自OFSのIPアドレス", "e": "OFSは、起動するとOFCとの間でTCPコネクションを確立します。そのために必要な最小限の情報は、接続先のOFCのIPアドレスと、OFS自身（管理用ポート）のIPアドレスです。Fテーブルなどは、その後OFCから設定されます。"}, "k2-4-1": {"a": "フィルタリングルール", "e": "仮想FWは通常のFWとほぼ同じなので、仮想FWごとに、フィルタリングルールを設定します。"}, "k2-4-2": {"a": "仮想FWのVLAN ID", "e": "仮想FWが属するVLANのIDです。"}, "k2-4-3": {"a": "仮想FWのIPアドレス", "e": "仮想FWのIPアドレスです。"}, "k2-4-4": {"a": "顧客のL2SW又はL3SWに接続する、L2SWa及びL2SWbのポート", "e": "ポートVLANは、スイッチのポートごとにVLANを割り当てる方式です。追加した顧客を収容する入口は、顧客のL2SW／L3SWにつながっているL2SWaとL2SWbのポートです。"}, "k2-5-1": {"a": "物理サーバ3の障害によって、3顧客のシステムが同時に停止してしまう。", "e": "図4では、物理サーバ3に、P社のFWp・LBp、Q社のFWq、Z社のLBzが載っています。物理サーバ3が故障すると、3顧客のシステムが同時に停止します。"}, "k2-5-2": {"a": "3顧客向けの仮想サーバを、それぞれ異なった物理サーバに配置する。", "e": "顧客ごとに別の物理サーバに載せれば、1台の障害の影響を1顧客に限定できます。"}, "k2-5-3": {"a": "FWpの内部側ポートとLBpの仮想IPアドレスをもつポートは、同一セグメントであり、物理サーバ3内で処理されるから", "e": "二つのポートは同じセグメント（図4のVLAN）にあり、物理サーバ3の仮想L2SWの中だけで転送されます。パケットはOFSを通らないので、OFSのFエントリは不要です。"}, "k2-5-4": {"a": "Fテーブル名：Fテーブル1\n項番：2", "e": "P社のWebサーバ利用者のパケットは、ルータ→L2SWを経てp1から入力されます。Fテーブル0の項番1でVLAN ID 100をセットし、Fテーブル1で処理されます。宛先MACはFWpのWAN側（mFWpw）なので、表5の項番2に一致して、p13（物理サーバ3）から出力されます。"}, "k2-5-5": {"a": "Fテーブル名：Fテーブル0\n項番：6", "e": "FWp、LBpの処理を終えたパケットは、物理サーバ3からp13を経由してOFSに再入力されます。Fテーブル0で入力ポートがp13なので、項番6に一致し、Fテーブル4の処理に移ります。"}, "k2-5-6": {"a": "Fテーブル名：Fテーブル4\n項番：6", "e": "宛先MACがWebサーバp1（mWSp1）、送信元MACがLBp（mLBp）なので、表8の項番6に一致して、p11（物理サーバ1）から出力され、Webサーバp1に届きます。"}, "k2-5-7": {"a": "OFS1、OFS2", "e": "Fテーブル4は、OFS1とOFS2のどちらにも同じ内容が生成されています。変更も両方のOFSに対して行われます。"}, "k2-5-8": {"a": "項番：7\n変更後のアクション：p12から出力", "e": "Webサーバp4が物理サーバ2に移動すると、宛先がmWSp4のパケットはp11ではなくp12から出力する必要があります。それで、項番7を「p12から出力」に変更します。なお、項番3（ARPのブロードキャスト、VLAN ID 120）は、p11に加えてp12からも出力するように変更されます（設問の「項番3のほかに」の項番が、項番7です）。"}, "w1-1-1": {"a": "i1", "e": "機械は、FWの外部NW側（ISPに面した側）のグローバルアドレスi1に向けてパケットを送ります。"}, "w1-1-2": {"a": "NAT", "e": "DMZのWebサーバ群はプライベートアドレスなので、FWが宛先アドレスを変換（NAT）します。"}, "w1-1-3": {"a": "i3", "e": "FWはパケットをLBに転送するので、宛先IPアドレスはLBのアドレス（i3）になります。"}, "w1-1-4": {"a": "Flow-Mod", "e": "OFSの管理テーブルにエントリを設定させるメッセージは、表1のFlow-Modです。"}, "w1-1-5": {"a": "controller", "e": "LLDPフレーム（ETH_TYPE=88CC）は、Output(controller)でPacket-Inとして、OFCに転送されます。これで、OFCは接続情報を知ることができます。"}, "w1-1-6": {"a": "Packet-Out", "e": "「OFSに指定した出力ポートからフレームを出力させる」メッセージはPacket-Outです。"}, "w1-1-7": {"a": "OFS2", "e": "図3の③のLLDPフレームYは、OFS2の全ポートから出力させたものです。OFS1が受け取ったフレームには、送信元のOFS2の装置名が入ります。"}, "w1-1-8": {"a": "p9", "e": "図2のとおり、OFS1のp8とOFS2のp9がつながっています。OFS1のp8から出たフレームXにはOFS1・p8が、OFS2のp9から出たフレームYにはOFS2・p9が格納されます。これで、OFCは両者の接続関係を把握できます。"}, "w1-2-1": {"a": "v2", "e": "⑬はFWからLBに向かうパケットです。FWは、新FWとOFSの間のトランクで、DMZのVLAN ID（v2）をつけて送ります。"}, "w1-2-2": {"a": "なし", "e": "⑭は、OFSがLBに出力する直前のパケットです。LBはp6（タグなしのアクセスポート）につながっているので、OFSはVLANタグを外して出力します。"}, "w1-2-3": {"a": "m2", "e": "⑬⑭とも、FWのNATで宛先IPアドレスがi3（LB）に書き換わっています。宛先MACアドレスは、LBのm2です。"}, "w1-2-4": {"a": "m3", "e": "⑮⑯は、LBが振り分けたパケットです。Web-A1（i4）に振り分けるので、宛先MACアドレスはWeb-A1のm3になります。"}, "w1-2-5": {"a": "i4", "e": "LBは、宛先IPアドレスを自分（i3）から振り分け先のWeb-A1のIPアドレスi4に書き換えます。"}, "w1-2-6": {"a": "②、⑧、⑨、⑩", "e": "Packet-Outメッセージは、OFCがOFSに「このパケットを出力せよ」と指示するものです。図4では、OFSからFW、LB、Web-A1、Web-A2へ出ているARP Request（②⑧⑨⑩）です。ARP Reply（④⑫）もPacket-Outで出ていますが、これらはユニキャストの応答なので、ブロードキャストに関する指示（下線(i)）には当たりません。"}, "w1-2-7": {"a": "ETH_TYPEがARPのイーサネットタイプに等しい。", "e": "ARP RequestとARP ReplyをOFCに通知するエントリは、OFSでARPパケットを識別する必要があります。表2のETH_TYPE（イーサネットタイプ）がARPに等しいことが条件です。"}, "w1-2-8": {"a": "外部NW内のRT-1と新FWの通信", "e": "表4のエントリ1・2は、p1とp7(v1)、MACはm5（RT-1）とm1（新FW）で、それぞれ上り・下りの通信を表します。外部NWのRT-1と新FWの間の通信です。"}, "w1-2-9": {"a": "p6", "e": "表5のエントリ1は、LB→新FWの通信（Push-VLANでv2をつけてp7から出力）に使われます。LBはp6につながっています。"}, "w1-2-10": {"a": "なし", "e": "LBはタグなしのアクセスポートp6につながっているので、入力時にはVLANタグはありません。"}, "w1-2-11": {"a": "m1", "e": "宛先は新FWのMACアドレス m1 です。"}, "w1-2-12": {"a": "m2", "e": "送信元はLBのMACアドレス m2 です。"}, "w1-2-13": {"a": "Push-VLAN、Set-Field VLAN_VID＝v2、Output(p7)", "e": "LBからの（タグなしの）パケットをDMZのVLAN（v2）にして、トランクポートp7から新FWに出します。表4のエントリ1（外部NWのv1）と同じ形です。"}, "w1-3-1": {"a": "CNAME", "e": "weblive.asha.example.com を、B社CDNのFQDN（webasha.bshacdn.example.net）の別名にするため、CNAMEレコードを使います。これで、名前解決がDNS-Bに引き継がれます。"}, "w1-3-2": {"a": "webtest.asha.example.com", "e": "試行モードのa1は、Web-Aへのアクセスです。図6のDNS-Aのゾーンファイルで、i1（Web-A側のアドレス）になっているのは、webtestです。FQDNは、$ORIGINのasha.example.com.が付いたものです。"}, "w1-3-3": {"a": "weblive.asha.example.com", "e": "本運用モードのb1は、Web-Bへのアクセスです。ゾーンファイルで、i6（Web-B側のアドレス）になっているのは、weblive です。"}, "w1-3-4": {"a": "DNSクライアントとDNSフルリゾルバが、ネットワーク上で離れた位置にある場合", "e": "CDNのDNS-Bは、通常、問合せの送信元（DNSフルリゾルバ）のアドレスで、最寄りのエッジサーバを選びます。DNSクライアントがフルリゾルバから離れている場合は、EDNS-Client-Subnetで、クライアントのアドレス情報も使うことで、クライアントに近いエッジサーバを選べます。"}, "w1-3-5": {"a": "Web-Bのサーバ処理能力不足", "e": "GETでファームウェアを一斉に更新すると、多数の機械からWeb-Bにアクセスが集中します。エッジサーバが、キャッシュで応答するので、Web-Bの処理負荷が下がります。"}, "w1-3-6": {"a": "機械とWeb-B間の通信遅延", "e": "世界中の機械から遠くのWeb-Bにアクセスすると、通信の遅延が大きくなります。近くのエッジサーバが応答すれば、遅延は小さくなります。（二つの要因は順不同）"}, "w1-4-1": {"a": "転用後の業務サーバのIPアドレスを、LBの振り分け先に追加しておく。", "e": "転用する業務サーバをWebサーバとして使うので、LBが負荷を振り分ける対象に、あらかじめ追加しておきます。"}, "w1-4-2": {"a": "weblive IN A i6", "e": "図6のDNS-Aのゾーンファイルの、現在のレコードです（Web-Bのアドレスi6）。"}, "w1-4-3": {"a": "weblive IN A i1", "e": "DR時は、機械のアクセス先をWeb-Aに切り替えます。Web-Aは、FW（i1）経由でアクセスされるので、アドレスをi1に置き換えます。"}, "w1-4-4": {"a": "転用する業務サーバに関する物理配線の変更が不要になる。", "e": "新工場LANは、仮想NWで構成されるので、OFSの設定変更だけで、DMZにサーバを接続できます。物理配線の変更が必要ありません。"}, "w1-4-5": {"a": "管理ソフトウェアを用いて、社内要員だけで対応できる。", "e": "構成変更は、OFCの管理ソフトウェアで行えます。ベンダへの作業依頼が不要で、自社の運用要員だけで対応できるので、復旧が早くなります。（二つの要因は順不同）"}, "w1-4-6": {"a": "CDN、ISP、IaaS環境の構築と切替えに関する、APIサービスとDNSを使った手順の確立。", "e": "国外のIaaS環境や、CDN、ISPの利用の開始・切替えは、B社のAPIサービスとDNSの設定変更で行います。その手順を、あらかじめ運用マニュアルに用意しておく必要があります。"}, "w1-4-7": {"a": "国外を利用するので、国内の広域災害の影響を回避できる。", "e": "国外の拠点なので、国内で広域災害が起きても、影響を受けません。"}, "w1-4-8": {"a": "B社CDNなどを使い、通常時と同じ品質を保つことができる。", "e": "自社設備のWeb-Aより性能面で劣ることがなく、B社のCDNやISPを使って、通常時と同じ品質で、サービスを継続できます。（二つの利点は順不同）"}, "w2-1-1": {"a": "2.4", "e": "802.11nは2.4GHz帯と5GHz帯の両方に対応します。"}, "w2-1-2": {"a": "5", "e": "802.11acは5GHz帯のみです（802.11nは2.4GHzと5GHz）。"}, "w2-1-3": {"a": "any", "e": "「ANY接続拒否」は、SSIDが空白又は「any」の接続要求を拒否する機能です。"}, "w2-1-4": {"a": "共通", "e": "RC4は、暗号化と復号に同じ鍵を使う共通鍵暗号です。"}, "w2-1-5": {"a": "802.11i", "e": "WPA2は、無線LANのセキュリティ規格IEEE 802.11iに準拠した方式です。"}, "w2-2-1": {"a": "ストリーム", "e": "RC4は、1バイト（又は1ビット）単位で暗号化するストリーム暗号です。AESはブロック暗号です。"}, "w2-2-2": {"a": "同一", "e": "WEPキーは、固定のまま使い続けられます。同じ鍵を使い続けるので、解読されやすくなります。"}, "w2-2-3": {"a": "認証サーバ", "e": "IEEE 802.1X認証が成功すると、認証サーバ（RADIUSサーバ）がPMKを生成してAPに配布します。公式の解答例では、h は「認証サーバ」です。"}, "w2-2-4": {"a": "MACアドレス", "e": "TKIPのフェーズ1は、一時鍵、IV（上位部分）、端末のMACアドレスの三つを混合します。"}, "w2-2-5": {"a": "認証", "e": "WPA2では、事前認証（接続前に、移動先のAPで認証しておく仕組み）の方法とPMKの保持方法が決まっています。これで、ハンドオーバ時の認証が不要になります。"}, "w2-2-6": {"a": "カウンタ値cをAESで暗号化した結果と、暗号文ブロックe1をXORする。", "e": "カウンタモードでは、暗号化も復号も、カウンタ値を暗号化した値とのXORです。XORを2回すると元に戻るので、e1 XOR AES(c) = m1 になります。AESの復号は使いません。"}, "w2-3-1": {"a": "80", "e": "アンテナ1本あたりの速度は、160MHz（8チャネル）で約867Mビット/秒、80MHz（4チャネル）で、その半分の約433Mです。"}, "w2-3-2": {"a": "2", "e": "80MHzだと、1本約433Mなので、867Mを得るには2本（ストリーム）が必要です。"}, "w2-3-3": {"a": "WLCに通信の負荷が集中するのを抑制することができる。", "e": "認証後の通信が、APからそのままネットワークに出ていくので、WLCにトラフィックが集中しません。"}, "w2-3-4": {"a": "認証後にWLCに障害が発生しても、その無線LAN端末の通信は継続できる。", "e": "WLCを経由しないので、WLCが故障しても、認証済みの端末の通信には影響しません。（二つの利点は順不同）"}, "w2-3-5": {"a": "電波干渉によって、通信障害が発生する。", "e": "外来電波（他の無線機器など）と同じ周波数帯を使っていると、電波が干渉して、通信が不安定になったり、つながらなくなったりします。"}, "w2-3-6": {"a": "4", "e": "図3は、隣り合うAPのセルが重なる配置です。80MHz幅のチャネルを、隣接するAPと重ならないよう、上下左右で使い分けるには、少なくとも4グループが必要です。"}, "w2-3-7": {"a": "ハンドオーバをスムーズに行わせるため（又は、APの負荷分散を行わせるため）", "e": "セルを重ねると、移動中の端末が、切れ目なく次のAPに乗り換えられます。また、端末が複数のAPの電波を受け取れるので、負荷の分散もできます。"}, "w2-3-8": {"a": "PoE＋", "e": "IEEE 802.3at規格のPoEは「PoE+（PoEプラス）」と呼ばれます（802.3af は PoE。1ポート最大約30W）。"}, "w2-3-9": {"a": "216", "e": "APの最大消費電力は18W。導入するAPは、オフィスエリア8台＋接客エリア4台の12台なので、18W×12台＝216Wです。"}, "w2-4-1": {"a": "CAの自己証明書", "e": "PKCS#12ファイルには、クライアント証明書と秘密鍵のほか、CA（認証局）の証明書も入れます。NPCがサーバ証明書を検証するのに、CAの証明書が必要です。"}, "w2-4-2": {"a": "クライアントの秘密鍵", "e": "クライアント証明書は公開鍵の証明書なので、EAP-TLSで使うには、対応する秘密鍵も必要です。（二つの情報は順不同）"}, "w2-4-3": {"a": "ダウンロードサーバの認証情報が漏えいすると、来訪者もクライアント証明書などがダウンロードできてしまう。", "e": "認証エラー用の特別なVLANは、来訪者のNPCも接続できる（認証に失敗した端末が入る）ので、ダウンロードサーバの利用者IDとパスワードが漏れると、第三者がクライアント証明書を入手できてしまいます。"}, "w2-4-4": {"a": "クライアント証明書の有効期限を切らせた営業員", "e": "有効期限の切れたクライアント証明書では、EAP-TLSの認証が通らず、無線LANに接続できません。有線LANが撤去されているので、ダウンロードもできません。"}, "w2-4-5": {"a": "無線LAN導入後に営業部に配属された営業員", "e": "導入時の一斉メールの対象外なので、クライアント証明書の配布案内を受けていません。（二つの営業員は順不同）"}, "w2-5-1": {"a": "NPC", "e": "サプリカントは、認証を受ける側の機器、つまりNPCです。"}, "w2-5-2": {"a": "WLC", "e": "オーセンティケータは、認証の可否を判断して、ポートの接続を制御する機器です。WLCがRADIUSサーバに問い合わせて結果を受け取り、可否を処理します。"}, "w2-5-3": {"a": "ESSID", "e": "パーソナルモードの接続に必要な情報は、接続先のネットワーク名（ESSID）です。"}, "w2-5-4": {"a": "PSK", "e": "事前共有鍵（PSK、パスフレーズ）です。（二つの情報は順不同）"}, "w2-5-5": {"a": "㋑", "e": "㋑は、APとL2SW5の間のリンクです。APは、ESSIDごとに、営業員用のVLAN100と来訪者用のVLAN200を割り当てます。二つのVLANを1本のリンクで通すので、APとL2SW5の間にタグVLAN（トランク）が必要です。"}, "w2-5-6": {"a": "ルータ2への接続ポートだけに、VLAN200のポートVLANを設定する。", "e": "来訪者のVLAN200は、インターネットだけに出られるようにします。L2SW5では、ルータ2につながるポート（㋓）だけをVLAN200のアクセスポートにし、他のVLANと通信できないようにします。"}, "w2-5-7": {"a": "ハンドオーバができなくなる。", "e": "WLCは、APの負荷分散やPMKの保持などのハンドオーバ制御を行います。WLCが停止すると、NPCが別のAPに移動（ハンドオーバ）するときの、制御ができません。"}, "w2-5-8": {"a": "NPCに配布したPMKと認証関連情報がWLCで保持されているから", "e": "ハンドオーバ時の認証や、PMKの再生成をなくすために、PMKと認証関連情報をWLCが保持しています。WLCが止まると、これらが使えなくなり、再認証が必要になります。"}, "w2-5-9": {"a": "AP→L2SW5→L3SW→FW→L2SW1→プロキシサーバ→L2SW1→FW→ルータ1", "e": "営業員のNPCのインターネットアクセスは、DMZのプロキシサーバ経由です。AP→L2SW5→L3SW→FW→L2SW1でプロキシサーバへ行き、L2SW1→FW→ルータ1でインターネットに出ます。FWとL2SW1は、行きと帰りで2回通ります。"}};
  var PROBLEM_NOTES = {"7": "IPA採点講評（要旨）：全体として正答率は低め。設問1（TLSのバージョン・プロトコル選定）、設問2(1)（暗号スイート中のアルゴリズムの用途）、設問2(2)（動作方式の選定根拠）は特に低かった一方、設問3・設問4は高かった。設問4は、L3SWに隣接するFWの設定を考慮しない誤答も見られた。", "8": "IPA採点講評（要旨）：全体として正答率は高め。設問2(2)の広域イーサ網の計算は低かった。設問2(3)は利点への言及がない解答が散見された。設問3(2)は「パケットを破棄する」と誤答した受験者が多く、シェーピングとポリシングの違いの理解が課題。", "9": "IPA採点講評（要旨）：設問2(1)（トランスポートモードを選んだ根拠）と設問4（二つのVPNトンネルを監視する目的）は正答率が低かった。設問3(4)は、経路ループの防止策としてSTPと誤答する例が散見された。", "13": "IPA採点講評（要旨）：全体として正答率は低め。設問1はウ（Set-Cookie）、設問3(2)（Secure属性）が特に低かった。設問4はアドレス重複検知の仕組みと対処の理解が課題。", "14": "IPA採点講評（要旨）：全体として正答率は高め。設問2(1)は4つのアドレスが全て正しい解答が少なかった。設問3(2)「い」は、「社内NW⇔(インターネット・DMZ)は全てProxy経由」「LB4はFWとProxyの負荷分散を併用」の条件の見落としが多かった。", "15": "IPA採点講評（要旨）：全体として正答率は高め。設問1は専門用語（ミラーポート・ICMPの設定など）の正答率が低かった。設問2(2)はFWとの連携、設問3(1)(2)はIPSの機能の理解が課題。", "16": "IPA採点講評（要旨）：全体として正答率は高め。設問2(4)（2種類のポートの使い分け）と(5)（STARTTLS方式のポート番号）、設問3(1)（SMTPの基本的なシーケンス）の正答率が低かった。", "17": "IPA採点講評（要旨）：全体として正答率は低め。設問2(1)はステルス機能の効果を答える誤りが多く、(2)はSSID・MACアドレスが暗号化できないことの理解が不足。設問4(1)は、利用者認証を含めたログ取得の観点が課題。", "18": "IPA採点講評（要旨）：全体として正答率は低め。設問1(4)は、負荷が偏りやすくなる条件を答えられた解答が少なかった。設問3(2)(3)は、未変更社員・実施済み社員・社外の三者間の転送経路を図3に書き込めば導けるとされている。", "19": "IPA採点講評（要旨）：全体として正答率は低め。設問1はウ・エ（QoS用語）、設問2(1)〜(3)が低かった。(1)は通信経路の説明にとどまらず、デフォルトゲートウェイの冗長化と仮想ルータに着目するのが要点。設問3(2)も低かった。設問2(4)は高かった。", "20": "IPA採点講評（要旨）：全体として正答率は低め。設問1はイ（ステートフルフェールオーバ）が低かった。設問2(1)はアプリケーション間の通信に着目する、(3)はSW2を挟むことで第2層を透過しつつ第1層を分離している観点、(5)aは第2層と第3層の違いが課題。設問3(2)は配置の具体性が不足する解答が多かった。", "21": "IPA採点講評（要旨）：全体として正答率は高め。設問1はDNSの用語の正答率が低かった。設問3(2)は、本文の条件を読まず経験や一般知識だけで答えた解答が非常に多かった。設問4はPDCAサイクルに従った改善手法が重要。", "22": "IPA採点講評（要旨）：全体として正答率は高め。設問1はアとイの正答率が低かった。設問2(1)(2)の正答率が低く、基本的な知識と、本文をしっかり読むことが必要。設問4は全体として正答率が低く、本文の要件と状況設定を整理して読むことが必要。", "23": "IPA採点講評（要旨）：全体として正答率は高め。設問1はアとオが低かった。設問2(3)は低かった（一般的なBBルータの構成の知識で導ける）。設問3(1)のb・cが低く、(4)は目的を答えたり構成を曖昧に書いたり、タグVLANで結ぶ構成を挙げる誤りが目立った。", "24": "IPA採点講評（要旨）：全体として正答率は低め。設問1はイ（VLAN数の制約の理由）が特に低かった。設問2は(2)と(3)が低く、L3SWがL2SWとしても動作すること、フレームフォーマットを意識することが必要。設問3は(1)の図示は高く、(3)は低かった。", "25": "IPA採点講評（要旨）：設問1(2)の正答率が低く、導入構成例（図1）に三つのFWがあることを踏まえて、Xシステムの記述を注意深く読むことが必要。設問2(2)（QoSレベルの考え方）の正答率が低かった。通信シーケンス（図3）を読んで仕組みを理解しておくこと。設問3は比較的高いが、リダイレクトに関する(1)シの誤答が見られた。設問4は、メッセージ交換システムの拡張性と、NATで二つのネットワークを接続したときの制約を理解して解答すること。", "26": "IPA採点講評（要旨）：設問1はイ（ステートフル）の正答率が低かった。設問2は全体として低く、(3)は仮想サーバの移動に不可欠な設定なので理解しておくこと。設問4は(1)が低く、仮想FWに設定するネットワーク情報は通常のFWとほぼ同じ。設問5は(1)が低く（図4の配置では物理サーバ3の障害で3顧客が同時に停止する）、(2)(3)(4)は高かった。", "27": "IPA採点講評（要旨）：設問1は正答率が高かった。設問2は正答率が高く、SDNへの理解がうかがえたが、(2)〜(4)に誤答が目立った（パケット識別条件とActionの定義・読解）。設問3は正答率が低い問題が複数あり、(1)はDNSの正しい知識、(4)(5)はCDNを使ったネットワークの動作の理解が必要。設問4は全体に低く、(3)は自社要員だけで構成変更ができること、(4)は準備作業全体、(5)はIaaS利用とアウトソーシングの混同が目立った。", "28": "IPA採点講評（要旨）：設問1はa、b、cは高く、eが低かった（IEEE 802.11i）。設問2は(2)が高く、(1)が低かった。設問3は全体に高く、(5)（PoE+の呼称）が低かった。設問4は(1)が低かった（認証に必要な情報）。設問5は(1)のオーセンティケータ（WLC）と、(5)の理由（PMKの保持）が低く、(2)と(6)は高かった。"};


  var STORE_KEY = "nw-r03h-pm1-cbt-mock-v3";

  /* ============================= STATE ============================= */
  var state = {
    screen:"cover",
    current:null,
    answers:{},
    marked:{},
    memos:{},
    history:{},
    correct:{},
    marks:{},
    timers:{}
  };
  (function hydrate(){
    var saved=null;
    try{ var raw=localStorage.getItem(STORE_KEY); if(raw) saved=JSON.parse(raw); }catch(e){}
    if(saved){
      state.answers = saved.answers || {};
      state.marked = saved.marked || {};
      state.memos = saved.memos || {};
      state.history = saved.history || {};
      state.correct = saved.correct || {};
      state.marks = saved.marks || {};
      state.timers = saved.timers || {};
    }
  })();
  var zoomLevel = 100;
  var memoOpen = false;
  var resumeScroll = false;
  var markerTool = null, markerSize = 3, invertOn = false, statusOpen = false, calcOpen = false, memoTrans = false;
  var activeItemId = null, splitH = 54, splitV = 50;
  var modelShown = false, resultProblemOpen = false, resZoom = 100;
  var EXAM_LIMIT_MIN = 45, EXAM_LIMIT_SEC = EXAM_LIMIT_MIN*60;
  var HISTORY_LIMIT = 20;

  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        answers:state.answers, marked:state.marked, memos:state.memos, history:state.history, correct:state.correct, marks:state.marks, timers:state.timers
      }));
    }catch(e){}
  }
  function clearProblemData(problemId){
    allItems(findProblem(problemId)).forEach(function(it){ delete state.answers[it.id]; delete state.marked[it.id]; });
    delete state.memos[problemId];
    Object.keys(state.marks).forEach(function(k){ if(k.indexOf(problemId+':')===0) delete state.marks[k]; });
    save();
  }
  function snapshotAnswers(problem){
    var out={};
    allItems(problem).forEach(function(it){
      if(state.answers[it.id]!=null) out[it.id]=JSON.parse(JSON.stringify(state.answers[it.id]));
    });
    return out;
  }
  function pushHistory(problem){
    var snap = snapshotAnswers(problem);
    if(!Object.keys(snap).length) return;
    var list = state.history[problem.id] || [];
    var lastJson = list.length ? JSON.stringify(list[0].answers) : null;
    if(lastJson===JSON.stringify(snap)) return;
    list.unshift({ts:Date.now(), answers:snap});
    if(list.length>HISTORY_LIMIT) list = list.slice(0,HISTORY_LIMIT);
    state.history[problem.id]=list;
    save();
  }
  function fmtDateTime(ts){
    var d=new Date(ts);
    function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function findProblem(id){ for(var i=0;i<PROBLEMS.length;i++){ if(PROBLEMS[i].id===id) return PROBLEMS[i]; } return null; }
  function timerKey(){ return state.current==null ? null : 'p'+state.current; }
  function timerLabel(){
    var pr = state.current==null ? null : findProblem(state.current);
    return pr ? examLabelFor(pr.id)+' '+pr.label : '';
  }
  function fmtHMS(sec){
    sec = Math.max(0, sec);
    function p(n){ return (n<10?'0':'')+n; }
    return p(Math.floor(sec/60))+':'+p(sec%60);
  }
  function timerHtml(){
    var k = timerKey();
    var used = k ? (state.timers[k]||0) : 0;
    var lim = limitMinFor(state.current), left = lim*60 - used;
    return '<div class="timer'+(left<=0?' over':(left<=300?' low':''))+'" id="examTimer" title="'+examPartFor(state.current)+'（'+lim+'分）の残り時間。この問題を解いている間だけ進みます">'
      + '<span class="tl">残り時間</span><span class="tv mono" id="timerVal">'+fmtHMS(left)+'</span>'
      + '<button class="ghost small" id="timerReset" title="この問題の試験時間を'+lim+'分に戻す">リセット</button></div>';
  }
  function updateTimerUI(){
    var el = document.getElementById('timerVal'), box = document.getElementById('examTimer');
    var k = timerKey();
    if(!el || !k) return;
    var left = limitMinFor(state.current)*60 - (state.timers[k]||0);
    el.textContent = fmtHMS(left);
    box.classList.toggle('low', left>0 && left<=300);
    box.classList.toggle('over', left<=0);
  }
  function bindTimerReset(){
    var b = document.getElementById('timerReset');
    if(!b) return;
    b.addEventListener('click', function(){
      var k = timerKey();
      if(!k || !confirm(timerLabel()+'の試験時間を'+limitMinFor(state.current)+'分に戻します。よろしいですか？')) return;
      delete state.timers[k]; save(); updateTimerUI();
    });
  }
  setInterval(function(){
    if((state.screen!=='exam' && state.screen!=='review') || document.hidden) return;
    var k = timerKey();
    if(!k) return;
    var used = (state.timers[k]||0) + 1;
    state.timers[k] = used;
    updateTimerUI();
    if(used===limitMinFor(state.current)*60) toast('試験時間の'+limitMinFor(state.current)+'分が経過しました（続けて解答できます）');
    if(used%5===0) save();
  }, 1000);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });

  function groupOf(problemId){
    for(var i=0;i<EXAM_GROUPS.length;i++){ if(EXAM_GROUPS[i].ids.indexOf(problemId)>=0) return EXAM_GROUPS[i]; }
    return null;
  }
  function examPartFor(problemId){ var g = groupOf(problemId); return g && g.part ? g.part : '午後I'; }
  function examLabelFor(problemId){
    var g = groupOf(problemId);
    return g ? g.title + (g.part ? ' ' + g.part : '') : '';
  }
  function examTitleFor(problemId){
    var g = groupOf(problemId);
    return (g ? g.title : '') + ' ネットワークスペシャリスト試験 ' + examPartFor(problemId);
  }
  function limitMinFor(problemId){ var g = groupOf(problemId); return g && g.limit ? g.limit : EXAM_LIMIT_MIN; }
  function allItems(problem){
    var out=[];
    problem.groups.forEach(function(g){ g.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function isAnswered(it){
    var v = state.answers[it.id];
    if(v==null) return false;
    if(it.type==="text") return String(v).trim().length>0;
    if(it.type==="multi") return Array.isArray(v) && v.length>0;
    if(it.type==="fields"){
      if(!v) return false;
      return it.fields.some(function(f){
        var fv=v[f.key];
        if(f.type==="multi") return Array.isArray(fv)&&fv.length>0;
        return fv && String(fv).trim().length>0;
      });
    }
    return false;
  }
  function progressOf(problem){
    var items = allItems(problem);
    var done = items.filter(isAnswered).length;
    return {done:done, total:items.length};
  }
  function ucount(str){ return Array.from(String(str||"")).length; }

  function toast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h=setTimeout(function(){ t.classList.remove("show"); },1800);
  }

  /* ============================= RENDER: COVER ============================= */
  function renderCover(root){
    var html = '';
    html += '<div class="cover-wrap"><div class="cover">';
    html += '<div class="cover-band"><span class="tag">CBT方式 学習モード</span>';
    html += '<h1>ネットワークスペシャリスト試験 午後I・午後II 過去問</h1>';
    html += '<p>記述式の過去問題を、CBT形式の画面で1問ずつ演習できる学習用ツール</p></div>';
    html += '<div class="cover-body">';
    html += '<div class="cover-meta">';
    html += '<div><div class="k">出題年度</div><div class="v">'+Object.keys(EXAM_GROUPS.reduce(function(m,g){ m[g.title]=1; return m; },{})).length+'年度分</div></div>';
    html += '<div><div class="k">解答方式</div><div class="v">記述式</div></div>';
    html += '<div><div class="k">採点</div><div class="v">自己採点</div></div>';
    html += '</div>';

    html += '<h2>注意事項</h2>';
    html += '<ul class="rules">';
    html += '<li>IPAが公開している<b>過去問題（ネットワークスペシャリスト試験 午後I・午後II）</b>を、CBT試験を想定した画面で解答できるようにしたものです。</li>';
    html += '<li>下から<b>1問ずつ選んで</b>演習できます。途中で他の問題に切り替えても、それぞれの解答は個別に保存されます。</li>';
    html += '<li>解答は自動的にこの端末（ブラウザ）に保存されます。閉じても続きから再開できます。</li>';
    html += '<li>各問題には、1問ごとの残り時間が表示されます（午後Iは<b>'+EXAM_LIMIT_MIN+'分</b>、午後IIは<b>120分</b>）。時間が0になっても、解答は続けられます。</li>';
    var modelYears = EXAM_GROUPS.filter(function(g){
      return g.ids.every(function(pid){ return allItems(findProblem(pid)).every(function(it){ return MODEL_DATA[it.id]; }); });
    }).map(function(g){ return g.title + ' ' + (g.part || '午後I'); });
    html += '<li>自動採点はありません。解答一覧で自分の解答を確認し、自己採点してください。'
      + (modelYears.length ? 'IPA公式の解答例と解説（解説は当ツール作成者によるもの）が付いているのは、'+escapeHtml(modelYears.join('、'))+'です。' : '')
      + 'それ以外の年度は、IPA公式サイトの解答例と照らしてください。</li>';
    html += '</ul>';

    EXAM_GROUPS.forEach(function(group){
      html += '<h2>'+escapeHtml(group.title)+' '+escapeHtml(group.part || '午後I')+'</h2>';
      if(group.note) html += '<div class="group-note">'+escapeHtml(group.note)+'</div>';
      html += '<div class="pick-grid">';
      group.ids.forEach(function(pid){
        var p = findProblem(pid);
        var pr = progressOf(p);
        var statusText = pr.done===0 ? '未着手' : (pr.done>=pr.total ? '解答済み' : pr.done+' / '+pr.total+' 解答済み');
        var statusClass = pr.done===0 ? '' : (pr.done>=pr.total ? 'done' : 'partial');
        html += '<button class="pick-card select" data-select="'+p.id+'">';
        html += '<div class="num">'+p.label+'</div>';
        html += '<div class="ttl">'+p.title+'</div>';
        html += '<div class="desc">'+p.lede+'</div>';
        html += '<div class="pick-status '+statusClass+'">'+statusText+'</div>';
        html += '</button>';
      });
      html += '</div>';
    });

    html += '</div></div></div>';
    root.innerHTML = html;

    root.querySelectorAll('[data-select]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var pid = Number(btn.getAttribute('data-select'));
        var pr = progressOf(findProblem(pid));
        state.current = pid;
        state.screen = "exam";
        zoomLevel = 100;
        resumeScroll = pr.done>0 && pr.done<pr.total;
        save();
        render();
      });
    });
  }

  /* ============================= RENDER: EXAM ============================= */
  var currentPageIdx = {};

  function inputChanged(it, value, fieldKey){
    if(fieldKey){
      var obj = state.answers[it.id] || {};
      obj[fieldKey]=value;
      state.answers[it.id]=obj;
    } else {
      state.answers[it.id]=value;
    }
    save();
  }

  function renderTextField(it, opts){
    opts = opts||{};
    var val = opts.value!=null?opts.value:"";
    var limit = opts.limit!=null?opts.limit:it.limit;
    var big = !limit || limit>=15;
    var idAttr = opts.id;

      html = '<textarea rows="'+(limit && limit<=30?2:3)+'" id="'+idAttr+'" data-ans="1"'+(limit?' data-limit="'+limit+'"':'')+'>'+escapeHtml(val)+'</textarea>';
    } else {
      html = '<input type="text" id="'+idAttr+'" data-ans="1"'+(limit?' data-limit="'+limit+'"':'')+' value="'+escapeHtml(val)+'">';
    }
    return html;
  }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function renderMultiOptions(it, selectedArr, groupId, selectCount){
    selectedArr = selectedArr||[];
    var atLimit = selectCount>0 && selectedArr.length>=selectCount;
    var html='<div class="opt-grid" data-group="'+groupId+'">';
    it.options.forEach(function(pair){
      var key=pair[0], text=pair[1];
      var checked = selectedArr.indexOf(key)>=0;

      html += '<label class="opt-chip'+(checked?' checked':'')+(disabled?' disabled':'')+'">';
      html += '<input type="checkbox" value="'+key+'" '+(checked?'checked':'')+(disabled?' disabled':'')+' data-multi="'+groupId+'">';
      html += '<span>'+escapeHtml(text===key?key:(key+"："+text))+'</span></label>';
    });
    html+='</div>';
    if(selectCount>0){
      html += '<div class="opt-hint">'+selectedArr.length+' / '+selectCount+' 個選択中'+(atLimit?'（上限に達しました。解除すると他を選べます）':'')+'</div>';
    } else {
      html += '<div class="opt-hint">該当するものを全て選択（'+selectedArr.length+'個選択中）</div>';

  function renderQCard(it){
    var answered = isAnswered(it);

    var html = '<div class="qcard'+(answered?' answered':'')+(marked?' marked':'')+'" id="card-'+it.id+'">';

    html += '</div>';

      var val = state.answers[it.id]||"";
      html += '<div class="field-row">'+renderTextField(it,{id:"in-"+it.id, value:val});
      if(it.limit){
        var n=ucount(val);
        html += '<div class="counter'+(n>it.limit?' over':'')+'">'+n+' / '+it.limit+' 文字</div>';
      }

    } else if(it.type==="multi"){

      var fv = state.answers[it.id]||{};

          if(f.limit){

            html += '<div class="counter'+(nn>f.limit?' over':'')+'">'+nn+' / '+f.limit+' 文字</div>';

  function bindAnswerPane(container, problem){
    function onAnswerInput(el){
      var lim = Number(el.getAttribute('data-limit')||0);
      if(lim){
        var chars = Array.from(el.value);
        if(chars.length>lim) el.value = chars.slice(0,lim).join('');
      }
      var id = el.id.replace(/^in-/,'');
      var parts = id.split('__');
      if(parts.length===2){ inputChanged({id:parts[0]}, el.value, parts[1]); }
      else { inputChanged({id:id}, el.value); }
      refreshLiveBits(container, problem);
    }
    container.querySelectorAll('[data-ans]').forEach(function(el){
      el.addEventListener('input', function(e){ if(!e.isComposing) onAnswerInput(el); else { var id=el.id.replace(/^in-/,''); var pp=id.split('__'); if(pp.length===2) inputChanged({id:pp[0]}, el.value, pp[1]); else inputChanged({id:id}, el.value); refreshLiveBits(container, problem); } });
      el.addEventListener('compositionend', function(){ onAnswerInput(el); });
    });
    container.addEventListener('focusin', function(e){
      var card = e.target.closest ? e.target.closest('.qcard') : null;
      setActiveItem(card ? card.id.replace(/^card-/,'') : null);
    });
    container.querySelectorAll('[data-multi]').forEach(function(el){
      el.addEventListener('change', function(){
        var group = el.getAttribute('data-multi');
        var parts = group.split('__');
        var itemId = parts[0], fieldKey = parts[1];
        var boxes = container.querySelectorAll('[data-multi="'+cssEscape(group)+'"]');
        var picked=[];
        boxes.forEach(function(b){ if(b.checked) picked.push(b.value); });
        if(fieldKey){ inputChanged({id:itemId}, picked, fieldKey); }
        else { inputChanged({id:itemId}, picked); }

        // update this option group's disabled-state / hint in place (no full re-render, keeps scroll position)
        var it=null;
        problem.groups.forEach(function(g){ g.items.forEach(function(x){ if(x.id===itemId) it=x; }); });
        var selectCount = (it && !fieldKey && it.type==="multi") ? (it.selectCount||0) : 0;
        var atLimit = selectCount>0 && picked.length>=selectCount;
        var optGrid = boxes.length ? boxes[0].closest('.opt-grid') : null;
        if(optGrid){
          optGrid.querySelectorAll('.opt-chip').forEach(function(label){
            var box = label.querySelector('input[type=checkbox]');
            var checked = box.checked;
            var disabled = (!checked && atLimit);
            box.disabled = disabled;
            label.classList.toggle('checked', checked);
            label.classList.toggle('disabled', disabled);
          });
          var hint = optGrid.nextElementSibling;
          if(hint && hint.classList.contains('opt-hint')){
            hint.textContent = selectCount>0
              ? (picked.length+' / '+selectCount+' 個選択中'+(atLimit?'（上限に達しました。解除すると他を選べます）':''))
              : ('該当するものを全て選択（'+picked.length+'個選択中）');
          }
        }
        refreshLiveBits(container, problem);
      });
    });
    container.querySelectorAll('[data-mark]').forEach(function(el){
      el.addEventListener('change', function(){
        var id = el.getAttribute('data-mark');
        if(el.checked) state.marked[id] = true; else delete state.marked[id];
        save();
        var card = document.getElementById('card-'+id);
        if(card) card.classList.toggle('marked', el.checked);
        refreshStatus(problem);
      });
    });
  }
  function cssEscape(s){ return s.replace(/[^a-zA-Z0-9_-]/g, function(c){return '\\'+c;}); }

  function refreshLiveBits(container, problem){
    // update char counters + status dot + answered class without full rerender (keeps caret position)
    container.querySelectorAll('.qcard').forEach(function(card){
      var id = card.id.replace(/^card-/,'');
      var it = null;
      problem.groups.forEach(function(g){ g.items.forEach(function(x){ if(x.id===id) it=x; }); });
      if(!it) return;
      var ans = isAnswered(it);
      card.classList.toggle('answered', ans);
    });
    // counters
    container.querySelectorAll('textarea, input[type=text]').forEach(function(inp){
      var wrap = inp.closest('.field-row');
      if(!wrap) return;
      var counter = wrap.querySelector('.counter');
      if(!counter) return;
      var limitMatch = counter.textContent.match(/\/\s*(\d+)/);
      var limit = limitMatch?Number(limitMatch[1]):0;
      var n = Array.from(inp.value).length;
      counter.textContent = n+' / '+limit+' 文字';
      counter.classList.toggle('over', n>limit);
    });
    var bd = document.getElementById('bottomDone');
    if(bd){ var pr=progressOf(problem); bd.textContent = pr.done+' / '+pr.total; }
    refreshStatus(problem);
  }

  /* ---------- floating windows (memo / calculator) ---------- */
  function makeDraggable(win, handle){
    handle.addEventListener('pointerdown', function(e){
      if(e.target.closest('button,input,label')) return;
      var r = win.getBoundingClientRect();
      var offX = e.clientX - r.left, offY = e.clientY - r.top;
      win.style.left = r.left+'px'; win.style.top = r.top+'px';
      win.style.right = 'auto'; win.style.bottom = 'auto';
      handle.setPointerCapture(e.pointerId);
      function move(ev){
        var x = Math.max(0, Math.min(window.innerWidth-60, ev.clientX-offX));
        var y = Math.max(0, Math.min(window.innerHeight-40, ev.clientY-offY));
        win.style.left = x+'px'; win.style.top = y+'px';
      }
      function up(){
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', up);
        handle.removeEventListener('pointercancel', up);
      }
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', up);
      handle.addEventListener('pointercancel', up);
    });
  }

  function setupCalc(win){
    var disp = win.querySelector('.calc-disp');
    var acc = null, op = null, entry = '0', fresh = true;
    function show(v){ disp.textContent = String(v); }
    function compute(a, b, o){
      if(o==='+') return a+b;
      if(o==='-') return a-b;
      if(o==='*') return a*b;
      if(o==='/') return b===0 ? NaN : a/b;
      return b;
    }
    function fmt(n){
      if(!isFinite(n)) return 'エラー';
      return String(Math.round(n*1e10)/1e10);
    }
    function press(k){
      if(/^[0-9]$/.test(k)){
        entry = (fresh || entry==='0') ? k : entry+k; fresh = false; show(entry);
      } else if(k==='.'){
        if(fresh){ entry='0.'; fresh=false; }
        else if(entry.indexOf('.')<0) entry+='.';
        show(entry);
      } else if(k==='C'){
        acc=null; op=null; entry='0'; fresh=true; show(entry);
      } else if(k==='B'){
        if(!fresh && entry.length>1) entry = entry.slice(0,-1); else entry='0';
        show(entry);
      } else if(k==='='){
        if(op!==null && acc!==null){
          var r = compute(acc, parseFloat(entry), op);
          entry = fmt(r); acc=null; op=null; fresh=true; show(entry);
        }
      } else {
        var cur = parseFloat(entry);
        if(op!==null && acc!==null && !fresh){ acc = compute(acc, cur, op); show(fmt(acc)); }
        else if(acc===null || op===null){ acc = cur; }
        op = k; fresh = true;
      }
    }
    win.querySelectorAll('[data-k]').forEach(function(b){
      b.addEventListener('click', function(){ press(b.getAttribute('data-k')); });
    });
    win.querySelectorAll('[data-size]').forEach(function(b){
      b.addEventListener('click', function(){
        win.classList.remove('s-s','s-m','s-l');
        win.classList.add('s-'+b.getAttribute('data-size'));
      });
    });
    show(entry);
  }

  function setupMarkCanvas(canvas, img, key){
    var ctx = canvas.getContext('2d');
    function redraw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      (state.marks[key]||[]).forEach(function(s){
        if(!s.p.length) return;
        ctx.strokeStyle = MARK_COLORS[s.c] || MARK_COLORS.y;
        ctx.lineWidth = s.w * 7;
        ctx.beginPath();
        ctx.moveTo(s.p[0][0]*canvas.width, s.p[0][1]*canvas.height);
        if(s.p.length===1) ctx.lineTo(s.p[0][0]*canvas.width+0.01, s.p[0][1]*canvas.height);
        for(var i=1;i<s.p.length;i++) ctx.lineTo(s.p[i][0]*canvas.width, s.p[i][1]*canvas.height);
        ctx.stroke();
      });
    }
    function fit(){
      canvas.width = img.naturalWidth || 1075;
      canvas.height = img.naturalHeight || 1520;
      redraw();
    }
    if(img.complete && img.naturalWidth){ fit(); }
    else { canvas.width = 1075; canvas.height = 1520; img.addEventListener('load', fit); }
    canvas.redrawMarks = redraw;

    var stroke = null;
    function pt(e){
      var r = canvas.getBoundingClientRect();
      return [Math.round((e.clientX-r.left)/r.width*10000)/10000, Math.round((e.clientY-r.top)/r.height*10000)/10000];
    }
    canvas.addEventListener('pointerdown', function(e){
      if(!markerTool) return;
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      stroke = {c:markerTool, w:markerSize, p:[pt(e)]};
      if(!state.marks[key]) state.marks[key] = [];
      state.marks[key].push(stroke);
      redraw();
    });
    canvas.addEventListener('pointermove', function(e){
      if(!stroke) return;
      stroke.p.push(pt(e));
      redraw();
    });
    function end(){ if(stroke){ stroke = null; save(); } }
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
  }

  function initSplitter(workArea, leftPane, splitter){
    var mq = window.matchMedia('(max-width: 880px)');
    function apply(){
      var pct = mq.matches ? splitV : splitH;
      leftPane.style.setProperty('--split', pct+'%');
    }
    apply();
    if(mq.addEventListener) mq.addEventListener('change', apply);
    splitter.addEventListener('pointerdown', function(e){
      e.preventDefault();
      splitter.setPointerCapture(e.pointerId);
      splitter.classList.add('drag');
      function move(ev){
        var r = workArea.getBoundingClientRect();
        var vertical = mq.matches;
        var p = vertical ? (ev.clientY-r.top)/r.height : (ev.clientX-r.left)/r.width;
        p = Math.max(0.2, Math.min(0.8, p)) * 100;
        if(vertical) splitV = p; else splitH = p;
        apply();
      }
      function up(){
        splitter.classList.remove('drag');
        splitter.removeEventListener('pointermove', move);
        splitter.removeEventListener('pointerup', up);
        splitter.removeEventListener('pointercancel', up);
      }
      splitter.addEventListener('pointermove', move);
      splitter.addEventListener('pointerup', up);
      splitter.addEventListener('pointercancel', up);
    });
  }

  function renderExam(){

  /* ============================= RENDER: RESULT ============================= */
  function buildTranscript(problem, answersSrc){
    answersSrc = answersSrc || state.answers;
    var lines=[];
    lines.push(examTitleFor(problem.id)+' － 解答控え');
    lines.push('■ '+problem.label+' '+problem.title);
    lines.push('');
    problem.groups.forEach(function(g){
      lines.push('['+g.mon+']');
      g.items.forEach(function(it){
        var label = (it.sub? (g.mon+it.sub):g.mon);
        if(it.type==="text"){
          lines.push('  '+label+'： '+(answersSrc[it.id]||'（未解答）'));
        } else if(it.type==="multi"){
          var v=answersSrc[it.id]||[];
          lines.push('  '+label+'： '+(v.length?v.join('、'):'（未解答）'));
        } else if(it.type==="fields"){
          var fv=answersSrc[it.id]||{};
          it.fields.forEach(function(f){
            var val = fv[f.key];
            var text = Array.isArray(val)? (val.length?val.join('、'):'（未解答）') : (val||'（未解答）');
            lines.push('  '+label+' '+f.label+'： '+text);
          });
        }
        if(state.correct[it.id]){
          lines.push('  '+label+' 正しい解答： '+state.correct[it.id]);
        }
      });
    });
    return lines.join('\n');
  }

  function buildQABlockHtml(problem, answersSrc, opts){
    opts = opts || {};
    var html='';
    problem.groups.forEach(function(g){
      g.items.forEach(function(it){
        html+='<div class="rq"><span class="sub">'+escapeHtml(g.mon)+(it.sub?' '+it.sub:'')+'</span>';
        html+='<div class="prompt">'+escapeHtml(it.prompt)+'</div>';
        html+='<div class="ans-label">あなたの解答</div>';
        if(it.type==="text"){
          var v=answersSrc[it.id];
          html+='<div class="ans'+(v?'':' empty')+'">'+escapeHtml(v||'（未解答）')+'</div>';
        } else if(it.type==="multi"){
          var vv=answersSrc[it.id]||[];
          html+='<div class="ans'+(vv.length?'':' empty')+'">'+(vv.length?escapeHtml(vv.join('、')):'（未解答）')+'</div>';
        } else if(it.type==="fields"){
          var fv=answersSrc[it.id]||{};
          it.fields.forEach(function(f){
            var val=fv[f.key];
            var text = Array.isArray(val)? (val.length?val.join('、'):'') : (val||'');
            html+='<div style="font-size:12px;color:var(--text-muted);margin-top:4px;">'+escapeHtml(f.label)+'</div>';
            html+='<div class="ans'+(text?'':' empty')+'">'+escapeHtml(text||'（未解答）')+'</div>';
          });
        }
        if(opts.showCorrect){
          var corr = state.correct[it.id]||'';
          html+='<div class="ans-label corr-label">正しい解答（自己採点用・任意入力）</div>';
          if(opts.editableCorrect){
            html+='<textarea class="corr-input" data-correct="'+it.id+'" rows="2" placeholder="IPA公式サイトの解答例を入力すると、あなたの解答と並べて記録できます">'+escapeHtml(corr)+'</textarea>';
          } else {
            html+='<div class="ans corr-display'+(corr?'':' empty')+'">'+escapeHtml(corr||'（未入力）')+'</div>';
          }
        }
        if(opts.showModel && MODEL_DATA[it.id]){
          var mo = MODEL_DATA[it.id];
          html+='<div class="model-ans"><div class="ans-label model-label">模範解答（IPA公式解答例）</div><div class="ans model-text">'+escapeHtml(mo.a)+'</div>';
          if(mo.e) html+='<div class="ans-label model-label">解説</div><div class="model-exp">'+escapeHtml(mo.e)+'</div>';
          html+='</div>';
        }
        html+='</div>';
      });
    });
    return html;
  }

  function wireCopyButton(btnId, textareaEl, textFn){
    document.getElementById(btnId).addEventListener('click', function(){
      var text = textFn();
      function fallbackCopy(){
        textareaEl.focus();
        textareaEl.select();
        var ok=false;
        try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
        toast(ok?'コピーしました（テキスト欄からコピーしました）':'自動コピーできませんでした。テキスト欄から手動でコピーしてください。');
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast('コピーしました'); }, fallbackCopy);
      } else {
        fallbackCopy();
      }
    });
  }

        });
        save();
        toast(n ? n+'件を「正しい解答」欄に転記しました' : '転記できる未入力の欄はありません');
        render();
      });
    }
    document.getElementById('btnPrint').addEventListener('click', function(){
      state.screen='print'; render();
    });
    document.getElementById('btnBackHome').addEventListener('click', function(){
      state.screen='cover'; render();
    });
    document.getElementById('btnRedo').addEventListener('click', function(){
      if(!confirm('この問題（'+problem.label+'）の解答とメモを全て消去してやり直します。解答の履歴は残ります。よろしいですか？')) return;
      clearProblemData(problem.id);
      state.screen='exam';
      render();
    });
  }

  /* ============================= RENDER: PRINT PREVIEW ============================= */
  function renderPrintPreview(){
    var root=document.getElementById('app');
    var problem=findProblem(state.current);
    var html='';
    html+='<div class="top-bar no-print"><div class="title">印刷プレビュー<small>'+problem.label+' '+escapeHtml(problem.title)+'</small></div>';
    html+='<div class="top-spacer"></div>';
    html+='<button class="ghost small" id="btnPrintBack">解答一覧に戻る</button>';
    html+='<button class="primary small" id="btnPrintNow">印刷する</button>';
    html+='</div>';

    html+='<div class="print-wrap"><div class="print-page">';
    html+='<div class="print-head">';
    html+='<h1>'+escapeHtml(examTitleFor(problem.id))+' － 解答控え</h1>';
    html+='<div class="print-sub">'+problem.label+' '+escapeHtml(problem.title)+'</div>';
    html+='<div class="print-meta">印刷日：'+fmtDateTime(Date.now())+'</div>';
    html+='</div>';
    html+=buildQABlockHtml(problem, state.answers, {showCorrect:true, editableCorrect:false});
    html+='</div></div>';

    root.innerHTML=html;

    document.getElementById('btnPrintBack').addEventListener('click', function(){
      state.screen='result'; render();
    });
    document.getElementById('btnPrintNow').addEventListener('click', function(){
      window.print();
    });
  }

  /* ============================= ROOT RENDER ============================= */
  function render(){
    var root=document.getElementById('app');
    document.documentElement.classList.toggle('invert', invertOn && state.screen==="exam");
    if(state.screen==="cover"){ renderCover(root); }
    else if(state.screen==="exam"){ renderExam(); }
    else if(state.screen==="review"){ renderReview(); }
    else if(state.screen==="result"){ renderResult(); }
    else if(state.screen==="print"){ renderPrintPreview(); }
  }

  render();
})();
</script>
