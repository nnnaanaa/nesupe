端のノードにRSTを送ると、各ノードはFWの故障で届かなくなったコネクションを、タイムアウトを待たずに切断として認識し、すぐに再接続できます。"}, "i1-1-1": {"a": "アノマリ（異常検知）", "e": "IDSの検知方式には、既知の攻撃パターンで検知するシグネチャ型と、正常な状態や仕様からの逸脱を検知するアノマリ型（異常検知型）があります。"}, "i1-1-2": {"a": "ミラー（ミラーリング）", "e": "IDSはSWのミラーポート（ミラーリングポート）に接続し、監視対象の通信のコピーを受け取ります。"}, "i1-1-3": {"a": "プロミスキャス", "e": "プロミスキャスモードにすると、宛先が自分宛でないフレームも取り込めます。"}, "i1-1-4": {"a": "IP", "e": "監視用のポートにIPアドレスを付けなければ、そのポートはL3レベルで通信できず、IDS自体が攻撃を受けることを避けられます。"}, "i1-1-5": {"a": "unreachable", "e": "UDPの不正パケットには送信元へICMPのport unreachable（宛先ポート到達不能）を返し、攻撃の抑止を試みます。"}, "i1-2-1": {"a": "追加する通信の範囲：インターネット⇔内部LAN\nSW1：○　SW2：×　SW3：○", "e": "表1に無い組合せは「インターネット⇔内部LAN」です。この通信は、インターネット側のSW1と内部LAN側のSW3を通りますが、DMZ側のSW2は通りません。"}, "i1-2-2": {"a": "FWのACLを動的に変更して、遮断の対象とする送信元アドレスを追加する。", "e": "IDSが不正を検知すると、FWにそのアドレスを通知し、FWのアクセス制御リストに遮断対象の送信元アドレスを動的に追加させます。"}, "i1-2-3": {"a": "不正アクセスの送信元アドレスが偽装されている可能性があるから。", "e": "送信元アドレスが偽装されていると、抑止のICMPパケットが無関係な第三者に届き、その第三者への攻撃になりかねません（本文の「他のサイトへの攻撃となることもある」）。"}, "i1-3-1": {"a": "保護する機器にセキュリティパッチを適用するまでの間、脆弱性を悪用する攻撃の通信を遮断する。", "e": "いわゆる仮想パッチです。サーバに新しい脆弱性が見つかり、影響確認に時間が掛かって実パッチをすぐ当てられない間、IPSが脆弱性を突く通信を遮断して時間を稼ぎます。"}, "i1-3-2": {"a": "通信をそのまま通過させ、遮断しない機能。", "e": "IPSは通信の経路上に置かれるので、IPSが故障すると通信全体が止まります。そのため、故障時には通信をそのまま通過させるバイパス（フェイルオープン）の機能を使います。"}, "i1-3-3": {"a": "不正アクセスへの対応を最適化するために、ログを取得して解析する。", "e": "IDS・IPSは誤検知（フォールスポジティブ）と見逃し（フォールスネガティブ）が起こり得ます。管理用PCでログを収集・解析して、設定やシグネチャを見直し、対応を継続的に最適化します。"}, "t1-1-1": {"a": "MX", "e": "他のドメイン宛のメールの配送先は、DNSのMXレコードで決まります。"}, "t1-1-2": {"a": "MSV3", "e": "DNS3が答えるMXレコードはA社のメールサーバ（MSV3）です。社内PCはMSV3に届いたメールをPOP3で取得します。"}, "t1-1-3": {"a": "MSV2", "e": "B社はQ社のメールサービスを使っており、Q社のメールサーバはMSV2です。"}, "t1-1-4": {"a": "SMTP-AUTH", "e": "SMTPプロトコル上でユーザ認証を行う方式はSMTP-AUTHです。"}, "t1-2-1": {"a": "不正メールの踏み台にされてしまうリスク。", "e": "認証なしにa-sha.co.jp以外宛のメールを転送する設定だと、誰でも外部宛のメールを中継させられるオープンリレーになり、迷惑メールの踏み台にされます。"}, "t1-2-2": {"a": "ルータ4", "e": "OP25Bは、サービスネットワーク内の動的IPアドレスのホストから、サービスネットワーク外へ向かう宛先ポート25のSMTPを禁止します。サービスネットワークとインターネットの境界は、Q社のルータ4です。"}, "t1-2-3": {"a": "オ：TCP\nカ：a.b.0.0/20\nキ：25", "e": "項番1は「禁止」で、TCPのポート25宛、送信元はQ社が動的に割り当てるアドレスブロック（a.b.0.0/20）です。項番2で、それ以外のIP通信を許可します。"}, "t1-2-4": {"a": "サブミッションポート", "e": "メールクライアントからメールサーバへ送信するときは、認証付きのサブミッションポート（TCP 587）を使います。"}, "t1-2-5": {"a": "110\n587", "e": "外部（B社）からDMZのMSV3へは、受信のPOP3（110番）と、送信のサブミッション（587番）の2種類を通します。本文でSTARTTLS方式（平文で接続して途中で暗号化に切り替える方式）とされているので、暗号化専用のポート（POP3Sの995、SMTPSの465）ではなく、元のポートです（採点講評でも誤答が多い点とされています）。"}, "t1-3-1": {"a": "MAIL FROM", "e": "SMTP通信の中でやり取りされる送信元（エンベロープの送信元）は、MAIL FROMコマンドで通知されます。"}, "t1-3-2": {"a": "送信元メールサーバのIPアドレス", "e": "SPFは、DNSのSPFレコードに登録された正当なメールサーバのIPアドレスと、実際にSMTP接続してきた送信元メールサーバのIPアドレスを照合します。"}, "q1-1-1": {"a": "AES", "e": "WPA2は、暗号化にAES（CCMP）を必須とした最初の方式です。（WPAはTKIPです）"}, "q1-1-2": {"a": "事前共有鍵", "e": "あらかじめ同じパスフレーズ（鍵）を設定する認証は、事前共有鍵（PSK）方式です。"}, "q1-1-3": {"a": "SIMカード", "e": "通信事業者が契約者を識別するための情報（IMSIなど）は、SIMカードに記録されています。"}, "q1-1-4": {"a": "APN", "e": "LTE回線で接続先のネットワークを指定する情報は、APN（Access Point Name）です。"}, "q1-1-5": {"a": "NAPT", "e": "プライベートIPアドレスのタブレットが、1つのグローバルIPアドレスでインターネットと通信するため、IPアドレスとポート番号を変換するNAPTが行われます。"}, "q1-1-6": {"a": "CONNECT", "e": "HTTPSプロキシは、クライアントのHTTP CONNECTメソッドの要求で、接続先へのTLSトンネルを中継します。"}, "q1-2-1": {"a": "定期的に送信するビーコン信号を停止する。", "e": "ステルス機能は、アクセスポイントがビーコンにSSIDを載せて発信するのをやめる機能です（クライアントの一覧にSSIDが出ない、というクライアント側の効果ではなく、アクセスポイント側の動作を答えます）。"}, "q1-2-2": {"a": "SSIDやMACアドレスは暗号化できず、傍受されるから。", "e": "無線LANは電波で通信するので、誰でも傍受できます。WPA2の暗号化は通信データを守るものですが、SSIDやMACアドレスは暗号化の対象にできず、そのまま見えてしまいます。"}, "q1-2-3": {"a": "E", "e": "タブレットはDHCPで（A）のプライベートIPアドレスをもらい、VPN接続後は（E）のプライベートIPアドレスが割り当てられます。（A）と（E）のアドレスが重複すると、タブレットはE社内への通信を自分のネットワーク（A）宛と判断して、VPNに送らなくなります。"}, "q1-3-1": {"a": "VPN接続の利用者IDを停止する。", "e": "端末とハードウェアトークンの両方が紛失している場合、利用者IDが悪用されるおそれがあるため、直ちにそのIDを使えないようにします。"}, "q1-3-2": {"a": "プロキシサーバと内部DNSサーバへの通信", "e": "本文では、タブレットから販売管理サーバ及びインターネットへの通信は、プロキシサーバ経由、名前解決は内部DNSサーバと決められています。VPN接続で許可するのは、この2つへの通信に絞ります。"}, "q1-4-1": {"a": "機能名：プロキシ認証\n設定内容：営業員ごとに利用者IDを登録する。", "e": "プロキシサーバのログから営業員を特定するには、プロキシ認証を行い、営業員ごとに利用者IDを登録して、ログに利用者IDが残るようにします。"}, "q1-4-2": {"a": "接続先ホスト名\n接続先ポート番号", "e": "HTTPSでは、プロキシが見えるのはCONNECTメソッドのRequest-URI（ホスト名:ポート番号）だけで、TLSトンネルの中のURLやデータは見えません。"}, "t3-1-1": {"a": "a：ゾーン転送\nb：SMTP", "e": "セカンダリDNSは、NOTIFYを受け取ると、プライマリDNSにゾーン転送を要求して、ゾーン情報を更新します。表1の項番1と2は、MGWとMSVの間のメール転送で、プロトコルはSMTPです。"}, "t3-1-2": {"a": "DNS1", "e": "項番3の送信元はDNS3（セカンダリ）で、プライマリDNSは、セカンダリDNSとだけ通信します。DNS3の通信相手はプライマリのDNS1です。"}, "t3-1-3": {"a": "公開ゾーン情報の更新通知", "e": "項番4のDNS1→DNS3は、プライマリDNSからセカンダリDNSへのNOTIFYです。DNS3は公開ゾーン情報だけを持つので、公開ゾーン情報の更新通知が送られます。"}, "t3-1-4": {"a": "条件：送信元が少数の場合\n理由：送信元は、DNSのキャッシュが生存している間、宛先を変えないから。", "e": "MGWからMSVへの送信元はMGWの2台だけなので、DNSのキャッシュが生存する間はどちらもキャッシュした同じ宛先に送り続け、宛先が偏ります。PCからMSVへの通信と違い、送信元が少数だとラウンドロビンの平準化効果が働きません。"}, "t3-2-1": {"a": "d：新MSV1\ne：新MSV2", "e": "VRRPを2グループ設定します。VRRPg1は新MSV1の優先度を高く、VRRPg2は新MSV2の優先度を高くして、2台でActive-Activeにします。"}, "t3-2-2": {"a": "msvc：VIP1\nmsvc：VIP2", "e": "PCが共通のホスト名msvcを引くと、VIP1とVIP2の2つが順番に返るよう、同じホスト名のAレコードを2件登録します（DNSラウンドロビン）。"}, "t3-3-1": {"a": "機器名：FW\n設定変更内容：新MSVとMGWとの間のSMTP通信を、双方向とも許可する。", "e": "表1のFWの許可ルールは旧MSV（MSV1～3）が対象です。移行中NWでは新MSVとMGWの間でもSMTPが流れるので、FWに許可を追加します（MGWの転送先変更とDNSの設定変更は設問で除かれています）。"}, "t3-3-2": {"a": "送信元：メール送受信サーバの変更を実施済みの社員、又は社外\n宛先：未変更社員", "e": "移行工程では、開始工程でMGWの転送先がVIP1（新MSV1）に変わっています。新MSVに届いた未変更社員宛のメールは、MBOXがまだ旧MSVにあるので、新MSVがLDAPの情報でメールルーティングして旧MSVへ回す必要があります。"}, "t3-3-3": {"a": "(A)：新MSV→旧MSV\n(B)：旧MSV", "e": "(ア)：社外→MGW→新MSV1（転送先がVIP1）→未変更社員のMBOXがある旧MSVへ、LDAPを使ってルーティング。(イ)：未変更社員のPCは旧MSVを使い続けているので、PC→旧MSV→MGW→宛先となります。"}, "t3-3-4": {"a": "申請者のメールアドレスに対応するメールサーバが、新MSVに変更される。", "e": "LDAPには、メールアドレスと、そのMBOXを収容するMSVとの対応が登録されています。社員が申告すると、その社員のアドレスに対応するMSVが旧MSVから新MSVに書き換えられます。"}, "a1-1-1": {"a": "帯域幅（通信速度）", "e": "ルータのOSPFコストは、標準では物理ポートの帯域幅（通信速度）を基準に自動計算されます（帯域が大きいほどコストが小さい）。この設問では、経路を方針どおりにするため、コストを図1の値（cost 20、cost 10）に手動で設定しています。"}, "a1-1-2": {"a": "0", "e": "OSPFのバックボーンエリアのエリア番号は0（0.0.0.0）で、必ず存在しなければならず、他のエリアは必ずバックボーンに隣接します。"}, "a1-1-3": {"a": "TOS", "e": "DiffServは、IPv4ヘッダのTOSフィールド（8ビット）をDSフィールドとして再定義し、上位6ビットのDSCPで優先度を示します。"}, "a1-1-4": {"a": "DiffServ（Differentiated Services）", "e": "RFC 2474で規定された、パケットごとにDSCPで優先度を示す、クラス単位のQoSモデルです。"}, "a1-1-5": {"a": "高く", "e": "PBRは、宛先だけでなくパケットの種類（プロトコルや通信の内容）で経路を選ぶ機能です。CIFSのパケットをWASへ回すためには、通常の経路制御（OSPF）よりPBRを優先させる必要があるので、優先度は「高く」します。"}, "a1-2-1": {"a": "デフォルトゲートウェイの設定：業務系セグメントに対応した仮想ルータのIPアドレス\nVRRPの設定：業務系セグメントの仮想ルータがルータ3でアクティブになるようにプライオリティ値を設定する。", "e": "PCのデフォルトゲートウェイを、ルータ3・4の実IPアドレスでなく、業務系セグメントのVRRPの仮想ルータのIPアドレスにします。そうすれば、ルータが切り替わってもPCの設定を変えずに済みます。通常時に業務系セグメントの通信を「ルータ1とルータ3」経由にするため、業務系セグメントの仮想ルータはルータ3でアクティブになるよう、ルータ3のプライオリティを高く設定します（動画系はルータ4）。採点講評でも、単に通信経路を説明しただけの解答が多かったとされています。"}, "a1-2-2": {"a": "10.1.0.0/16", "e": "支部1のセグメントは、業務系10.1.1.0/24と動画系10.1.2.0/24です。本文「ABRで最もプレフィックスが短くなるように経路情報の集約を行う」とあるので、両方を含む最も短いプレフィックスの10.1.0.0/16に集約します。"}, "a1-2-3": {"a": "a：ルータ1 → ルータ3\nb：ルータ2 → ルータ1 → ルータ3", "e": "通常は「動画サーバ → L2SW → ルータ2 → ルータ4 → L2SW → PC」です。a：ルータ2本体が故障すると、動画系の通信は、動画系セグメント側のL2SWからルータ1へ出て、広域イーサ網1経由でルータ3に入ります（動画系も業務系の経路を使う）。b：ルータ4のp10（広域イーサ網2側のポート）が故障すると、ルータ2からは、ルータ1を回って広域イーサ網1経由でルータ3に入ります。"}, "a1-2-4": {"a": "利用者をグループ化して使用時間帯をずらす。", "e": "広域イーサ網の一方が使えないとき、業務系のアクセスが集中して応答が悪化するのを防ぐ運用上の方策です。利用者をグループに分けて、アクセスする時間帯をずらします。（採点講評では(4)の正答率は高かったとされています）"}, "a1-3-1": {"a": "IPアドレス\nポート番号", "e": "CIFS（SMB）のパケットを識別するには、宛先IPアドレス（FSのアドレス）と、宛先ポート番号（TCP 445など）を使います。第3層はIPアドレス、第4層はポート番号です。"}, "a1-3-2": {"a": "ラウンドトリップ時間が大きい場合", "e": "WASは、一方のWASが代理応答（FS側の代わりにクライアントへ応答）して、データをまとめて送ります。ラウンドトリップ時間（遅延）が大きいほど、1回ずつ待ち合わせる通信のむだが大きいので、まとめ送りと代理応答の効果が大きくなります。"}, "a1-3-3": {"a": "片側のWASが故障した場合", "e": "データの高速化処理はWAS間で対向して行われます。片側のWASが故障すると、対向のWASが処理できず通信が止まるので、高速化処理を自動的に停止して、通常の（高速化なしの）通信に切り替える機能が必要です。"}, "b1-1-1": {"a": "NAPT", "e": "ネットワークアドレス（IPアドレス）とポート番号を同時に変換する機能は、NAPT（IPマスカレード）です。"}, "b1-1-2": {"a": "ステートフル", "e": "FWの管理情報（コネクションテーブルなど）を主系から副系へ引き継ぐフェールオーバが、ステートフルフェールオーバです。これがないとフェールオーバ後に既存の通信が切れます。採点講評で、この設問（イ）の正答率が低かった点とされています。"}, "b1-1-3": {"a": "物理（第1）", "e": "リンクLEDは、ケーブルでつながって信号が届いている状態を示すので、OSI基本参照モデルの物理層（第1層）の正常接続を表します。"}, "b1-1-4": {"a": "Gratuitous ARP（GARP）", "e": "自分のIPアドレスに対するARP要求をブロードキャストして、接続機器のARPテーブルを更新させるのがGratuitous ARPです。FWにはこれを使った更新の機能がなかったので、交換後のMACアドレスの変更を反映させる手動操作が必要でした。"}, "b1-1-5": {"a": "タグ（Tag）", "e": "1本のリンクに複数のVLANを収容するトランク接続では、IEEE 802.1Qのタグ（VLAN ID）をフレームに付けて、VLANを識別します。タグVLANです。"}, "b1-2-1": {"a": "SW3とL3SWの間", "e": "企画部と営業部のVLANは、SW3とL3SWの両方にまたがって存在しています。この2台の間は、1本のリンクで複数のVLANを通す必要があるので、トランク接続にしなければなりません。"}, "b1-2-2": {"a": "TCPの再送機能", "e": "FWのフェールオーバ中に落ちたパケットを、TCPが再送することで補い、アプリケーションのデータが失われず、通信を継続できます（採点講評では、FWに着目せず、TCPの信頼性のある通信を実現する機能を端的に答える設問と説明されています）。"}, "b1-2-3": {"a": "一方のポート故障による対向ポートのリンク断を防ぎ、どちらのFWの障害か特定が容易になる。", "e": "FW同士をケーブルで直結すると、片方のポートが故障したとき、対向のポートのリンクも切れてしまい、どちらが故障したか分かりにくくなります。SW2を挟めば、第2層（通信）は透過しつつ第1層（物理リンク）は分離され、故障側のFW接続ポートだけがリンク断になります。"}, "b1-2-4": {"a": "MACアドレステーブル", "e": "下線③の「切り替わったことを通知するフレーム」を受けたスイッチが更新するのは、MACアドレステーブル（学習テーブル）です。主系のIPアドレスとMACアドレスを副系が引き継ぐ方式なので、スイッチは同じMACアドレスのポートが変わったと学習し直します。"}, "b1-2-5": {"a": "a：ルータ、DNSサーバ、Webサーバ\nb：FW1から設定情報が同期されたこと", "e": "FW1の交換でFW1の各ポートのMACアドレスが変わったので、FWを経由して通信する機器のARPテーブルを初期化します（表の(5)に書かれているL3SWに加えて、aに三つの機器）。図1で、FWの外側（インターネット側）につながるルータと、DMZのDNSサーバ・Webサーバが対象です。bは、FW1と同様、交換後のFW2が起動時にStandby動作に入り、Active動作のFW1から設定情報が同期されたことの確認です（今回の事故は、交換後のFW1が相手のFWを認識できずにActiveになり、設定が失われたことが原因でした）。"}, "b1-3-1": {"a": "SW4とL3SWを相互に入れ替える。", "e": "公式解答例のとおりです。本文では、仮想FWの導入にあたり、企画部と営業部のVLAN間通信を廃止し、DNSサーバ・Webサーバは現状のまま、トランク接続は使わない、新たな機器は購入しない、という条件があります。この条件の下で、2台のスイッチ（図1のSW4とL3SW）を相互に入れ替えることで、仮想FWのVLAN構成に合わせます。"}, "b1-3-2": {"a": "・FW1で企画部用の仮想FWを、FW2で営業部用の仮想FWを、それぞれActiveにする。\n・FW2で企画部用の仮想FWを、FW1で営業部用の仮想FWを、それぞれActiveにする。", "e": "公式解答例は、この2つを両方挙げた形です。仮想FWごとにActive・Standbyを設定でき、企画部用と営業部用でActiveにする物理FWを分けると、2台の物理FWの両方が通信を処理でき、物理FW間で負荷分散できます。採点講評では、目的の説明に終始して、配置の具体性（どの仮想FWをどの物理FWでActiveにするか）に欠ける解答が散見されたとされています。"}, "c1-1-1": {"a": "分散", "e": "多数のコンピュータから一斉に攻撃する分散型（DDoS）です。発信元の特定が難しく、被害が大きくなります。"}, "c1-1-2": {"a": "フラッド", "e": "SYNフラッド攻撃、UDPフラッド攻撃です。大量のパケットを送って、標的の処理能力を使い切らせます。"}, "c1-1-3": {"a": "再帰", "e": "問合せを受けたDNSサーバが、他のDNSサーバへ問い合わせて最終的な結果を返す方式が、再帰的な問合せです。"}, "c1-1-4": {"a": "リフレクタ", "e": "送信元IPアドレスを標的のアドレスに偽装して問合せを送り、DNSサーバから標的へ応答（増幅された大きな応答）を送らせる攻撃が、DNSリフレクタ攻撃です。"}, "c1-1-5": {"a": "ペネトレーション", "e": "実際に侵入を試みて、脆弱性を確かめるテストが、ペネトレーションテストです。"}, "c1-2-1": {"a": "踏み台", "e": "オープンリゾルバは、誰からの再帰的な問合せにも応答するDNSサーバで、DNSリフレクタ攻撃の踏み台にされます。自分が攻撃の踏み台にならないよう、再帰問合せを受け付ける範囲を制限します。"}, "c1-2-2": {"a": "断片化されたエコーパケットを許可しない機能", "e": "大きなサイズのICMPパケットは、MTUを超えるため断片化（フラグメント）されます。断片化された大きなエコー応答を大量に送りつける攻撃を防ぐため、FWで断片化されたICMPエコーパケットを通さない（許可しない）機能が必要です。"}, "c1-3-1": {"a": "DNSキャッシュが改ざんされる。", "e": "DMZのDNSサーバでキャッシュ機能を有効にしていると、キャッシュポイズニング攻撃で、偽の情報をキャッシュさせられるおそれがあります。そのためDMZの外部向けDNSは、キャッシュ機能を無効にして使います。"}, "c1-3-2": {"a": "DMZの空欄：DNS-S（外部向けのセカンダリ。内部のDNS-Pからゾーン転送を受ける）\n内部セグメントの空欄：DNS-C（PCからの問合せを受けるキャッシュDNS）と、DNS-S（内部向けのセカンダリ）\n矢印：DNS-P→DMZのDNS-S（ゾーン転送）、DNS-C→DMZのDNS-S（DNS問合せ）", "e": "公式解答例の図に基づきます。PCからの問合せは、内部セグメントのキャッシュDNS（DNS-C）が受け、DNS-Cが内部のDNS-S、DMZのDNS-S、インターネットへ問い合わせます。プライマリDNS-Pには問合せが来ないようにし、ゾーン転送の宛先は、自行内のセカンダリ（内部のDNS-SとDMZのDNS-S）に限ります。"}, "c1-3-3": {"a": "内部から外部への通信に対する遮断ルールを設定する。\nFWで遮断した通信の結果ログを監視する。", "e": "外部からの不正アクセスだけでなく、内部から外部への通信（マルウェアの通信など）も、不要な通信は遮断するルールを設定して防ぎます。また、遮断された通信のログを監視することで、内部の不審な動き（感染の兆候）を早期に見つけられます。"}, "c1-4-1": {"a": "ネットワークの切断", "e": "セキュリティ担当者の対応の「(3)」は、被害の拡大を防ぐためにネットワークの切断（感染機器の隔離）を行う作業です。(2)対処方法の確認のあと、原因を調べる(4)の前に行います。"}, "c1-4-2": {"a": "対処結果の評価を行い、インシデントの対処方法を見直す。", "e": "PDCAサイクルのとおり、対処結果を評価して、手順（対処方法）を見直すことで、将来のインシデントへの対応力を高めます（採点講評でも、PDCAに従った改善手法の重要性が述べられています）。"}, "r1-1-1": {"a": "HELLO", "e": "SSLのハンドシェイクは、ClientHello／ServerHelloのHELLOメッセージで、暗号化アルゴリズムなどを決めるところから始まります。採点講評では、アとイの正答率が低かったとされています。"}, "r1-1-2": {"a": "127.255.255.254", "e": "127.0.0.0/8がループバックアドレスの範囲で、127.255.255.255はブロードキャストアドレスにあたるので、利用できる最大は127.255.255.254です。"}, "r1-1-3": {"a": "FQDN", "e": "hostsファイルに「127.0.1.10 shisankanri.example.com」と書くので、ループバックアドレスは資産管理サーバのFQDN（完全修飾ドメイン名）に対応付けます。"}, "r1-1-4": {"a": "第三者認証局", "e": "サーバ証明書が、信頼できる第三者認証局（CA）から発行されていることを、PC側で検証します。"}, "r1-2-1": {"a": "外部からの不正利用が発生しない。", "e": "ループバックアドレスは自分自身（PC）の中でしか使えないので、外部のホストからはJavaアプレットが待ち受けるポートにアクセスできません。社内のプライベートアドレスを使うと、そのアドレスで外部から接続される可能性が残ります。"}, "r1-2-2": {"a": "サーバ側のポート番号が変化する。", "e": "ポートフォワード方式は、待受けポートと転送先ポートの対応（ポートマッピングテーブル）をあらかじめ決めて転送します。FTPのデータ転送のように、サーバ側のポート番号が通信の途中で変化するアプリケーションは、対応表で転送できないので使えません。"}, "r1-2-3": {"a": "IPアドレス：127.0.1.10\nポート番号：6310\nTCPコネクション：\n・Javaアプレット と SSL-VPN装置 間\n・SSL-VPN装置 と 資産管理サーバ 間", "e": "資産管理サーバ（AP1）宛は、図2のポートマッピングテーブルより待受けポートは6310、IPアドレスは本文で資産管理サーバに対応付けた127.0.1.10です。TCPコネクションは、PCのJavaアプレットとSSL-VPN装置の間（SSLトンネル）、SSL-VPN装置と資産管理サーバの間の2本に分かれます。"}, "r1-2-4": {"a": "SSLセッション確立による負荷を、軽減させるため。", "e": "SSLセッションのキャッシュ時間を延ばすと、利用が増えても、毎回ハンドシェイクを行ってSSLセッションを確立し直す必要が減り、SSL-VPN装置の負荷を軽減できます。"}, "r1-3-1": {"a": "202.y.63.10", "e": "表1の1行目は外部LAN→DMZの宛先ポート53（DNS）なので、宛先はDNSサーバの202.y.63.10です。"}, "r1-3-2": {"a": "443", "e": "B社のPCから、グローバルIPアドレス202.y.63.11のSSL-VPN装置へは、HTTPS（SSL）のポート443です。"}, "r1-3-3": {"a": "202.y.63.11", "e": "DMZ→内部LANは、SSL-VPN装置（202.y.63.11）から、資産管理サーバ（AP1）、テスト環境サーバ（AP2、AP3）への通信です。送信元は3つとも、SSL-VPN装置のアドレスです。"}, "r1-3-4": {"a": "202.y.63.11", "e": "AP2用（宛先10.10.10.2のポート23）の送信元も、SSL-VPN装置の202.y.63.11です。"}, "r1-3-5": {"a": "202.y.63.11", "e": "AP3用（宛先10.10.10.2のポート13000）の送信元も、SSL-VPN装置の202.y.63.11です。"}, "r1-4-1": {"a": "クライアント証明書の有効期限", "e": "クライアント証明書を管理する運用担当者が自動で通知を受ける情報は、証明書の有効期限です。期限切れ前に更新や失効の対応を行えます。"}, "r1-4-2": {"a": "ログイン時：ウイルス対策ソフトの定義ファイルの適用状態を確認する機能\nログアウト時：PCからリモート接続時のキャッシュ情報や履歴情報を削除する機能", "e": "B社のPCからのウイルス感染や情報漏えいを防ぐ要件を満たすための、Javaアプレットの機能です。ログイン時は、PCのウイルス対策ソフトの定義ファイルが最新かを確認し、ログアウト時は、リモート接続中のキャッシュや履歴をPCに残さないよう削除します。採点講評では、設問4は全体として正答率が低かったとされています。"}, "d1-1-1": {"a": "リレーエージェント", "e": "DHCPサーバと異なるセグメントの端末に割り当てるには、ルータでDHCPリレーエージェントを動作させ、端末のブロードキャストをDHCPサーバへユニキャストで中継します。"}, "d1-1-2": {"a": "ARP", "e": "ルータやWebサーバのARPテーブルから、IPアドレスとMACアドレスの対応を調べます。"}, "d1-1-3": {"a": "製造者", "e": "MACアドレスの上位24ビットのOUIは、NICの製造者（ベンダ）に固有の値です。"}, "d1-1-4": {"a": "ミラー", "e": "トラフィックモニタには、通信のコピーを受け取るミラーポート（ポートミラーリング）を設定して接続します。"}, "d1-1-5": {"a": "DHCPDISCOVER", "e": "端末が最初にDHCPサーバを探すために、ブロードキャストで送るメッセージがDHCPDISCOVERです。"}, "d1-2-1": {"a": "5", "e": "IEEE 802.11aは5GHz帯の電波を使います（802.11b/gは2.4GHz帯）。"}, "d1-2-2": {"a": "IPアドレスの重複割当て", "e": "情報管理課の許可なく割り当てたIPアドレスが、他のPCのIPアドレスと重複し、他のPCの通信に障害が出ました。"}, "d1-2-3": {"a": "PCを接続すべきポート", "e": "公式解答例は「PCを接続すべきポート」です。BBルータは、インターネット側（WAN）に接続するポートと、PCなどを接続するLAN側のポートを持ちます。本文では、BBルータのうちSWに接続したポートが、本来、PCを接続すべきポートだったため、そのポート経由でSWにDHCPサーバ（BBルータ内蔵）が接続された状態になり、商品本部のPCに不正なIPアドレスが割り当てられました。採点講評では、一般的なBBルータの構成の知識があれば導けるが、この設問の正答率は低かったとされています。"}, "d1-3-1": {"a": "b：24\nc：6", "e": "MACアドレスは48ビットで、上位24ビットがOUI（製造者を示す）、下位24ビットが製造者が付ける番号です。cは、DHCPの正規のやり取り（DISCOVER・OFFER・REQUEST・ACK）が4メッセージですが、折り返し転送された結果、重複して送受信され、6メッセージになったことを示します。"}, "d1-3-2": {"a": "固定IPアドレスの割当て：MACアドレスに対応付けたIPアドレスを割り当てる。\n暫定運用中の対処：MACアドレスが未登録でもIPアドレスを割り当てる。", "e": "固定IPアドレスが必要な端末には、MACアドレスとIPアドレスを対応付けて登録し、その端末には常に同じIPアドレスを割り当てます。暫定運用中は、端末登録システムに登録が完了していない端末でも、通信できるように、MACアドレスが未登録でもIPアドレスを割り当てる運用を認めます。"}, "d1-3-3": {"a": "SW1とSW2の間でのブロードキャストフレームの折り返し", "e": "本文のとおり、SW1とSW2が、自SWに接続していない端末向けのDHCPのブロードキャストフレームを受信すると、折り返して転送する不具合があり、SW5の増設で表面化しました。"}, "d1-3-4": {"a": "SW単位にVLANを設定し、VLAN間経路制御とDHCPリレーを行う構成", "e": "L2SWの代わりにL3SWを使い、スイッチごとにVLAN（ブロードキャストドメイン）を分けて、VLAN間の通信はL3SWで経路制御し、DHCPはリレーします。1つのVLANの障害（ブロードキャストの折り返しなど）を他のVLANに波及させません。採点講評では、SWに複数のVLANを設定してタグVLANで結ぶ構成は、1つのVLANがブロードキャストで飽和するとスイッチ間リンクも飽和するので、不適切とされています。"}, "v1-1-1": {"a": "タグ", "e": "IEEE 802.1QのVLANタグは、32ビット（TPID 16ビット＋TCI 16ビット）で、TCIの中にVID（VLAN ID）が入ります。"}, "v1-1-2": {"a": "12", "e": "VID（VLAN ID）は12ビットなので、4,096通り（実際に使えるのは4,094個）に限られます。採点講評では、この設問の正答率が低かったとされています。数だけでなく、12ビットという理由まで理解しておく必要があります。"}, "v1-1-3": {"a": "帯域", "e": "リンクアグリゲーションは、複数のリンクを1本の論理リンクとして扱うので、リンクの冗長化に加えて、帯域の有効活用ができます。"}, "v1-1-4": {"a": "ルータ", "e": "VRFは、1台のルータ（L3SW）の中に、独立した経路表を持つ仮想ルータを複数動かす機能です。"}, "v1-1-5": {"a": "スタック", "e": "複数の筐体を接続して1台のスイッチとして動かす機能は、スタック（スタッキング）です。複数の筐体を1つのIPアドレスで管理できます。"}, "v1-2-1": {"a": "MACアドレス", "e": "イーサネットフレームのDA（宛先アドレス）とSA（送信元アドレス）は、MACアドレスです。"}, "v1-2-2": {"a": "フレーム①：DA＝SV2、SA＝SV1\nフレーム②：DA＝SV2、SA＝SV1\nフレーム③：DA＝SV2、SA＝SV1", "e": "図2のとおり、同一セグメント上の異なるフロアにある顧客αのサーバ間通信です。顧客のVLANタグ付けやNW基盤側でのタグの追加（カプセル化）があっても、内側のイーサネットフレームのDA・SAは変わらず、DA＝SV2、SA＝SV1のままです（L3SWがL2SWとしても動作するので、MACアドレスの書き換えは起きません）。採点講評では、(2)(3)の正答率が低く、L3SWがL2SWとしても動作することを理解しておくこととされています。"}, "v1-2-3": {"a": "TPID と TCI（外側のVLANタグを、この2つのフィールドに分割して記入する）", "e": "公式解答例の図では、フレーム③は「DA｜SA｜TPID｜TCI｜TPID｜…」の順です。網掛け部分（DAとSAの後ろ）に、外側のVLANタグであるTPIDとTCIの2つのフィールドが入ります。IEEE 802.1ad（QinQ）のカプセル化で、顧客のVLANタグ（内側のTPID・TCI）の前に、NW基盤が外側のタグを付けます。"}, "v1-2-4": {"a": "・別々の顧客で使用しているVLAN IDが重複する。\n・VLAN数に制限があるが、これを超える。", "e": "物理的に共用するNWで、顧客ごとにVLAN IDを管理してきた場合、顧客間でVLAN IDが重複して衝突します。また、VLAN IDは12ビット（4,094個）までなので、顧客が増えるとVLAN数の制限を超えます。そこで、IEEE 802.1Qトンネリング（QinQ）で顧客のVLANを外側のタグでカプセル化します。"}, "v1-3-1": {"a": "L3SWにFW（稼働系）とFW（待機系）の2台、L2SWを3台つなぐ（3台のうち、太線で追加された2台は、NW基盤の冗長構成のL2SW）", "e": "公式解答例の図に基づきます。2台のFW（稼働系・待機系）がL3SWにつながり、L3SWの下にL2SWが3台つながります。図3は、監視システム上のマップで、冗長化された機器を並べて表現するための図です。この設問は作図なので、文章で説明しています。"}, "v1-3-2": {"a": "・STPを動作させ、ブロックポートを設ける。\n・リンクアグリゲーションで、単一のリンクとして扱う。", "e": "顧客システムのL2SWから2本のケーブルをNW基盤の別々のL2SWの筐体に接続すると、ループが発生するおそれがあります。対応方法は2つあり、STPを動作させて片方をブロックポートにする方法と、リンクアグリゲーションで2本を単一の論理リンクとして扱う方法です（スタックで筐体が単一のスイッチとして動作する場合に可能）。"}, "v1-3-3": {"a": "複数の独立したFW機能を、1台のFW装置で稼働させる機能", "e": "仮想FW（バーチャルFW）です。顧客システムごとに独立したFW機能を、1台のFW装置の中に複数作って稼働させるので、それぞれが独立した環境を維持できます。"}, "k1-1-1": {"a": "暗号化", "e": "TLSの三つの機能は、盗聴を防ぐ「暗号化」、改ざんを見つける「改ざん検知」、通信相手を確かめる「認証」です。"}, "k1-1-2": {"a": "検知", "e": "改ざんそのものは防げないので、メッセージ認証コード（MAC）などで改ざんされたことを「検知」します。"}, "k1-1-3": {"a": "認証", "e": "サーバ証明書（必要ならクライアント証明書）で、通信相手が正しい相手かを「認証」します。"}, "k1-1-4": {"a": "TCP", "e": "工場内の機器はクライアントとして、X社のサーバに向けてTCPコネクションを確立します（インターネット側から工場へは確立しません）。"}, "k1-1-5": {"a": "X社が運用・保守を行う機器からX社FWの方向に確立されるTCPコネクションだけを許可する。", "e": "図1の「通信装置内のFW」は、工場側からX社への通信だけを通せば足ります。コネクションの確立要求は工場からX社の方向にだけ行われるので、逆方向（外部から工場）の新規接続を拒否すれば、外部からの侵入を防げます。"}, "k1-1-6": {"a": "クライアント証明書を配布してクライアント認証を行う。", "e": "「なりすまし」対策です。サーバ証明書だけだと、X社側がデバイスやエッジサーバの正当性を確かめられません。TLSのクライアント認証（クライアント証明書）を使えば、証明書を持つ機器だけを接続させられます。"}, "k1-2-1": {"a": "TCPの送信処理中に、デバイスの電源断などでTCPコネクションが開放された場合", "e": "QoS 0は、MQTT層で送達確認をしません。TCPの再送はコネクションが維持されている間しか働かないので、送信の途中でコネクションが切れる（電源断など）と、未送達のPUBLISHは再送されず消失します。"}, "k1-2-2": {"a": "メッセージの重複を防止する。", "e": "図3の注記2のとおり、受信者は処理開始後に受信したPUBLISHを新しいパケットとみなします。PUBRECを返しても、PUBRELが来るまでは処理を始めないことで、PUBRECが届かず送信者がPUBLISHを再送してきた場合でも、同じメッセージを2回処理せずに済みます。"}, "k1-2-3": {"a": "SUBSCRIBE", "e": "デバイスが、設定情報を受け取るために、あらかじめ交換サーバに購読要求（SUBSCRIBE）を送っておきます。購読しておくから、業務サーバが発行したPUBLISHが交換サーバ経由でデバイスに配信されます。"}, "k1-2-4": {"a": "config/Di", "e": "図4の項番1のトピック名です。デバイスごとに異なるので、DiはデバイスのIDになります。"}, "k1-2-5": {"a": "デバイスDi", "e": "交換サーバがデバイスDiに配信している最中に、受信側のデバイスDiの電源が切れた場合の話です。"}, "k1-2-6": {"a": "交換サーバ", "e": "QoS 2では、送信者がPUBLISHを保存して再送に備えます。ここでの送信者は交換サーバなので、デバイスが復帰した後に、交換サーバが保存しておいたPUBLISHを再送します。"}, "k1-2-7": {"a": "業務サーバ", "e": "項番2はデバイス→交換サーバ→業務サーバ／エッジサーバの流れで、QoS 0を使います。受信先の業務サーバとエッジサーバは安定して稼働するので、メッセージが失われにくいと見込めます。"}, "k1-2-8": {"a": "業務サーバ、交換サーバ", "e": "図5の概算では、t1（業務サーバが次のメッセージを送れるようになるまでの時間）を、LANのRTT 20ミリ秒の2倍としています。業務サーバが次の送信に進めるのは、交換サーバからPUBRECが返ってきた時点で、ここが業務サーバと交換サーバの間の区間です。そのため、この区間がLANである前提が成り立つように、業務サーバと交換サーバを同一拠点（X社内）に置く必要があります。交換サーバとデバイスの間（t2）は、WANのRTT 200ミリ秒で見積もっています。"}, "k1-3-1": {"a": "認可", "e": "図6の(a)の宛先は認可サーバです。有効なトークンがなければ、WebAPはブラウザを認可サーバにリダイレクトします。"}, "k1-3-2": {"a": "WebAP", "e": "認可応答（302）のLocationは、認可要求のredirect_uriに指定したWebAPのURIです。ブラウザがそこにリダイレクトされるので、認可コードはWebAPに渡ります。"}, "k1-3-3": {"a": "リフレッシュトークン", "e": "アクセストークンの有効期間が切れていても、リフレッシュトークンが有効なら、利用者の確認なしに新しいアクセストークンを発行できます。図6の(III)の流れです。"}, "k1-3-4": {"a": "認可応答", "e": "認可コードは認可応答（Locationの?code=…）に含まれます。redirect_uriが書き換えられると、認可コードが攻撃者の指定した宛先に渡ってしまいます。"}, "k1-3-5": {"a": "認可", "e": "認可サーバが、認可要求のredirect_uriと、事前に登録されている絶対URIが一致するかを確認します。"}, "k1-3-6": {"a": "10", "e": "アクセストークンは有効期間が10分で、有効期間内のトークンは認可サーバに確認せずに使われます。X社がトークンを変更しても、顧客サーバが古いトークンを持っている間は変更が反映されません。最長で、アクセストークンの有効期間の10分後です（その後はリフレッシュトークンで新しいトークンを取得し、変更が有効になります）。"}, "k1-3-7": {"a": "WebAPのURIを固定にし、絶対URIを事前に通知してもらう。", "e": "redirect_uriの確認は、事前に登録した絶対URIとの一致で行います。そのため、顧客には、WebAPのURIを変えないこと、及びその絶対URIを事前にX社へ通知することを依頼します。"}, "k1-4-1": {"a": "送信元IPアドレスをNATルータ-Pに、宛先IPアドレスをエッジサーバ-Pに、それぞれ変換する。", "e": "顧客サーバは、NATルータ-P’のアドレス（顧客ネットワーク側から見たエッジサーバの代わりのアドレス）に接続します。NATルータは、宛先IPアドレスをエッジサーバ-P（Xシステム側のアドレス）に、送信元IPアドレスを顧客サーバ-P’から、NATルータ-Pに変換します。"}, "k1-4-2": {"a": "顧客サーバ-P’からNATルータ-P’のポート8883番への通信", "e": "顧客サーバはクライアントとして、エッジサーバのMQTTサーバ機能に接続します。MQTTをTLSで使う場合の標準のポートは8883です。顧客FWは、顧客サーバから、NATルータ-P’（エッジサーバに対応するアドレス）の8883番への通信を許可する必要があります。"}, "k1-4-3": {"a": "config/Di、status/Di", "e": "MQTTブリッジで交換サーバと送受信するトピックは、図4で定義した、デバイスに設定情報を送るconfig/Diと、稼働情報を集めるstatus/Diです。Confidential/Diは顧客の内部情報なので、X社には送りません。"}, "k1-4-4": {"a": "1：1静的双方向NATの設定をNATルータに追加する。", "e": "顧客サーバを1台増やすと、その台数分のNATの対応（プライベートアドレスの変換）が必要です。1:1の静的NATなので、追加した顧客サーバ用の変換設定をNATルータに追加します。"}, "k1-4-5": {"a": "通信を許可するルールを通信装置内のFWに追加する。", "e": "追加した顧客サーバから、エッジサーバに対する通信（NATで変換されたアドレス）を通すために、通信装置内のFWにも許可ルールを追加します（①②は順不同）。"}, "k2-1-1": {"a": "スタック", "e": "2台のL2SWをケーブルで接続して、1台のL2SWとして動作させる機能がスタックです。2台の機器を1台に見せることで、機器をまたいだリンクアグリゲーションができます。"}, "k2-1-2": {"a": "ステートフル", "e": "セッション情報（接続状態）を、アクティブからスタンバイに引き継ぐ方式です。切り替わっても既存の通信が継続するので、ステートフルフェールオーバと呼びます。"}, "k2-1-3": {"a": "負荷分散", "e": "クラスタグループごとに、仮想IPアドレスと負荷分散アルゴリズム（ラウンドロビンや最小接続数など）を設定します。"}, "k2-1-4": {"a": "チーミング", "e": "2枚のNICをまとめて使う、サーバ側の機能です。スイッチ側のリンクアグリゲーションに対応する機能です。"}, "k2-2-1": {"a": "顧客ごとに異なるフィルタリングの設定が必要であるから（又は、顧客ごとにルーティングの設定が必要であるから）", "e": "顧客ごとにネットワークの要件（通せる通信の条件や経路）が違います。1台のFWで複数の顧客を収容するには、顧客ごとに独立したフィルタリング設定とルーティングが必要です。それを、仮想FWとして分けて稼働させます。"}, "k2-2-2": {"a": "FWbによるFWaの稼働状態", "e": "冗長構成のFWは、互いの稼働状態（ハートビート）を監視します。"}, "k2-2-3": {"a": "FWaによるL2SWaへの接続ポートのリンク状態", "e": "アクティブのFWは、自分のポートのリンク状態を監視します。リンクがダウンしたら切り替えます。"}, "k2-2-4": {"a": "FWaによるLBaへの接続ポートのリンク状態", "e": "三つのうち、どの三つでも正解です（例：FWbによるFWaの稼働状態、FWaによるFWbの稼働状態、FWaによるL2SWa／LBaへの接続ポートのリンク状態、FWbによるL2SWb／LBbへの接続ポートのリンク状態）。"}, "k2-2-5": {"a": "物理サーバへの接続ポートに、全ての顧客の仮想サーバに設定されたVLAN IDを設定する。", "e": "仮想サーバを別の物理サーバに移動（マイグレーション）しても通信できるように、どの物理サーバへの接続ポートにも、全顧客のVLAN IDを通す設定（タグVLAN）をL2SWc、L2SWdに入れておきます。"}, "k2-3-1": {"a": "OFCのIPアドレス、自OFSのIPアドレス", "e": "OFSは、起動するとOFCとの間でTCPコネクションを確立します。そのために必要な最小限の情報は、接続先のOFCのIPアドレスと、OFS自身（管理用ポート）のIPアドレスです。Fテーブルなどは、その後OFCから設定されます。"}, "k2-4-1": {"a": "フィルタリングルール", "e": "仮想FWは通常のFWとほぼ同じなので、仮想FWごとに、フィルタリングルールを設定します。"}, "k2-4-2": {"a": "仮想FWのVLAN ID", "e": "仮想FWが属するVLANのIDです。"}, "k2-4-3": {"a": "仮想FWのIPアドレス", "e": "仮想FWのIPアドレスです。"}, "k2-4-4": {"a": "顧客のL2SW又はL3SWに接続する、L2SWa及びL2SWbのポート", "e": "ポートVLANは、スイッチのポートごとにVLANを割り当てる方式です。追加した顧客を収容する入口は、顧客のL2SW／L3SWにつながっているL2SWaとL2SWbのポートです。"}, "k2-5-1": {"a": "物理サーバ3の障害によって、3顧客のシステムが同時に停止してしまう。", "e": "図4では、物理サーバ3に、P社のFWp・LBp、Q社のFWq、Z社のLBzが載っています。物理サーバ3が故障すると、3顧客のシステムが同時に停止します。"}, "k2-5-2": {"a": "3顧客向けの仮想サーバを、それぞれ異なった物理サーバに配置する。", "e": "顧客ごとに別の物理サーバに載せれば、1台の障害の影響を1顧客に限定できます。"}, "k2-5-3": {"a": "FWpの内部側ポートとLBpの仮想IPアドレスをもつポートは、同一セグメントであり、物理サーバ3内で処理されるから", "e": "二つのポートは同じセグメント（図4のVLAN）にあり、物理サーバ3の仮想L2SWの中だけで転送されます。パケットはOFSを通らないので、OFSのFエントリは不要です。"}, "k2-5-4": {"a": "Fテーブル名：Fテーブル1\n項番：2", "e": "P社のWebサーバ利用者のパケットは、ルータ→L2SWを経てp1から入力されます。Fテーブル0の項番1でVLAN ID 100をセットし、Fテーブル1で処理されます。宛先MACはFWpのWAN側（mFWpw）なので、表5の項番2に一致して、p13（物理サーバ3）から出力されます。"}, "k2-5-5": {"a": "Fテーブル名：Fテーブル0\n項番：6", "e": "FWp、LBpの処理を終えたパケットは、物理サーバ3からp13を経由してOFSに再入力されます。Fテーブル0で入力ポートがp13なので、項番6に一致し、Fテーブル4の処理に移ります。"}, "k2-5-6": {"a": "Fテーブル名：Fテーブル4\n項番：6", "e": "宛先MACがWebサーバp1（mWSp1）、送信元MACがLBp（mLBp）なので、表8の項番6に一致して、p11（物理サーバ1）から出力され、Webサーバp1に届きます。"}, "k2-5-7": {"a": "OFS1、OFS2", "e": "Fテーブル4は、OFS1とOFS2のどちらにも同じ内容が生成されています。変更も両方のOFSに対して行われます。"}, "k2-5-8": {"a": "項番：7\n変更後のアクション：p12から出力", "e": "Webサーバp4が物理サーバ2に移動すると、宛先がmWSp4のパケットはp11ではなくp12から出力する必要があります。それで、項番7を「p12から出力」に変更します。なお、項番3（ARPのブロードキャスト、VLAN ID 120）は、p11に加えてp12からも出力するように変更されます（設問の「項番3のほかに」の項番が、項番7です）。"}, "w1-1-1": {"a": "i1", "e": "【考え方】\n機械はインターネット側から、C社ISP経由でA社のFWに届きます。機械が宛先にできるのは、外から到達できるグローバルアドレスです。図1で、FWの外部NW側（RT-1側）についているアドレスは i1 です。DMZ側（i2）や、DMZ内の機器のアドレス（i3〜i5）は、プライベートアドレスなので、インターネットから直接は指定できません。\n\n【補足】\n試行環境のWeb-Aは、既に稼働しているので、機械はこのi1に向けてアクセスします。後の設問3(2)で、webtest.asha.example.com が i1 になっているのも、このためです。"}, "w1-1-2": {"a": "NAT", "e": "【考え方】\n本文に「Web-Aを収容しているDMZは、プライベートアドレスが割り当てられている」とあります。外部NWのグローバルアドレス宛のパケットを、プライベートアドレスのLBに届けるには、FWが宛先IPアドレスを書き換える必要があります。宛先アドレスを変換する機能は、NAT（宛先NAT、DNAT）です。\n\n【補足】\nFWの機能としては、フィルタリング（通してよい通信かの判断）とNAT（アドレスの変換）があります。現行FWの両方の機能を新FWに移行する、と本文にもあります。"}, "w1-1-3": {"a": "i3", "e": "【考え方】\nFWが転送する相手は、DMZのLBです。LBは、図1でi3のアドレスをもっています。FWは、宛先のグローバルアドレス（i1）を、LBのアドレス（i3）に書き換えます。LBがさらにWeb-A1（i4）、Web-A2（i5）に振り分けます。\n\n【補足】\n後の表3の⑬⑭で、宛先IPアドレスがi3、⑮⑯でi4になっているのが、この変換の流れです。"}, "w1-1-4": {"a": "Flow-Mod", "e": "【考え方】\n表1のとおり、OFCがOFSの管理テーブルを書き換えるメッセージは、Flow-Modです。LLDPフレーム（イーサネットタイプ88CC）を、OFCに送る設定をOFSに入れます。\n\n【補足】\n表1の3メッセージは、次のように覚えると整理できます。\n・Packet-In：OFS→OFC。「一致するエントリがないパケットが来た」とOFCに知らせる。\n・Packet-Out：OFC→OFS。「このパケットを、このポートから出せ」と指示する。\n・Flow-Mod：OFC→OFS。管理テーブル（エントリ）を追加・変更する。"}, "w1-1-5": {"a": "controller", "e": "【考え方】\nETH_TYPEが88CC（LLDP）のフレームを受けたOFSは、そのフレームをOFCに渡す必要があります。表2のActionで、OFCに転送するのは、Output(controller)です。「controller：Packet-Inメッセージを使いOFCに転送」とあります。\n\n【補足】\nOFCがLLDPフレームを受け取ると、そのフレームに入っている装置名とポートIDから、「どのOFSのどのポートからフレームが出て、どのOFSのどのポートに届いたか」が分かります。これで、OFS同士の接続（トポロジ）を把握します。"}, "w1-1-6": {"a": "Packet-Out", "e": "【考え方】\nOFCが、「OFS1の全ポートから、このLLDPフレームを出せ」と指示するのは、Packet-Outです。LLDPフレームの中に、OFS1の装置名とそのポートIDが入っています。指示を受けたOFS1が、各ポートからフレームを出し、隣のOFS2が受け取ります。OFS2は、一致するエントリ（①で登録）に従って、Packet-InでOFCに転送します。\n\n【補足】\n図3の矢印の向きに注意します。OFCからOFS1へは、Packet-Out（太さの細い線＝OFCとOFS間の通信）、OFS1からOFS2へは、LLDPフレーム（太い線＝OFSに接続された機器間の通信）です。"}, "w1-1-7": {"a": "OFS2", "e": "【考え方】\n③は、OFS2に対して、②と同じ操作をします。OFS2の全ポートからLLDPフレームを出させるので、フレームには、OFS2の装置名とポートIDが入ります。OFS1が受け取ったフレームYには、送信元のOFS2の名前（き）と、フレームを出したポート（く）が入ります。"}, "w1-1-8": {"a": "p9", "e": "【考え方】\n図2で、OFS1のp8は、管理NWのL2SWにつながっています。OFS2のポートのうち、OFS1とつながっているポートがp9です（フレームXには「OFS1・p8」が入っています）。フレームYは、OFS2のp9から出てOFS1のp8に届きます。OFCは、X（OFS1のp8→OFS2）とY（OFS2のp9→OFS1）を合わせて、OFS1のp8とOFS2のp9がつながっていると判断します。\n\n【補足】\nOFS1のp8とOFS2のp9は、図2で、どちらも管理NWのL2SWにつながっています。LLDPフレームは、このL2SWを経由して届きます。"}, "w1-2-1": {"a": "v2", "e": "【考え方】\n⑬は、新FWが、NAT後のパケットをLBに向けて送り出したものです。表3の⑥と比べます。\n・⑥：外部NW側（v1）、宛先MAC=m1（新FW）、送信元MAC=m5（RT-1）、宛先IP=i1。\n・⑬：新FWの出力はDMZ側（i2側）なので、VLANは v2。送信元MACは m1（新FW）、宛先IPはNAT後の i3。\nVLAN IDは、新FWとOFS1の間のトランクポート（p7）で、仮想NWを区別するための識別子です。v1が外部NW、v2がDMZ、v3が内部NWです。"}, "w1-2-2": {"a": "なし", "e": "【考え方】\n⑭は、OFS1からLBに出る直前のパケットです。LBは、p6につながっています。p6は、VLANタグを付けないポート（アクセスポート）なので、OFS1は、タグ（v2）を外して出力します。表5のエントリ2のActionに、Pop-VLANとOutput(p6)があります。\n\n【補足】\n⑬（新FW→OFS1、タグあり）と⑭（OFS1→LB、タグなし）の違いは、トランクポート（p7）とアクセスポート（p6）の違いです。"}, "w1-2-3": {"a": "m2", "e": "【考え方】\n宛先MACアドレスは、L2で直接届ける相手のMACです。⑬⑭の宛先IPは、i3（LB）なので、同じ宛先のLBのMACアドレス m2 になります（LBのMACはARPで調べます。図4の⑦〜⑪のARPシーケンスです）。\n\n【補足】\nIPアドレスが、通信の最終的な宛先を表し、MACアドレスは、次に渡す相手を表します。FWがNATで宛先IPを書き換えたあと、LBに渡すので、宛先MACもLBになります。"}, "w1-2-4": {"a": "m3", "e": "【考え方】\n⑮⑯は、LBが振り分けたあとのパケットです。図4では、Web-A1に振り分けるシーケンスなので、宛先MACアドレスはWeb-A1のMAC m3です。送信元MACは、LBのm2です。\n\n【補足】\nLBは、受け取ったIPパケットの宛先IPアドレス（i3）を、振り分け先（Web-A1のi4）に書き換えて、送り直します。そのため、MACアドレスも、LBが自分のものを送信元、振り分け先のものを宛先にして付け直します。"}, "w1-2-5": {"a": "i4", "e": "【考え方】\nLBは、宛先IPアドレスを自分（i3）から振り分け先のWeb-A1のアドレス i4 に書き換えます（図1と注の記述）。⑮⑯の宛先IPアドレスはi4です。\n\n【補足】\nWeb-A2に振り分ける場合は、i5になります。"}, "w1-2-6": {"a": "②、⑧、⑨、⑩", "e": "【考え方】\n下線(i)は、「ブロードキャスト通信に関する Packet-In を受信したとき、OFCは、構成情報を基に、OFSにPacket-Outで指示する」です。ブロードキャスト通信とは、図4の中では、宛先MACアドレスが FF-FF-FF-FF-FF-FF のARP Requestです。\n①：RT-1からOFS1に届いたARP Request → Packet-In。\n②：OFCがPacket-Outで指示し、外部NWの構成要素のうち、入力ポート以外（p7(v1)）に出力されたARP Request。\n⑦：新FWからOFS1に届いたARP Request → Packet-In。\n⑧⑨⑩：OFCがPacket-Outで指示し、DMZの構成要素（p4、p5、p6）に出力されたARP Request。\nよって答えは ②、⑧、⑨、⑩ です。\n\n【補足】\n④⑫のARP Replyも、OFCがPacket-Outで出力させます。しかし、これらはユニキャストの応答（宛先が決まっている）で、下線(i)の「ブロードキャスト」ではないので、含まれません。①⑦は、OFSからOFCへのPacket-Inです。"}, "w1-2-7": {"a": "ETH_TYPEがARPのイーサネットタイプに等しい。", "e": "【考え方】\n「ARP RequestとARP ReplyをOFCに通知するためのエントリ」は、ARPパケットだけを、OFCにPacket-Inで渡すものです。ARPかどうかは、イーサネットタイプで判別します。表2のMFの中でその役割をもつのは、ETH_TYPEです。\n\n【補足】\nOFCは、ARP RequestとARP Replyの内容（誰がどのMACアドレスをもつか）を知って、ユニキャストのエントリをOFSに登録します。ARPパケットを全部OFCに通知しておくことで、「一致するエントリがなければ入力パケットを破棄する」設定（OFCへの通信集中を避けるため）でも、ARPだけはOFCに届きます。"}, "w1-2-8": {"a": "外部NW内のRT-1と新FWの通信", "e": "【考え方】\n表4のエントリ1：IN_PORT=p1（RT-1側）、タグなし、宛先MAC=m1（新FW）、送信元MAC=m5（RT-1）→ Push-VLAN（v1）、p7から出力。\nエントリ2：IN_PORT=p7、VLAN v1、宛先MAC=m5（RT-1）、送信元MAC=m1（新FW）→ Pop-VLAN、p1から出力。\nつまり、外部NWにある RT-1 と新FW の間の、行きと帰りの通信です。\n\n【補足】\n図4では、Flow-Mod(1) がこのエントリを登録します。この登録後の⑤⑥のSYNは、OFCを経由せずに、OFS1だけで転送されます。"}, "w1-2-9": {"a": "p6", "e": "【考え方】\n表5は、Flow-Mod(2)で登録されるエントリです。エントリ2は「p7、v2、宛先m2（LB）、送信元m1（新FW）」で、新FW→LB（Pop-VLANしてp6へ）です。エントリ1は、その逆向き、LB→新FWの通信です。LBはp6につながっているので、入力ポートは p6 です。"}, "w1-2-10": {"a": "なし", "e": "【考え方】\np6はアクセスポートなので、LBから入ってくるパケットには、VLANタグがありません。タグがない状態は、「VLAN_VID＝なし」と書きます（表4のエントリ1と同じ書き方）。"}, "w1-2-11": {"a": "m1", "e": "【考え方】\nLB→新FWの通信です。宛先は新FW（MAC m1）です。表4のエントリ2では、新FW→RT-1の送信元MAC が m1 になっていることとも合います。"}, "w1-2-12": {"a": "m2", "e": "【考え方】\n送信元は、LB（MAC m2）です。表5のエントリ2（新FW→LB）では、宛先が m2、送信元が m1 ですから、エントリ1は、これと宛先・送信元が入れ替わる関係になります。"}, "w1-2-13": {"a": "Push-VLAN、Set-Field VLAN_VID＝v2、Output(p7)", "e": "【考え方】\nエントリ1は、LBからのタグなしパケットを、新FWへ送る処理です。新FWとOFS1の間のp7は、トランクポートで、DMZのVLAN ID（v2）を付けて出す必要があります。表4のエントリ1（外部NW側）と同じ形で、次の3つのActionになります。\n・Push-VLAN：VLANヘッダを付ける。\n・Set-Field VLAN_VID＝v2：VLAN IDをv2（DMZ）にする。\n・Output(p7)：p7から出力する。\n\n【補足】\nこの記述は、「Actionは、エントリ内に記述された全てのActionを実行する」（表4の注記）ので、3つとも必要です。"}, "w1-3-1": {"a": "CNAME", "e": "【考え方】\n図6では、DNS-Aのゾーンファイルの「weblive IN A i6」を、「weblive IN [つ] webasha.bshacdn.example.net.」に置き換えます。右辺がIPアドレスではなく、別のFQDNなので、別名を定義するリソースレコード、CNAMEです。\n\n【補足】\nCNAMEにすると、weblive.asha.example.com の名前解決が、DNS-B（B社CDN）の管理する webasha.bshacdn.example.net に引き継がれます。DNS-Bが、問合せ元に近いエッジサーバのIPアドレスを、その都度（動的に）答えます。Aレコードで固定のアドレスを書くと、この動的な選択ができません。"}, "w1-3-2": {"a": "webtest.asha.example.com", "e": "【考え方】\na1は、試行モードで、機械（DNSクライアント）がDNSフルリゾルバに問い合わせる通信です（図5）。試行時にWeb-A（FWのi1）に接続するための名前は、図6の凡例に「webtest：試行時のWebサーバのホスト名」とあります。ゾーンファイルの $ORIGIN は asha.example.com. なので、FQDNは webtest.asha.example.com です。\n\n【補足】\nFQDNは、ホスト名だけでなく、末尾のドメイン名まで含めて書きます。$ORIGINの値を補うのがポイントです。"}, "w1-3-3": {"a": "weblive.asha.example.com", "e": "【考え方】\nb1は、本運用モードで、機械が、Web-Bに接続するために名前解決する通信です。凡例に「weblive：本運用時のWebサーバのホスト名」とあるので、FQDNは weblive.asha.example.com です。\n\n【補足】\nこのweblive（図6のDNS-A）のレコードの値が、i6（Web-Bのグローバルアドレス）です。B社CDNを使う場合は、このレコードだけを、CNAMEに置き換えます。"}, "w1-3-4": {"a": "DNSクライアントとDNSフルリゾルバが、ネットワーク上で離れた位置にある場合", "e": "【考え方】\nDNS-Bは、DNSの問合せの送信元IPアドレスから、近いエッジサーバを選びます。ところが、送信元は、機械本人（DNSクライアント）ではなく、機械の代わりに問い合わせるDNSフルリゾルバです（図5のc1）。フルリゾルバが、機械から離れた場所にあると、フルリゾルバに近い（機械からは遠い）エッジサーバが選ばれてしまいます。\nEDNS-Client-Subnet（RFC 7871）を使うと、フルリゾルバが問合せに、DNSクライアントの属するサブネットの情報を付けられます。DNS-Bはそれを使って、クライアントに近いエッジサーバを選べます。\n\n【補足】\n特に、ISPのDNSではなく、遠くのパブリックDNSなどを使うクライアントで効果が出ます。"}, "w1-3-5": {"a": "Web-Bのサーバ処理能力不足", "e": "【考え方】\n下線(v)は、HTTPのGETで、ファームウェアを、国内外の多数の機械に、一斉に更新する場合です。この場合のTAT（Turn Around Time、要求から応答までの時間）悪化の要因は2つです。\n(a) 多数の機械が同時にWeb-Bにアクセスして、Web-Bの処理能力が不足する。→ エッジサーバが、キャッシュしたファームウェアを返すので、Web-Bへのアクセスが減ります。\n(b) 機械とWeb-Bが、地理的・ネットワーク的に遠く、通信の遅延が大きい。→ 近くのエッジサーバが応答するので、遅延が小さくなります。\n\n【補足】\nファームウェアの更新は、同じ内容を多数の機械が取得するので、キャッシュが有効です。POSTなどで内容が毎回異なる通信には、キャッシュの効果は小さくなります。（設問は「GETを使う」場合と限定しています。）"}, "w1-3-6": {"a": "機械とWeb-B間の通信遅延", "e": "【考え方】\n(5)の2つ目は、(a)Web-Bのサーバ処理能力の不足（又は、Webサーバへのアクセス集中）に対して、(b)機械とWeb-B間の通信遅延です。解答欄の1つ目と2つ目は、順番を入れ替えて答えても構いません。"}, "w1-4-1": {"a": "転用後の業務サーバのIPアドレスを、LBの振り分け先に追加しておく。", "e": "【考え方】\n自社設備利用DR案は、「工場のWeb-Aを使って、B社IaaSのWeb-Bを代替する」ものです。Web-Aの性能不足に備えて、重要度の低い業務サーバをWebサーバに転用して、スケールアウトします。LBは、振り分け先の一覧に登録されたサーバにだけ、リクエストを振り分けます。そのため、転用後の業務サーバのIPアドレスを決めて、LBの振り分け先に追加しておきます。\n\n【補足】\nIPアドレスを前もって決めておくのは、LBへの登録、DMZに接続するときの設定（OFCの定義）などの準備を、DRの発動前に済ませるためです。準備作業を「転用後のIPアドレスを決めて」と答えただけでは、何のための準備か不明確です。LBの振り分け先への追加まで書きます。"}, "w1-4-2": {"a": "weblive IN A i6", "e": "【考え方】\n(vii)は、機械の本運用モードのアクセスを、Web-AにDNSで切り替える手順です。置換え前は、図6のDNS-Aのゾーンファイルにある、Web-B（グローバルアドレスi6）を指すAレコードです。\n\n【補足】\nここで B社CDNは適用していないので、「weblive IN CNAME …」ではなく、Aレコードどうしの置換えです。"}, "w1-4-3": {"a": "weblive IN A i1", "e": "【考え方】\n本運用モードのアクセスを、Web-Aに切り替えるので、weblive が指すアドレスを、Web-Aの外部アドレス（FWのi1。試行時にwebtestで使っているのと同じ）にします。\n\n【補足】\nDNS-AのゾーンファイルのTTLは、$TTL 3600（1時間）です。レコードを置き換えても、フルリゾルバのキャッシュが残る間は、古い値が返ります。DRの手順には、TTLの扱い（あらかじめ短くしておくなど）も含めて用意しておくと、切替えが早く完了します。（この点は設問の解答には含まれません。）"}, "w1-4-4": {"a": "転用する業務サーバに関する物理配線の変更が不要になる。", "e": "【考え方】\n現行の工場内LANを使った自社設備利用DR案と比べて、新工場LANは、次の2点で復旧が早くなります。\n(a) 新工場LANは、OFSで仮想NWを構成するので、転用する業務サーバをDMZに接続するのに、物理配線の変更（ケーブルの付け替え）が要らない。\n(b) 構成変更は、OFCの管理ソフトウェアで行えるので、ベンダへの依頼が不要になり、自社の運用要員だけですぐに対応できる。\n\n【補足】\n本文に「新工場LANでは、物理配線の変更なしに、自社要員だけで構成変更ができるようにする」と、NW拡張の目的として書かれています。設問は、この目的が、DRのRTO（目標復旧時間）の短縮にどうつながるかを聞いています。IPA講評は、(b)に気づいてほしかったとしています。"}, "w1-4-5": {"a": "管理ソフトウェアを用いて、社内要員だけで対応できる。", "e": "【考え方】\n(3)の2つ目は、自社要員だけで対応できる（管理ソフトウェアを使って）という点です。1つ目と2つ目は順番が入れ替わっても構いません。"}, "w1-4-6": {"a": "CDN、ISP、IaaS環境の構築と切替えに関する、APIサービスとDNSを使った手順の確立。", "e": "【考え方】\nB社拠点（国外）のDRでは、B社APIサービスで、国外のA社向けIaaS環境にWeb-Bのバックアップを作成します。NWの準備として必要なのは、CDN、ISP、IaaS環境を、構築して切り替えるための手順です。その切替えは、B社APIサービスのHTTPリクエストと、DNSの書き換えで行います。これらを使った手順を確立し、運用マニュアルに書いておきます。\n\n【補足】\nIPA講評によると、準備作業全体ではなく、一部の切替え手順だけを書いた解答が目立ちました。「CDN、ISP、IaaS環境の」「構築と切替え」という全体を、「APIサービスとDNSを使った」手順として答えます。"}, "w1-4-7": {"a": "国外を利用するので、国内の広域災害の影響を回避できる。", "e": "【考え方】\nB社拠点（国内）が長時間使えない事態は、国内の広域災害などで起こります。B社拠点（国外）なら、国内の災害の影響を受けません。自社設備（工場、国内）を使うDR案では、工場も同じ災害の影響を受けるおそれがあります。\n\n【補足】\n(5)は、自社設備利用DR案と比べたときの利点を問うています。IaaSの利用と、運用のアウトソーシングを混同した解答が目立った、と講評にあります。「本文の“内部NW”と“IaaS環境”は、ともに仮想化されたNWで、OFCの管理ソフトウェアとAPIサービスを使って運用する」ことを理解しておく必要があります。"}, "w1-4-8": {"a": "B社CDNなどを使い、通常時と同じ品質を保つことができる。", "e": "【考え方】\n自社設備利用DR案は、工場のWeb-A（試行環境、規模が小さい）を使うので、性能不足に備えた転用が必要です。国外のIaaS環境にバックアップを作ってWeb-Bを使えば、B社CDNなども使って、通常時と同じ品質（性能、通信経路）を保てます。\n\n【補足】\n利点の2つ（国内の広域災害の回避、通常時と同じ品質）は、順番が入れ替わっても構いません。"}, "w2-1-1": {"a": "2.4", "e": "【考え方】\n表1は、IEEE 802.11nと802.11acが使う周波数帯を聞いています。\n・802.11n：2.4GHz帯と5GHz帯の両方に対応（最大600Mビット/秒）。\n・802.11ac：5GHz帯のみ（最大6.93Gビット/秒）。\n空欄aは、802.11nの2つ並んだ周波数帯のうち、小さい方です。\n\n【補足】\n本文に「802.11nにも対応したAP製品を選定すれば、来訪者のNPCにも提供できる」とあります。来訪者の古いNPCは2.4GHz帯（802.11n）しか使えないものがある、という前提です。"}, "w2-1-2": {"a": "5", "e": "【考え方】\nbは、表1の2か所（802.11nの2つ目と、802.11acの唯一の周波数帯）に共通で入ります。802.11nは2.4GHzと5GHz、802.11acは5GHzのみなので、b は 5 です。\n\n【補足】\n5GHz帯は、2.4GHz帯より、使えるチャネル数が多く、電波干渉も少なめです。そのため、チャネルを束ねる（チャネルボンディング）高速化が可能になります。設問3(1)(4)につながります。"}, "w2-1-3": {"a": "any", "e": "【考え方】\n表2は、無線LANのアクセス制御方式の一覧です。\n・SSID（ESSID）：APの識別子で制御する。\n・［c］接続拒否：SSIDが空白又は［c］の接続要求を拒否する。\n・SSID隠蔽（ステルス）：ビーコンにSSIDを含めない。\n・MACアドレスフィルタリング、IEEE 802.1X認証。\n空白又はSSIDとして「any」を指定した接続要求を拒否するのが、「ANY接続拒否」です。\n\n【補足】\n無線LAN端末が「どのAPでもいいので接続したい」とき、SSIDに空白やanyを指定して探します。これを許すと、SSIDを知らない第三者の端末が、APを見つけられてしまいます。"}, "w2-1-4": {"a": "共通", "e": "【考え方】\nWEPで使うRC4は、暗号化と復号に同じ鍵を使う「共通鍵暗号」です。「WEPキーを、1つのAPと複数の無線LAN端末で共有する」という本文の記述からも分かります。\n\n【補足】\n暗号方式の分類は、共通鍵暗号（RC4、AESなど）と公開鍵暗号（RSAなど）です。無線LANのデータ暗号化は、速度の点から、共通鍵暗号を使います。公開鍵暗号は、EAP-TLSなどの認証で使われます。"}, "w2-1-5": {"a": "802.11i", "e": "【考え方】\nWPA2は、IEEE 802.11i（無線LANのセキュリティ規格）に準拠した方式です。暗号化アルゴリズムはAES、暗号化プロトコルはCCMPです。WPAは、802.11iの策定途中に、暫定的に定められた規格（TKIP）でした。\n\n【補足】\nIPA講評で、eの正答率が低かった問題です。「IEEE 802.11i = WPA2」とセットで覚えておきます。"}, "w2-2-1": {"a": "ストリーム", "e": "【考え方】\nRC4は「1バイト単位」で暗号化する暗号です。データを、バイトやビット単位で、連続的に暗号化する方式は、ストリーム暗号です。固定長のブロック単位で暗号化するAESなどは、ブロック暗号です。\n\n【補足】\nWEPでは、WEPキーとIVから「キーストリーム」を作り、それとデータをXORして暗号化します。ストリーム暗号の典型的な仕組みです。"}, "w2-2-2": {"a": "同一", "e": "【考え方】\nWEPを採用しない理由は、2つです。\n・WEPキーが、同一のまま使われ続ける（鍵が更新されない）。\n・暗号化アルゴリズム（RC4）も複雑ではない。\nこのため、短時間で暗号を解読されるおそれがあります。gは、「同一」です。\n\n【補足】\n後で出てくるWPAのTKIPは、「一時鍵が動的に生成され、通信途中で変更される」ことで、WEPより強くなっています。WEPとTKIPの違いは、鍵が固定か、動的かです。"}, "w2-2-3": {"a": "認証サーバ", "e": "【考え方】\nエンタープライズモードでは、IEEE 802.1Xの認証に成功すると、認証サーバ（RADIUSサーバ）で、PMK（Pairwise Master Key）が動的に生成され、クライアントに配布されます。公式の解答例では、hは「認証サーバ」です。\n\n【補足】\nPMKから、一時鍵（PTK）が作られます。実際の無線LANでは、一時鍵を生成するのは、端末とAP（オーセンティケータ）です。設問のhには、公式の解答例どおり、「認証サーバ」と答えます。PMKは、認証が成功するたびに、新しく作られます。パーソナルモードでは、PSKがそのままPMKになります。"}, "w2-2-4": {"a": "MACアドレス", "e": "【考え方】\nTKIPのフェーズ1では、次の3つを混ぜてキーストリーム1を作ります。\n・一時鍵（Temporal Key）\n・IV（初期化ベクタ）の上位部分\n・無線LAN端末のMACアドレス\n端末ごとに異なる値（MACアドレス）が入るので、端末が違えば、鍵も違います。\n\n【補足】\nフェーズ2では、キーストリーム1にIVの拡張部分を混ぜて、暗号鍵を作ります。こうした2段階の鍵混合と、パケットごとの鍵の変更が、WEPより安全な理由です。それでも、TKIPには脆弱性が報告されているので、採用されません。"}, "w2-2-5": {"a": "認証", "e": "【考え方】\nWPA2には、「事前認証」の方法とPMKの保持方法が規定されています。移動先のAPで、あらかじめ（接続前に）認証を済ませる方法が、事前認証です。PMKを保持しておけば、以前接続した（認証済みの）APに戻るとき、PMKを再生成しなくて済みます。この2つで、ハンドオーバ時の認証時間が短くなります。\n\n【補足】\nこの「PMKの保持」は、設問5(5)の理由（WLCがPMKを保持している）につながる、重要な知識です。"}, "w2-2-6": {"a": "カウンタ値cをAESで暗号化した結果と、暗号文ブロックe1をXORする。", "e": "【考え方】\nCCMPのカウンタモードの暗号化は、次のとおりです。\n1) カウンタ値cをAESで暗号化する（暗号鍵を使う）。\n2) その結果と平文ブロックm1をXORして、暗号文ブロックe1を作る。\n復号は、まったく同じ手順です。\n1) カウンタ値cをAESで暗号化する。\n2) その結果と暗号文ブロックe1をXORする。→ m1が得られる。\n\n【補足】\nXORは、同じ値を2回かけると元に戻ります（m1 ⊕ K ⊕ K = m1）。このため、暗号化と復号が同じ手順になります。復号でもAESの「暗号化」を使い、AESの復号は使いません。これが、本文の「復号時もAESが使用される」の意味です。\n\n【正誤表】図2右上の「c＋n」は、「c＋(n−1)」に訂正されています（n番目のブロックは、cからn−1回増やしたカウンタ値）。"}, "w2-3-1": {"a": "80", "e": "【考え方】\n本文に「8チャネルボンディング（160MHz）なら、アンテナ1本当たり最大約867Mビット/秒」とあります。\n・160MHz（8チャネル）：約867Mビット/秒 ／ アンテナ1本。\n・80MHz（4チャネル）：その半分の約433Mビット/秒 ／ アンテナ1本。\n検討中のAP製品は、4チャネルボンディング（80MHz）まで行えます。したがって、867Mビット/秒を得るには、80MHzで、アンテナ（ストリーム）2本が必要です。\n\n【補足】\n「最低限必要な」ということは、必要条件を最小にすることです。周波数帯域幅を広げれば、アンテナ本数を減らせます（160MHzなら1本）。製品が80MHzまでなので、帯域幅は80MHz、本数は2本が答えです。"}, "w2-3-2": {"a": "2", "e": "【考え方】\n80MHzで、アンテナ1本あたり約433Mビット/秒なので、867Mビット/秒には、2本（ストリーム）が必要です（433M×2＝866M）。\n\n【補足】\n製品は、アンテナ3本を搭載しています。3本使えば433M×3＝約1.3Gビット/秒になります。本文は、1Gビット/秒以上の速度が出るので、同時接続を10台に制限すれば、1台あたり100Mビット/秒以上を確保できる、という計算です。"}, "w2-3-3": {"a": "WLCに通信の負荷が集中するのを抑制することができる。", "e": "【考え方】\n下線③は、「認証後の無線LAN端末の通信は、WLCを経由しない」という方式です（WLCは分散処理方式で、暗号化と復号をAPに任せます）。WLCを経由する方式（集中処理方式）と比べた利点は、次の2つです。\n・全ての通信がWLCを通らないので、WLCに通信の負荷が集中しない。\n・認証後にWLCに障害が起きても、その端末の通信は止まらず、継続できる。\n\n【補足】\nWLCを経由する方式では、WLCが性能のボトルネックになり、WLCは単一障害点（SPOF）になります。分散処理方式は、その両方の問題を避けられます。（一方、WLC障害時の影響は、設問5(5)のとおりハンドオーバに残ります。）"}, "w2-3-4": {"a": "認証後にWLCに障害が発生しても、その無線LAN端末の通信は継続できる。", "e": "【考え方】\n2つ目の利点は、「認証後にWLCに障害が発生しても、その無線LAN端末の通信は継続できる」という点です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "w2-3-5": {"a": "電波干渉によって、通信障害が発生する。", "e": "【考え方】\n下線④の「外来電波」とは、自社のAP以外から来る電波（他社のAP、電子レンジ、Bluetooth機器など）です。同じ周波数帯を使う電波があると、互いに干渉して、通信が不安定になったり、速度が落ちたり、つながらなくなったりします。このため、「電波干渉によって、通信障害が発生する」と答えます。\n\n【補足】\n電波干渉の対策は、他の電波と重ならない周波数帯（チャネル）を選ぶことです。設置前に電波の状態を測定するのは、このためです。"}, "w2-3-6": {"a": "4", "e": "【考え方】\n80MHz（4チャネルを束ねた）幅の周波数帯を、セルが重なるAPどうしで、重複しないように割り当てます。図3は、営業部フロアに、APを2段×複数列で、格子状に並べた配置です。上下・左右（斜めも）で隣り合うAPのセルが重なるので、隣接する4台が全て違う周波数帯になる、2×2の組合せを繰り返す必要があります。このため、少なくとも4グループが必要です。\n\n【補足】\n実務の知識ですが、日本の5GHz帯は、20MHz幅のチャネルが19個あります（W52、W53、W56）。80MHz（4チャネル）で束ねると、約4グループ取れるので、4グループなら実現できます。グループ数を増やすのは、チャネルが足りなくなるので、難しい設計です。"}, "w2-3-7": {"a": "ハンドオーバをスムーズに行わせるため（又は、APの負荷分散を行わせるため）", "e": "【考え方】\nAPのセルを重ねる目的は、2つ考えられます。\n・端末が移動してAPを乗り換える（ハンドオーバ）ときに、電波の切れ目がなく、スムーズに切り替わる。\n・1つのセルに端末が集中したときに、重なった別のAPに接続させて、負荷を分散できる。\nどちらか一方を答えれば正解です。\n\n【補足】\nセルを重ねない（離す）配置にすると、電波が届かない場所が生まれ、ハンドオーバのときに通信が途切れます。重ねすぎると、同じ周波数帯の電波干渉が増えます。設問(4)のグループ分けは、この干渉を避けるためのものです。"}, "w2-3-8": {"a": "PoE＋", "e": "【考え方】\nPoE（Power over Ethernet）は、LANケーブルで電力を供給する仕組みです。規格は2つあります。\n・IEEE 802.3af：PoE。最大約15.4W（機器側で約12.95W）。\n・IEEE 802.3at：PoE＋（PoEプラス）。最大約30W。\n本文に、「選定したAP製品の消費電力は最大18Wなので、802.3afでは供給電力が不足する」とあります。そこで、802.3at対応のL2SWを導入します。\n\n【補足】\nIPA講評では、(5)の正答率が低い問題でした。「PoE＋」と答えます。呼称は、技術者どうしの会話で使うので、知っておくとよい知識です。"}, "w2-3-9": {"a": "216", "e": "【考え方】\n必要な供給電力は、AP1台の最大消費電力×台数です。\n・AP1台：最大18W。\n・AP台数：営業部オフィスエリアに8台、接客エリアに4台、合計12台。\n・18W×12台＝216W。\n12台のAPを、1台のL2SW（PoE対応）に収容するので、このL2SWは、最小でも216Wの供給電力が必要です。\n\n【補足】\n「最小」と聞かれているので、余裕を見て多めに見積もるのではなく、計算どおりの値を答えます。"}, "w2-4-1": {"a": "CAの自己証明書", "e": "【考え方】\nダウンロードサーバは、RADIUSサーバで作ったクライアント証明書と、「⑥その他にNPCで必要となる情報」を、PKCS#12形式のファイルにまとめて配布します。EAP-TLSで、NPCに必要な情報は、次の3つです。\n・クライアント証明書（既出）。\n・クライアントの秘密鍵（証明書とペアで、認証時に使う）。\n・CA（認証局）の証明書（サーバ証明書を検証するために使う）。\n「その他」として、残りの2つを挙げます。\n\n【補足】\nPKCS#12は、証明書と秘密鍵などを、1つのファイルにまとめて持ち運ぶための形式です。ファイルには、パスワードをかけます。"}, "w2-4-2": {"a": "クライアントの秘密鍵", "e": "【考え方】\n2つ目は、「クライアントの秘密鍵」です（CAの自己証明書と、順番は入れ替わっても構いません）。EAP-TLSでは、NPCが秘密鍵を使って自分を証明し、CA証明書でRADIUSサーバ（サーバ証明書）を検証します。"}, "w2-4-3": {"a": "ダウンロードサーバの認証情報が漏えいすると、来訪者もクライアント証明書などがダウンロードできてしまう。", "e": "【考え方】\n無線LAN経由で、ダウンロードサーバにアクセスさせる方法として、「認証エラー時に、WLCの認証VLAN機能で、特別なVLANをAPに設定し、そこにダウンロードサーバを置く」案を検討しました。クライアント証明書のない端末は、認証に失敗するので、この特別なVLANに接続されます。\n問題は、認証に失敗する端末なら、誰でもこのVLANに接続できることです。つまり、ダウンロードサーバを守る手段が、利用者IDとパスワードだけになります。この認証情報が漏れると、来訪者などの第三者も、クライアント証明書などをダウンロードできてしまいます。\n\n【補足】\n社内の営業員用VLANとは別に、「認証前の端末が、証明書を取りに来るための場所」を無線LAN側に作ると、そこが、社外の人にも届く入口になる、という点がポイントです。IPA講評では、(1)の正答率が低かったとあります。"}, "w2-4-4": {"a": "クライアント証明書の有効期限を切らせた営業員", "e": "【考え方】\n無線LAN導入後、営業部オフィスエリアの有線LANは撤去されます。クライアント証明書の更新は、有効期限の1か月前に、有効な証明書で無線LANに接続して、ダウンロードできます。しかし、有効期限が切れてしまった営業員は、EAP-TLSの認証が通らず、無線LANにつながりません。有線LANも撤去されているので、ダウンロードサーバにアクセスできません。"}, "w2-4-5": {"a": "無線LAN導入後に営業部に配属された営業員", "e": "【考え方】\nもう1つは、無線LAN導入後に営業部に配属された営業員です。ダウンロードサーバの案内（一斉メール）は、導入時に、全営業員宛てに送られます。後から配属された営業員は、この案内を受けていません。クライアント証明書も、まだNPCにありません。したがって、無線LANにつながらず、有線LANもないので、ダウンロードできません。（NPCの紛失、故障による再貸与は、設問の除外条件です。）\n\n【補足】\nどちらも、「証明書を持っていない状態で、ダウンロードサーバに行く手段（有線LAN）がない人」です。2つの答えは、順番が入れ替わっても構いません。本文の最後に、「その営業員には、情シスの担当者が、必要な情報をNPCにインストールして渡す」とある、人たちです。"}, "w2-5-1": {"a": "NPC", "e": "【考え方】\nIEEE 802.1Xの3つの役割です。\n・サプリカント：認証を受ける側の機器。図4では、NPC。\n・オーセンティケータ：認証を仲介し、接続の可否を制御する機器。\n・認証サーバ：認証の可否を判断するサーバ。図4では、RADIUSサーバ。\nNPCは、サプリカントです。"}, "w2-5-2": {"a": "WLC", "e": "【考え方】\n本文に、「WLCで、EAP-TLSを利用するときは、APとWLC間でトンネルが設定され、無線LAN端末とWLC間で、認証情報の交換が行われる」とあります。WLCがRADIUSサーバに問い合わせ、結果を基に、認証の可否を処理します。したがって、オーセンティケータは、APではなく、WLCです。\n\n【補足】\nIPA講評で、正答率が低かった問題です。「認証を受ける側＝NPC、認証を仲介・制御する側（無線LANコントローラ構成では、WLC）」と覚えます。APは、トンネルでWLCにつなぐだけで、認証の判断はしません。"}, "w2-5-3": {"a": "ESSID", "e": "【考え方】\n下線⑨の「WPA2又はWPAのパーソナルモードで無線LANに接続するための情報」とは、来訪者のNPCに設定してもらう情報です。パーソナルモードでは、次の2つが必要です。\n・ESSID：接続先のネットワーク名（本文に、ESSIDごとに、来訪者向けのVLAN200が割り当てられるとあります）。\n・PSK（事前共有鍵、パスフレーズ）：暗号鍵（PMK）を作るための、共通のパスワード。\n\n【補足】\nIPA講評では、(2)は正答率が高かった問題です。エンタープライズモードの、利用者ごとの認証（EAP-TLS）と違い、パーソナルモードは、共通のPSKで認証します。"}, "w2-5-4": {"a": "PSK", "e": "【考え方】\nもう1つの情報は、PSKです（ESSIDと、順番は入れ替わっても構いません）。PSKをNPCに設定すると、来訪者のNPCは、PSKからPMKを作り、AP（WLC）と接続できます。"}, "w2-5-5": {"a": "㋑", "e": "【考え方】\nタグVLANは、1本のリンクで、複数のVLANを通すときに使います（フレームにVLANタグを付けて区別）。\n・㋑（AP―L2SW5）：APが、営業員用のVLAN100と、来訪者用のVLAN200の両方を、1本のケーブルで流します。したがって、タグVLAN（トランク）が必要です。\n・㋒（L2SW5―L3SW）：来訪者のVLAN200は、L3SW側（社内）に流しません。VLAN100だけなので、タグを付ける必要はありません。\n・㋓（L2SW5―ルータ2）：VLAN200だけ。ポートVLANです。\nしたがって、答えは ㋑ です。\n\n【補足】\nIPA公式の解答例は ㋑ です。タグVLAN＝「複数のVLANを1本に束ねるリンク」と考えると、判断できます。"}, "w2-5-6": {"a": "ルータ2への接続ポートだけに、VLAN200のポートVLANを設定する。", "e": "【考え方】\n来訪者のNPCには、VLAN200が割り当てられ、ルータ2のDHCP機能でアドレスが付与されて、インターネットアクセスだけができるようにします。そのためのL2SW5の設定は、次のとおりです。\n・ルータ2に接続するポートだけに、VLAN200のポートVLANを設定する。\nつまり、VLAN200は、AP側のトランクポートと、ルータ2側のポートだけで通し、L3SWへのポートには、VLAN200を設定しません。これで、来訪者のNPCは、社内のサーバ（L3SWの先）には、到達できません。\n\n【補足】\nVLANは、L2のブロードキャストドメインを分ける仕組みです。VLAN200をL3SW側に出さなければ、来訪者のNPCから社内LANは見えません。「だけ」という語が、解答のキーワードです。"}, "w2-5-7": {"a": "ハンドオーバができなくなる。", "e": "【考え方】\nWLCは、本文の機能として、「APの負荷分散制御、PMKの保持などによるハンドオーバ制御機能」をもちます。認証後にWLCが故障すると、現在のAPでの通信は続けられます（認証後の通信はWLCを経由しないため）。しかし、NPCが別のAPに移動（ハンドオーバ）するときの制御ができなくなります。したがって、問題は、「ハンドオーバができなくなる」ことです。"}, "w2-5-8": {"a": "NPCに配布したPMKと認証関連情報がWLCで保持されているから", "e": "【考え方】\nハンドオーバでは、通常、PMKを再利用して、素早く再接続します。この仕組みは、設問2(1)jで答えた「PMKの保持」です。PMKと認証に関連する情報（認証済みの情報）は、WLCが保持しています。WLCが故障すると、これらが使えなくなるので、別のAPに移るときに、必要な情報（PMK）を得られず、ハンドオーバができません。\n\n【補足】\nIPA講評で、(5)の「理由」は正答率が低かった問題です。本文の「WPA2では、PMKの保持方法が規定され、ハンドオーバ時の再生成が不要になった」という記述と、WLCの機能（PMKの保持）を結びつけると、導けます。"}, "w2-5-9": {"a": "AP→L2SW5→L3SW→FW→L2SW1→プロキシサーバ→L2SW1→FW→ルータ1", "e": "【考え方】\n本文の冒頭に、「インターネットアクセスは、本社DMZのプロキシサーバ経由で行われている」とあります。営業員のNPCは、EAP-TLS認証後に、VLAN100に属し、既設の有線LANと同じ作業ができます。そこで、経路を順に追います。\n1) NPC → AP（無線）。\n2) AP → L2SW5（営業部フロアのスイッチ）。\n3) L2SW5 → L3SW（VLAN100）。\n4) L3SW → FW → L2SW1（DMZのスイッチ）。\n5) L2SW1 → プロキシサーバ（要求を中継）。\n6) プロキシサーバ → L2SW1 → FW → ルータ1 → インターネット。\nFWとL2SW1は、行きと戻りで2回通るので、2回書きます。\n\n【補足】\n・WLCは、認証後の通信が経由しないので、経路に入りません。\n・ルータ2は、来訪者用の経路（VLAN200）なので、入りません。\nIPA講評では、この(6)と(2)は、正答率が高かった問題でした。"}, "x1-1-1": {"a": "ip1/29", "e": "【考え方】\n宛先NATは、ブラウザ1（インターネット上）が送ってきたパケットの宛先IPアドレスを、FWが書き換える機能です。\n・変換前の宛先：インターネットからアクセスされるアドレス＝グローバルIPアドレス。\n・変換後の宛先：WebサーバがあるDMZのプライベートIPアドレス。\n表1で、グローバルIPアドレスの空間は、L2SW1のvlan1（ISP1接続）の ip1/29 です。したがって、アは ip1/29、イは、DMZ（L2SW9のvlan9）の 10.0.9.0/24 です。\n\n【補足】\n「/29」は、ホスト部が3ビットで、8アドレスという意味です。ここから、Webサーバ用などのグローバルIPアドレスが割り当てられます。「1:1に固定」は、グローバルIPアドレス1つに、プライベートIPアドレス1つを、いつも同じ組合せで対応付けることで、静的NATともいいます。"}, "x1-1-2": {"a": "10.0.9.0/24", "e": "【考え方】\nイは、宛先NATの「変換後」のアドレス空間です。WebサーバはDMZ（L2SW9のvlan9）にいるので、表1の「DMZ」の 10.0.9.0/24 が入ります。\n\n【補足】\n表1の用途欄で、「何のためのアドレス空間か」を見ます。ISP1接続（ip1/29）、DMZ（10.0.9.0/24）、FW接続（10.0.8.0/24）、IP-PBX接続（10.0.7.0/24）、イントラネット接続（10.0.6.0/24）の5つです。プライベートアドレスの中で、Webサーバが属するのは、DMZです。"}, "x1-1-3": {"a": "送信元ポート番号", "e": "【考え方】\nブラウザ2（社内）がインターネットにアクセスするときは、社内のプライベートアドレスのまま出ていけないので、FWが変換します。\n・送信元IPアドレス：グローバルIPアドレスに変換。\n・もう1つ：送信元ポート番号も変換。\nこの、IPアドレスとポート番号の両方を変換する方式が、NAPT（IPマスカレード）です。\n\n【補足】\nNAT（IPアドレスだけを変換する）では、グローバルIPアドレスが、同時にアクセスできる社内ホストの数だけ必要です。NAPTは、ポート番号で区別するので、少数のグローバルIPアドレスを多数のホストで共用できます。なお、設問1(2)は、このポート番号の数から、同時に処理できるコネクション数を求めます。"}, "x1-1-4": {"a": "131,072", "e": "【考え方】\n送信元NAPTでは、変換後の「送信元IPアドレス＋送信元ポート番号」の組が、コネクションごとに異なる必要があります。\n・TCPのポート番号は16ビットなので、1つのグローバルIPアドレスあたり 2^16＝65,536 通り。\n・変換後のグローバルIPアドレスは、下線(a)のとおり2つ。\n同時に処理できるコネクション数の上限は、65,536 × 2 ＝ 131,072 です。\n\n【補足】\n実際には、ウェルノウンポート（0〜1023）などは使えない場合があります。しかし、設問が「2^16＝65,536である」と与えているので、単純な掛け算で答えます。この計算は、設問5(2)の「グローバルIPアドレスの数」とは別の話です（ここでは、送信元NAPT用の2つです）。"}, "x1-1-5": {"a": "許可する通信を追加する。", "e": "【考え方】\nWebサーバを3台以上に増やす（スケールアウト）ときのFWの設定変更です。DNS機能（DNSラウンドロビンのAレコードの追加など）以外には、次の2つが必要です。\n1. 新しいWebサーバとの通信を許可する、フィルタリング定義の追加。\n2. 新しいWebサーバ用の宛先NAT（新しいグローバルIPアドレス→プライベートIPアドレス）の定義の追加。\n\n【補足】\n本文に、「FWのフィルタリング定義は、図1に示す情報システムの通信だけを許可している」とあります。許可されていない通信は通らないので、新しいサーバ用の許可が要ります。また、グローバルIPアドレスを新しいサーバに割り当てるので、宛先NATの定義も必要です。"}, "x1-1-6": {"a": "宛先NATに関する定義を追加する。", "e": "【考え方】\n2つ目は、「宛先NATに関する定義を追加する」です。1つ目（許可する通信の追加）と、順番が入れ替わっても構いません。\n\n【補足】\n解答は、1つの設定変更を、20字以内の短い文で書きます。「フィルタリング」と「NAT」は別の機能なので、2つを別々に書き分けます。"}, "x1-2-1": {"a": "異なるISPから払い出されている。", "e": "【考え方】\n下線(c)は、DNSラウンドロビンで、WebサーバのグローバルIPアドレスを増やす話です。\n・現行のグローバルIPアドレス：ip1/29 の中のアドレス（ISP1が払い出したもの）。\n・追加するグローバルIPアドレス：ip2/29 の中のアドレス（ISP2が払い出したもの）。\n違いは、「どのISPから払い出されたアドレスか」です。\n\n【補足】\nISPが払い出したアドレスは、そのISPが経路情報として広告しています。そのため、ip2宛てのパケットは、ISP2経由でA社に届きます。「別のISPのアドレスをもつことで、入口を2つ作る」ことが、マルチホーミングの考え方です。"}, "x1-2-2": {"a": "応答が行きの宛先IPアドレスとは異なる送信元IPアドレスから戻る。", "e": "【考え方】\n社外のブラウザが、ISP1側のアドレス（ip1）宛てに、Webサーバへアクセスした場合を考えます。\n1. 行き：ブラウザ → ISP1 → LB（ip1宛）→ Webサーバ。\n2. 戻り：もし、LBがISP2経由で返すと、送信元は、ISP2側のアドレス（ip2）になる。\n3. ブラウザから見ると、「ip1にアクセスしたのに、ip2から応答が来た」ことになる。\nTCPなどは、自分が通信している相手のアドレス以外からの応答は、受け付けません。そのため、通信が成立しません。\n\n【補足】\nIPA講評は、「IP層とTCP層の動作を勘違いしたり、技術的に不正確だったりする解答が散見された。正確で簡潔な記述を心掛けてほしい」としています。「IPアドレス」という用語を使って、「行きの宛先IPアドレスと、戻りの送信元IPアドレスが一致しない」と書くのが、簡潔で正確です。"}, "x1-3-1": {"a": "Bindingレスポンス中のデータに含まれるIPアドレスと、自分のIPアドレスを比べる。", "e": "【考え方】\nSTUNの動作は、次のとおりです。\n1. STUNクライアント（AP）が、STUNサーバにBindingリクエストを送る。\n2. STUNサーバは、受け取ったIPパケットのヘッダから、送信元のIPアドレスとポート番号を取り出して、Bindingレスポンスのデータに入れて返す。\n3. クライアントは、そのデータのIPアドレスを、自分のIPアドレスと比べる。\n・NATがなければ、STUNサーバから見えるアドレスは、クライアント自身のアドレスと同じ。\n・NATがあれば、NATで変換された後のアドレスになるので、自分のアドレスとは違う。\n\n【補足】\nSTUNは、「自分が外から見ると、どのアドレスとポート番号に見えるか」を教えてもらうプロトコルです。この仕組みで、NAT変換後のアドレス（図4の〈g2〉）を知り、通信相手に通知します。"}, "x1-3-2": {"a": "〈p〉", "e": "【考え方】\nホールパンチでは、APが、自分のIPアドレスの候補を、SDPオブジェクトにまとめて、通信相手のAPに渡します（図5の②）。ブラウザ2が格納するのは、次の2つです。\n1. ブラウザ2自身のIPアドレス：〈p〉（プライベートIPアドレス）。\n2. STUNサーバから得た、NAT変換後のIPアドレス：〈g2〉（グローバルIPアドレス）。\n通信相手のブラウザ1のAPは、通知された2つに向けて、順に通信を試します。\n\n【補足】\n図4では、ブラウザ1が〈g1〉（グローバルアドレス）、ブラウザ2が、NATの内側の〈p〉です。〈p〉は、プライベートアドレスなので、ブラウザ1からは到達できません。〈g2〉に送ると、NAT機能が〈p〉に変換して届けます。このように、「候補を全部渡して、通じるものを選ぶ」ので、最適ルートが決まります（図5の③）。"}, "x1-3-3": {"a": "〈g2〉", "e": "【考え方】\n2つ目は、STUNサーバから得た、NAT変換後のグローバルIPアドレス〈g2〉です。1つ目と2つ目は、順番が入れ替わっても構いません。\n\n【補足】\n設問は、「図4中の字句を用いて」と指定しています。「ブラウザ2のIPアドレス」などの説明ではなく、図4に書いてある記号〈p〉と〈g2〉で答えます。"}, "x1-3-4": {"a": "vlan1", "e": "【考え方】\nSTUNサーバに求められる役割は、「各ISP経由でNATされたとき、どのアドレスに見えるか」をAPに教えることです。\n・図3のA（STUNサーバ1）：ISP1につながるL2SW1の側のセグメント（vlan1）に接続する。\n・図3のB（STUNサーバ2）：ISP2につながるL2SW2の側のセグメント（vlan2）に接続する。\nこうすると、ISP1側のSTUNサーバ1からはISP1側のアドレスが、ISP2側のSTUNサーバ2からはISP2側のアドレスが得られます。さらに、片方のISPが障害のときでも、もう一方のISP側のSTUNサーバには、到達できます。\n\n【補足】\n表2のとおり、vlan1はISP1接続（L2SW1）、vlan2はISP2接続（L2SW2）です。AとBは、順番が入れ替わっても構いません。この設問は、「STUNサーバを、LBやFWの内側のvlan9などに置かない」理由を考える問題です。内側に置くと、STUNサーバにとって、アクセスが、LB（NAT）の内側から来たものとしか見えず、ISPごとのアドレスが得られません。この理由づけは、図3の接続位置からの推論です。"}, "x1-3-5": {"a": "vlan2", "e": "【考え方】\nB（STUNサーバ2）は、ISP2につながるL2SW2の側（vlan2）に接続します。これで、ISP1が障害のとき、ブラウザ2のAPは、LBがISP2を使って出ていく通信で、vlan2のSTUNサーバ2にアクセスできます。ISP2が障害のときも、同様に、ISP1側のSTUNサーバ1が使えます。"}, "x1-3-6": {"a": "ブラウザ2のAP", "e": "【考え方】\n図5の④（音声、ビデオ、データなどの交換）は、データ量が最も多い通信です。④は、③の最適ルートのIPアドレスの組合せで行います。その組合せのうち、A社の内側にあるブラウザ2のAPのアドレスは、LBのNATで、どのISPのアドレスに変換されるかが、決め手です。\n・ブラウザ2のAPが、STUNサーバにアクセスする（①'）。\n・このとき、LBが、通信をISP1とISP2のどちらに振り分けるかで、NAT後のアドレスが決まる。\nしたがって、④に用いられるISPは、ブラウザ2のAPがSTUNサーバをアクセスするときの、LBの振分け結果によって決まります。\n\n【補足】\nブラウザ1は、社外にいるので、A社のLBを通りません。A社の負荷分散の対象は、A社の内側にいる、ブラウザ2のAPです。"}, "x1-3-7": {"a": "STUNサーバ", "e": "【考え方】\nオは、ブラウザ2のAPがアクセスする相手のSTUNサーバです。ここまでの設問(4)をまとめると、\n「④に用いられるISPは、［ブラウザ2のAP］が［STUNサーバ］をアクセスするときの、LBの振分け結果によって決まる」\nとなります。LBがSTUNサーバ1（ISP1側）に振り分けるか、STUNサーバ2（ISP2側）に振り分けるかで、ISPが決まる、と読めます。"}, "x1-4-1": {"a": "HTTP", "e": "【考え方】\n図6の最初の2行（①-1、①-2）を読みます。\n・①-1 HTTP GET Upgrade: websocket：APは、まず、HTTPでIP-PBXにアクセスする。\n・①-2 101 Switching Protocols：IP-PBXが、プロトコルの切替えに同意する。\nしたがって、カは、HTTPです。この後、WebSocketに切り替えて、SIP（REGISTER、INVITEなど）のシグナリングを行います。\n\n【補足】\nIPA講評は、「(1)はWebsocketの知識を求めるものではなく、図6やHTTPの一般知識からの推論を期待した設問であるが、SIPそのものに引きずられた誤答が多かった」としています。図6の文字（HTTP GET、101 Switching Protocols）を、そのまま読めば、答えが出ます。"}, "x1-4-2": {"a": "WebSocket", "e": "【考え方】\n①-1のヘッダ「Upgrade: websocket」は、「WebSocketに切り替えたい」というHTTPの要求です。したがって、キは、WebSocketです。\n\n【補足】\nWebSocketは、HTTPで始めた接続を、そのまま使って、双方向の通信ができるようにするプロトコルです。ブラウザからSIPを使うには、このWebSocketの上にSIPを載せます。切替えは、必ず、HTTPのGET（Upgrade ヘッダ）から始めます。"}, "x1-4-3": {"a": "ISP1とISP2から払い出されたIPアドレスを一つずつ割り当てる。", "e": "【考え方】\nIP-PBXは、2組のB2BUA（Back-to-Back User Agent）として動作します。B2BUAは、通話の両側にそれぞれ別のUAとして動作して、通話を中継するものです。インターネット側のUAは2つあるので、それぞれに別のISPのグローバルIPアドレスを割り当てます。\n・1つ目のUA：ISP1から払い出されたアドレス。\n・2つ目のUA：ISP2から払い出されたアドレス。\nこうすると、ISP1とISP2のどちらからでも、IP-PBXに着信できます。\n\n【補足】\nIP-PBXは、グローバルIPアドレスとプライベートIPアドレスを変換する、Session Border Controllerとして動作します（本文）。社外側のUAがグローバルアドレス、社内側のUAがプライベートアドレスをもつ、という分け方です。"}, "x1-4-4": {"a": "vlan1", "e": "【考え方】\nIP-PBXのLANインタフェースC、Dは、インターネット側（グローバルIPアドレス）のUAのインタフェースです。マルチホーミングのため、別々のISPに近いセグメントに接続します。\n・C：ISP1に近い、L2SW1のセグメント（vlan1）。\n・D：ISP2に近い、L2SW2のセグメント（vlan2）。\n\n【補足】\nCとDは、順番が入れ替わっても構いません。IP-PBXが、vlan1とvlan2の両方につながっていれば、片方のISPが障害のときでも、もう一方のISPから通話に使えます。FWを通らずに、LBの外側に接続するので、設問5(7)でFWの設定変更が必要になる通信から、IP-PBX宛ての通信は除かれます。"}, "x1-4-5": {"a": "vlan2", "e": "【考え方】\nDは、ISP2側のL2SW2のセグメント（vlan2）に接続します。CとDで、vlan1とvlan2の両方に接続することが、解答の要点です。"}, "x1-4-6": {"a": "IP-PBX", "e": "【考え方】\n本文の空欄を読むと、次のことが分かります。\n・図6の通信の前に、［ク］のFQDNに関する［ケ］クエリが、APから［コ］へ発行される。\n・これによって、APとIP-PBXの間の通信が、ISP1とISP2に負荷分散される。\n負荷分散の仕組みは、LBのDNSラウンドロビン機能（本文の「LBのDNSラウンドロビン機能を使い、インターネットからA社内への通信の負荷分散を行う」）です。APは、IP-PBXの名前をDNSで引き、ISP1側とISP2側のアドレスを交互に受け取ります。したがって、クは、IP-PBXです。\n\n【補足】\nAP内の定義が、IPアドレスではなく、FQDNになっているのは、このDNSによる負荷分散のためです。設問5(3)の「APが名前解決しなければならないFQDN」と関連します。"}, "x1-4-7": {"a": "DNS", "e": "【考え方】\nケは、FQDNを問い合わせるクエリの種類で、DNSクエリです。実際のレコードの種類は、Aレコード（FQDNからIPアドレスを引く）です。"}, "x1-4-8": {"a": "LB", "e": "【考え方】\nコは、DNSクエリの発行先です。本文の移行後の構成では、インターネット向けのDNS機能を、FWからLBに移します（ISP2を経由してもDNS機能を提供できるようにするため）。そのため、APは、LBにDNSクエリを発行します。"}, "x1-5-1": {"a": "切り戻し", "e": "【考え方】\nサービス停止時間とは、次の3つの作業時間の合計です。\n1. 切替作業\n2. 切替作業後の動作確認\n3. 問題発生時の［サ］\n移行作業の途中で問題が見つかったときに、元の構成へ戻す作業が、「切り戻し」です。切り戻しにかかる時間も含めて、停止時間を見積もります。\n\n【補足】\nIPA講評によると、設問5は、設計の(2)(7)と、運用の(5)(6)の正答率が低く、時間切れと思われる誤答が多かった問題です。切り戻し（ロールバック）を含めて、移行計画の時間を見積もることは、実務の基本です。"}, "x1-5-2": {"a": "1", "e": "【考え方】\n下線(j)の「Webサーバ1とWebサーバ2に関する四つのAレコード」は、Webサーバ用の、1つのFQDNに対する、4つのIPアドレスです。DNSラウンドロビンで負荷分散するので、Aレコードを、同じ名前で、複数並べます。\n\n【補足】\nAレコードは、「FQDN → IPアドレス」の対応を1行ずつ書いたものです。同じFQDNのレコードが4行並ぶ形になるので、FQDNは1つ、IPアドレスは4つです（設問(2)の次の欄）。"}, "x1-5-3": {"a": "4", "e": "【考え方】\nグローバルIPアドレスの数を数えます。\n・Webサーバは2台（Webサーバ1、Webサーバ2）。\n・ISP1のアドレスが、各サーバに1つずつの、計2つ（現行）。\n・ISP2のアドレスが、各サーバに1つずつの、計2つ（追加）。\n合計4つです。四つのAレコードは、この4つのIPアドレスが、1つのFQDNに対応している、という意味になります。"}, "x1-5-4": {"a": "IP-PBX、STUNサーバ1、STUNサーバ2", "e": "【考え方】\n下線(k)は、APが名前解決しなければならないFQDNです。APが接続する相手は、次の3つです。\n・IP-PBX：音声電話で、AP→IP-PBX（図6）。\n・STUNサーバ1、STUNサーバ2：ビデオ電話で、AP→STUNサーバ（図5の①）。\nWebサーバへは、すでに現行のAレコードで名前解決しているので、新しい対象ではありません。\n\n【補足】\nAP内の定義には、IPアドレスではなく、FQDNを用いることにしています（下線(k)）。FQDNなら、DNSが、ISP1とISP2のアドレスを切り替えて返すことで、負荷分散や、障害時の切替えができるからです。"}, "x1-5-5": {"a": "FW", "e": "【考え方】\n切替1の対象機器は、図7のとおり、LB（設置）、L2SW2（設置）、ISP2（立会い試験、NSレコードの登録）、FW（新構成用の機能設定、中間構成用のフィルタリング設定）です。\n・LB、L2SW2、ISP2：新設・新規なので、元に戻す前の定義がない。\n・FW：既存の機器で、定義を書き換える。変更前の定義ファイルと、変更後の定義ファイルの2通りが必要。\n2通りの定義ファイルをもたせておけば、問題が起きたとき、元の定義ファイルを指定して再起動するだけで、切り戻せます。\n\n【補足】\n下線(l)の「機器の変更は、あらかじめ2通りの定義ファイルをもたせておき、定義ファイルを指定した再起動によって行う」は、サービス停止時間を2時間以内に収めるための工夫です。"}, "x1-5-6": {"a": "社外からWebサーバへのアクセス", "e": "【考え方】\n中間のネットワーク構成（図7）の用途は、次の3つです。\n・施工情報管理（マルチホーミング運用開始）：社外から、社内からのWebサーバへのアクセス。\n・インターネットアクセス（マルチホーミング運用開始）：社内からインターネットへのアクセス。\n・コールセンタ：IP-PBX（切替1では変更しない）。\n動作の正常性を確認するために発生させる3種類の通信は、次のとおりです。\n1. 社外からWebサーバへのアクセス\n2. 社内からWebサーバへのアクセス\n3. 社内からインターネットへのアクセス\n\n【補足】\nコールセンタ（IP-PBX）は、切替1の対象ではないので、確認の通信には含まれません。切替1で変わった機器（LB、L2SW2、ISP2、FW）を通る通信を、洗い出す考え方です。"}, "x1-5-7": {"a": "社内からWebサーバへのアクセス", "e": "【考え方】\n2つ目は、社内（ブラウザ2など）からWebサーバへのアクセスです。3種類は、順番が入れ替わっても構いません。"}, "x1-5-8": {"a": "社内からインターネットへのアクセス", "e": "【考え方】\n3つ目は、社内からインターネットへのアクセスです。FWのNAT機能をLBに移したことと、ISP1とISP2への負荷分散の確認になります。"}, "x1-5-9": {"a": "ISP2を経由した外向きDNS機能を確認する。", "e": "【考え方】\nドメイン登録業者に依頼する定義変更は、ISP2経由でも、A社のDNSの問合せに応答できるようにするための、NSレコードなどの追加です（本文の「ISP1、ISP2のいずれからでも同じゾーンファイルが参照されるようにする」）。情報システム部が確認するのは、ISP2を経由して、外から、A社のDNS（LBのDNS機能）を問い合わせても、正しく応答することです。つまり、ISP2を経由した外向きのDNS機能が、正常であることです。\n\n【補足】\nこの確認は、利用者サービスに直接の影響がないので、サービス停止時間には含まれません（本文）。そのため、サービス停止時間の2時間とは別に、確認することができます。"}, "x1-5-10": {"a": "①'、③、④", "e": "【考え方】\n切替2は、STUNサーバとIP-PBXの追加です。FWのフィルタリング設定の対象は、「FWを通る通信」です。図3の接続位置から、各通信を判断します。\n・STUNサーバのインタフェースA、Bは、LBの外側（vlan1、vlan2）にあります。\n・IP-PBXのインタフェースC、Dも、同様にvlan1、vlan2にあります。\n\n・①（ブラウザ1→STUNサーバ）：通らない ／ 社外から、vlan1/vlan2のSTUNサーバへ直接。LB、FWの外側。\n・①'（ブラウザ2→STUNサーバ）：通る ／ 社内から、FW→LB→L2SW→STUNサーバ。\n・②（SDPオブジェクトの交換）：既存の通信 ／ ブラウザとWebサーバ間のHTTPS。すでに許可済み。\n・③（最適ルートの決定）：通る ／ ブラウザ2（社内）とブラウザ1（社外）の通信。\n・④（音声、ビデオ、データなど）：通る ／ 同上。\n\nしたがって、答えは ①'、③、④ です。\n\n【補足】\nIPA講評で、設問5(7)は正答率が低く、時間切れと思われる誤答が多い問題でした。「FWを通るか、通らないか」を、1つずつ図3の位置関係から判断します。上の表の「通るか」の判断は、図3の接続位置からの推論です。"}, "x2-1-1": {"a": "32", "e": "【考え方】\nSPI（Security Parameters Index）は、SAの識別キーとして、IPsecの各パケットに挿入される値です。ESPヘッダには、SPI（32ビット）とシーケンス番号（32ビット）が入ります。したがって、SPIは32ビットの整数値です。\n\n【補足】\n受信側のIPsecルータは、パケット中のSPIで、使うSAを識別します。SAには、暗号化アルゴリズム、鍵、ライフタイムなどが入っています。SAは一方向（送信用と受信用で2つ）なので、SPIも方向ごとに異なります。IPA講評は、アとイが踏み込んだ内容で、正答率が低かったとしています。"}, "x2-1-2": {"a": "セレクタ", "e": "【考え方】\nSP（セキュリティポリシ）は、「このパケットには、どんな処理を施すか」を決めたものです。処理は、PROTECT（IPsecを適用して送信）、BYPASS（IPsecを適用せずに送信）、DISCARD（廃棄）の3種類です。\nそのSPを選び出すキーのことを、セレクタと呼びます。IPアドレス、プロトコル、ポート番号などを組み合わせて、パケットがどのSPに合うかを判断します。\n\n【補足】\nSPデータベース（SPD）は、経路表に似た構造です。経路表が、宛先アドレスから次の転送先を引くのに対し、SPDは、セレクタから処理を引く表です。"}, "x2-1-3": {"a": "アグレッシブ", "e": "【考え方】\nIKEフェーズ1には、2つのモードがあります。\n・メインモード：3往復（6メッセージ）。\n・アグレッシブモード：1往復半（3メッセージ）。\n本文の「メインモードでは3往復の通信が行われるが、［ウ］モードは1往復半の通信で完了する」から、ウは、アグレッシブです。\n\n【補足】\nアグレッシブモードは、メッセージが少なく速く完了する代わりに、識別情報（ID）が暗号化されないという弱点があります。メインモードのほうが安全です。"}, "x2-1-4": {"a": "経路", "e": "【考え方】\nGREでカプセル化すると、外側のIPヘッダ（図3のIPヘッダ1）の宛先は、トンネルの対向ルータです。インターネットは、元のパケット（IPヘッダ2）の宛先への「経路」情報を、もつ必要がありません。図4では、PCとサーバが、プライベートアドレス（192.168.x.x）ですが、インターネットは、α.0.0.1とβ.0.0.1の間の経路だけを知っていれば、通信が成立します。\n\n【補足】\nIPsecのトンネルモードも、同様の考え方です。違いは、GREは、IPマルチキャストやIPブロードキャストもカプセル化できる点です（設問2(3)）。"}, "x2-1-5": {"a": "断片化", "e": "【考え方】\nGREでカプセル化すると、ヘッダが24バイト（20＋4）増えます。そのため、トンネルインタフェースのMTUは、イーサネットインタフェースのMTUより、24バイト小さくなります。\n・PCとサーバが、1,500バイトのMTUのまま送ると、カプセル化後は1,500バイトを超える。\n・超えたパケットは、断片化（フラグメンテーション）される。\nPCとサーバのMTUサイズを、適切な値（小さい値）にしておけば、カプセル化しても、MTUを超えないので、断片化を防げます。\n\n【補足】\n断片化が起きると、ルータの処理負荷が増え、1つの断片が失われるだけで、元のパケット全体が再送になるので、性能が下がります。本文の後ろで、IPsecルータでMSS（Maximum Segment Size）を書き換えるのも、TCPで同じ問題を避けるためです。"}, "x2-2-1": {"a": "リキー（ReKey）", "e": "【考え方】\nライフタイムは、SAの生存期間です。表2のライフタイムは、IPsec SA（IKEフェーズ2で作るSA）のものです。終了時点では、そのSAが使えなくなるので、次の処理を行います。\n・IKEフェーズ2を再度行って、新しいIPsec SAを作る。\n・新しい暗号鍵を生成して、鍵を更新する。\nこの処理を、「リキー（ReKey）」といいます。\n\n【補足】\n同じ鍵を長く使うと、通信を解読されるおそれが高まります。鍵を一定時間で作り直すのは、このためです。IPA講評で、(1)は正答率が高い問題でした。"}, "x2-2-2": {"a": "IPsec通信で送受信されるメッセージが、通信中に改ざんされていないこと", "e": "【考え方】\n「認証」という語が、IPsecには2か所に出てきます。表1と表2を比べて、違いを読み取ります。\n・表1（IKEフェーズ1）の認証方式：「IPsec通信相手機器の認証方式」。対象は、通信相手の機器。\n・表2（IKEフェーズ2）の認証方式：「IPsec通信で使用する認証アルゴリズム」。対象は、IPsec通信のデータ。\nしたがって、表2の認証方式で認証できるのは、「IPsec通信で送受信されるメッセージ（データ）が、通信中に改ざんされていないこと」（完全性）です。\n\n【補足】\nIPA講評は、(2)の正答率が低く、「IKEフェーズ1とフェーズ2で、それぞれ認証方式の交渉が行われるが、フェーズ2で交渉される認証方式は、IPsec通信で送受信されるデータの完全性を認証するためのものであることを、表の内容と本文の記述から導き出してほしかった」としています。同じ「認証」でも、フェーズ1は「相手」、フェーズ2は「データの完全性」と使い分けます。"}, "x2-2-3": {"a": "OSPFのリンクステート情報交換は、IPマルチキャスト通信で行われるから", "e": "【考え方】\n次の2つを組み合わせて考えます。\n1. 本文に、「IPsecでは、ユニキャストのIPパケットをカプセル化して転送する」とある。\n2. OSPFのリンクステート情報の交換パケットは、マルチキャスト（224.0.0.5など）宛ての、IPマルチキャストパケットである。\nしたがって、IPsecだけでは、OSPFのリンクステート情報の交換パケットを、カプセル化できません。\n\n【補足】\nGREは、IPブロードキャストもIPマルチキャストもカプセル化できます（本文）。そこで、OSPFのパケットをGREでカプセル化し、そのGREパケット（ユニキャスト）を、IPsecで保護します。この方法が、GRE over IPsec です。"}, "x2-3-1": {"a": "1,436", "e": "【考え方】\nイーサネットのMTUは1,500バイトです（ジャンボフレームは使わない）。図3のGREでカプセル化したパケットの構成は、次のとおりです。\n・IPヘッダ1（20）＋GREヘッダ（4）＋IPヘッダ2（20）＋TCP/UDPヘッダ（20）＋データ（あ）\n1,500 − (20 ＋ 4 ＋ 20 ＋ 20) ＝ 1,500 − 64 ＝ 1,436 バイト。\n\n【補足】\n「最大バイト数」は、データ部の最大の長さです。IPヘッダ1は、トンネルの外側のIPヘッダ、IPヘッダ2とTCP/UDPヘッダは、元のIPパケットのヘッダです。"}, "x2-3-2": {"a": "1,414", "e": "【考え方】\n図5のL2TPでカプセル化したパケットの構成は、次のとおりです。\n・IPヘッダ1（20）＋UDPヘッダ（8）＋L2TPヘッダ（16）＋PPPヘッダ（2）＋IPヘッダ2（20）＋TCP/UDPヘッダ（20）＋データ（い）\n1,500 − (20 ＋ 8 ＋ 16 ＋ 2 ＋ 20 ＋ 20) ＝ 1,500 − 86 ＝ 1,414 バイト。\n\n【補足】\nGRE（1,436）と、L2TP（1,414）の差は22バイトです。L2TPのほうが、1つのパケットで運べるデータが少なくなります。この差が、設問3(4)の「GREを利用する利点」です。"}, "x2-3-3": {"a": "IPヘッダ1　送信元：α.0.0.1、宛先：β.0.0.1", "e": "【考え方】\n図3のIPヘッダ1は、GREの外側のIPヘッダです。GREトンネルの両端、つまり、ルータ1とルータ2が、通信相手です。図4で、ルータ1のインターネット側のアドレスは α.0.0.1、ルータ2のアドレスは β.0.0.1 です。PCからサーバへの通信では、ルータ1（送信元）からルータ2（宛先）に送ります。\n・IPヘッダ1の送信元：α.0.0.1\n・IPヘッダ1の宛先：β.0.0.1\n\n【補足】\nインターネットの経路上にあるルータは、このIPヘッダ1だけを見て転送します。PCやサーバのプライベートアドレス（IPヘッダ2）は、トンネルの中身なので、インターネットのルータからは見えません。"}, "x2-3-4": {"a": "IPヘッダ2　送信元：192.168.0.100、宛先：192.168.10.1", "e": "【考え方】\nIPヘッダ2は、カプセル化された、元のIPパケットのヘッダです。PC（192.168.0.100）からサーバ（192.168.10.1）への通信なので、次のとおりです。\n・IPヘッダ2の送信元：192.168.0.100\n・IPヘッダ2の宛先：192.168.10.1\n\n【補足】\nGREは、元のパケットを変更せず、そのまま包みます。このため、ルータ2が、カプセル化を解除したあとの、元のパケットのアドレスが、変わらずに残ります。"}, "x2-3-5": {"a": "IPヘッダ1", "e": "【考え方】\n図6のL2TP利用時の通信は、次の3つの層に分かれています。\n・①PPPoE：PCとPPPoEサーバ（アクセス回線網内）の間。\n・L2TPトンネル：PC（LAC）とVPN装置（LNS）の間。\n・②PPPセッション：PCとVPN装置の間（L2TPトンネルの中）。\n注記のとおり、PCが、PPPoEによって、IPアドレスを動的に取得します。①のPPPoEで、PCが取得するIPアドレスは、アクセス回線網（ISP）側のアドレスです。これは、L2TPトンネルの外側の、IPパケットのアドレスになります。したがって、図5の「IPヘッダ1」に格納されます。\n\n【補足】\nIPA講評は、(3)の正答率が低く、「図で示した通信手順とパケット形式を基にじっくり考えれば、正答を導き出せたはず」としています。図6の「①PPPoE」「②PPPセッション」と、図5の「IPヘッダ1」「IPヘッダ2」を、層の外側と内側として対応づけます。"}, "x2-3-6": {"a": "IPヘッダ2", "e": "【考え方】\n②のPPPセッションは、PCとVPN装置の間、L2TPトンネルの中の通信です。このPPPセッションで、PCは、イントラネット内のアドレスを取得します（VPN装置のLNS機能が割り当てる）。このアドレスは、PCとサーバの通信（イントラネットのアドレス）に使われるので、元のIPパケットのアドレス、つまり図5の「IPヘッダ2」に格納されます。\n\n【補足】\n整理すると、\n・外側のIPヘッダ（IPヘッダ1）：インターネットを通るための、PC（PPPoEで取得したアドレス）とVPN装置のアドレス。\n・内側のIPヘッダ（IPヘッダ2）：PCとサーバの通信用で、PPPセッション（②）で取得したアドレス。\nです。"}, "x2-3-7": {"a": "カプセル化によるオーバヘッドがL2TPより小さいので、一つのパケットで転送できるデータ量が多い。", "e": "【考え方】\nGREとL2TPのカプセル化で増えるヘッダを比べます。\n・GRE：IPヘッダ1（20）＋GREヘッダ（4）＝ 24バイト。\n・L2TP：IPヘッダ1（20）＋UDP（8）＋L2TP（16）＋PPP（2）＝ 46バイト。\nGREのほうがオーバヘッドが小さいので、同じMTUでも、1つのパケットで運べるデータ量が多くなります（設問3(1)の、1,436バイトと1,414バイトの差です）。\n\n【補足】\nL2TPは、PPPフレームをカプセル化するので、ユーザ認証やアドレス割当などの機能が豊富です。今回の目的は、OSPFのパケットとサーバ宛のパケットを、トンネルで運ぶことなので、機能よりも効率のよいGREを選ぶ、という判断です。"}, "x2-4-1": {"a": "GREでトンネリングが行われるから", "e": "【考え方】\nIPsecの通信モードは、2つあります。\n・トランスポートモード：元のIPヘッダはそのまま、その後ろのデータ部だけを保護する。\n・トンネルモード：元のIPパケット全体をカプセル化し、新しいIPヘッダを付ける。\nGRE over IPsecでは、元のパケットが、すでにGREでカプセル化され、外側にIPヘッダ（IPヘッダ1）が付いています。トンネルモードで、さらに新しいIPヘッダを付ける必要はありません。「GREでトンネリングが行われるから」が、解答の要点です。\n\n【補足】\nトンネルモードを重ねても、IPヘッダが20バイト増えるだけで、無駄になります。トランスポートモードなら、図7のように、IPヘッダ1の次にESPヘッダが入るだけです。"}, "x2-4-2": {"a": "ESP認証データ長は、使用する認証アルゴリズムによって変化するから", "e": "【考え方】\n図7のESP認証データは、ESPの認証アルゴリズムが出力する値（ICV）です。出力の長さは、アルゴリズムによって違います（HMAC-SHA-1を96ビットに切り詰める場合は12バイト、HMAC-SHA-256を使う場合はそれより長い、など）。表2の「認証方式」で選んだアルゴリズムによって、長さが変わるので、図7では「不定」と書かれています。\n\n【補足】\nESPトレーラも「不定」です。これは、暗号化アルゴリズムのブロック長に合わせるパディングなどが入るためです。"}, "x2-4-3": {"a": "GREヘッダ、IPヘッダ2、TCP/UDPヘッダ、データ、ESPトレーラ", "e": "【考え方】\nESPの暗号化の範囲は、ESPヘッダの後ろから、ESPトレーラまでです。図7（トランスポートモード）で、各項目を見ます。\n・IPヘッダ1：されない（ルータが転送に使う）\n・ESPヘッダ：されない（SPIなど、受信側がSAを識別するのに使う）\n・GREヘッダ：される\n・IPヘッダ2：される\n・TCP/UDPヘッダ：される\n・データ：される\n・ESPトレーラ：される\n・ESP認証データ：されない（認証用の値）\nしたがって、暗号化される項目は、GREヘッダ、IPヘッダ2、TCP/UDPヘッダ、データ、ESPトレーラです。\n\n【補足】\n設問は、項目名を「全て」答えるので、5つとも書きます。「ESP認証データ」は、暗号化の対象ではなく、認証の対象（ESPヘッダ〜ESPトレーラ）を元に計算される値です。"}, "x2-5-1": {"a": "172.16.128.0/20、172.16.17.0/24", "e": "【考え方】\n図1から、DMサーバ以外のサーバを、Z社のデータセンタに移設します。IPアドレスは変えないので、サブネットごと移動します。\n・Webサーバ、中継メールサーバ、プロキシサーバ：172.16.128.0/20（DMZ） ／ 全部が対象なので、そのまま移動\n・DMサーバ（172.16.16.1）：172.16.16.0/20（社内サーバ用） ／ 本社に残る\n・社内メールサーバ（172.16.17.1）：同上 ／ 移設する\nDMサーバと社内メールサーバは、同じ 172.16.16.0/20 にいます。社内メールサーバだけを移すには、サブネットを分割します。プレフィックス長は、16、20、24のいずれかです。DMサーバのアドレス（172.16.16.1）を含まず、社内メールサーバのアドレス（172.16.17.1）を含むのは、172.16.17.0/24 です。\nしたがって、移動するサブネットは、172.16.128.0/20 と 172.16.17.0/24 です。\n\n【補足】\nサブネットを分けて、データセンタ側に別のサブネットとして置けば、サーバのIPアドレスを変えずに移設できます（要件の「サーバのIPアドレスの変更が生じないようにすること」）。"}, "x2-5-2": {"a": "L2SWaとL2SWbを異なるサブネットにする。", "e": "【考え方】\n図9では、IPsecルータとL3SWが、L2SWaとL2SWbの両方に接続されています。L2SWaとL2SWbが、同じサブネット（同じブロードキャストドメイン）だと、IPsecルータとL3SWを経由して、レイヤ2のループができます。ループができると、ブロードキャストストームの原因になります。\nL2SWaとL2SWbを異なるサブネット（別のVLAN）にすれば、それぞれが別のブロードキャストドメインになり、ループが発生しません。\n\n【補足】\nループを防ぐ別の方法には、STP（スパニングツリー）がありますが、今回は、サブネットを分ける設計です。サブネットが2つになるので、設問(3)の仮想IPアドレスの数が、2つになります。"}, "x2-5-3": {"a": "2", "e": "【考え方】\nVRRPの仮想IPアドレスは、サブネットごとに1つ必要です（PCが、デフォルトゲートウェイとして、使うアドレス）。\n本社は、設問(2)のとおり、L2SWaとL2SWbが、異なるサブネットです。サブネットが2つなので、仮想IPアドレスは、最少で2つです。\n\n【補足】\n「最少の個数」とは、サブネットごとに1つだけ設定して、それ以上は増やさない、という意味です。"}, "x2-5-4": {"a": "1", "e": "【考え方】\n営業所は、L2SWが1台だけです。サブネットは1つなので、仮想IPアドレスは、最少で1つです。"}, "x2-5-5": {"a": "2", "e": "【考え方】\nデータセンタは、本社と同じく、IPsecルータ、L3SW、L2SWa、L2SWbの構成で、L2SWaとL2SWbが、異なるサブネットです。サブネットが2つなので、仮想IPアドレスは、最少で2つです。\n\n【補足】\n3か所をまとめると、本社 2、営業所 1、データセンタ 2 です。サーバが多い本社とデータセンタは、L2SWを2台に分けて可用性を上げ、営業所は1台にしている、という設計です。"}, "x2-5-6": {"a": "どのサーバアクセスも、VRRPのマスタルータが稼働する機器に接続されたWAN回線を経由して行われる。", "e": "【考え方】\n次の順に考えます。\n1. 名古屋営業所の、IPsecルータとL3SWを直接接続する経路が切断される。\n2. PCのデフォルトゲートウェイは、VRRPの仮想IPアドレス。マスタルータは、IPsecルータかL3SWのどちらか1台。\n3. 切断されると、IPsecルータとL3SWの間で、パケットを転送できず、OSPFの経路情報も、直接は交換できなくなる。\n4. そのため、PCからのアクセスは、マスタルータが稼働する機器が、自分に直接接続されているWAN回線だけを使って転送する。\n・マスタがL3SWなら、L3SWに接続された広域イーサ網（または専用線）。\n・マスタがIPsecルータなら、IPsecルータに接続されたインターネットVPN。\nしたがって、どのサーバ（本社、データセンタ）へのアクセスも、VRRPのマスタルータが稼働する機器に接続されたWAN回線を経由して行われます。\n\n【補足】\nIPA講評によると、(4)は、正答率が低く、「VRRPのマスタルータの状態と経路テーブルの変化後の内容を基に、サーバ宛てのパケットが転送される経路について考える設問だったが、機器間の接続が切断されることによる経路テーブルの変化内容が理解できていない解答が散見された」問題です。「動的経路制御はネットワークの基盤となる技術なので、是非とも基本技術は習得してほしい」とあります。この解説の手順4は、公式の解答例の文言を、図9の構成に当てはめた私の整理です。"}, "x2-5-7": {"a": "インターネットVPN経由のコスト値が最小230であるのに対して、専用線経由のコスト値は200で最も小さい。", "e": "【考え方】\n表3の下線(d)は、「本社のPC → インターネット」が、「専用線 → データセンタ → プロキシサーバ → インターネット」になる経路です。OSPFは、コスト値の合計が最小の経路を選ぶので、本社のL3SWから、データセンタへの経路を比べます。\n・専用線経由：L3SWの専用線ポートのコスト 200\n・インターネットVPN経由：L3SWとIPsecルータ間のコスト 10 ＋ トンネルインタフェースのコスト 220 ＝ 230（最小）\n200 ＜ 230 なので、専用線経由が選ばれ、インターネットVPN経由にはなりません。\n\n【補足】\n図9の注記2と注記3のとおり、IPsecルータとL3SWのポートの数値は、OSPFのコスト値です。IPsecルータのポートの（　）内の数値は、トンネルインタフェースのコスト値です。解答には、「230」と「200」のコスト値を、必ず示します。"}, "x2-5-8": {"a": "広域イーサ網→本社→専用線", "e": "【考え方】\n表3の「名古屋営業所のインターネットVPN接続」に障害がある場合です。送信元は名古屋営業所のPC、宛先はデータセンタのサーバです。\n1. インターネットVPNは、データセンタと営業所の間のものなので、障害で使えない。\n2. 営業所からは、広域イーサ網を経由して、本社に入る。\n3. 本社から先は、本社とデータセンタの間の専用線を使って、データセンタに入る。\nしたがって、「PC→広域イーサ網→本社→専用線→データセンタ→サーバ」となり、うは、広域イーサ網→本社→専用線です。\n\n【補足】\nIPA講評によると、(6)の「う」は、「インターネットVPNの設定についての本文の記述を見落とした受験者が多かった」問題です。本文に、「インターネットVPNは、データセンタと本社間、及びデータセンタと営業所間で設定する」とあります。営業所と本社の間には、インターネットVPNはありません。そのため、本社へは、広域イーサ網で行きます。"}, "x2-5-9": {"a": "インターネットVPN→データセンタ→専用線", "e": "【考え方】\n表3の「名古屋営業所の広域イーサ網接続」に障害がある場合の、DMサーバ宛ての経路です。DMサーバは、本社に残っています。\n1. 営業所と本社をつなぐ広域イーサ網が使えない。\n2. 営業所のPCは、インターネットVPNを使って、データセンタに入る。\n3. データセンタから、専用線で本社に入る。\nしたがって、「PC→インターネットVPN→データセンタ→専用線→本社→DMサーバ」で、えは、インターネットVPN→データセンタ→専用線です。\n\n【補足】\nIPA講評は、(6)の「え」の正答率が低かった、としています。障害があるときは、営業所→データセンタ（インターネットVPN）→本社（専用線）と、迂回する、遠回りの経路になります。広域イーサ網を使えない経路を、順に組み立てます。"}, "y1-1-1": {"a": "送信元IP", "e": "【考え方】\n図2の構成は、FW → LB → Webサーバ／業務サーバです。Webサーバと業務サーバは、同じセグメントにあり、デフォルトゲートウェイは、LBです。\nWebサーバから業務サーバへアクセスするとき（図3の③④）、LBは、宛先を業務サーバの実IPアドレスに変換して送ります。このとき、送信元がWebサーバのままだと、業務サーバは、同じセグメントのWebサーバへ、LBを通さずに直接応答してしまいます。Webサーバは、アクセス先（業務サーバの仮想IPアドレス）以外のアドレスからの応答を受け付けないので、通信が成立しません。\nそのため、LBは、宛先IPアドレスだけでなく、送信元IPアドレスも、LB自身のアドレスに変換します。\n\n【補足】\nIPA講評で、設問1(1)は、TCP/IPの基本に関する、正答率が比較的低い問題でした。「同一セグメント内だから、戻りがLBを通らないおそれがある」という理由づけが要点です。本文の「Webサーバから業務サーバへのアクセスについては、両サーバが同一セグメント内にあるので」が、手がかりです。"}, "y1-1-2": {"a": "LB正", "e": "【考え方】\n図3の③と④の間にある機器です。Webサーバから業務サーバへのアクセスは、LBを経由します（Webサーバと業務サーバのデフォルトゲートウェイがLBで、アクセスはLBによって負荷分散されているため）。FWとLBは、Active-Standby方式で冗長化されており、通常時のアクティブ側は、LB正です。したがって、いは、LB正です。\n\n【補足】\n図3の流れは、FW正 → LB正 → Webサーバ → LB正 → 業務サーバです。LB正が、2回登場します。1回目は、外部からWebサーバへ、2回目は、Webサーバから業務サーバへの中継です。"}, "y1-1-3": {"a": "①", "e": "【考え方】\n図3の①〜⑧を、各パケットの送信元と宛先で整理します。（Webサーバの仮想IP、Webサーバの実IP、業務サーバの仮想IP、業務サーバの実IPで表します。）\n・①：FW→LB。送信元：クライアント。宛先：Webサーバの仮想IP。\n・②：LB→Webサーバ。送信元：クライアント。宛先：Webサーバの実IP。\n・③：Webサーバ→LB。送信元：Webサーバの実IP。宛先：業務サーバの仮想IP。\n・④：LB→業務サーバ。送信元：LBのアドレス。宛先：業務サーバの実IP。\n・⑤：業務サーバ→LB。送信元：業務サーバの実IP。宛先：LBのアドレス。\n・⑥：LB→Webサーバ。送信元：業務サーバの仮想IP。宛先：Webサーバの実IP。\n・⑦：Webサーバ→LB。送信元：Webサーバの実IP。宛先：クライアント。\n・⑧：LB→FW。送信元：Webサーバの仮想IP。宛先：クライアント。\n②の送信元は、クライアントです。送信元がクライアントになるのは、①と②（自分自身を除くと①）です。\n\n【補足】\n①と②は、宛先が違うだけで、送信元は同じです。LBは、宛先の仮想IPアドレスを実IPアドレスに変換するだけで、送信元は、変えていません（外から来た通信は、クライアントのアドレスのまま、Webサーバに届く）。"}, "y1-1-4": {"a": "⑥", "e": "【考え方】\n②の宛先は、Webサーバの実IPアドレスです。上の一覧で、宛先がWebサーバの実IPになるのは、次の2つです。\n・②：LB→Webサーバ（宛先：Webサーバの実IP）。\n・⑥：LB→Webサーバ（業務サーバからの応答を、Webサーバに返す）。\n自分自身（②）を除くと、答えは⑥です。③⑦は、宛先がLB側、④⑤は、業務サーバやLBが宛先で、Webサーバの実IPではありません。\n\n【補足】\nIPA講評は、「ヘッダ内のアドレスの変化など、基本事項に関する設問だが、誤答が少なからず見受けられた。この種の問題は、落ち着いて取り組み、着実に答えるようにしてほしい」としています。①〜⑧を、1つずつ、送信元と宛先を書き出せば、間違えにくくなります。"}, "y1-2-1": {"a": "中継装置", "e": "【考え方】\nプロキシには、2種類あります。\n・フォワードプロキシ：クライアントの代わりに、サーバにアクセスする。クライアント側にある。\n・リバースプロキシ：サーバの代わりに、クライアントのアクセスを受ける。サーバ側にある。\n稼働情報取得案では、次のように動作します。\n・中継装置：新業務サーバやPC（クライアント）の代わりに、設備側にGETリクエストを送る。→ フォワードプロキシ。\n・通信アダプタ：設備（サーバ）の代わりに、中継装置からのGETリクエストを受けて、キャッシュした稼働情報で応答する。→ リバースプロキシ。\nしたがって、うは、中継装置です。\n\n【補足】\nどちらも、HTTPキャッシュを使って、応答を速くしたり、設備への負荷を下げたりする点が共通です。「どちら側の代理か」で、フォワードとリバースを見分けます。"}, "y1-2-2": {"a": "通信アダプタ", "e": "【考え方】\nえは、設備（サーバ）の代わりに応答する機器で、通信アダプタです。設備の近く（顧客側）にあって、設備の稼働情報をキャッシュしています。"}, "y1-2-3": {"a": "リバース", "e": "【考え方】\nおは、通信アダプタの種類で、リバースプロキシです。サーバ（設備）の代理として、クライアント（中継装置）からのリクエストを受けるプロキシだからです。"}, "y1-2-4": {"a": "稼働情報の収集周期の変更が容易である。", "e": "【考え方】\n稼働情報取得案では、稼働情報を取得するきっかけ（トリガ）が、設備側ではなく、K社データセンタ側（新業務サーバ）にあります。この方式の運用上の利点は、次のとおりです。\n・収集周期（サービス開始時は1時間、段階的に5分程度）を変更したいとき、新業務サーバの設定を変えるだけで済む。\n・何万台もの設備（108,000台）に対して、設定を変更する必要がない。\nしたがって、「稼働情報の収集周期の変更が容易である」が答えです。\n\n【補足】\nもし、設備側にトリガがあると、収集周期を変えるたびに、全設備の設定を変更しなければなりません。トリガを、集めたい側（データセンタ）に置くのは、運用の変更を、集中して行えるようにする工夫です。"}, "y1-2-5": {"a": "Tc", "e": "【考え方】\n図6の例IIは、「設備から更新情報を取得できた場合」です。流れを順に追います。\n1. PC・新業務サーバが、中継装置にGETリクエストを送る。\n2. 中継装置が、通信アダプタにGET（If-Modified-Since: Tb）を送る。\n3. 通信アダプタが、設備にGET（If-Modified-Since: Tb'）を送る。\n4. 設備が、更新された稼働情報を返す（Last-Modified: Tc）。\n5. 通信アダプタが、キャッシュを更新して、中継装置に返す。\n通信アダプタのキャッシュは、設備から得た、Tc のタイムスタンプの稼働情報に更新されます。\n\n【補足】\n時刻の前後関係は、Tb ≦ Tb' ＜ Tc です。Tc が、最も新しい時刻です。例IIIの場合は、キャッシュが更新されないので、Tf のままです。"}, "y1-2-6": {"a": "中継装置より通信アダプタのキャッシュの更新頻度が高く新しいから", "e": "【考え方】\nTbとTb'の意味を、整理します。\n・Tb：中継装置が、自分のキャッシュしている、最新の稼働情報のタイムスタンプ。\n・Tb'：通信アダプタが、自分のキャッシュしている、最新の稼働情報のタイムスタンプ。\n通信アダプタは、④'（1分間隔）で、単独で設備から稼働情報を取得してキャッシュを更新しています（図6の例I）。一方、中継装置のキャッシュは、④のアクセス（収集周期は1時間〜5分）のときにしか、更新されません。そのため、通信アダプタのキャッシュのほうが、更新頻度が高く、新しいことが多いので、Tb ≦ Tb'（多くの場合 Tb ＜ Tb'）になります。\n\n【補足】\n図6の注記の「Tb ≦ Tb' ＜ Tc」の ≦ は、「等しい場合もある」という意味です。解答は、「キャッシュの更新頻度」に着目して、「通信アダプタのほうが高く、新しい」と書きます。"}, "y1-2-7": {"a": "設備とTCPコネクションが確立できない場合", "e": "【考え方】\n図6の例IIIは、通信アダプタが、設備から新しい稼働情報を得ず、キャッシュ（Tf）をそのまま返す場合です。通信アダプタと設備の間の通信に着目すると、次の2つの場合が考えられます。\n1. 設備が電源断などで、通信アダプタと設備の間に、TCPコネクションを確立できない場合。\n2. 設備が、新しい稼働情報がないことを示す、Not Modified（304）を応答した場合（If-Modified-Sinceの条件に一致しない）。\n\n【補足】\n図6の例IIIでは、通信アダプタと設備の間の部分が、「設問のため省略」と、灰色になっています。この省略された部分に、何が入るかを考える設問です。1の場合は、TCPコネクションが確立できず、2の場合は、確立できても、新しい情報がない、という違いです。"}, "y1-2-8": {"a": "設備がNot Modifiedを応答した場合", "e": "【考え方】\n2つ目は、設備がNot Modified（304）を応答した場合です。1つ目（TCPコネクションを確立できない場合）と、順番が入れ替わっても構いません。"}, "y1-2-9": {"a": "電源断などで設備との通信ができない場合の稼働情報が古くなる。", "e": "【考え方】\n例Iは、通信アダプタが、設備に1分間隔でGETして、稼働情報を更新する通信（④'）です。この周期を長くすると（2分間隔など）、通信アダプタのキャッシュを更新する回数が減ります。\n・通常のときは、設備が稼働していれば、周期が長くなっても、新しい情報を取得できる。\n・設備が電源断などで、通信できないときは、それまでの稼働情報（古い情報）がキャッシュに残ったままになる。\n周期が長いほど、HTTPクライアント（新業務サーバ、PC）が受け取る稼働情報が、古くなる影響が大きくなります。\n\n【補足】\n周期を短くすれば、新しい情報が得られますが、通信量と設備への負荷が増えます。1分間隔は、鮮度と負荷のバランスをとった値です。"}, "y1-3-1": {"a": "通信アダプタ", "e": "【考え方】\n本文に、「その際FWの設定を変更しなくてもよいように、HTTPとCoAPの変換機能は、図5中の［か］に実装することにした」とあります。FWを通る区間（K社データセンタ〜顧客）は、これまでどおり、HTTPのままにしておく必要があります。そうすると、CoAPに変換するのは、顧客側の、設備の近くにある機器です。それは、通信アダプタです。通信アダプタと設備の間を、ZigBeeとCoAPにします。\n\n【補足】\n通信アダプタは、設備のHTTPアクセス（無線LAN）を、受け持つ機器です。次世代設備では、通信インタフェースがZigBee、通信プロトコルがCoAPなので、変換する場所として、自然です。"}, "y1-3-2": {"a": "IPヘッダとUDPヘッダ", "e": "【考え方】\nCoAPは、UDP上で動作するプロトコルです（本文）。したがって、IEEE 802.15.4フレームのデータ部は、次のように入れ子になります。\n・IPヘッダ\n・UDPヘッダ\n・CoAPメッセージ（図7）\n設問は、「図7のCoAPメッセージ以外に」含まれるデータを聞いているので、IPヘッダとUDPヘッダが答えです。\n\n【補足】\nIPA講評で、設問3(2)は、TCP/IPの基本に関する、正答率が比較的低い問題でした。「CoAPがUDPの上で動く」ことと、「UDPはIPの上で動く」ことを、積み重ねて考えます。ZigBeeのフレームのデータ部は、イーサネットよりずっと短いので、CoAPのヘッダ（4バイト）は、短く作られています。"}, "y1-3-3": {"a": "TCPコネクションの確立と終了の手順が不要である。", "e": "【考え方】\nTATは、リクエストを送ってからレスポンスを受け取るまでの時間です。HTTP（TCP）をCoAP（UDP）に置き換えると、TATが短くなる理由は、次の2つです。\n・UDPは、コネクションレスなので、TCPのような、コネクションの確立（3ウェイハンドシェイク）と終了の手順が不要である。\n・CoAPのヘッダは4バイトと短く、データの格納効率が良い。\n\n【補足】\nIPA講評は、設問3は、固有の知識は求めず、通信プロトコルの基本知識だけで解ける問題だとしています。TCPでは、1回の通信ごとに、SYN、SYN/ACK、ACKの往復と、FINによる終了の手順が必要です。この往復分が、UDPでは省けます。"}, "y1-3-4": {"a": "CoAPはヘッダ長が短いなど、データの格納効率が良い。", "e": "【考え方】\n2つ目は、CoAPのヘッダが短く、データの格納効率が良いことです。1つ目と2つ目は、順番が入れ替わっても構いません。解答は、30字以内でまとめます。"}, "y1-4-1": {"a": "LB", "e": "【考え方】\n本文に、次のことが書かれています。\n・LB利用の有無を考慮し、新業務サーバと中継装置は、別のVLANに収容する。\n・図5の②の通信（保守センタのPC→新業務サーバ）は、LBを経由させて、2台の新業務サーバに負荷分散させる。\nLBで負荷分散するサーバは、LBを経由する必要があります。そのため、新業務サーバのデフォルトゲートウェイは、LBです（Webサーバや業務サーバと同じ設計）。中継装置は、FWを経由して外（顧客）に出るので、デフォルトゲートウェイはFWです。\n\n【補足】\nデフォルトゲートウェイを、LBにしておくと、戻りのパケットも、LBを通ります。LBが、振り分けたセッションの戻りも見えるようにするための、設計です。"}, "y1-4-2": {"a": "内部L2SW-0に、L2SW-20とL2SW-30を接続する。内部L2SW-1に、L2SW-21とL2SW-31を接続する。", "e": "【考え方】\n図8のブレードサーバには、内部L2SW-0と内部L2SW-1があります。図2の、L2SWが3組（10/11、20/21、30/31）のうち、新業務サーバと中継装置を収容するのは、LBとFWに関するセグメントです。公式の解答例の図では、次の接続になっています。\n・内部L2SW-0 ← L2SW-20 と L2SW-30\n・内部L2SW-1 ← L2SW-21 と L2SW-31\nつまり、内部L2SWごとに、L2SW-20/21の1台と、L2SW-30/31の1台に接続します。\n\n【補足】\n図8のとおり、ブレードの2つの物理NICは、別々の内部L2SWにつながっています。内部L2SW-0が故障しても、内部L2SW-1経由で、通信を続けられます。内部L2SWは、2つのセグメント（20/21と30/31）の両方につなぐので、新業務サーバ（LBの内側）のセグメントと、中継装置（FWとLBの間）のセグメントを、別のVLANとして、1つのブレードサーバに収容できます。"}, "y1-4-3": {"a": "30", "e": "【考え方】\n表1の項番1は、稼働情報の収集対象の設備数（108,000台）、項番6は、新サービス開始時の収集周期（3,600秒）です。\n・1周期（3,600秒）で、108,000台すべてに、1回ずつアクセスする。\n・④の通信の起動タイミングは、平準化されている（時間内に均等に分散）。\n・毎秒のトランザクション数 ＝ 108,000 ÷ 3,600 ＝ 30。\n\n【補足】\n将来、収集周期が5分（300秒）になると、108,000 ÷ 300 ＝ 360 トランザクション/秒で、12倍です（本文の「この値は、将来、収集周期が5分になると、12倍に増加する」）。"}, "y1-4-4": {"a": "72", "e": "【考え方】\n1トランザクションは、1コネクションで処理されます。各コネクションの保持時間は、表1の項番3〜5から、次のとおりです。\n・成功（80%）：トランザクションの通信時間 3秒。\n・失敗（20%）：TCPの無通信タイムアウト時間 Tout 秒（設備の電源断などで応答がなく、タイムアウトまで待つ）。\n平均の保持時間 ＝ 0.8 × 3 ＋ 0.2 × Tout ＝ 2.4 ＋ 0.2 × Tout（秒）。\n同時コネクション数 ＝ 毎秒の発生数 × 保持時間\n＝ 30 × (2.4 ＋ 0.2 × Tout) ＝ 72 ＋ 6 × Tout。\nしたがって、イ は 72 です。\n\n【補足】\n「同時に存在する数 ＝ 到着率 × 滞在時間」という、リトルの法則の応用です。到着率が毎秒30、滞在時間が、平均 (2.4 ＋ 0.2×Tout) 秒です。"}, "y1-4-5": {"a": "6", "e": "【考え方】\nウは、Toutの係数です。30 × 0.2 ＝ 6 です。結果は、72 ＋ 6 × Tout で、イが72、ウが6です。\n\n【補足】\nこの式から、Toutの値が、同時コネクション数に与える影響が大きいことが分かります。例えば、Tout＝60秒なら、72 ＋ 360 ＝ 432 コネクションです。Toutを短くするほど、同時コネクション数が減ります（設問(4)の設定方針）。"}, "y1-4-6": {"a": "正常な通信に支障がない範囲でなるべく小さくする。", "e": "【考え方】\n同時コネクション数を減らすには、コネクションの保持時間を短くします。保持時間は、2.4 ＋ 0.2 × Tout なので、中継装置のTout（TCPの無通信タイムアウト時間）を小さくすると、設備に接続できないときの待ち時間が短くなり、同時コネクション数が減ります。\nただし、Toutを短くしすぎると、応答が遅いだけの、正常な通信まで、切断してしまいます。そのため、設定方針は、「正常な通信に支障がない範囲で、なるべく小さくする」ことです。\n\n【補足】\nIPA講評は、「本設問では、通常の“TCPコネクション維持によるWebアクセスの応答時間改善”ではなく、“TCPコネクション解放によるファイアウォールの論理資源節約”という、いわば逆の要件になっていることに注意してほしい」としています。普通は、コネクションを長く保って、速くしますが、この問題は、FWの同時コネクション数を減らす、逆の方向の要件です。"}, "y1-4-7": {"a": "後続がないリクエストに付与し、コネクションを切断する。", "e": "【考え方】\nクローズ接続オプション（Connection: close）は、HTTP/1.1で、「このリクエストへの応答を返したら、コネクションを切断する」と指示するものです。\nトランザクションを、パイプライン化（1つのコネクションで、続けて、複数のリクエストを送る）する場合を考えます。\n・途中のリクエストにcloseを付けると、そこでコネクションが切れてしまい、後続のリクエストが送れなくなる。\n・最後のリクエスト（後続がないリクエスト）にだけ付ければ、全部のリクエストを処理した後に、コネクションを切断できる。\nしたがって、「後続がないリクエストに付与し、コネクションを切断する」が答えです。\n\n【補足】\nIPA講評で、設問4(5)は、HTTPに関する、理解不足の解答がやや目立った問題です。HTTP/1.1は、標準では、コネクションを維持（持続的接続）します。この問題では、FWの論理資源を節約したいので、不要になったコネクションを、早く切断する工夫が必要です。"}, "y1-4-8": {"a": "通信アダプタにFQDNを付与し、同一コネクションを使って複数の設備から稼働情報を取得する。", "e": "【考え方】\n本文に、設備へのアクセスは、「http://（設備を指定するためのFQDN）/（リソース名）」の形式で指定するとあります。パイプライン化は、同じサーバ（同じFQDN）に対して、同じコネクションで、続けてリクエストを送る工夫です。\n・設備ごとに別のFQDNを付けると、FQDNごとに、別のコネクションが必要になる。\n・通信アダプタ1台に対して1つのFQDNを付け、リソース名（パス）で、接続されている設備（1〜100台）を区別する。\nこうすると、同じコネクションで、複数の設備の稼働情報を取得できます（パイプライン化できる）。同時コネクション数が減ります。\n\n【補足】\n「設計方針」の要点は、URLのホスト部（FQDN）を、設備単位ではなく、通信アダプタ単位にすることです。IPA講評は、「設備のリソースを指定する際のURLに関する設計方針」の設問で、理解不足の解答がやや目立った、としています。"}, "y2-1-1": {"a": "3", "e": "【考え方】\n図2のNAT444の構成を、左から順に見ます。\n1. 顧客宅のPC：プライベートIPアドレス。\n2. CPEとCGN装置の間（ISP網内）：シェアードアドレス（100.64.0.0/10）。\n3. CGN装置から先（インターネット）：グローバルIPアドレス。\nつまり、3種類のネットワークアドレスで運用されます。各ネットワークの境界（CPEとCGN装置）で、NATを2回行うので、「444」（IPv4、IPv4、IPv4の3つ）と呼ばれます。\n\n【補足】\n通常のNAT（NAT44）は、プライベートとグローバルの2種類（4と4）です。NAT444は、真ん中に、シェアードアドレスの層が増えます。これで、1つのグローバルIPアドレスを、複数の顧客で共有できます。"}, "y2-1-2": {"a": "16", "e": "【考え方】\nTCP/UDPのポート番号は、16ビットです（0〜65,535）。CGNでは、1つのグローバルIPアドレスの、ポート番号を、複数の顧客に分配します。したがって、1顧客が使えるポート数は、少なくなります。\n\n【補足】\n本文に、「1顧客に割り当てるポート数を10,000に設定したとすると、グローバルIPアドレスを約1/6に削減できる」とあります。これは、65,536 ÷ 10,000 ≒ 6.5 なので、1つのグローバルIPアドレスを、約6顧客で共有できる、という計算です。"}, "y2-1-3": {"a": "アクティブ", "e": "【考え方】\nFTPには、2つのモードがあります。\n・アクティブモード：データ用のTCPコネクションを、サーバからクライアントに向けて確立する。クライアントが指定したポートに、サーバが接続しに行く。\n・パッシブモード：データ用のTCPコネクションを、クライアントからサーバに向けて確立する。\n本文は、「インターネット上のサーバからクライアントが指定したポートに対してTCPコネクションの確立を試みる」とあるので、アクティブモードです。NATが介在すると、外から内への新しいコネクションは、変換テーブルに登録がなく、届きません。\n\n【補足】\nIPA講評で、cは、正答率が低かった問題です。「FTPのモード」は、知識問題ですが、本文の説明から、「サーバからクライアントへ」の向きに注目して、導くこともできます。"}, "y2-1-4": {"a": "D", "e": "【考え方】\nIPv4アドレスのクラスは、先頭のビットで分かれます。\n・クラスA：0.0.0.0〜127.255.255.255\n・クラスB：128.0.0.0〜191.255.255.255\n・クラスC：192.0.0.0〜223.255.255.255\n・クラスD：224.0.0.0〜239.255.255.255（マルチキャスト）\n・クラスE：240.0.0.0〜（予約）\nマルチキャストIPアドレスは、クラスDです。本文の 224.1.1.1 なども、この範囲です。"}, "y2-1-5": {"a": "マルチキャストMACアドレス", "e": "【考え方】\nマルチキャストIPアドレスから、対応するマルチキャストMACアドレスが生成されます。\n・MACアドレスは、01-00-5e で始まる（上位25ビット固定）。\n・下位23ビットに、マルチキャストIPアドレスの下位23ビットをコピーする。\n例えば、224.1.1.1 は、01-00-5e-01-01-01 になります（図5のフレームの宛先MACアドレス）。PCのNICは、このマルチキャストMACアドレス宛てのフレームを受信するように動作します。\n\n【補足】\nIPアドレスは、32ビットのうち、上位4ビットが固定で、下位28ビットがグループIDです。そのうち、MACアドレスにコピーされるのは、23ビット分だけです。そのため、複数のIPマルチキャストアドレスが、同じMACアドレスに対応することがあります。"}, "y2-2-1": {"a": "PCのネットワークアドレスと、CPEとCGN装置間のネットワークアドレスが重なったとき", "e": "【考え方】\nNAT444では、CPEとCGN装置の間は、シェアードアドレス（100.64.0.0/10）です。ここで、シェアードアドレスではなく、プライベートIPアドレスを用いたとします。\n・顧客宅のPCのネットワークも、プライベートIPアドレスを使っている。\n・そのため、顧客宅内のネットワークアドレスと、CPEとCGN装置の間のネットワークアドレスが、重なる（同じ範囲になる）ことがある。\n重なると、CPEは、宛先のアドレスが、顧客宅内のものか、CGN装置側のものかを、区別できません。その結果、インターネットにアクセスできなくなります。\n\n【補足】\nIPA講評で、設問2は、(2)に比べて(1)の正答率が低く、設問の趣旨が適切に理解されていない解答が散見されました。「シェアードアドレス（100.64.0.0/10）」は、顧客宅内で使われるプライベートアドレス（10.x、172.16.x、192.168.x）と重ならない範囲として、専用に定義されたものです。"}, "y2-2-2": {"a": "送信元IPアドレス", "e": "【考え方】\nNAT444では、複数の顧客が、1つのグローバルIPアドレスを共有します。WebサーバのログでPCを特定するには、次の3つが必要です。\n1. 送信元IPアドレス：CGN装置のグローバルIPアドレス。\n2. 送信元ポート番号：CGN装置が変換した後のポート番号。\n3. アクセス時刻：そのポート番号が、どの顧客に割り当てられていたかを、時刻で特定する。\nWebサーバからは、CGN装置の外側のアドレスとポートしか見えないので、CGN装置側の変換ログ（時刻つき）と突き合わせて、顧客を特定します。\n\n【補足】\nCGN装置では、ポート番号が、顧客の間で使い回されます。そのため、同じ「アドレス＋ポート」でも、時刻が違えば、別の顧客です。アクセス時刻が、特定に欠かせません。"}, "y2-2-3": {"a": "送信元ポート番号", "e": "【考え方】\n2つ目は、送信元ポート番号です。CGN装置が変換した後の送信元ポート番号が分からないと、どの顧客か、特定できません。3つは、順番が入れ替わっても構いません。"}, "y2-2-4": {"a": "アクセス時刻", "e": "【考え方】\n3つ目は、アクセス時刻です。CGN装置では、ポート番号が使い回されるので、時刻が分からないと、同じポート番号を使った顧客のうち、どれかを特定できません。"}, "y2-3-1": {"a": "IPヘッダが認証対象なので、IPアドレスが書き換えられると認証データが計算値と一致しなくなるから", "e": "【考え方】\nIPsecのAH（Authentication Header）は、パケットの認証を行います。認証の対象を見ます。\n・AHは、IPヘッダ（変化しない部分）を含めて、パケット全体を認証の対象にする。\n・NAT機器が、送信元IPアドレスなどを書き換えると、IPヘッダの内容が変わる。\n・受信側で計算した認証データが、パケットに付いている認証データと一致せず、認証エラーになる。\n「認証対象」に着目して、「IPヘッダが認証対象なので、IPアドレスが書き換えられると、認証データが計算値と一致しなくなる」と書きます。\n\n【補足】\nIPA講評は、設問3は、正答率が高く、この問題が、受験者に広く理解されていることがうかがえた、としています。ESPは、認証の対象に、IPヘッダを含まないので、IPアドレスだけの変換なら、認証エラーにならないことが、本文の表1に書かれています。"}, "y2-3-2": {"a": "TCP又はUDPヘッダが暗号化の対象であり、ポート番号が暗号化されていて分からないから", "e": "【考え方】\nNAPTがポート変換を行うには、TCP/UDPヘッダのポート番号を、書き換える必要があります。ESPの場合は、\n・ESPは、TCP/UDPヘッダを暗号化する。したがって、NAT機器からは、ポート番号が見えず、変換できない。\n・ESPヘッダ自体には、ポート番号がない。\nそのため、トランスポートモードでも、トンネルモードでも、ポート変換が行えません。\n\n【補足】\n解答の要点は、「ポート番号が暗号化されている」か、「ESPヘッダにポート番号が存在しない」のどちらかです。このため、ESPは、そのままでは、NAPTを通れません。この問題を解決するのが、IPsec NATトラバーサル（ESPをUDPでカプセル化し、新しくUDPヘッダを付ける）です。"}, "y2-3-3": {"a": "送信元ポート番号が500と4500以外のISAKMPメッセージも受信できるようにする。", "e": "【考え方】\nIPsec NATトラバーサルでは、次の流れになります。\n1. IKEが、経路上にNAT機器が存在するかを検査する。\n2. NAT機器を検出すると、ISAKMPメッセージの送信元ポート番号と宛先ポート番号を、500から4500に変更する。\n3. NATが行われると、送信元ポート番号が、NAT機器によって、別の値に変換される。\n受信側のIPsec機器の、受信パケットのフィルタリングが、「送信元ポート番号が500か4500」だけを許可していると、変換後のポート番号のパケットが、拒否されてしまいます。そのため、送信元ポート番号が、500と4500以外のISAKMPメッセージも、受信できるように、フィルタリング設定を変更します。\n\n【補足】\n通常のIKEは、送信元・宛先ともUDP 500番を使います。フィルタリングも、これに合わせて、設定されています。NAPTで、送信元ポートが変わっても、通せるようにする、という変更です。"}, "y2-4-1": {"a": "マルチキャストMACアドレスが送信元アドレスになることがないから", "e": "【考え方】\nL2SWは、フレームを受信したとき、その「送信元MACアドレス」を、MACアドレステーブルに学習（登録）します。宛先MACアドレスが、テーブルにあれば、そのポートだけに転送し、なければ、全ポートにフラッディングします。\nマルチキャストMACアドレスは、宛先アドレスとしてしか使われず、送信元になりません。したがって、テーブルに学習されず、エントリがないので、全ポートにフラッディングされます。\n\n【補足】\nIPA講評は、設問4(1)(2)は、正答率が低かった問題だとしています。「マルチキャスト通信では、宛先は、IPアドレスとMACアドレスともマルチキャストのアドレスになるが、送信元は、必ず、ユニキャストのアドレスになること、及び、スイッチによるMACアドレスの学習は、送信元のMACアドレスを基に行われることを忘れないでほしい」とあります。"}, "y2-4-2": {"a": "ビデオサーバは、マルチキャストパケットを送信する側だから", "e": "【考え方】\nIGMPは、PC（受信者）が、マルチキャストグループへの参加や離脱を、ルータに知らせるプロトコルです。図5のIGMPのメッセージは、PC（PC1〜PC3）から、ルータ1に向けて送られています。\nビデオサーバは、マルチキャストパケットを送信する側で、グループに参加して、受信する立場ではありません。したがって、ビデオサーバとルータ2の間では、IGMPは使われません。\n\n【補足】\n送信側は、宛先に、マルチキャストアドレスを指定して、送るだけです。受信者がいるかどうかは、ルータ間のIPマルチキャストルーティングプロトコルと、受信者側のIGMPで、管理されます。"}, "y2-4-3": {"a": "01-00-5e-01-01-01", "e": "【考え方】\n表2は、IGMPスヌーピングを動かしたときの、L2SWのMACアドレステーブルです。アには、マルチキャストグループ 224.1.1.1 に対応する、マルチキャストMACアドレスが入ります。\n・マルチキャストMACアドレスは、01-00-5e ＋ IPアドレスの下位23ビット。\n・224.1.1.1 の下位は 1.1.1 なので、01-00-5e-01-01-01。\n図5の①と②（IGMP join）のフレームの宛先MACアドレスが、これです。\n\n【補足】\n③のIGMP leave（224.0.0.2、全ルータ宛）の宛先MACアドレスは、01-00-5e-00-00-02 です。これは、表2のエントリには登録されません。"}, "y2-4-4": {"a": "p1", "e": "【考え方】\nIGMPスヌーピングを動かしたL2SWは、IGMP join / leave から、指定されたマルチキャストグループが存在するポートを知り、MACアドレステーブルに、マルチキャストエントリを作成します。表2は、PC1、PC2、PC3が、まだグループに参加していない状態から、①〜③を順に受信して作られます。\n・①を受信：PC1（p1）からのIGMP join。マルチキャストMACアドレス 01-00-5e-01-01-01 に、p1 を登録 → p1。\n\n【補足】\n表2には、同じMACアドレス（マルチキャストMACアドレス）が、複数のポートに存在することがあります。通常のMACアドレスは、1つのポートにしか存在しませんが、マルチキャストMACアドレスは例外です（本文）。"}, "y2-4-5": {"a": "p1、p3", "e": "【考え方】\n②を受信：PC3（p3）からのIGMP join。同じグループ（01-00-5e-01-01-01）のエントリに、p3 を追加。ポートIDは、p1 と p3 になります。"}, "y2-4-6": {"a": "p3", "e": "【考え方】\n③を受信：PC1（p1）からのIGMP leave。PC1が、グループから離脱するので、p1 をエントリから削除します。残るのは、p3 だけです。\n\n【補足】\nIGMPスヌーピングによって、マルチキャストフレームは、グループに属するPCがいるポートだけに、転送されます。PC2（p2）は、グループに参加していないので、フレームが届きません。①→②→③の順に、エントリが「p1」→「p1、p3」→「p3」と遷移します。"}, "y2-5-1": {"a": "224のVXLANセグメントが構成できるから", "e": "【考え方】\nVLANとVXLANの、識別子の大きさを比べます。\n・VLAN（IEEE 802.1Q）：VLAN IDは12ビット。4,094個まで（本文）。\n・VXLAN：VNI（VXLANネットワーク識別子）は24ビット。2^24（約1,677万）個。\nVXLANでは、VNIごとにVXLANセグメントが構成されるので、VLAN数の制限（4,094）が緩和されます。\n\n【補足】\n解答の要点は、「224のVXLANセグメントが構成できる」、又は「膨大な数の論理セグメントが構成できる」です。VLAN IDが不足する問題（顧客の増加に伴ってVLAN数が足りなくなる）は、この、識別子のビット数の違いで解決します。"}, "y2-5-2": {"a": "宛先となるVMの存在場所が不明だから", "e": "【考え方】\n図8の(i)〜(ii)の流れです。\n・(i)：VM2が、VM3のMACアドレスを取得するために、ARP要求（ブロードキャスト）を送る。\n・(ii)：ARP要求を受けたVTEP1が、VXLANでカプセル化して、送る。\nこのとき、VM3が、どの物理サーバ（どのVTEP）にいるのか、まだ分かりません。宛先のVTEPが不明なので、ユニキャストでは送れず、同じVNI（5002）のVXLANセグメントに属するVT
