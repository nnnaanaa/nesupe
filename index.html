"e": "送信元IPアドレスを標的のアドレスに偽装して問合せを送り、DNSサーバから標的へ応答（増幅された大きな応答）を送らせる攻撃が、DNSリフレクタ攻撃です。"}, "c1-1-5": {"a": "ペネトレーション", "e": "実際に侵入を試みて、脆弱性を確かめるテストが、ペネトレーションテストです。"}, "c1-2-1": {"a": "踏み台", "e": "オープンリゾルバは、誰からの再帰的な問合せにも応答するDNSサーバで、DNSリフレクタ攻撃の踏み台にされます。自分が攻撃の踏み台にならないよう、再帰問合せを受け付ける範囲を制限します。"}, "c1-2-2": {"a": "断片化されたエコーパケットを許可しない機能", "e": "大きなサイズのICMPパケットは、MTUを超えるため断片化（フラグメント）されます。断片化された大きなエコー応答を大量に送りつける攻撃を防ぐため、FWで断片化されたICMPエコーパケットを通さない（許可しない）機能が必要です。"}, "c1-3-1": {"a": "DNSキャッシュが改ざんされる。", "e": "DMZのDNSサーバでキャッシュ機能を有効にしていると、キャッシュポイズニング攻撃で、偽の情報をキャッシュさせられるおそれがあります。そのためDMZの外部向けDNSは、キャッシュ機能を無効にして使います。"}, "c1-3-2": {"a": "DMZの空欄：DNS-S（外部向けのセカンダリ。内部のDNS-Pからゾーン転送を受ける）\n内部セグメントの空欄：DNS-C（PCからの問合せを受けるキャッシュDNS）と、DNS-S（内部向けのセカンダリ）\n矢印：DNS-P→DMZのDNS-S（ゾーン転送）、DNS-C→DMZのDNS-S（DNS問合せ）", "e": "公式解答例の図に基づきます。PCからの問合せは、内部セグメントのキャッシュDNS（DNS-C）が受け、DNS-Cが内部のDNS-S、DMZのDNS-S、インターネットへ問い合わせます。プライマリDNS-Pには問合せが来ないようにし、ゾーン転送の宛先は、自行内のセカンダリ（内部のDNS-SとDMZのDNS-S）に限ります。"}, "c1-3-3": {"a": "内部から外部への通信に対する遮断ルールを設定する。\nFWで遮断した通信の結果ログを監視する。", "e": "外部からの不正アクセスだけでなく、内部から外部への通信（マルウェアの通信など）も、不要な通信は遮断するルールを設定して防ぎます。また、遮断された通信のログを監視することで、内部の不審な動き（感染の兆候）を早期に見つけられます。"}, "c1-4-1": {"a": "ネットワークの切断", "e": "セキュリティ担当者の対応の「(3)」は、被害の拡大を防ぐためにネットワークの切断（感染機器の隔離）を行う作業です。(2)対処方法の確認のあと、原因を調べる(4)の前に行います。"}, "c1-4-2": {"a": "対処結果の評価を行い、インシデントの対処方法を見直す。", "e": "PDCAサイクルのとおり、対処結果を評価して、手順（対処方法）を見直すことで、将来のインシデントへの対応力を高めます（採点講評でも、PDCAに従った改善手法の重要性が述べられています）。"}, "r1-1-1": {"a": "HELLO", "e": "SSLのハンドシェイクは、ClientHello／ServerHelloのHELLOメッセージで、暗号化アルゴリズムなどを決めるところから始まります。採点講評では、アとイの正答率が低かったとされています。"}, "r1-1-2": {"a": "127.255.255.254", "e": "127.0.0.0/8がループバックアドレスの範囲で、127.255.255.255はブロードキャストアドレスにあたるので、利用できる最大は127.255.255.254です。"}, "r1-1-3": {"a": "FQDN", "e": "hostsファイルに「127.0.1.10 shisankanri.example.com」と書くので、ループバックアドレスは資産管理サーバのFQDN（完全修飾ドメイン名）に対応付けます。"}, "r1-1-4": {"a": "第三者認証局", "e": "サーバ証明書が、信頼できる第三者認証局（CA）から発行されていることを、PC側で検証します。"}, "r1-2-1": {"a": "外部からの不正利用が発生しない。", "e": "ループバックアドレスは自分自身（PC）の中でしか使えないので、外部のホストからはJavaアプレットが待ち受けるポートにアクセスできません。社内のプライベートアドレスを使うと、そのアドレスで外部から接続される可能性が残ります。"}, "r1-2-2": {"a": "サーバ側のポート番号が変化する。", "e": "ポートフォワード方式は、待受けポートと転送先ポートの対応（ポートマッピングテーブル）をあらかじめ決めて転送します。FTPのデータ転送のように、サーバ側のポート番号が通信の途中で変化するアプリケーションは、対応表で転送できないので使えません。"}, "r1-2-3": {"a": "IPアドレス：127.0.1.10\nポート番号：6310\nTCPコネクション：\n・Javaアプレット と SSL-VPN装置 間\n・SSL-VPN装置 と 資産管理サーバ 間", "e": "資産管理サーバ（AP1）宛は、図2のポートマッピングテーブルより待受けポートは6310、IPアドレスは本文で資産管理サーバに対応付けた127.0.1.10です。TCPコネクションは、PCのJavaアプレットとSSL-VPN装置の間（SSLトンネル）、SSL-VPN装置と資産管理サーバの間の2本に分かれます。"}, "r1-2-4": {"a": "SSLセッション確立による負荷を、軽減させるため。", "e": "SSLセッションのキャッシュ時間を延ばすと、利用が増えても、毎回ハンドシェイクを行ってSSLセッションを確立し直す必要が減り、SSL-VPN装置の負荷を軽減できます。"}, "r1-3-1": {"a": "202.y.63.10", "e": "表1の1行目は外部LAN→DMZの宛先ポート53（DNS）なので、宛先はDNSサーバの202.y.63.10です。"}, "r1-3-2": {"a": "443", "e": "B社のPCから、グローバルIPアドレス202.y.63.11のSSL-VPN装置へは、HTTPS（SSL）のポート443です。"}, "r1-3-3": {"a": "202.y.63.11", "e": "DMZ→内部LANは、SSL-VPN装置（202.y.63.11）から、資産管理サーバ（AP1）、テスト環境サーバ（AP2、AP3）への通信です。送信元は3つとも、SSL-VPN装置のアドレスです。"}, "r1-3-4": {"a": "202.y.63.11", "e": "AP2用（宛先10.10.10.2のポート23）の送信元も、SSL-VPN装置の202.y.63.11です。"}, "r1-3-5": {"a": "202.y.63.11", "e": "AP3用（宛先10.10.10.2のポート13000）の送信元も、SSL-VPN装置の202.y.63.11です。"}, "r1-4-1": {"a": "クライアント証明書の有効期限", "e": "クライアント証明書を管理する運用担当者が自動で通知を受ける情報は、証明書の有効期限です。期限切れ前に更新や失効の対応を行えます。"}, "r1-4-2": {"a": "ログイン時：ウイルス対策ソフトの定義ファイルの適用状態を確認する機能\nログアウト時：PCからリモート接続時のキャッシュ情報や履歴情報を削除する機能", "e": "B社のPCからのウイルス感染や情報漏えいを防ぐ要件を満たすための、Javaアプレットの機能です。ログイン時は、PCのウイルス対策ソフトの定義ファイルが最新かを確認し、ログアウト時は、リモート接続中のキャッシュや履歴をPCに残さないよう削除します。採点講評では、設問4は全体として正答率が低かったとされています。"}, "d1-1-1": {"a": "リレーエージェント", "e": "DHCPサーバと異なるセグメントの端末に割り当てるには、ルータでDHCPリレーエージェントを動作させ、端末のブロードキャストをDHCPサーバへユニキャストで中継します。"}, "d1-1-2": {"a": "ARP", "e": "ルータやWebサーバのARPテーブルから、IPアドレスとMACアドレスの対応を調べます。"}, "d1-1-3": {"a": "製造者", "e": "MACアドレスの上位24ビットのOUIは、NICの製造者（ベンダ）に固有の値です。"}, "d1-1-4": {"a": "ミラー", "e": "トラフィックモニタには、通信のコピーを受け取るミラーポート（ポートミラーリング）を設定して接続します。"}, "d1-1-5": {"a": "DHCPDISCOVER", "e": "端末が最初にDHCPサーバを探すために、ブロードキャストで送るメッセージがDHCPDISCOVERです。"}, "d1-2-1": {"a": "5", "e": "IEEE 802.11aは5GHz帯の電波を使います（802.11b/gは2.4GHz帯）。"}, "d1-2-2": {"a": "IPアドレスの重複割当て", "e": "情報管理課の許可なく割り当てたIPアドレスが、他のPCのIPアドレスと重複し、他のPCの通信に障害が出ました。"}, "d1-2-3": {"a": "PCを接続すべきポート", "e": "公式解答例は「PCを接続すべきポート」です。BBルータは、インターネット側（WAN）に接続するポートと、PCなどを接続するLAN側のポートを持ちます。本文では、BBルータのうちSWに接続したポートが、本来、PCを接続すべきポートだったため、そのポート経由でSWにDHCPサーバ（BBルータ内蔵）が接続された状態になり、商品本部のPCに不正なIPアドレスが割り当てられました。採点講評では、一般的なBBルータの構成の知識があれば導けるが、この設問の正答率は低かったとされています。"}, "d1-3-1": {"a": "b：24\nc：6", "e": "MACアドレスは48ビットで、上位24ビットがOUI（製造者を示す）、下位24ビットが製造者が付ける番号です。cは、DHCPの正規のやり取り（DISCOVER・OFFER・REQUEST・ACK）が4メッセージですが、折り返し転送された結果、重複して送受信され、6メッセージになったことを示します。"}, "d1-3-2": {"a": "固定IPアドレスの割当て：MACアドレスに対応付けたIPアドレスを割り当てる。\n暫定運用中の対処：MACアドレスが未登録でもIPアドレスを割り当てる。", "e": "固定IPアドレスが必要な端末には、MACアドレスとIPアドレスを対応付けて登録し、その端末には常に同じIPアドレスを割り当てます。暫定運用中は、端末登録システムに登録が完了していない端末でも、通信できるように、MACアドレスが未登録でもIPアドレスを割り当てる運用を認めます。"}, "d1-3-3": {"a": "SW1とSW2の間でのブロードキャストフレームの折り返し", "e": "本文のとおり、SW1とSW2が、自SWに接続していない端末向けのDHCPのブロードキャストフレームを受信すると、折り返して転送する不具合があり、SW5の増設で表面化しました。"}, "d1-3-4": {"a": "SW単位にVLANを設定し、VLAN間経路制御とDHCPリレーを行う構成", "e": "L2SWの代わりにL3SWを使い、スイッチごとにVLAN（ブロードキャストドメイン）を分けて、VLAN間の通信はL3SWで経路制御し、DHCPはリレーします。1つのVLANの障害（ブロードキャストの折り返しなど）を他のVLANに波及させません。採点講評では、SWに複数のVLANを設定してタグVLANで結ぶ構成は、1つのVLANがブロードキャストで飽和するとスイッチ間リンクも飽和するので、不適切とされています。"}, "v1-1-1": {"a": "タグ", "e": "IEEE 802.1QのVLANタグは、32ビット（TPID 16ビット＋TCI 16ビット）で、TCIの中にVID（VLAN ID）が入ります。"}, "v1-1-2": {"a": "12", "e": "VID（VLAN ID）は12ビットなので、4,096通り（実際に使えるのは4,094個）に限られます。採点講評では、この設問の正答率が低かったとされています。数だけでなく、12ビットという理由まで理解しておく必要があります。"}, "v1-1-3": {"a": "帯域", "e": "リンクアグリゲーションは、複数のリンクを1本の論理リンクとして扱うので、リンクの冗長化に加えて、帯域の有効活用ができます。"}, "v1-1-4": {"a": "ルータ", "e": "VRFは、1台のルータ（L3SW）の中に、独立した経路表を持つ仮想ルータを複数動かす機能です。"}, "v1-1-5": {"a": "スタック", "e": "複数の筐体を接続して1台のスイッチとして動かす機能は、スタック（スタッキング）です。複数の筐体を1つのIPアドレスで管理できます。"}, "v1-2-1": {"a": "MACアドレス", "e": "イーサネットフレームのDA（宛先アドレス）とSA（送信元アドレス）は、MACアドレスです。"}, "v1-2-2": {"a": "フレーム①：DA＝SV2、SA＝SV1\nフレーム②：DA＝SV2、SA＝SV1\nフレーム③：DA＝SV2、SA＝SV1", "e": "図2のとおり、同一セグメント上の異なるフロアにある顧客αのサーバ間通信です。顧客のVLANタグ付けやNW基盤側でのタグの追加（カプセル化）があっても、内側のイーサネットフレームのDA・SAは変わらず、DA＝SV2、SA＝SV1のままです（L3SWがL2SWとしても動作するので、MACアドレスの書き換えは起きません）。採点講評では、(2)(3)の正答率が低く、L3SWがL2SWとしても動作することを理解しておくこととされています。"}, "v1-2-3": {"a": "TPID と TCI（外側のVLANタグを、この2つのフィールドに分割して記入する）", "e": "公式解答例の図では、フレーム③は「DA｜SA｜TPID｜TCI｜TPID｜…」の順です。網掛け部分（DAとSAの後ろ）に、外側のVLANタグであるTPIDとTCIの2つのフィールドが入ります。IEEE 802.1ad（QinQ）のカプセル化で、顧客のVLANタグ（内側のTPID・TCI）の前に、NW基盤が外側のタグを付けます。"}, "v1-2-4": {"a": "・別々の顧客で使用しているVLAN IDが重複する。\n・VLAN数に制限があるが、これを超える。", "e": "物理的に共用するNWで、顧客ごとにVLAN IDを管理してきた場合、顧客間でVLAN IDが重複して衝突します。また、VLAN IDは12ビット（4,094個）までなので、顧客が増えるとVLAN数の制限を超えます。そこで、IEEE 802.1Qトンネリング（QinQ）で顧客のVLANを外側のタグでカプセル化します。"}, "v1-3-1": {"a": "L3SWにFW（稼働系）とFW（待機系）の2台、L2SWを3台つなぐ（3台のうち、太線で追加された2台は、NW基盤の冗長構成のL2SW）", "e": "公式解答例の図に基づきます。2台のFW（稼働系・待機系）がL3SWにつながり、L3SWの下にL2SWが3台つながります。図3は、監視システム上のマップで、冗長化された機器を並べて表現するための図です。この設問は作図なので、文章で説明しています。"}, "v1-3-2": {"a": "・STPを動作させ、ブロックポートを設ける。\n・リンクアグリゲーションで、単一のリンクとして扱う。", "e": "顧客システムのL2SWから2本のケーブルをNW基盤の別々のL2SWの筐体に接続すると、ループが発生するおそれがあります。対応方法は2つあり、STPを動作させて片方をブロックポートにする方法と、リンクアグリゲーションで2本を単一の論理リンクとして扱う方法です（スタックで筐体が単一のスイッチとして動作する場合に可能）。"}, "v1-3-3": {"a": "複数の独立したFW機能を、1台のFW装置で稼働させる機能", "e": "仮想FW（バーチャルFW）です。顧客システムごとに独立したFW機能を、1台のFW装置の中に複数作って稼働させるので、それぞれが独立した環境を維持できます。"}, "k1-1-1": {"a": "暗号化", "e": "TLSの三つの機能は、盗聴を防ぐ「暗号化」、改ざんを見つける「改ざん検知」、通信相手を確かめる「認証」です。"}, "k1-1-2": {"a": "検知", "e": "改ざんそのものは防げないので、メッセージ認証コード（MAC）などで改ざんされたことを「検知」します。"}, "k1-1-3": {"a": "認証", "e": "サーバ証明書（必要ならクライアント証明書）で、通信相手が正しい相手かを「認証」します。"}, "k1-1-4": {"a": "TCP", "e": "工場内の機器はクライアントとして、X社のサーバに向けてTCPコネクションを確立します（インターネット側から工場へは確立しません）。"}, "k1-1-5": {"a": "X社が運用・保守を行う機器からX社FWの方向に確立されるTCPコネクションだけを許可する。", "e": "図1の「通信装置内のFW」は、工場側からX社への通信だけを通せば足ります。コネクションの確立要求は工場からX社の方向にだけ行われるので、逆方向（外部から工場）の新規接続を拒否すれば、外部からの侵入を防げます。"}, "k1-1-6": {"a": "クライアント証明書を配布してクライアント認証を行う。", "e": "「なりすまし」対策です。サーバ証明書だけだと、X社側がデバイスやエッジサーバの正当性を確かめられません。TLSのクライアント認証（クライアント証明書）を使えば、証明書を持つ機器だけを接続させられます。"}, "k1-2-1": {"a": "TCPの送信処理中に、デバイスの電源断などでTCPコネクションが開放された場合", "e": "QoS 0は、MQTT層で送達確認をしません。TCPの再送はコネクションが維持されている間しか働かないので、送信の途中でコネクションが切れる（電源断など）と、未送達のPUBLISHは再送されず消失します。"}, "k1-2-2": {"a": "メッセージの重複を防止する。", "e": "図3の注記2のとおり、受信者は処理開始後に受信したPUBLISHを新しいパケットとみなします。PUBRECを返しても、PUBRELが来るまでは処理を始めないことで、PUBRECが届かず送信者がPUBLISHを再送してきた場合でも、同じメッセージを2回処理せずに済みます。"}, "k1-2-3": {"a": "SUBSCRIBE", "e": "デバイスが、設定情報を受け取るために、あらかじめ交換サーバに購読要求（SUBSCRIBE）を送っておきます。購読しておくから、業務サーバが発行したPUBLISHが交換サーバ経由でデバイスに配信されます。"}, "k1-2-4": {"a": "config/Di", "e": "図4の項番1のトピック名です。デバイスごとに異なるので、DiはデバイスのIDになります。"}, "k1-2-5": {"a": "デバイスDi", "e": "交換サーバがデバイスDiに配信している最中に、受信側のデバイスDiの電源が切れた場合の話です。"}, "k1-2-6": {"a": "交換サーバ", "e": "QoS 2では、送信者がPUBLISHを保存して再送に備えます。ここでの送信者は交換サーバなので、デバイスが復帰した後に、交換サーバが保存しておいたPUBLISHを再送します。"}, "k1-2-7": {"a": "業務サーバ", "e": "項番2はデバイス→交換サーバ→業務サーバ／エッジサーバの流れで、QoS 0を使います。受信先の業務サーバとエッジサーバは安定して稼働するので、メッセージが失われにくいと見込めます。"}, "k1-2-8": {"a": "業務サーバ、交換サーバ", "e": "図5の概算では、t1（業務サーバが次のメッセージを送れるようになるまでの時間）を、LANのRTT 20ミリ秒の2倍としています。業務サーバが次の送信に進めるのは、交換サーバからPUBRECが返ってきた時点で、ここが業務サーバと交換サーバの間の区間です。そのため、この区間がLANである前提が成り立つように、業務サーバと交換サーバを同一拠点（X社内）に置く必要があります。交換サーバとデバイスの間（t2）は、WANのRTT 200ミリ秒で見積もっています。"}, "k1-3-1": {"a": "認可", "e": "図6の(a)の宛先は認可サーバです。有効なトークンがなければ、WebAPはブラウザを認可サーバにリダイレクトします。"}, "k1-3-2": {"a": "WebAP", "e": "認可応答（302）のLocationは、認可要求のredirect_uriに指定したWebAPのURIです。ブラウザがそこにリダイレクトされるので、認可コードはWebAPに渡ります。"}, "k1-3-3": {"a": "リフレッシュトークン", "e": "アクセストークンの有効期間が切れていても、リフレッシュトークンが有効なら、利用者の確認なしに新しいアクセストークンを発行できます。図6の(III)の流れです。"}, "k1-3-4": {"a": "認可応答", "e": "認可コードは認可応答（Locationの?code=…）に含まれます。redirect_uriが書き換えられると、認可コードが攻撃者の指定した宛先に渡ってしまいます。"}, "k1-3-5": {"a": "認可", "e": "認可サーバが、認可要求のredirect_uriと、事前に登録されている絶対URIが一致するかを確認します。"}, "k1-3-6": {"a": "10", "e": "アクセストークンは有効期間が10分で、有効期間内のトークンは認可サーバに確認せずに使われます。X社がトークンを変更しても、顧客サーバが古いトークンを持っている間は変更が反映されません。最長で、アクセストークンの有効期間の10分後です（その後はリフレッシュトークンで新しいトークンを取得し、変更が有効になります）。"}, "k1-3-7": {"a": "WebAPのURIを固定にし、絶対URIを事前に通知してもらう。", "e": "redirect_uriの確認は、事前に登録した絶対URIとの一致で行います。そのため、顧客には、WebAPのURIを変えないこと、及びその絶対URIを事前にX社へ通知することを依頼します。"}, "k1-4-1": {"a": "送信元IPアドレスをNATルータ-Pに、宛先IPアドレスをエッジサーバ-Pに、それぞれ変換する。", "e": "顧客サーバは、NATルータ-P’のアドレス（顧客ネットワーク側から見たエッジサーバの代わりのアドレス）に接続します。NATルータは、宛先IPアドレスをエッジサーバ-P（Xシステム側のアドレス）に、送信元IPアドレスを顧客サーバ-P’から、NATルータ-Pに変換します。"}, "k1-4-2": {"a": "顧客サーバ-P’からNATルータ-P’のポート8883番への通信", "e": "顧客サーバはクライアントとして、エッジサーバのMQTTサーバ機能に接続します。MQTTをTLSで使う場合の標準のポートは8883です。顧客FWは、顧客サーバから、NATルータ-P’（エッジサーバに対応するアドレス）の8883番への通信を許可する必要があります。"}, "k1-4-3": {"a": "config/Di、status/Di", "e": "MQTTブリッジで交換サーバと送受信するトピックは、図4で定義した、デバイスに設定情報を送るconfig/Diと、稼働情報を集めるstatus/Diです。Confidential/Diは顧客の内部情報なので、X社には送りません。"}, "k1-4-4": {"a": "1：1静的双方向NATの設定をNATルータに追加する。", "e": "顧客サーバを1台増やすと、その台数分のNATの対応（プライベートアドレスの変換）が必要です。1:1の静的NATなので、追加した顧客サーバ用の変換設定をNATルータに追加します。"}, "k1-4-5": {"a": "通信を許可するルールを通信装置内のFWに追加する。", "e": "追加した顧客サーバから、エッジサーバに対する通信（NATで変換されたアドレス）を通すために、通信装置内のFWにも許可ルールを追加します（①②は順不同）。"}, "k2-1-1": {"a": "スタック", "e": "2台のL2SWをケーブルで接続して、1台のL2SWとして動作させる機能がスタックです。2台の機器を1台に見せることで、機器をまたいだリンクアグリゲーションができます。"}, "k2-1-2": {"a": "ステートフル", "e": "セッション情報（接続状態）を、アクティブからスタンバイに引き継ぐ方式です。切り替わっても既存の通信が継続するので、ステートフルフェールオーバと呼びます。"}, "k2-1-3": {"a": "負荷分散", "e": "クラスタグループごとに、仮想IPアドレスと負荷分散アルゴリズム（ラウンドロビンや最小接続数など）を設定します。"}, "k2-1-4": {"a": "チーミング", "e": "2枚のNICをまとめて使う、サーバ側の機能です。スイッチ側のリンクアグリゲーションに対応する機能です。"}, "k2-2-1": {"a": "顧客ごとに異なるフィルタリングの設定が必要であるから（又は、顧客ごとにルーティングの設定が必要であるから）", "e": "顧客ごとにネットワークの要件（通せる通信の条件や経路）が違います。1台のFWで複数の顧客を収容するには、顧客ごとに独立したフィルタリング設定とルーティングが必要です。それを、仮想FWとして分けて稼働させます。"}, "k2-2-2": {"a": "FWbによるFWaの稼働状態", "e": "冗長構成のFWは、互いの稼働状態（ハートビート）を監視します。"}, "k2-2-3": {"a": "FWaによるL2SWaへの接続ポートのリンク状態", "e": "アクティブのFWは、自分のポートのリンク状態を監視します。リンクがダウンしたら切り替えます。"}, "k2-2-4": {"a": "FWaによるLBaへの接続ポートのリンク状態", "e": "三つのうち、どの三つでも正解です（例：FWbによるFWaの稼働状態、FWaによるFWbの稼働状態、FWaによるL2SWa／LBaへの接続ポートのリンク状態、FWbによるL2SWb／LBbへの接続ポートのリンク状態）。"}, "k2-2-5": {"a": "物理サーバへの接続ポートに、全ての顧客の仮想サーバに設定されたVLAN IDを設定する。", "e": "仮想サーバを別の物理サーバに移動（マイグレーション）しても通信できるように、どの物理サーバへの接続ポートにも、全顧客のVLAN IDを通す設定（タグVLAN）をL2SWc、L2SWdに入れておきます。"}, "k2-3-1": {"a": "OFCのIPアドレス、自OFSのIPアドレス", "e": "OFSは、起動するとOFCとの間でTCPコネクションを確立します。そのために必要な最小限の情報は、接続先のOFCのIPアドレスと、OFS自身（管理用ポート）のIPアドレスです。Fテーブルなどは、その後OFCから設定されます。"}, "k2-4-1": {"a": "フィルタリングルール", "e": "仮想FWは通常のFWとほぼ同じなので、仮想FWごとに、フィルタリングルールを設定します。"}, "k2-4-2": {"a": "仮想FWのVLAN ID", "e": "仮想FWが属するVLANのIDです。"}, "k2-4-3": {"a": "仮想FWのIPアドレス", "e": "仮想FWのIPアドレスです。"}, "k2-4-4": {"a": "顧客のL2SW又はL3SWに接続する、L2SWa及びL2SWbのポート", "e": "ポートVLANは、スイッチのポートごとにVLANを割り当てる方式です。追加した顧客を収容する入口は、顧客のL2SW／L3SWにつながっているL2SWaとL2SWbのポートです。"}, "k2-5-1": {"a": "物理サーバ3の障害によって、3顧客のシステムが同時に停止してしまう。", "e": "図4では、物理サーバ3に、P社のFWp・LBp、Q社のFWq、Z社のLBzが載っています。物理サーバ3が故障すると、3顧客のシステムが同時に停止します。"}, "k2-5-2": {"a": "3顧客向けの仮想サーバを、それぞれ異なった物理サーバに配置する。", "e": "顧客ごとに別の物理サーバに載せれば、1台の障害の影響を1顧客に限定できます。"}, "k2-5-3": {"a": "FWpの内部側ポートとLBpの仮想IPアドレスをもつポートは、同一セグメントであり、物理サーバ3内で処理されるから", "e": "二つのポートは同じセグメント（図4のVLAN）にあり、物理サーバ3の仮想L2SWの中だけで転送されます。パケットはOFSを通らないので、OFSのFエントリは不要です。"}, "k2-5-4": {"a": "Fテーブル名：Fテーブル1\n項番：2", "e": "P社のWebサーバ利用者のパケットは、ルータ→L2SWを経てp1から入力されます。Fテーブル0の項番1でVLAN ID 100をセットし、Fテーブル1で処理されます。宛先MACはFWpのWAN側（mFWpw）なので、表5の項番2に一致して、p13（物理サーバ3）から出力されます。"}, "k2-5-5": {"a": "Fテーブル名：Fテーブル0\n項番：6", "e": "FWp、LBpの処理を終えたパケットは、物理サーバ3からp13を経由してOFSに再入力されます。Fテーブル0で入力ポートがp13なので、項番6に一致し、Fテーブル4の処理に移ります。"}, "k2-5-6": {"a": "Fテーブル名：Fテーブル4\n項番：6", "e": "宛先MACがWebサーバp1（mWSp1）、送信元MACがLBp（mLBp）なので、表8の項番6に一致して、p11（物理サーバ1）から出力され、Webサーバp1に届きます。"}, "k2-5-7": {"a": "OFS1、OFS2", "e": "Fテーブル4は、OFS1とOFS2のどちらにも同じ内容が生成されています。変更も両方のOFSに対して行われます。"}, "k2-5-8": {"a": "項番：7\n変更後のアクション：p12から出力", "e": "Webサーバp4が物理サーバ2に移動すると、宛先がmWSp4のパケットはp11ではなくp12から出力する必要があります。それで、項番7を「p12から出力」に変更します。なお、項番3（ARPのブロードキャスト、VLAN ID 120）は、p11に加えてp12からも出力するように変更されます（設問の「項番3のほかに」の項番が、項番7です）。"}, "w1-1-1": {"a": "i1", "e": "【考え方】\n機械はインターネット側から、C社ISP経由でA社のFWに届きます。機械が宛先にできるのは、外から到達できるグローバルアドレスです。図1で、FWの外部NW側（RT-1側）についているアドレスは i1 です。DMZ側（i2）や、DMZ内の機器のアドレス（i3〜i5）は、プライベートアドレスなので、インターネットから直接は指定できません。\n\n【補足】\n試行環境のWeb-Aは、既に稼働しているので、機械はこのi1に向けてアクセスします。後の設問3(2)で、webtest.asha.example.com が i1 になっているのも、このためです。"}, "w1-1-2": {"a": "NAT", "e": "【考え方】\n本文に「Web-Aを収容しているDMZは、プライベートアドレスが割り当てられている」とあります。外部NWのグローバルアドレス宛のパケットを、プライベートアドレスのLBに届けるには、FWが宛先IPアドレスを書き換える必要があります。宛先アドレスを変換する機能は、NAT（宛先NAT、DNAT）です。\n\n【補足】\nFWの機能としては、フィルタリング（通してよい通信かの判断）とNAT（アドレスの変換）があります。現行FWの両方の機能を新FWに移行する、と本文にもあります。"}, "w1-1-3": {"a": "i3", "e": "【考え方】\nFWが転送する相手は、DMZのLBです。LBは、図1でi3のアドレスをもっています。FWは、宛先のグローバルアドレス（i1）を、LBのアドレス（i3）に書き換えます。LBがさらにWeb-A1（i4）、Web-A2（i5）に振り分けます。\n\n【補足】\n後の表3の⑬⑭で、宛先IPアドレスがi3、⑮⑯でi4になっているのが、この変換の流れです。"}, "w1-1-4": {"a": "Flow-Mod", "e": "【考え方】\n表1のとおり、OFCがOFSの管理テーブルを書き換えるメッセージは、Flow-Modです。LLDPフレーム（イーサネットタイプ88CC）を、OFCに送る設定をOFSに入れます。\n\n【補足】\n表1の3メッセージは、次のように覚えると整理できます。\n・Packet-In：OFS→OFC。「一致するエントリがないパケットが来た」とOFCに知らせる。\n・Packet-Out：OFC→OFS。「このパケットを、このポートから出せ」と指示する。\n・Flow-Mod：OFC→OFS。管理テーブル（エントリ）を追加・変更する。"}, "w1-1-5": {"a": "controller", "e": "【考え方】\nETH_TYPEが88CC（LLDP）のフレームを受けたOFSは、そのフレームをOFCに渡す必要があります。表2のActionで、OFCに転送するのは、Output(controller)です。「controller：Packet-Inメッセージを使いOFCに転送」とあります。\n\n【補足】\nOFCがLLDPフレームを受け取ると、そのフレームに入っている装置名とポートIDから、「どのOFSのどのポートからフレームが出て、どのOFSのどのポートに届いたか」が分かります。これで、OFS同士の接続（トポロジ）を把握します。"}, "w1-1-6": {"a": "Packet-Out", "e": "【考え方】\nOFCが、「OFS1の全ポートから、このLLDPフレームを出せ」と指示するのは、Packet-Outです。LLDPフレームの中に、OFS1の装置名とそのポートIDが入っています。指示を受けたOFS1が、各ポートからフレームを出し、隣のOFS2が受け取ります。OFS2は、一致するエントリ（①で登録）に従って、Packet-InでOFCに転送します。\n\n【補足】\n図3の矢印の向きに注意します。OFCからOFS1へは、Packet-Out（太さの細い線＝OFCとOFS間の通信）、OFS1からOFS2へは、LLDPフレーム（太い線＝OFSに接続された機器間の通信）です。"}, "w1-1-7": {"a": "OFS2", "e": "【考え方】\n③は、OFS2に対して、②と同じ操作をします。OFS2の全ポートからLLDPフレームを出させるので、フレームには、OFS2の装置名とポートIDが入ります。OFS1が受け取ったフレームYには、送信元のOFS2の名前（き）と、フレームを出したポート（く）が入ります。"}, "w1-1-8": {"a": "p9", "e": "【考え方】\n図2で、OFS1のp8は、管理NWのL2SWにつながっています。OFS2のポートのうち、OFS1とつながっているポートがp9です（フレームXには「OFS1・p8」が入っています）。フレームYは、OFS2のp9から出てOFS1のp8に届きます。OFCは、X（OFS1のp8→OFS2）とY（OFS2のp9→OFS1）を合わせて、OFS1のp8とOFS2のp9がつながっていると判断します。\n\n【補足】\nOFS1のp8とOFS2のp9は、図2で、どちらも管理NWのL2SWにつながっています。LLDPフレームは、このL2SWを経由して届きます。"}, "w1-2-1": {"a": "v2", "e": "【考え方】\n⑬は、新FWが、NAT後のパケットをLBに向けて送り出したものです。表3の⑥と比べます。\n・⑥：外部NW側（v1）、宛先MAC=m1（新FW）、送信元MAC=m5（RT-1）、宛先IP=i1。\n・⑬：新FWの出力はDMZ側（i2側）なので、VLANは v2。送信元MACは m1（新FW）、宛先IPはNAT後の i3。\nVLAN IDは、新FWとOFS1の間のトランクポート（p7）で、仮想NWを区別するための識別子です。v1が外部NW、v2がDMZ、v3が内部NWです。"}, "w1-2-2": {"a": "なし", "e": "【考え方】\n⑭は、OFS1からLBに出る直前のパケットです。LBは、p6につながっています。p6は、VLANタグを付けないポート（アクセスポート）なので、OFS1は、タグ（v2）を外して出力します。表5のエントリ2のActionに、Pop-VLANとOutput(p6)があります。\n\n【補足】\n⑬（新FW→OFS1、タグあり）と⑭（OFS1→LB、タグなし）の違いは、トランクポート（p7）とアクセスポート（p6）の違いです。"}, "w1-2-3": {"a": "m2", "e": "【考え方】\n宛先MACアドレスは、L2で直接届ける相手のMACです。⑬⑭の宛先IPは、i3（LB）なので、同じ宛先のLBのMACアドレス m2 になります（LBのMACはARPで調べます。図4の⑦〜⑪のARPシーケンスです）。\n\n【補足】\nIPアドレスが、通信の最終的な宛先を表し、MACアドレスは、次に渡す相手を表します。FWがNATで宛先IPを書き換えたあと、LBに渡すので、宛先MACもLBになります。"}, "w1-2-4": {"a": "m3", "e": "【考え方】\n⑮⑯は、LBが振り分けたあとのパケットです。図4では、Web-A1に振り分けるシーケンスなので、宛先MACアドレスはWeb-A1のMAC m3です。送信元MACは、LBのm2です。\n\n【補足】\nLBは、受け取ったIPパケットの宛先IPアドレス（i3）を、振り分け先（Web-A1のi4）に書き換えて、送り直します。そのため、MACアドレスも、LBが自分のものを送信元、振り分け先のものを宛先にして付け直します。"}, "w1-2-5": {"a": "i4", "e": "【考え方】\nLBは、宛先IPアドレスを自分（i3）から振り分け先のWeb-A1のアドレス i4 に書き換えます（図1と注の記述）。⑮⑯の宛先IPアドレスはi4です。\n\n【補足】\nWeb-A2に振り分ける場合は、i5になります。"}, "w1-2-6": {"a": "②、⑧、⑨、⑩", "e": "【考え方】\n下線(i)は、「ブロードキャスト通信に関する Packet-In を受信したとき、OFCは、構成情報を基に、OFSにPacket-Outで指示する」です。ブロードキャスト通信とは、図4の中では、宛先MACアドレスが FF-FF-FF-FF-FF-FF のARP Requestです。\n①：RT-1からOFS1に届いたARP Request → Packet-In。\n②：OFCがPacket-Outで指示し、外部NWの構成要素のうち、入力ポート以外（p7(v1)）に出力されたARP Request。\n⑦：新FWからOFS1に届いたARP Request → Packet-In。\n⑧⑨⑩：OFCがPacket-Outで指示し、DMZの構成要素（p4、p5、p6）に出力されたARP Request。\nよって答えは ②、⑧、⑨、⑩ です。\n\n【補足】\n④⑫のARP Replyも、OFCがPacket-Outで出力させます。しかし、これらはユニキャストの応答（宛先が決まっている）で、下線(i)の「ブロードキャスト」ではないので、含まれません。①⑦は、OFSからOFCへのPacket-Inです。"}, "w1-2-7": {"a": "ETH_TYPEがARPのイーサネットタイプに等しい。", "e": "【考え方】\n「ARP RequestとARP ReplyをOFCに通知するためのエントリ」は、ARPパケットだけを、OFCにPacket-Inで渡すものです。ARPかどうかは、イーサネットタイプで判別します。表2のMFの中でその役割をもつのは、ETH_TYPEです。\n\n【補足】\nOFCは、ARP RequestとARP Replyの内容（誰がどのMACアドレスをもつか）を知って、ユニキャストのエントリをOFSに登録します。ARPパケットを全部OFCに通知しておくことで、「一致するエントリがなければ入力パケットを破棄する」設定（OFCへの通信集中を避けるため）でも、ARPだけはOFCに届きます。"}, "w1-2-8": {"a": "外部NW内のRT-1と新FWの通信", "e": "【考え方】\n表4のエントリ1：IN_PORT=p1（RT-1側）、タグなし、宛先MAC=m1（新FW）、送信元MAC=m5（RT-1）→ Push-VLAN（v1）、p7から出力。\nエントリ2：IN_PORT=p7、VLAN v1、宛先MAC=m5（RT-1）、送信元MAC=m1（新FW）→ Pop-VLAN、p1から出力。\nつまり、外部NWにある RT-1 と新FW の間の、行きと帰りの通信です。\n\n【補足】\n図4では、Flow-Mod(1) がこのエントリを登録します。この登録後の⑤⑥のSYNは、OFCを経由せずに、OFS1だけで転送されます。"}, "w1-2-9": {"a": "p6", "e": "【考え方】\n表5は、Flow-Mod(2)で登録されるエントリです。エントリ2は「p7、v2、宛先m2（LB）、送信元m1（新FW）」で、新FW→LB（Pop-VLANしてp6へ）です。エントリ1は、その逆向き、LB→新FWの通信です。LBはp6につながっているので、入力ポートは p6 です。"}, "w1-2-10": {"a": "なし", "e": "【考え方】\np6はアクセスポートなので、LBから入ってくるパケットには、VLANタグがありません。タグがない状態は、「VLAN_VID＝なし」と書きます（表4のエントリ1と同じ書き方）。"}, "w1-2-11": {"a": "m1", "e": "【考え方】\nLB→新FWの通信です。宛先は新FW（MAC m1）です。表4のエントリ2では、新FW→RT-1の送信元MAC が m1 になっていることとも合います。"}, "w1-2-12": {"a": "m2", "e": "【考え方】\n送信元は、LB（MAC m2）です。表5のエントリ2（新FW→LB）では、宛先が m2、送信元が m1 ですから、エントリ1は、これと宛先・送信元が入れ替わる関係になります。"}, "w1-2-13": {"a": "Push-VLAN、Set-Field VLAN_VID＝v2、Output(p7)", "e": "【考え方】\nエントリ1は、LBからのタグなしパケットを、新FWへ送る処理です。新FWとOFS1の間のp7は、トランクポートで、DMZのVLAN ID（v2）を付けて出す必要があります。表4のエントリ1（外部NW側）と同じ形で、次の3つのActionになります。\n・Push-VLAN：VLANヘッダを付ける。\n・Set-Field VLAN_VID＝v2：VLAN IDをv2（DMZ）にする。\n・Output(p7)：p7から出力する。\n\n【補足】\nこの記述は、「Actionは、エントリ内に記述された全てのActionを実行する」（表4の注記）ので、3つとも必要です。"}, "w1-3-1": {"a": "CNAME", "e": "【考え方】\n図6では、DNS-Aのゾーンファイルの「weblive IN A i6」を、「weblive IN [つ] webasha.bshacdn.example.net.」に置き換えます。右辺がIPアドレスではなく、別のFQDNなので、別名を定義するリソースレコード、CNAMEです。\n\n【補足】\nCNAMEにすると、weblive.asha.example.com の名前解決が、DNS-B（B社CDN）の管理する webasha.bshacdn.example.net に引き継がれます。DNS-Bが、問合せ元に近いエッジサーバのIPアドレスを、その都度（動的に）答えます。Aレコードで固定のアドレスを書くと、この動的な選択ができません。"}, "w1-3-2": {"a": "webtest.asha.example.com", "e": "【考え方】\na1は、試行モードで、機械（DNSクライアント）がDNSフルリゾルバに問い合わせる通信です（図5）。試行時にWeb-A（FWのi1）に接続するための名前は、図6の凡例に「webtest：試行時のWebサーバのホスト名」とあります。ゾーンファイルの $ORIGIN は asha.example.com. なので、FQDNは webtest.asha.example.com です。\n\n【補足】\nFQDNは、ホスト名だけでなく、末尾のドメイン名まで含めて書きます。$ORIGINの値を補うのがポイントです。"}, "w1-3-3": {"a": "weblive.asha.example.com", "e": "【考え方】\nb1は、本運用モードで、機械が、Web-Bに接続するために名前解決する通信です。凡例に「weblive：本運用時のWebサーバのホスト名」とあるので、FQDNは weblive.asha.example.com です。\n\n【補足】\nこのweblive（図6のDNS-A）のレコードの値が、i6（Web-Bのグローバルアドレス）です。B社CDNを使う場合は、このレコードだけを、CNAMEに置き換えます。"}, "w1-3-4": {"a": "DNSクライアントとDNSフルリゾルバが、ネットワーク上で離れた位置にある場合", "e": "【考え方】\nDNS-Bは、DNSの問合せの送信元IPアドレスから、近いエッジサーバを選びます。ところが、送信元は、機械本人（DNSクライアント）ではなく、機械の代わりに問い合わせるDNSフルリゾルバです（図5のc1）。フルリゾルバが、機械から離れた場所にあると、フルリゾルバに近い（機械からは遠い）エッジサーバが選ばれてしまいます。\nEDNS-Client-Subnet（RFC 7871）を使うと、フルリゾルバが問合せに、DNSクライアントの属するサブネットの情報を付けられます。DNS-Bはそれを使って、クライアントに近いエッジサーバを選べます。\n\n【補足】\n特に、ISPのDNSではなく、遠くのパブリックDNSなどを使うクライアントで効果が出ます。"}, "w1-3-5": {"a": "Web-Bのサーバ処理能力不足", "e": "【考え方】\n下線(v)は、HTTPのGETで、ファームウェアを、国内外の多数の機械に、一斉に更新する場合です。この場合のTAT（Turn Around Time、要求から応答までの時間）悪化の要因は2つです。\n(a) 多数の機械が同時にWeb-Bにアクセスして、Web-Bの処理能力が不足する。→ エッジサーバが、キャッシュしたファームウェアを返すので、Web-Bへのアクセスが減ります。\n(b) 機械とWeb-Bが、地理的・ネットワーク的に遠く、通信の遅延が大きい。→ 近くのエッジサーバが応答するので、遅延が小さくなります。\n\n【補足】\nファームウェアの更新は、同じ内容を多数の機械が取得するので、キャッシュが有効です。POSTなどで内容が毎回異なる通信には、キャッシュの効果は小さくなります。（設問は「GETを使う」場合と限定しています。）"}, "w1-3-6": {"a": "機械とWeb-B間の通信遅延", "e": "【考え方】\n(5)の2つ目は、(a)Web-Bのサーバ処理能力の不足（又は、Webサーバへのアクセス集中）に対して、(b)機械とWeb-B間の通信遅延です。解答欄の1つ目と2つ目は、順番を入れ替えて答えても構いません。"}, "w1-4-1": {"a": "転用後の業務サーバのIPアドレスを、LBの振り分け先に追加しておく。", "e": "【考え方】\n自社設備利用DR案は、「工場のWeb-Aを使って、B社IaaSのWeb-Bを代替する」ものです。Web-Aの性能不足に備えて、重要度の低い業務サーバをWebサーバに転用して、スケールアウトします。LBは、振り分け先の一覧に登録されたサーバにだけ、リクエストを振り分けます。そのため、転用後の業務サーバのIPアドレスを決めて、LBの振り分け先に追加しておきます。\n\n【補足】\nIPアドレスを前もって決めておくのは、LBへの登録、DMZに接続するときの設定（OFCの定義）などの準備を、DRの発動前に済ませるためです。準備作業を「転用後のIPアドレスを決めて」と答えただけでは、何のための準備か不明確です。LBの振り分け先への追加まで書きます。"}, "w1-4-2": {"a": "weblive IN A i6", "e": "【考え方】\n(vii)は、機械の本運用モードのアクセスを、Web-AにDNSで切り替える手順です。置換え前は、図6のDNS-Aのゾーンファイルにある、Web-B（グローバルアドレスi6）を指すAレコードです。\n\n【補足】\nここで B社CDNは適用していないので、「weblive IN CNAME …」ではなく、Aレコードどうしの置換えです。"}, "w1-4-3": {"a": "weblive IN A i1", "e": "【考え方】\n本運用モードのアクセスを、Web-Aに切り替えるので、weblive が指すアドレスを、Web-Aの外部アドレス（FWのi1。試行時にwebtestで使っているのと同じ）にします。\n\n【補足】\nDNS-AのゾーンファイルのTTLは、$TTL 3600（1時間）です。レコードを置き換えても、フルリゾルバのキャッシュが残る間は、古い値が返ります。DRの手順には、TTLの扱い（あらかじめ短くしておくなど）も含めて用意しておくと、切替えが早く完了します。（この点は設問の解答には含まれません。）"}, "w1-4-4": {"a": "転用する業務サーバに関する物理配線の変更が不要になる。", "e": "【考え方】\n現行の工場内LANを使った自社設備利用DR案と比べて、新工場LANは、次の2点で復旧が早くなります。\n(a) 新工場LANは、OFSで仮想NWを構成するので、転用する業務サーバをDMZに接続するのに、物理配線の変更（ケーブルの付け替え）が要らない。\n(b) 構成変更は、OFCの管理ソフトウェアで行えるので、ベンダへの依頼が不要になり、自社の運用要員だけですぐに対応できる。\n\n【補足】\n本文に「新工場LANでは、物理配線の変更なしに、自社要員だけで構成変更ができるようにする」と、NW拡張の目的として書かれています。設問は、この目的が、DRのRTO（目標復旧時間）の短縮にどうつながるかを聞いています。IPA講評は、(b)に気づいてほしかったとしています。"}, "w1-4-5": {"a": "管理ソフトウェアを用いて、社内要員だけで対応できる。", "e": "【考え方】\n(3)の2つ目は、自社要員だけで対応できる（管理ソフトウェアを使って）という点です。1つ目と2つ目は順番が入れ替わっても構いません。"}, "w1-4-6": {"a": "CDN、ISP、IaaS環境の構築と切替えに関する、APIサービスとDNSを使った手順の確立。", "e": "【考え方】\nB社拠点（国外）のDRでは、B社APIサービスで、国外のA社向けIaaS環境にWeb-Bのバックアップを作成します。NWの準備として必要なのは、CDN、ISP、IaaS環境を、構築して切り替えるための手順です。その切替えは、B社APIサービスのHTTPリクエストと、DNSの書き換えで行います。これらを使った手順を確立し、運用マニュアルに書いておきます。\n\n【補足】\nIPA講評によると、準備作業全体ではなく、一部の切替え手順だけを書いた解答が目立ちました。「CDN、ISP、IaaS環境の」「構築と切替え」という全体を、「APIサービスとDNSを使った」手順として答えます。"}, "w1-4-7": {"a": "国外を利用するので、国内の広域災害の影響を回避できる。", "e": "【考え方】\nB社拠点（国内）が長時間使えない事態は、国内の広域災害などで起こります。B社拠点（国外）なら、国内の災害の影響を受けません。自社設備（工場、国内）を使うDR案では、工場も同じ災害の影響を受けるおそれがあります。\n\n【補足】\n(5)は、自社設備利用DR案と比べたときの利点を問うています。IaaSの利用と、運用のアウトソーシングを混同した解答が目立った、と講評にあります。「本文の“内部NW”と“IaaS環境”は、ともに仮想化されたNWで、OFCの管理ソフトウェアとAPIサービスを使って運用する」ことを理解しておく必要があります。"}, "w1-4-8": {"a": "B社CDNなどを使い、通常時と同じ品質を保つことができる。", "e": "【考え方】\n自社設備利用DR案は、工場のWeb-A（試行環境、規模が小さい）を使うので、性能不足に備えた転用が必要です。国外のIaaS環境にバックアップを作ってWeb-Bを使えば、B社CDNなども使って、通常時と同じ品質（性能、通信経路）を保てます。\n\n【補足】\n利点の2つ（国内の広域災害の回避、通常時と同じ品質）は、順番が入れ替わっても構いません。"}, "w2-1-1": {"a": "2.4", "e": "【考え方】\n表1は、IEEE 802.11nと802.11acが使う周波数帯を聞いています。\n・802.11n：2.4GHz帯と5GHz帯の両方に対応（最大600Mビット/秒）。\n・802.11ac：5GHz帯のみ（最大6.93Gビット/秒）。\n空欄aは、802.11nの2つ並んだ周波数帯のうち、小さい方です。\n\n【補足】\n本文に「802.11nにも対応したAP製品を選定すれば、来訪者のNPCにも提供できる」とあります。来訪者の古いNPCは2.4GHz帯（802.11n）しか使えないものがある、という前提です。"}, "w2-1-2": {"a": "5", "e": "【考え方】\nbは、表1の2か所（802.11nの2つ目と、802.11acの唯一の周波数帯）に共通で入ります。802.11nは2.4GHzと5GHz、802.11acは5GHzのみなので、b は 5 です。\n\n【補足】\n5GHz帯は、2.4GHz帯より、使えるチャネル数が多く、電波干渉も少なめです。そのため、チャネルを束ねる（チャネルボンディング）高速化が可能になります。設問3(1)(4)につながります。"}, "w2-1-3": {"a": "any", "e": "【考え方】\n表2は、無線LANのアクセス制御方式の一覧です。\n・SSID（ESSID）：APの識別子で制御する。\n・［c］接続拒否：SSIDが空白又は［c］の接続要求を拒否する。\n・SSID隠蔽（ステルス）：ビーコンにSSIDを含めない。\n・MACアドレスフィルタリング、IEEE 802.1X認証。\n空白又はSSIDとして「any」を指定した接続要求を拒否するのが、「ANY接続拒否」です。\n\n【補足】\n無線LAN端末が「どのAPでもいいので接続したい」とき、SSIDに空白やanyを指定して探します。これを許すと、SSIDを知らない第三者の端末が、APを見つけられてしまいます。"}, "w2-1-4": {"a": "共通", "e": "【考え方】\nWEPで使うRC4は、暗号化と復号に同じ鍵を使う「共通鍵暗号」です。「WEPキーを、1つのAPと複数の無線LAN端末で共有する」という本文の記述からも分かります。\n\n【補足】\n暗号方式の分類は、共通鍵暗号（RC4、AESなど）と公開鍵暗号（RSAなど）です。無線LANのデータ暗号化は、速度の点から、共通鍵暗号を使います。公開鍵暗号は、EAP-TLSなどの認証で使われます。"}, "w2-1-5": {"a": "802.11i", "e": "【考え方】\nWPA2は、IEEE 802.11i（無線LANのセキュリティ規格）に準拠した方式です。暗号化アルゴリズムはAES、暗号化プロトコルはCCMPです。WPAは、802.11iの策定途中に、暫定的に定められた規格（TKIP）でした。\n\n【補足】\nIPA講評で、eの正答率が低かった問題です。「IEEE 802.11i = WPA2」とセットで覚えておきます。"}, "w2-2-1": {"a": "ストリーム", "e": "【考え方】\nRC4は「1バイト単位」で暗号化する暗号です。データを、バイトやビット単位で、連続的に暗号化する方式は、ストリーム暗号です。固定長のブロック単位で暗号化するAESなどは、ブロック暗号です。\n\n【補足】\nWEPでは、WEPキーとIVから「キーストリーム」を作り、それとデータをXORして暗号化します。ストリーム暗号の典型的な仕組みです。"}, "w2-2-2": {"a": "同一", "e": "【考え方】\nWEPを採用しない理由は、2つです。\n・WEPキーが、同一のまま使われ続ける（鍵が更新されない）。\n・暗号化アルゴリズム（RC4）も複雑ではない。\nこのため、短時間で暗号を解読されるおそれがあります。gは、「同一」です。\n\n【補足】\n後で出てくるWPAのTKIPは、「一時鍵が動的に生成され、通信途中で変更される」ことで、WEPより強くなっています。WEPとTKIPの違いは、鍵が固定か、動的かです。"}, "w2-2-3": {"a": "認証サーバ", "e": "【考え方】\nエンタープライズモードでは、IEEE 802.1Xの認証に成功すると、認証サーバ（RADIUSサーバ）で、PMK（Pairwise Master Key）が動的に生成され、クライアントに配布されます。公式の解答例では、hは「認証サーバ」です。\n\n【補足】\nPMKから、一時鍵（PTK）が作られます。実際の無線LANでは、一時鍵を生成するのは、端末とAP（オーセンティケータ）です。設問のhには、公式の解答例どおり、「認証サーバ」と答えます。PMKは、認証が成功するたびに、新しく作られます。パーソナルモードでは、PSKがそのままPMKになります。"}, "w2-2-4": {"a": "MACアドレス", "e": "【考え方】\nTKIPのフェーズ1では、次の3つを混ぜてキーストリーム1を作ります。\n・一時鍵（Temporal Key）\n・IV（初期化ベクタ）の上位部分\n・無線LAN端末のMACアドレス\n端末ごとに異なる値（MACアドレス）が入るので、端末が違えば、鍵も違います。\n\n【補足】\nフェーズ2では、キーストリーム1にIVの拡張部分を混ぜて、暗号鍵を作ります。こうした2段階の鍵混合と、パケットごとの鍵の変更が、WEPより安全な理由です。それでも、TKIPには脆弱性が報告されているので、採用されません。"}, "w2-2-5": {"a": "認証", "e": "【考え方】\nWPA2には、「事前認証」の方法とPMKの保持方法が規定されています。移動先のAPで、あらかじめ（接続前に）認証を済ませる方法が、事前認証です。PMKを保持しておけば、以前接続した（認証済みの）APに戻るとき、PMKを再生成しなくて済みます。この2つで、ハンドオーバ時の認証時間が短くなります。\n\n【補足】\nこの「PMKの保持」は、設問5(5)の理由（WLCがPMKを保持している）につながる、重要な知識です。"}, "w2-2-6": {"a": "カウンタ値cをAESで暗号化した結果と、暗号文ブロックe1をXORする。", "e": "【考え方】\nCCMPのカウンタモードの暗号化は、次のとおりです。\n1) カウンタ値cをAESで暗号化する（暗号鍵を使う）。\n2) その結果と平文ブロックm1をXORして、暗号文ブロックe1を作る。\n復号は、まったく同じ手順です。\n1) カウンタ値cをAESで暗号化する。\n2) その結果と暗号文ブロックe1をXORする。→ m1が得られる。\n\n【補足】\nXORは、同じ値を2回かけると元に戻ります（m1 ⊕ K ⊕ K = m1）。このため、暗号化と復号が同じ手順になります。復号でもAESの「暗号化」を使い、AESの復号は使いません。これが、本文の「復号時もAESが使用される」の意味です。\n\n【正誤表】図2右上の「c＋n」は、「c＋(n−1)」に訂正されています（n番目のブロックは、cからn−1回増やしたカウンタ値）。"}, "w2-3-1": {"a": "80", "e": "【考え方】\n本文に「8チャネルボンディング（160MHz）なら、アンテナ1本当たり最大約867Mビット/秒」とあります。\n・160MHz（8チャネル）：約867Mビット/秒 ／ アンテナ1本。\n・80MHz（4チャネル）：その半分の約433Mビット/秒 ／ アンテナ1本。\n検討中のAP製品は、4チャネルボンディング（80MHz）まで行えます。したがって、867Mビット/秒を得るには、80MHzで、アンテナ（ストリーム）2本が必要です。\n\n【補足】\n「最低限必要な」ということは、必要条件を最小にすることです。周波数帯域幅を広げれば、アンテナ本数を減らせます（160MHzなら1本）。製品が80MHzまでなので、帯域幅は80MHz、本数は2本が答えです。"}, "w2-3-2": {"a": "2", "e": "【考え方】\n80MHzで、アンテナ1本あたり約433Mビット/秒なので、867Mビット/秒には、2本（ストリーム）が必要です（433M×2＝866M）。\n\n【補足】\n製品は、アンテナ3本を搭載しています。3本使えば433M×3＝約1.3Gビット/秒になります。本文は、1Gビット/秒以上の速度が出るので、同時接続を10台に制限すれば、1台あたり100Mビット/秒以上を確保できる、という計算です。"}, "w2-3-3": {"a": "WLCに通信の負荷が集中するのを抑制することができる。", "e": "【考え方】\n下線③は、「認証後の無線LAN端末の通信は、WLCを経由しない」という方式です（WLCは分散処理方式で、暗号化と復号をAPに任せます）。WLCを経由する方式（集中処理方式）と比べた利点は、次の2つです。\n・全ての通信がWLCを通らないので、WLCに通信の負荷が集中しない。\n・認証後にWLCに障害が起きても、その端末の通信は止まらず、継続できる。\n\n【補足】\nWLCを経由する方式では、WLCが性能のボトルネックになり、WLCは単一障害点（SPOF）になります。分散処理方式は、その両方の問題を避けられます。（一方、WLC障害時の影響は、設問5(5)のとおりハンドオーバに残ります。）"}, "w2-3-4": {"a": "認証後にWLCに障害が発生しても、その無線LAN端末の通信は継続できる。", "e": "【考え方】\n2つ目の利点は、「認証後にWLCに障害が発生しても、その無線LAN端末の通信は継続できる」という点です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "w2-3-5": {"a": "電波干渉によって、通信障害が発生する。", "e": "【考え方】\n下線④の「外来電波」とは、自社のAP以外から来る電波（他社のAP、電子レンジ、Bluetooth機器など）です。同じ周波数帯を使う電波があると、互いに干渉して、通信が不安定になったり、速度が落ちたり、つながらなくなったりします。このため、「電波干渉によって、通信障害が発生する」と答えます。\n\n【補足】\n電波干渉の対策は、他の電波と重ならない周波数帯（チャネル）を選ぶことです。設置前に電波の状態を測定するのは、このためです。"}, "w2-3-6": {"a": "4", "e": "【考え方】\n80MHz（4チャネルを束ねた）幅の周波数帯を、セルが重なるAPどうしで、重複しないように割り当てます。図3は、営業部フロアに、APを2段×複数列で、格子状に並べた配置です。上下・左右（斜めも）で隣り合うAPのセルが重なるので、隣接する4台が全て違う周波数帯になる、2×2の組合せを繰り返す必要があります。このため、少なくとも4グループが必要です。\n\n【補足】\n実務の知識ですが、日本の5GHz帯は、20MHz幅のチャネルが19個あります（W52、W53、W56）。80MHz（4チャネル）で束ねると、約4グループ取れるので、4グループなら実現できます。グループ数を増やすのは、チャネルが足りなくなるので、難しい設計です。"}, "w2-3-7": {"a": "ハンドオーバをスムーズに行わせるため（又は、APの負荷分散を行わせるため）", "e": "【考え方】\nAPのセルを重ねる目的は、2つ考えられます。\n・端末が移動してAPを乗り換える（ハンドオーバ）ときに、電波の切れ目がなく、スムーズに切り替わる。\n・1つのセルに端末が集中したときに、重なった別のAPに接続させて、負荷を分散できる。\nどちらか一方を答えれば正解です。\n\n【補足】\nセルを重ねない（離す）配置にすると、電波が届かない場所が生まれ、ハンドオーバのときに通信が途切れます。重ねすぎると、同じ周波数帯の電波干渉が増えます。設問(4)のグループ分けは、この干渉を避けるためのものです。"}, "w2-3-8": {"a": "PoE＋", "e": "【考え方】\nPoE（Power over Ethernet）は、LANケーブルで電力を供給する仕組みです。規格は2つあります。\n・IEEE 802.3af：PoE。最大約15.4W（機器側で約12.95W）。\n・IEEE 802.3at：PoE＋（PoEプラス）。最大約30W。\n本文に、「選定したAP製品の消費電力は最大18Wなので、802.3afでは供給電力が不足する」とあります。そこで、802.3at対応のL2SWを導入します。\n\n【補足】\nIPA講評では、(5)の正答率が低い問題でした。「PoE＋」と答えます。呼称は、技術者どうしの会話で使うので、知っておくとよい知識です。"}, "w2-3-9": {"a": "216", "e": "【考え方】\n必要な供給電力は、AP1台の最大消費電力×台数です。\n・AP1台：最大18W。\n・AP台数：営業部オフィスエリアに8台、接客エリアに4台、合計12台。\n・18W×12台＝216W。\n12台のAPを、1台のL2SW（PoE対応）に収容するので、このL2SWは、最小でも216Wの供給電力が必要です。\n\n【補足】\n「最小」と聞かれているので、余裕を見て多めに見積もるのではなく、計算どおりの値を答えます。"}, "w2-4-1": {"a": "CAの自己証明書", "e": "【考え方】\nダウンロードサーバは、RADIUSサーバで作ったクライアント証明書と、「⑥その他にNPCで必要となる情報」を、PKCS#12形式のファイルにまとめて配布します。EAP-TLSで、NPCに必要な情報は、次の3つです。\n・クライアント証明書（既出）。\n・クライアントの秘密鍵（証明書とペアで、認証時に使う）。\n・CA（認証局）の証明書（サーバ証明書を検証するために使う）。\n「その他」として、残りの2つを挙げます。\n\n【補足】\nPKCS#12は、証明書と秘密鍵などを、1つのファイルにまとめて持ち運ぶための形式です。ファイルには、パスワードをかけます。"}, "w2-4-2": {"a": "クライアントの秘密鍵", "e": "【考え方】\n2つ目は、「クライアントの秘密鍵」です（CAの自己証明書と、順番は入れ替わっても構いません）。EAP-TLSでは、NPCが秘密鍵を使って自分を証明し、CA証明書でRADIUSサーバ（サーバ証明書）を検証します。"}, "w2-4-3": {"a": "ダウンロードサーバの認証情報が漏えいすると、来訪者もクライアント証明書などがダウンロードできてしまう。", "e": "【考え方】\n無線LAN経由で、ダウンロードサーバにアクセスさせる方法として、「認証エラー時に、WLCの認証VLAN機能で、特別なVLANをAPに設定し、そこにダウンロードサーバを置く」案を検討しました。クライアント証明書のない端末は、認証に失敗するので、この特別なVLANに接続されます。\n問題は、認証に失敗する端末なら、誰でもこのVLANに接続できることです。つまり、ダウンロードサーバを守る手段が、利用者IDとパスワードだけになります。この認証情報が漏れると、来訪者などの第三者も、クライアント証明書などをダウンロードできてしまいます。\n\n【補足】\n社内の営業員用VLANとは別に、「認証前の端末が、証明書を取りに来るための場所」を無線LAN側に作ると、そこが、社外の人にも届く入口になる、という点がポイントです。IPA講評では、(1)の正答率が低かったとあります。"}, "w2-4-4": {"a": "クライアント証明書の有効期限を切らせた営業員", "e": "【考え方】\n無線LAN導入後、営業部オフィスエリアの有線LANは撤去されます。クライアント証明書の更新は、有効期限の1か月前に、有効な証明書で無線LANに接続して、ダウンロードできます。しかし、有効期限が切れてしまった営業員は、EAP-TLSの認証が通らず、無線LANにつながりません。有線LANも撤去されているので、ダウンロードサーバにアクセスできません。"}, "w2-4-5": {"a": "無線LAN導入後に営業部に配属された営業員", "e": "【考え方】\nもう1つは、無線LAN導入後に営業部に配属された営業員です。ダウンロードサーバの案内（一斉メール）は、導入時に、全営業員宛てに送られます。後から配属された営業員は、この案内を受けていません。クライアント証明書も、まだNPCにありません。したがって、無線LANにつながらず、有線LANもないので、ダウンロードできません。（NPCの紛失、故障による再貸与は、設問の除外条件です。）\n\n【補足】\nどちらも、「証明書を持っていない状態で、ダウンロードサーバに行く手段（有線LAN）がない人」です。2つの答えは、順番が入れ替わっても構いません。本文の最後に、「その営業員には、情シスの担当者が、必要な情報をNPCにインストールして渡す」とある、人たちです。"}, "w2-5-1": {"a": "NPC", "e": "【考え方】\nIEEE 802.1Xの3つの役割です。\n・サプリカント：認証を受ける側の機器。図4では、NPC。\n・オーセンティケータ：認証を仲介し、接続の可否を制御する機器。\n・認証サーバ：認証の可否を判断するサーバ。図4では、RADIUSサーバ。\nNPCは、サプリカントです。"}, "w2-5-2": {"a": "WLC", "e": "【考え方】\n本文に、「WLCで、EAP-TLSを利用するときは、APとWLC間でトンネルが設定され、無線LAN端末とWLC間で、認証情報の交換が行われる」とあります。WLCがRADIUSサーバに問い合わせ、結果を基に、認証の可否を処理します。したがって、オーセンティケータは、APではなく、WLCです。\n\n【補足】\nIPA講評で、正答率が低かった問題です。「認証を受ける側＝NPC、認証を仲介・制御する側（無線LANコントローラ構成では、WLC）」と覚えます。APは、トンネルでWLCにつなぐだけで、認証の判断はしません。"}, "w2-5-3": {"a": "ESSID", "e": "【考え方】\n下線⑨の「WPA2又はWPAのパーソナルモードで無線LANに接続するための情報」とは、来訪者のNPCに設定してもらう情報です。パーソナルモードでは、次の2つが必要です。\n・ESSID：接続先のネットワーク名（本文に、ESSIDごとに、来訪者向けのVLAN200が割り当てられるとあります）。\n・PSK（事前共有鍵、パスフレーズ）：暗号鍵（PMK）を作るための、共通のパスワード。\n\n【補足】\nIPA講評では、(2)は正答率が高かった問題です。エンタープライズモードの、利用者ごとの認証（EAP-TLS）と違い、パーソナルモードは、共通のPSKで認証します。"}, "w2-5-4": {"a": "PSK", "e": "【考え方】\nもう1つの情報は、PSKです（ESSIDと、順番は入れ替わっても構いません）。PSKをNPCに設定すると、来訪者のNPCは、PSKからPMKを作り、AP（WLC）と接続できます。"}, "w2-5-5": {"a": "㋑", "e": "【考え方】\nタグVLANは、1本のリンクで、複数のVLANを通すときに使います（フレームにVLANタグを付けて区別）。\n・㋑（AP―L2SW5）：APが、営業員用のVLAN100と、来訪者用のVLAN200の両方を、1本のケーブルで流します。したがって、タグVLAN（トランク）が必要です。\n・㋒（L2SW5―L3SW）：来訪者のVLAN200は、L3SW側（社内）に流しません。VLAN100だけなので、タグを付ける必要はありません。\n・㋓（L2SW5―ルータ2）：VLAN200だけ。ポートVLANです。\nしたがって、答えは ㋑ です。\n\n【補足】\nIPA公式の解答例は ㋑ です。タグVLAN＝「複数のVLANを1本に束ねるリンク」と考えると、判断できます。"}, "w2-5-6": {"a": "ルータ2への接続ポートだけに、VLAN200のポートVLANを設定する。", "e": "【考え方】\n来訪者のNPCには、VLAN200が割り当てられ、ルータ2のDHCP機能でアドレスが付与されて、インターネットアクセスだけができるようにします。そのためのL2SW5の設定は、次のとおりです。\n・ルータ2に接続するポートだけに、VLAN200のポートVLANを設定する。\nつまり、VLAN200は、AP側のトランクポートと、ルータ2側のポートだけで通し、L3SWへのポートには、VLAN200を設定しません。これで、来訪者のNPCは、社内のサーバ（L3SWの先）には、到達できません。\n\n【補足】\nVLANは、L2のブロードキャストドメインを分ける仕組みです。VLAN200をL3SW側に出さなければ、来訪者のNPCから社内LANは見えません。「だけ」という語が、解答のキーワードです。"}, "w2-5-7": {"a": "ハンドオーバができなくなる。", "e": "【考え方】\nWLCは、本文の機能として、「APの負荷分散制御、PMKの保持などによるハンドオーバ制御機能」をもちます。認証後にWLCが故障すると、現在のAPでの通信は続けられます（認証後の通信はWLCを経由しないため）。しかし、NPCが別のAPに移動（ハンドオーバ）するときの制御ができなくなります。したがって、問題は、「ハンドオーバができなくなる」ことです。"}, "w2-5-8": {"a": "NPCに配布したPMKと認証関連情報がWLCで保持されているから", "e": "【考え方】\nハンドオーバでは、通常、PMKを再利用して、素早く再接続します。この仕組みは、設問2(1)jで答えた「PMKの保持」です。PMKと認証に関連する情報（認証済みの情報）は、WLCが保持しています。WLCが故障すると、これらが使えなくなるので、別のAPに移るときに、必要な情報（PMK）を得られず、ハンドオーバができません。\n\n【補足】\nIPA講評で、(5)の「理由」は正答率が低かった問題です。本文の「WPA2では、PMKの保持方法が規定され、ハンドオーバ時の再生成が不要になった」という記述と、WLCの機能（PMKの保持）を結びつけると、導けます。"}, "w2-5-9": {"a": "AP→L2SW5→L3SW→FW→L2SW1→プロキシサーバ→L2SW1→FW→ルータ1", "e": "【考え方】\n本文の冒頭に、「インターネットアクセスは、本社DMZのプロキシサーバ経由で行われている」とあります。営業員のNPCは、EAP-TLS認証後に、VLAN100に属し、既設の有線LANと同じ作業ができます。そこで、経路を順に追います。\n1) NPC → AP（無線）。\n2) AP → L2SW5（営業部フロアのスイッチ）。\n3) L2SW5 → L3SW（VLAN100）。\n4) L3SW → FW → L2SW1（DMZのスイッチ）。\n5) L2SW1 → プロキシサーバ（要求を中継）。\n6) プロキシサーバ → L2SW1 → FW → ルータ1 → インターネット。\nFWとL2SW1は、行きと戻りで2回通るので、2回書きます。\n\n【補足】\n・WLCは、認証後の通信が経由しないので、経路に入りません。\n・ルータ2は、来訪者用の経路（VLAN200）なので、入りません。\nIPA講評では、この(6)と(2)は、正答率が高かった問題でした。"}, "x1-1-1": {"a": "ip1/29", "e": "【考え方】\n宛先NATの「変換前」は、ブラウザ1（インターネット上）がアクセスする宛先なので、グローバルIPアドレスです。表1で、グローバルIPアドレスの空間は、L2SW1のvlan1（ISP1接続）にある ip1/29 です。\n\n【補足】\n「/29」は、ホスト部が3ビットのアドレス空間（8アドレス）という意味です。WebサーバにはこのうちのIPアドレスが1:1で割り当てられます。"}, "x1-1-2": {"a": "10.0.9.0/24", "e": "【考え方】\n宛先NATの「変換後」は、WebサーバがあるDMZのプライベートIPアドレスです。表1で、DMZ（L2SW9のvlan9）のIPアドレス空間は 10.0.9.0/24 です。\n\n【補足】\nFWは、グローバルIPアドレス（ip1/29内）宛のパケットを、DMZのWebサーバ1・2のプライベートアドレスに、1:1で固定的に変換します（宛先NAT、静的NAT）。"}, "x1-1-3": {"a": "送信元ポート番号", "e": "【考え方】\nブラウザ2（社内）が、インターネットにアクセスするときは、FWが送信元IPアドレスと送信元ポート番号の両方を変換する方式です。これを「NAPT（IPマスカレード）」といいます。複数の社内ホストが、少数のグローバルIPアドレスを共有するために、ポート番号も変換します。\n\n【補足】\nNATは、IPアドレスだけを変換します。NAPTは、IPアドレスとポート番号を変換するので、1つのグローバルIPアドレスを、多数のホストで共用できます。"}, "x1-1-4": {"a": "131,072", "e": "【考え方】\n送信元NAPTでは、変換後の「送信元IPアドレスと送信元ポート番号」の組が、コネクションごとに異なる必要があります。TCPのポート番号は16ビットなので、1つのグローバルIPアドレスあたり 2^16＝65,536 通りです。変換後のIPアドレスは2つなので、同時に処理できるTCPコネクション数の上限は、65,536×2＝131,072 です。\n\n【補足】\n実際にはウェルノウンポート（0〜1023）などは使えませんが、設問は「ここで、2^16＝65,536である」と与えているので、単純な掛け算で答えます。"}, "x1-1-5": {"a": "許可する通信を追加する。", "e": "【考え方】\nWebサーバを3台以上に増やす（スケールアウト）と、FWでは、DNSの設定変更のほかに、次の2つが必要になります。\n・新しいWebサーバとの通信を許可するための、フィルタリング定義（許可する通信）の追加。\n・新しいWebサーバに対する、グローバルIPアドレスとの宛先NATの定義の追加。\n\n【補足】\n本文に、「FWのフィルタリング定義は、図1に示す情報システムの通信だけを許可している」とあります。許可されていない通信は通らないので、新しいサーバ用の許可が要ります。"}, "x1-1-6": {"a": "宛先NATに関する定義を追加する。", "e": "【考え方】\n(3)の2つ目は、新しいWebサーバ用の宛先NAT（グローバルIPアドレス→プライベートIPアドレス）の定義の追加です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "x1-2-1": {"a": "異なるISPから払い出されている。", "e": "【考え方】\n現行のグローバルIPアドレス（ip1/29）は、ISP1から払い出されたものです。追加するグローバルIPアドレス（ip2/29）は、ISP2から払い出されます。違いは、「どのISPのアドレスか」です。\n\n【補足】\nISPのアドレスは、そのISPが経路を広告しているので、ip2宛のパケットは、ISP2経由でA社に届きます。マルチホーミングで、アドレスの異なる2つの入口を作る考え方です。"}, "x1-2-2": {"a": "応答が行きの宛先IPアドレスとは異なる送信元IPアドレスから戻る。", "e": "【考え方】\n例えば、社外のブラウザが、ISP1側のグローバルIPアドレス（ip1）宛にWebサーバへアクセスしたとします。もし戻りのパケットがISP2経由で出ていくと、LBがISP2側のアドレス（ip2）に、送信元を変換して返します。そうすると、ブラウザから見ると、「アクセスした宛先（ip1）とは別のIPアドレス（ip2）から応答が来た」ことになります。TCPは、通信相手のアドレスが異なる応答は、自分のコネクションの応答とは認めないので、通信が成立しません。\n\n【補足】\nIPA講評では、IP層とTCP層の動作を取り違えたり、技術的に不正確だったりする解答が散見されました。「IPアドレス」という語を使って、「行きの宛先IPアドレスと、戻りの送信元IPアドレスが一致しない」ことを簡潔に書きます。"}, "x1-3-1": {"a": "Bindingレスポンス中のデータに含まれるIPアドレスと、自分のIPアドレスを比べる。", "e": "【考え方】\nSTUNサーバは、受け取ったIPパケットのヘッダから、送信元のIPアドレスとポート番号を取り出して、Bindingレスポンスのデータに入れて返します。この送信元アドレスは、STUNサーバから見えたアドレスです。\n・NATがなければ、STUNサーバから見えるアドレスは、クライアント自身のアドレスと同じ。\n・NATがあれば、NATで変換された後のアドレスに変わっている。\nそこで、Bindingレスポンスのデータに入っているIPアドレスを、自分のIPアドレスと比べて、違えばNATがあると判定します。\n\n【補足】\nSTUNは、「自分が外から見てどのアドレス・ポートに見えるか」を教えてもらうプロトコルです。この仕組みで、NAT変換後のアドレス（図4の〈g2〉）を知ります。"}, "x1-3-2": {"a": "〈p〉", "e": "【考え方】\nホールパンチでは、APは自分のIPアドレスの候補を、SDPオブジェクトにまとめて通信相手に渡します。通知するのは、次の2つです。\n・ブラウザ2自身のIPアドレス：〈p〉（プライベートIPアドレス）。\n・STUNサーバから得た、NAT変換後のIPアドレス：〈g2〉（グローバルIPアドレス）。\n通信相手のブラウザ1のAPは、この2つに順に通信を試み、成功した組合せを最適ルートにします。\n\n【補足】\n図4の、ブラウザ1とブラウザ2が、ともにグローバルアドレスで見える場合は、〈p〉は、通信相手には使えない（別のネットワークのプライベートアドレス）ので、〈g2〉で通信が成功します。"}, "x1-3-3": {"a": "〈g2〉", "e": "【考え方】\n2つ目は、NAT変換後のグローバルIPアドレス〈g2〉です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "x1-3-4": {"a": "vlan1", "e": "【考え方】\nSTUNサーバの目的は、「各ISP経由でNAT変換されたとき、どのアドレスになるか」を知ることです。図3でA（STUNサーバ1）は、ISP1につながるL2SW1の側（vlan1）に接続します。こうすると、ISP1経由で届いたアクセスから、ISP1側のNAT後アドレスが分かります。\n\n【補足】\n表2のとおり、vlan1はISP1接続（L2SW1）、vlan2はISP2接続（L2SW2）です。AとBの組合せ（A=vlan1、B=vlan2）は、順番が入れ替わっても構いません。"}, "x1-3-5": {"a": "vlan2", "e": "【考え方】\nB（STUNサーバ2）は、ISP2につながるL2SW2の側（vlan2）に接続します。これで、片方のISPに障害が起きても、もう一方のISP側のSTUNサーバに到達できるので、ホールパンチに必要なアドレスを得られます。"}, "x1-3-6": {"a": "ブラウザ2のAP", "e": "【考え方】\n図5の④（音声、ビデオ、データなどの交換）は、データ量が最も多い通信です。④に使われるISPは、ホールパンチ（①〜③）で決まった最適ルートに従います。最適ルートに含まれるLB側のNAT変換後アドレスは、ブラウザ2のAPが、STUNサーバにアクセスしたとき（①'）に、LBが振り分けたISPで決まります。\n\n【補足】\nブラウザ2は社内、つまりLBの内側にあるので、LBのNATと振分けの影響を受けるのは、ブラウザ2のAPです。ブラウザ1は社外にいるため、A社のLBを通りません。"}, "x1-3-7": {"a": "STUNサーバ", "e": "【考え方】\nオは、ブラウザ2のAPがアクセスする相手で、STUNサーバです。ブラウザ2のAPがSTUNサーバ（STUNサーバ1、2）にアクセスするとき、LBがどのISPに振り分けるかによって、④に使われるISPが決まります。"}, "x1-4-1": {"a": "HTTP", "e": "【考え方】\n図6で、APは最初にHTTPのGETリクエスト（Upgrade: websocket ヘッダ付き）をIP-PBXに送ります。IP-PBXが、101 Switching Protocols を返して、プロトコルを切り替えます。\n\n【補足】\n①-1のようにHTTPで接続を始めて、途中でWebSocketに切り替える（アップグレードする）のは、WebSocketの標準的な手順です。IPA講評は、「Websocketの知識を求めるものではなく、図6やHTTPの一般知識からの推論を期待した」としています。「Upgrade: websocket」「101 Switching Protocols」から答えを推論します。"}, "x1-4-2": {"a": "WebSocket", "e": "【考え方】\n①-1のヘッダ「Upgrade: websocket」で、切替え先のプロトコルが指定されています。したがって、キは WebSocket です。切り替わったWebSocketの上で、SIP（REGISTER、INVITE など）のシグナリングを行います。\n\n【補足】\nWebSocketは、HTTPのコネクションをそのまま使って、双方向の通信ができるようにしたプロトコルです。ブラウザからSIPを使うには、このWebSocket上に載せます。"}, "x1-4-3": {"a": "ISP1とISP2から払い出されたIPアドレスを一つずつ割り当てる。", "e": "【考え方】\nIP-PBXは2組のB2BUA（Back-to-Back User Agent）で動作します。インターネット側のUA（User Agent）は2つあるので、それぞれに別のISPのグローバルIPアドレスを割り当てます。1つ目のUAには、ISP1のアドレス、2つ目のUAには、ISP2のアドレスを割り当てることで、ISP1とISP2の両方から着信できるようにします。\n\n【補足】\nB2BUAは、通話の両側にそれぞれ別のUAとして動作して、中継する仕組みです。IP-PBXが、社外側と社内側を分ける境界（Session Border Controller）として動作することになります。"}, "x1-4-4": {"a": "vlan1", "e": "【考え方】\nIP-PBXのLANインタフェースC、Dは、グローバルIPアドレスをもつインタフェースです。マルチホーミングのため、C は ISP1 側のL2SW1（vlan1）に、D は ISP2 側のL2SW2（vlan2）に接続します。\n\n【補足】\nC、Dの組合せは、順番が入れ替わっても構いません。IP-PBXが、インターネット側（グローバルアドレス）と社内側（プライベートアドレス）の両方につながり、Session Border Controllerとして、IPアドレスを変換します。"}, "x1-4-5": {"a": "vlan2", "e": "【考え方】\nD は ISP2 側のL2SW2（vlan2）に接続します。vlan1とvlan2の両方に接続することで、片方のISPが障害でも、もう一方で通話を続けられます。"}, "x1-4-6": {"a": "IP-PBX", "e": "【考え方】\nLBのDNSラウンドロビン機能で、図6の通信（APとIP-PBX間）をISP1とISP2に分散させます。APは、まず、IP-PBXのFQDNに関するAレコードを問い合わせます。LBは、その問合せに対して、ISP1側のアドレスとISP2側のアドレスを交互に返します。これで、IP-PBXへの接続が、2つのISPに振り分けられます。\n\n【補足】\n(4)のク、ケ、コは、「何の」「どんな」「どこへ」です。クはIP-PBX（のFQDN）、ケは DNS（のAレコード）クエリ、コは LB（DNSサーバ機能）です。"}, "x1-4-7": {"a": "DNS", "e": "【考え方】\nケは、FQDNを問い合わせるクエリの種類で、DNSクエリです。（実際の設計では、AレコードのDNSクエリです。）"}, "x1-4-8": {"a": "LB", "e": "【考え方】\nコは、DNSクエリの送信先です。移行後のDNS機能は、FWからLBに移ります。ISP2を経由してもDNS機能を提供できるようにするためです。したがって、APは、LBにDNSクエリを発行します。"}, "x1-5-1": {"a": "切り戻し", "e": "【考え方】\nサービス停止時間は、切替作業、動作確認、及び、問題が発生したときの「切り戻し」に要する時間の合計です。移行作業で問題が出たときに、元の構成に戻す時間を含めて、停止時間を見積もります。\n\n【補足】\nIPA講評で、(2)(7)(5)(6)は時間切れと思われる誤答が多かった、とあります。切り戻し（ロールバック）の時間を含めるのは、移行計画の基本です。"}, "x1-5-2": {"a": "1", "e": "【考え方】\n(j)の「Webサーバ1とWebサーバ2に関する四つのAレコード」は、同じFQDN（Webサーバ用の1つの名前）に対する4つのIPアドレスです。DNSラウンドロビンで負荷分散するので、FQDNは1つで、IPアドレスが複数になります。"}, "x1-5-3": {"a": "4", "e": "【考え方】\nWebサーバは2台です。現行はISP1のグローバルIPアドレスが2つ（1台1つ）、ISP2用に新たに2つ追加します。2＋2＝4つです。四つのAレコードは、1つのFQDNに対して、この4つのIPアドレスを対応付けます。"}, "x1-5-4": {"a": "IP-PBX、STUNサーバ1、STUNサーバ2", "e": "【考え方】\n(k)の「APが名前解決しなければならないFQDN」は、APが接続する相手のFQDNです。\n・IP-PBX：音声電話で、APがアクセスする（図6）。\n・STUNサーバ1、STUNサーバ2：ビデオ電話で、APがアクセスする（図5の①）。\nAP内の定義は、IPアドレスではなく、FQDNで書きます。そうすると、DNS（LB）が、ISP1、ISP2のアドレスを返すことで負荷分散や障害対応ができます。"}, "x1-5-5": {"a": "FW", "e": "【考え方】\n切替1の対象機器は、LB、L2SW2、ISP2、FWです（図7）。このうち、LB、L2SW2は新規設置なので、元の定義はありません。2通りの定義ファイル（切替前の構成用と切替後の構成用）をもたせて、戻すときに指定して再起動するのは、既存の機器で、定義を書き換えるFW（1-4の「新構成用の機能設定」）です。\n\n【補足】\n定義ファイルを2つ用意すれば、問題が起きたとき、元の定義ファイルを指定して再起動するだけで、すぐに切り戻せます。"}, "x1-5-6": {"a": "社外からWebサーバへのアクセス", "e": "【考え方】\n中間のネットワーク構成（図7）では、施工情報管理とインターネットアクセスが、マルチホーミング運用を開始します。動作の正常性を確認する3種類の通信は、次のとおりです。\n・社外からWebサーバへのアクセス（ブラウザ1→Webサーバ）。\n・社内からWebサーバへのアクセス（ブラウザ2→Webサーバ）。\n・社内からインターネットへのアクセス。\n\n【補足】\nこの3つは、図7の「ネットワークの主な用途」にある、施工情報管理（社外・社内）、インターネットアクセスに対応します。コールセンタ（IP-PBX）は、切替1では変更しないので、確認の対象に入りません。"}, "x1-5-7": {"a": "社内からWebサーバへのアクセス", "e": "【考え方】\n(5)の2つ目は、社内（ブラウザ2など）からWebサーバへのアクセスです。3つは順不同です。"}, "x1-5-8": {"a": "社内からインターネットへのアクセス", "e": "【考え方】\n(5)の3つ目は、社内からインターネットへのアクセスです。ISP1、ISP2への負荷分散と、FWのNAT機能をLBに移したことの確認になります。"}, "x1-5-9": {"a": "ISP2を経由した外向きDNS機能を確認する。", "e": "【考え方】\nドメイン登録業者に依頼する定義変更は、「ISP2経由でもDNS機能を提供できるようにするための、NSレコードなどの追加」です。情報システム部が確認するのは、ISP2を経由して、外から問い合わせても、A社のDNSが正常に応答することです。\n\n【補足】\nこの確認作業は、利用者のサービスに直接の影響がないので、サービス停止時間には含まれません（本文に明記）。"}, "x1-5-10": {"a": "①'、③、④", "e": "【考え方】\n切替2は、STUNサーバとIP-PBXを追加する作業です。FWを通る通信だけが、FWのフィルタリングに関係します。\n・①（ブラウザ1→STUNサーバ）：STUNサーバのインタフェースA、Bは、FWの外側のvlan1、vlan2にあるので、FWを通らない。\n・①'（ブラウザ2→STUNサーバ）：社内からFWを通って、外側のSTUNサーバに出るので、許可が必要。\n・②（SDPオブジェクトの交換）：ブラウザとWebサーバの間のHTTPSで、既存の通信。\n・③（最適ルートの決定）、④（音声、ビデオ、データなどの交換）：社内のブラウザ2が、社外のブラウザ1と通信するので、FWを通る新しい通信。\nしたがって、答えは ①'、③、④ です。\n\n【補足】\nIPA講評で、(7)は正答率が低く、時間切れと思われる誤答が多かった問題です。「FWを通るか、通らないか」を、図3のSTUNサーバの接続位置から1つずつ判断します。"}, "x2-1-1": {"a": "32", "e": "【考え方】\nSPI（Security Parameters Index）は、IPsec通信の各パケットに入る、SAの識別キーです。SPIは32ビットの整数値です。\n\n【補足】\n受信側のIPsecルータは、パケット中のSPIでSAを識別して、暗号化アルゴリズムや鍵などの情報を取り出します。IPA講評で、アとイは踏み込んだ内容で、正答率が低かった問題です。"}, "x2-1-2": {"a": "セレクタ", "e": "【考え方】\nSP（セキュリティポリシ）を選択するキーを、セレクタと呼びます。IPアドレス、プロトコル、ポート番号などの組合せで、「どのパケットに、どんな処理（PROTECT、BYPASS、DISCARD）を施すか」を引きます。\n\n【補足】\nSPデータベースは、経路表に似た構造です。経路表が「宛先アドレスで次の転送先を引く」のに対して、SPデータベースは「セレクタで処理を引く」ものです。"}, "x2-1-3": {"a": "アグレッシブ", "e": "【考え方】\nIKEフェーズ1のモードは、メインモードとアグレッシブモードの2つです。メインモードは3往復、アグレッシブモードは1往復半で、完了します。\n\n【補足】\nアグレッシブモードは、メッセージ数が少なく速い代わりに、識別情報（ID）が暗号化されない、という特徴があります。"}, "x2-1-4": {"a": "経路", "e": "【考え方】\nGREでカプセル化すると、元のパケットの宛先アドレスへの「経路」情報を、インターネットがもたなくても、元のパケットによるエンドツーエンド通信ができます。外側のIPヘッダ（IPヘッダ1）の宛先は、GREトンネルの対向機器（ルータ2）なので、インターネットは、そこまでの経路だけがあればよいからです。\n\n【補足】\n図4では、PCとサーバのアドレスはプライベートアドレスです。インターネットは、これらへの経路をもちませんが、GREトンネルを使えば通信できます。"}, "x2-1-5": {"a": "断片化", "e": "【考え方】\nGREでカプセル化すると、ヘッダが24バイト増えるので、トンネルインタフェースのMTUは、イーサネットインタフェースのMTUより、24バイト小さくなります。このとき、PCとサーバのMTUサイズを適切な値（小さく）にすると、カプセル化後に、MTUを超えるパケットが作られなくなり、パケットの断片化（フラグメンテーション）を防げます。\n\n【補足】\n断片化が起きると、ルータの処理負荷が増え、パケットの1つが失われるだけで元のパケット全体が再送になるため、性能が下がります。"}, "x2-2-1": {"a": "リキー（ReKey）", "e": "【考え方】\nライフタイムは、SAの生存期間です。終了時点では、そのSAは使えなくなるので、新しいSAをIKEで作り直し、暗号鍵を新しくします。この処理を「リキー（ReKey）」といいます。\n\n【補足】\n鍵を一定時間で更新することで、同じ鍵が長く使われ、解読される危険を減らします。IPA講評では、(1)は正答率が高かった問題です。"}, "x2-2-2": {"a": "IPsec通信で送受信されるメッセージが、通信中に改ざんされていないこと", "e": "【考え方】\n表2は、IKEフェーズ2で決まるパラメータです。表2の「認証方式」の説明は、「IPsec通信で使用する認証アルゴリズム」です。これは、IPsec通信（ESPやAH）で、送受信されるデータの完全性（改ざんされていないこと）を確認するものです。\n\n【補足】\nIPA講評は、(2)の正答率が低かったとしています。表1の「認証方式」（IKEフェーズ1）は、「IPsec通信相手機器の認証方式」で、通信相手が正しい相手かを確認します。表2の「認証方式」は、データの完全性の確認です。同じ「認証」という語でも、対象が違う点が出題の核心です。"}, "x2-2-3": {"a": "OSPFのリンクステート情報交換は、IPマルチキャスト通信で行われるから", "e": "【考え方】\n本文に、「IPsecでは、ユニキャストのIPパケットをカプセル化して転送する」とあります。OSPFのリンクステート情報の交換パケットは、マルチキャストアドレス（224.0.0.5など）宛のパケットです。IPsecは、これをカプセル化できないので、IPsecだけではOSPFを動かせません。\n\n【補足】\nGREは、IPブロードキャストもIPマルチキャストも、カプセル化できます。そのため、OSPFのパケットをGREでカプセル化し、そのGREパケットをIPsecで保護する方法（GRE over IPsec）を使います。"}, "x2-3-1": {"a": "1,436", "e": "【考え方】\nイーサネットのMTUは1,500バイトです。図3のGREでカプセル化したパケットは、IPヘッダ1（20）＋GREヘッダ（4）＋元のIPパケットです。元のIPパケットは、IPヘッダ2（20）＋TCP/UDPヘッダ（20）＋データ（あ）です。\n1,500 − 20 − 4 − 20 − 20 ＝ 1,436 バイト。\n\n【補足】\nジャンボフレームを使わないので、MTUは1,500バイトとして計算します。「最大バイト数」は、データ部の最大の長さです。"}, "x2-3-2": {"a": "1,414", "e": "【考え方】\n図5のL2TPでカプセル化したパケットは、IPヘッダ1（20）＋UDPヘッダ（8）＋L2TPヘッダ（16）＋PPPヘッダ（2）＋IPヘッダ2（20）＋TCP/UDPヘッダ（20）＋データ（い）です。\n1,500 − 20 − 8 − 16 − 2 − 20 − 20 ＝ 1,414 バイト。\n\n【補足】\nGRE（1,436）とL2TP（1,414）を比べると、L2TPのほうが22バイト、データを少ししか運べません。設問3(4)の利点につながります。"}, "x2-3-3": {"a": "IPヘッダ1　送信元：α.0.0.1、宛先：β.0.0.1", "e": "【考え方】\nIPヘッダ1は、GREの外側のIPヘッダです。GREトンネルの両端（ルータ1とルータ2）のアドレスで通信します。図4で、ルータ1のインターネット側アドレスが α.0.0.1、ルータ2が β.0.0.1 です。PCからサーバへの通信では、送信元が α.0.0.1、宛先が β.0.0.1 になります。"}, "x2-3-4": {"a": "IPヘッダ2　送信元：192.168.0.100、宛先：192.168.10.1", "e": "【考え方】\nIPヘッダ2は、元のIPパケットのヘッダです。PC（192.168.0.100）からサーバ（192.168.10.1）への通信なので、送信元が 192.168.0.100、宛先が 192.168.10.1 です。"}, "x2-3-5": {"a": "IPヘッダ1", "e": "【考え方】\n図6の①は、PCとPPPoEサーバの間のPPPoEの通信です。ここでPCが取得するIPアドレス（PPPoEで、アクセス回線網から動的に取得するアドレス）は、L2TPトンネルの外側のIPパケット、つまりIPヘッダ1に入ります。\n\n【補足】\nIPA講評で、(3)の正答率が低かった問題です。図6のPPPoEは、アクセス回線網のための接続で、L2TPトンネルの外側です。"}, "x2-3-6": {"a": "IPヘッダ2", "e": "【考え方】\n図6の②は、PCとLNS（VPN装置）の間のPPPセッションです。このPPPセッションで、PCは、イントラネットのアドレス（VPN装置が割り当てる）を取得します。これは、L2TPトンネルの内側の、元のIPパケットのアドレスなので、IPヘッダ2に入ります。\n\n【補足】\nPPPフレームの中のIPヘッダが、PCとサーバの通信（イントラネット内のアドレス）、つまりIPヘッダ2です。図5（L2TPのパケット形式）と、図6の層の対応を、じっくり考えると解けます。"}, "x2-3-7": {"a": "カプセル化によるオーバヘッドがL2TPより小さいので、一つのパケットで転送できるデータ量が多い。", "e": "【考え方】\nGREのカプセル化で増えるヘッダは、20＋4＝24バイト、L2TPは、20＋8＋16＋2＝46バイトです。GREのほうがオーバヘッドが小さいので、同じMTU（1,500バイト）でも、1つのパケットで運べるデータ量が多くなります（設問3(1)の1,436と1,414の差です）。\n\n【補足】\nL2TPは、PPPフレームをカプセル化し、ユーザ認証やアドレス割当ができる機能が豊富です。一方、今回の目的は「OSPFのパケットとサーバ宛のパケットを、トンネルで運ぶ」ことなので、機能よりも効率の良いGREが向いています。"}, "x2-4-1": {"a": "GREでトンネリングが行われるから", "e": "【考え方】\nトンネルモードは、元のIPパケット全体をカプセル化して、新しいIPヘッダを付けるモードです。GRE over IPsecでは、すでにGREでトンネリングされ、GREの外側にIPヘッダ（IPヘッダ1）が付いています。IPsecのトンネルモードで、さらに新しいIPヘッダを付ける必要はありません。トランスポートモード（IPヘッダの後ろだけを保護）で足ります。\n\n【補足】\nトンネルモードを重ねると、ヘッダが20バイト増えるだけで、無駄になります。"}, "x2-4-2": {"a": "ESP認証データ長は、使用する認証アルゴリズムによって変化するから", "e": "【考え方】\nESP認証データは、認証アルゴリズムが出力するデータ（ICV、メッセージ認証コード）です。出力長は、HMAC-SHA-1（96ビットに切り詰め）、HMAC-SHA-256 など、アルゴリズムごとに違います。表2の「認証方式」で選んだアルゴリズムで、長さが決まります。\n\n【補足】\nIPsecのESPトレーラも「不定」です。パディングなどで、暗号化アルゴリズムのブロック長に合わせるためです。"}, "x2-4-3": {"a": "GREヘッダ、IPヘッダ2、TCP/UDPヘッダ、データ、ESPトレーラ", "e": "【考え方】\nESPは、トランスポートモードでは、ESPヘッダの後ろ（ペイロード）から、ESPトレーラまでを暗号化します。図7では、ESPヘッダの後ろ、すなわち、GREヘッダ、IPヘッダ2、TCP/UDPヘッダ、データ、ESPトレーラが、暗号化の対象です。IPヘッダ1とESPヘッダは暗号化されません。ESP認証データも、暗号化の対象外です。\n\n【補足】\nIPヘッダ1とESPヘッダは、ルータが転送や復号に使うので平文です。認証データは、暗号化範囲の後ろに付く認証用の値で、認証の対象が、ESPヘッダからESPトレーラまでです。"}, "x2-5-1": {"a": "172.16.128.0/20、172.16.17.0/24", "e": "【考え方】\n図1から、DMサーバ以外のサーバをデータセンタに移設します。IPアドレスは変更しないので、サブネットごとデータセンタに移動します。\n・DMZ（Webサーバ、中継メールサーバ、プロキシサーバ）：172.16.128.0/20 は、全部移設するので、そのまま移動。\n・社内メールサーバ（172.16.17.1）：DMサーバ（172.16.16.1）と同じ 172.16.16.0/20 にある。DMサーバは本社に残る。社内メールサーバだけ移すには、サブネットを分割する。プレフィックス長は16、20、24のいずれか。DMサーバのアドレス（172.16.16.1）を含まず、社内メールサーバのアドレス（172.16.17.1）を含むのは、172.16.17.0/24。\nしたがって、移動するサブネットは、172.16.128.0/20 と 172.16.17.0/24 です。\n\n【補足】\nサブネットを分けて、データセンタ側に別のサブネットとして置けば、サーバのIPアドレスを変えずに移設できます。"}, "x2-5-2": {"a": "L2SWaとL2SWbを異なるサブネットにする。", "e": "【考え方】\n図9では、IPsecルータとL3SWが、L2SWa、L2SWbの両方に接続されています。L2SWaとL2SWbを同じサブネット（同じブロードキャストドメイン）にすると、IPsecルータとL3SWを経由して、レイヤ2のループができます。L2SWaとL2SWbを、異なるサブネット（VLAN）にすれば、ループができません。\n\n【補足】\nループをSTPで防ぐ方法もありますが、今回はサブネットを分ける設計です。このため、設問(3)の仮想IPアドレスの数が、サブネットの数で決まります。"}, "x2-5-3": {"a": "2", "e": "【考え方】\nVRRPの仮想IPアドレスは、サブネットごとに1つ必要です。本社では、L2SWaとL2SWbが、異なるサブネットになるので、本社のサブネットは2つです。したがって、仮想IPアドレスは最少で2つです。"}, "x2-5-4": {"a": "1", "e": "【考え方】\n営業所は、L2SWが1台だけで、サブネットは1つです。したがって、仮想IPアドレスは最少で1つです。"}, "x2-5-5": {"a": "2", "e": "【考え方】\nデータセンタは、本社と同じく、L2SWaとL2SWbを異なるサブネットにするので、サブネットは2つです。したがって、仮想IPアドレスは最少で2つです。"}, "x2-5-6": {"a": "どのサーバアクセスも、VRRPのマスタルータが稼働する機器に接続されたWAN回線を経由して行われる。", "e": "【考え方】\n名古屋営業所のIPsecルータとL3SWを直接接続する経路が切断されると、営業所のL3SWとIPsecルータは、お互いのOSPFの情報（経路）を交換できなくなります。PCのデフォルトゲートウェイは、VRRPの仮想IPアドレスです。VRRPのマスタルータが稼働する機器（L3SWならL3SWに接続された広域イーサ網側、IPsecルータならインターネットVPN側）は、直接接続されているWAN回線への経路しかもたなくなります。そのため、PCからのどのサーバ（本社、データセンタ）へのアクセスも、VRRPのマスタルータが稼働する機器に接続されたWAN回線だけを経由して行われます。\n\n【補足】\nIPA講評によると、(4)は、機器間の接続が切断されることによる経路テーブルの変化内容を理解できていない解答が、散見された問題です。動的経路制御（OSPF）は、ネットワークの基盤となる技術なので、基本技術は習得しておきます。"}, "x2-5-7": {"a": "インターネットVPN経由のコスト値が最小230であるのに対して、専用線経由のコスト値は200で最も小さい。", "e": "【考え方】\n本社のPCからインターネットへの通信は、データセンタのプロキシサーバ経由で行います（表3の(d)）。本社のPCから、データセンタへの経路のコスト値を比べます。\n・専用線経由：L3SWの専用線ポートのコスト 200。\n・インターネットVPN経由：L3SWとIPsecルータ間のコスト 10＋トンネルインタフェースのコスト 220 ＝ 230（最小）。\nOSPFでは、コストの小さい経路が選ばれるので、専用線経由（200）が最も小さく、インターネットVPN（230）は使われません。\n\n【補足】\n図9のコスト値は、「営業所のPCは、広域イーサ網とインターネットVPNを使い分ける」ように設計されています。本社と営業所では、トンネルのコスト（220）と、広域イーサ網のコスト（50）に差があるので、使われる経路が違います。"}, "x2-5-8": {"a": "広域イーサ網→本社→専用線", "e": "【考え方】\n表3の「名古屋営業所のインターネットVPN接続」に障害があるときの、PCからデータセンタのサーバへの経路です。インターネットVPNが使えないので、広域イーサ網を経由して、本社に出ます。本社から先は、専用線でデータセンタに入ります。\n\n【補足】\nIPA講評によると、(6)の「う」は、インターネットVPNの設定についての本文の記述を見落とした受験者が多くいました。本文に、「インターネットVPNは、データセンタと本社間、及びデータセンタと営業所間で設定する」とあります。営業所と本社の間には、インターネットVPNがないので、本社を経由します。"}, "x2-5-9": {"a": "インターネットVPN→データセンタ→専用線", "e": "【考え方】\n「名古屋営業所の広域イーサ網接続」に障害があるときの、PCから本社のDMサーバへの経路です。広域イーサ網が使えないので、インターネットVPNを経由してデータセンタに入り、データセンタから専用線で本社に入ります。\n\n【補足】\n本社のDMサーバへは、本社と営業所をつなぐ広域イーサ網が、通常の経路ですが、障害時には、営業所→データセンタ（インターネットVPN）→本社（専用線）と迂回します。IPA講評は、(6)の「え」の正答率が低かった問題としています。"}, "y1-1-1": {"a": "送信元IP", "e": "【考え方】\nLBは、宛先の仮想IPアドレスを実IPアドレスに変換して、サーバへのアクセスを振り分けます。Webサーバから業務サーバへのアクセスは、両者が同一セグメント内にあり、デフォルトゲートウェイがLBなので、戻りのパケットも必ずLBを通すようにする必要があります。そのために、宛先アドレスだけでなく、送信元IPアドレスも、LBのアドレスに変換します。\n\n【補足】\n送信元を変換しないと、業務サーバがWebサーバに、同一セグメント内で直接応答してしまいます。Webサーバは、アクセス先（LBの仮想IPアドレス）以外のアドレスから応答が来るため、通信が成立しません。IPA講評は、設問1(1)が、TCP/IPの基本に関する、正答率が比較的低い問題だとしています。"}, "y1-1-2": {"a": "LB正", "e": "【考え方】\nWebサーバから業務サーバへのアクセスは、LBを経由します（Webサーバと業務サーバのデフォルトゲートウェイはLB、アクセスはLBで負荷分散されるため）。通常時のアクティブはLB正（Active-Standby）です。図3の③④⑤⑥の間に入る機器は、LB正です。"}, "y1-1-3": {"a": "①", "e": "【考え方】\n図3の流れは次のとおりです。\n①FW正→LB正（クライアントの要求）、②LB正→Webサーバ（宛先を実IPアドレスに変換）、③Webサーバ→LB正（業務サーバの仮想IPアドレス宛）、④LB正→業務サーバ（送信元をLBに変換）、⑤業務サーバ→LB正、⑥LB正→Webサーバ、⑦Webサーバ→LB正、⑧LB正→FW正（応答）。\n②では、宛先の仮想IPアドレスだけを実IPアドレスに書き換えるので、送信元は元のクライアントのままです。送信元が、②と同じ（クライアントのアドレス）になるのは、①です。\n\n【補足】\n①と②は、宛先が違うだけで、送信元は同じです。"}, "y1-1-4": {"a": "⑥", "e": "【考え方】\n②の宛先IPアドレスは、Webサーバの実IPアドレスです。宛先がWebサーバの実IPアドレスになるのは、⑥（LB正→Webサーバ、業務サーバからの応答を、Webサーバに返す）です。④⑤はWebサーバが宛先ではなく、③⑦はLBが宛先です。\n\n【補足】\n(3)(4)は、各パケットのヘッダ内の送信元・宛先アドレスが、どこで変わるかを、順に追う問題です。IPA講評は、「ヘッダ内のアドレスの変化など、基本事項に関する設問だが、誤答が少なからず見受けられた。落ち着いて取り組み着実に答えるように」としています。"}, "y1-2-1": {"a": "中継装置", "e": "【考え方】\n稼働情報取得案では、次のように動作します。\n・新業務サーバやPC（クライアント）の代わりに、中継装置が設備にアクセスします（クライアント側に近いプロキシ）。これが「フォワードプロキシ」です。\n・通信アダプタは、設備（サーバ）の代わりに、設備への要求を受けます（サーバ側に近いプロキシ）。これが「リバースプロキシ」です。\nしたがって、う は中継装置です。\n\n【補足】\nフォワードプロキシは、内部のクライアントの代理として外部に出ていくプロキシです。リバースプロキシは、外部からのアクセスを受けて、内部のサーバの代理で応答するプロキシです。"}, "y1-2-2": {"a": "通信アダプタ", "e": "【考え方】\nえ は、設備（サーバ）の代理として、中継装置からのGETリクエストに、キャッシュした稼働情報で応答する、通信アダプタです。"}, "y1-2-3": {"a": "リバース", "e": "【考え方】\nお は、通信アダプタの役割で、リバースプロキシです。"}, "y1-2-4": {"a": "稼働情報の収集周期の変更が容易である。", "e": "【考え方】\n稼働情報の取得のトリガ（きっかけ）が、設備ではなく、K社データセンタ側（新業務サーバ）にある方式です。収集周期は、サービス開始時は1時間で、段階的に5分程度に短縮します。トリガがデータセンタ側にあれば、新業務サーバの設定を変えるだけで、周期を変更できます。何万台もの設備の設定を変更する必要がありません。\n\n【補足】\nIPA講評は、設問2(2)(5)(6)は、提示した通信シーケンスなどから直接読み解く必要があるので、受験者の経験によって差が出た、としています。"}, "y1-2-5": {"a": "Tc", "e": "【考え方】\n図6の例IIは、設備から更新情報を取得できた場合です。通信アダプタは、設備にGET（If-Modified-Since: Tb'）を送り、設備が、最新の稼働情報（Last-Modified: Tc）を応答します。通信アダプタは、キャッシュを更新して、更新後の最新稼働情報のタイムスタンプは、Tc になります。\n\n【補足】\nTb ≦ Tb' < Tc の関係なので、Tc が最も新しい時刻です。"}, "y1-2-6": {"a": "中継装置より通信アダプタのキャッシュの更新頻度が高く新しいから", "e": "【考え方】\nTbは、中継装置のキャッシュの最新稼働情報のタイムスタンプ、Tb'は、通信アダプタのキャッシュの最新稼働情報のタイムスタンプです。通信アダプタは、設備に1分間隔で単独で取得する（図5の④'、図6の例I）ので、キャッシュの更新頻度が高く、通常は中継装置のキャッシュより新しい稼働情報をもっています。そのため、Tb ≦ Tb'（多くの場合は、Tb < Tb'）になります。\n\n【補足】\n中継装置のキャッシュは、④のアクセス（収集周期は1時間〜5分）でしか更新されません。通信アダプタは、④' で、1分ごとに更新されます。"}, "y1-2-7": {"a": "設備とTCPコネクションが確立できない場合", "e": "【考え方】\n例IIIは、通信アダプタが、設備に問い合わせなかった（設備から更新情報を取得できなかった）場合です。「設問のため省略」の部分の内容は、通信アダプタと設備の通信に着目して、考えます。\n・設備が電源断などで、通信アダプタと設備の間に、TCPコネクションが確立できない場合。\n・設備がHTTPのNot Modified（304）を応答した場合（更新された情報がない）。\nどちらも、通信アダプタのキャッシュが更新されないので、キャッシュの最新稼働情報（Tf）をそのまま返します。"}, "y1-2-8": {"a": "設備がNot Modifiedを応答した場合", "e": "【考え方】\n2つ目は、設備が、If-Modified-Sinceの条件に対して、新しい稼働情報がないことを示す Not Modified（304）を応答した場合です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "y1-2-9": {"a": "電源断などで設備との通信ができない場合の稼働情報が古くなる。", "e": "【考え方】\n例Iは、通信アダプタが設備に1分間隔で取得する④'の通信です。この周期を長くする（2分間隔など）と、通信アダプタのキャッシュの更新が減ります。電源断などで、設備との通信ができない場合に、HTTPクライアント（新業務サーバやPC）が受け取る稼働情報が、古くなる影響が大きくなります。\n\n【補足】\n周期を短くすると新しい情報が得られますが、通信量は増えます。1分間隔は、鮮度と負荷のバランスを取った値です。"}, "y1-3-1": {"a": "通信アダプタ", "e": "【考え方】\n本文に、「FWの設定を変更しなくてもよいように」とあります。FWの設定を変えずにCoAPを使うには、FWを通る区間（K社データセンタ〜顧客）は、HTTPのまま、顧客側の通信アダプタと設備の間だけ、CoAPにします。そのため、HTTPとCoAPの変換機能は、顧客側にある通信アダプタに実装します。\n\n【補足】\n設備側（ZigBee）の通信は、通信アダプタが受け持つので、変換する場所として自然です。"}, "y1-3-2": {"a": "IPヘッダとUDPヘッダ", "e": "【考え方】\nCoAPはUDP上で動作するプロトコルです。IEEE 802.15.4フレームのデータ部には、CoAPメッセージのほかに、IPヘッダとUDPヘッダが含まれます。\n\n【補足】\nIPA講評で、設問3(2)は、TCP/IPの基本に関する、正答率が比較的低い問題でした。IEEE 802.15.4（ZigBee）のフレームのデータ部は、イーサネットよりずっと短いので、CoAPのメッセージ形式（4バイトのヘッダ）は、これに適したものになっています。"}, "y1-3-3": {"a": "TCPコネクションの確立と終了の手順が不要である。", "e": "【考え方】\nTATの向上に寄与する特長は、次の2つです。\n・UDPには、TCPのようなコネクションの確立（3ウェイハンドシェイク）と終了の手順が不要である。\n・CoAPは、ヘッダ長が短いなど、データの格納効率が良い。\n通信にかかる往復回数やデータ量が減るので、応答までの時間（TAT）が短くなります。"}, "y1-3-4": {"a": "CoAPはヘッダ長が短いなど、データの格納効率が良い。", "e": "【考え方】\n2つ目は、CoAPのヘッダは4バイトと短く、データを効率的に運べることです。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "y1-4-1": {"a": "LB", "e": "【考え方】\n本文に、「LB利用の有無を考慮し、新業務サーバと中継装置は別のVLANに収容する」とあります。図5の②の通信は、LBを経由させて、2台の新業務サーバに負荷分散させます。そのため、新業務サーバのデフォルトゲートウェイは、LBです（Webサーバと業務サーバと同様）。中継装置は、FWを経由して外に出るので、デフォルトゲートウェイはFWです。"}, "y1-4-2": {"a": "内部L2SW-0に、L2SW-20とL2SW-30を接続する。内部L2SW-1に、L2SW-21とL2SW-31を接続する。", "e": "【考え方】\n図8のブレードサーバには、内部L2SW-0と内部L2SW-1の2台があります。図2で、L2SWは、L2SW-10/11（FWの外側）、L2SW-20/21（FWとLBの間）、L2SW-30/31（LBとサーバの間）の3組があり、組ごとにリンクアグリゲーションで1つのセグメントを構成しています。\n図2の2組のL2SW（20/21、30/31）は、それぞれ別のセグメントで、新業務サーバと中継装置は別のVLANに収容します。\n各内部L2SWを、L2SW-20とL2SW-30（内部L2SW-0）、L2SW-21とL2SW-31（内部L2SW-1）の、それぞれ2つに接続します。ブレードの2つの物理NICが別々の内部L2SWにつながる（図8）ので、片方の内部L2SWが故障しても、もう一方の内部L2SW経由で通信を継続できます。内部L2SWは、2つのセグメント（L2SW-20/21とL2SW-30/31）に、それぞれ接続します。\n\n【補足】\nIPA公式の解答例では、内部L2SW-0に、L2SW-20とL2SW-30を、内部L2SW-1に、L2SW-21とL2SW-31を、それぞれ接続した図になっています。"}, "y1-4-3": {"a": "30", "e": "【考え方】\n表1の項番1は、設備数108,000台、項番6は、新サービス開始時の収集周期3,600秒です。収集が平準化されているとすると、1秒あたりのトランザクション数は、108,000 ÷ 3,600 ＝ 30 です。\n\n【補足】\n「平準化されている」とは、収集の開始タイミングが時間内で均等に分散しているという仮定です。"}, "y1-4-4": {"a": "72", "e": "【考え方】\n1トランザクションは1コネクションで処理されます。各コネクションの保持時間は、項番3〜5から、次のとおりです。\n・成功（80%）：トランザクションの通信時間 3秒。\n・失敗（20%）：TCPの無通信タイムアウト時間 Tout 秒。\n平均 ＝ 0.8×3 ＋ 0.2×Tout ＝ 2.4 ＋ 0.2×Tout（秒）。\n同時コネクション数 ＝ 毎秒の発生数 × 保持時間 ＝ 30 × (2.4 ＋ 0.2×Tout) ＝ 72 ＋ 6×Tout。\nしたがって、イ は 72、ウ は 6 です。\n\n【補足】\nリトルの法則（同時に存在する数 ＝ 到着率 × 滞在時間）の応用です。"}, "y1-4-5": {"a": "6", "e": "【考え方】\nウは、30 × 0.2 ＝ 6 です。設問(3)の計算は、(イ＋ウ×Tout) ＝ 72 ＋ 6×Tout です。"}, "y1-4-6": {"a": "正常な通信に支障がない範囲でなるべく小さくする。", "e": "【考え方】\n同時コネクション数を減らすには、コネクションの保持時間を短くします。保持時間は、2.4 ＋ 0.2×Tout です。Tout（TCPの無通信タイムアウト時間）を小さくすれば、設備に接続できない場合に、コネクションを早く解放できます。ただし、短くしすぎると、正常な通信（応答が遅いだけの設備）まで切ってしまいます。そのため、「正常な通信に支障がない範囲で、なるべく小さくする」ことが、設定方針です。\n\n【補足】\nIPA講評は、本設問は、通常の「TCPコネクション維持によるWebアクセスの応答時間改善」ではなく、「TCPコネクション解放によるFWの論理資源節約」という、逆の要件になっていることに注意してほしい、としています。"}, "y1-4-7": {"a": "後続がないリクエストに付与し、コネクションを切断する。", "e": "【考え方】\nクローズ接続オプション（Connection: close）は、HTTP/1.1で、このリクエストへの応答を返した後に、コネクションを切断するよう指示するものです。トランザクションをパイプライン化して、1つのコネクションで連続してリクエストを送る場合に、最後のリクエストにだけ付けます。後続のリクエストがない最後のリクエストに付与することで、不要なコネクションを残さず、同時コネクション数を減らせます。\n\n【補足】\nIPA講評で、設問4(5)(6)は、HTTPに関する、正答率が比較的低い問題でした。"}, "y1-4-8": {"a": "通信アダプタにFQDNを付与し、同一コネクションを使って複数の設備から稼働情報を取得する。", "e": "【考え方】\n本文に、「設備を指定するためのFQDN」でURLを指定する形式とあります。通信アダプタ1台に、1〜100台の設備が接続されます。URLのFQDNを、設備ごとではなく、通信アダプタごとに付与し、リソース名（パス）で設備を区別すれば、同じFQDN宛ての同一コネクションの中で、パイプライン化して、複数の設備の稼働情報を取得できます。コネクション数が減り、同時コネクション数が削減されます。\n\n【補足】\nパイプライン化は、同じサーバ（FQDN）に、同じコネクションで連続してリクエストを送る工夫です。そのため、設備ごとに別のFQDNだと、コネクションが設備の数だけ必要になります。設計方針は、URLの「ホスト部」を通信アダプタ単位にすることです。"}, "y2-1-1": {"a": "3", "e": "【考え方】\nNAT444は、①顧客宅内のプライベートIPアドレス、②CPEとCGN装置の間のシェアードアドレス（100.64.0.0/10）、③インターネット側のグローバルIPアドレス、の3種類のネットワークアドレスで運用されます。「444」は、IPv4を3つのネットワークで使うので「4」が3つ並びます。\n\n【補足】\n図2のとおり、NATが2回行われます（CPEと、CGN装置）。各境界でNATを実行することで、グローバルIPアドレスを節約します。"}, "y2-1-2": {"a": "16", "e": "【考え方】\nTCP/UDPのポート番号は、16ビットです（0〜65,535）。CGNでは、1つのグローバルIPアドレスの、この限られたポート番号を、複数の顧客に分配します。"}, "y2-1-3": {"a": "アクティブ", "e": "【考え方】\nFTPのアクティブモードは、サーバからクライアントが指定したポートに向けて、データ用のTCPコネクションを確立します。NATが介在すると、外からのコネクション確立要求は、変換テーブルになく、届きません。\n\n【補足】\nIPA講評によると、cの正答率が低かった問題です。FTPのモード（アクティブモード、パッシブモード）の違いを、この機会に理解しておきます。パッシブモードは、データ用のコネクションも、クライアントからサーバに確立するので、NATを通りやすいです。"}, "y2-1-4": {"a": "D", "e": "【考え方】\nマルチキャストIPアドレスは、224.0.0.0〜239.255.255.255 で、クラスDのIPアドレスです。"}, "y2-1-5": {"a": "マルチキャストMACアドレス", "e": "【考え方】\nマルチキャストIPアドレスから、対応するマルチキャストMACアドレス（01-00-5e で始まる48ビット）が生成されます。PCのNICは、このマルチキャストMACアドレス宛てのフレームを受信するように動作します。\n\n【補足】\nIPアドレス（下位23ビット）をMACアドレスの下位23ビットにコピーして作ります。例えば、224.1.1.1 は 01-00-5e-01-01-01 です。"}, "y2-2-1": {"a": "PCのネットワークアドレスと、CPEとCGN装置間のネットワークアドレスが重なったとき", "e": "【考え方】\nNAT444では、CPEとCGN装置の間は、シェアードアドレス（100.64.0.0/10）です。ここに、顧客宅内のプライベートIPアドレスと同じ範囲を使うと、次の問題が起きます。顧客宅のPCのネットワークアドレス（プライベート）と、CPEとCGN装置間のネットワークアドレスが重なると、CPEが、宛先をどちらのネットワークか区別できず、インターネットに出られなくなります。\n\n【補足】\nIPA講評で、設問2は(2)に比べて(1)の正答率が低く、設問の趣旨が適切に理解されていない解答が散見されました。「シェアードアドレス専用に定義された範囲」を設ける理由が、顧客宅のプライベートアドレスと重ならないようにするためです。"}, "y2-2-2": {"a": "送信元IPアドレス", "e": "【考え方】\nNAT444では、顧客宅のPCが、CPE（NAT）とCGN装置（NAT）の2回変換されて、Webサーバに届きます。Webサーバから見えるのは、CGN装置のグローバルIPアドレスと、変換後のポート番号です。複数の顧客が1つのグローバルIPアドレスを共有するので、PCを特定するためには、次の3つの情報が必要です。\n・送信元IPアドレス（CGN装置のグローバルIPアドレス）。\n・送信元ポート番号（CGN装置が変換したポート番号）。\n・アクセス時刻（そのポートがどの顧客に割り当てられていたかを、時刻で特定するため）。"}, "y2-2-3": {"a": "送信元ポート番号", "e": "【考え方】\n2つ目は送信元ポート番号です。3つは、順番が入れ替わっても構いません。"}, "y2-2-4": {"a": "アクセス時刻", "e": "【考え方】\n3つ目はアクセス時刻です。CGN装置では、ポート番号が使い回されるので、時刻が分からないと、顧客を特定できません。"}, "y2-3-1": {"a": "IPヘッダが認証対象なので、IPアドレスが書き換えられると認証データが計算値と一致しなくなるから", "e": "【考え方】\nAH（Authentication Header）は、IPヘッダを含むパケット全体を認証の対象にします。NAT機器が、送信元IPアドレスなどを書き換えると、受信側が計算した認証データが、パケットに付いている認証データと一致せず、認証エラーになります。\n\n【補足】\nIPA講評で、設問3は正答率が高く、受験者に広く理解されていることがうかがえました。ESPは、IPヘッダを認証の対象にしないので、アドレスの変換だけなら通ります（本文の表1）。"}, "y2-3-2": {"a": "TCP又はUDPヘッダが暗号化の対象であり、ポート番号が暗号化されていて分からないから", "e": "【考え方】\nNAPTは、TCP/UDPヘッダのポート番号を変換します。ESPでは、TCP/UDPヘッダは暗号化されるので、NAT機器からは、ポート番号が見えず、変換できません。また、ESPヘッダ自体には、ポート番号が存在しません。したがって、トランスポートモード、トンネルモードのどちらでも、ポート変換ができません。\n\n【補足】\n解答の要点は、「ポート番号が暗号化されている」か「ESPヘッダにポート番号がない」のどちらかです。"}, "y2-3-3": {"a": "送信元ポート番号が500と4500以外のISAKMPメッセージも受信できるようにする。", "e": "【考え方】\nIPsec NATトラバーサルでは、ISAKMPメッセージの送信元ポート番号と宛先ポート番号を、500から4500に変更します。NATが行われると、送信元ポート番号が、NAT機器によって変換されるので、500や4500以外の値になります。IPsecを使用する機器の、受信パケットに対するフィルタリング設定を、送信元ポート番号が500と4500以外のISAKMPメッセージも受信できるように、変更する必要があります。"}, "y2-4-1": {"a": "マルチキャストMACアドレスが送信元アドレスになることがないから", "e": "【考え方】\nL2SWは、受信したフレームの「送信元MACアドレス」を学習し、MACアドレステーブルに登録します。マルチキャストMACアドレスは、宛先アドレスにしかならず、送信元になりません。したがって、学習されず、テーブルにエントリがないので、フラッディングされます。\n\n【補足】\nIPA講評で、設問4(1)(2)は、正答率が低かった問題です。「マルチキャスト通信では、宛先は、IPアドレスもMACアドレスもマルチキャストのアドレスになるが、送信元は、必ずユニキャストのアドレスになること、スイッチによるMACアドレスの学習は、送信元のMACアドレスを基に行われること」を、忘れないでほしい、とあります。"}, "y2-4-2": {"a": "ビデオサーバは、マルチキャストパケットを送信する側だから", "e": "【考え方】\nIGMPは、受信者（PC）が、マルチキャストグループへの参加や離脱を、ルータに知らせるプロトコルです。ビデオサーバは、マルチキャストパケットを送信する側なので、グループに参加する必要がなく、IGMPを使いません。ビデオサーバとルータ2の間では、IGMPが使われません（図5の通信内容は、PCとルータ1の間だけ）。\n\n【補足】\n送信側は、マルチキャストアドレスを宛先にして、送信するだけです。受信者の有無は、IPマルチキャストルーティングプロトコルと、IGMPで、ルータが管理します。"}, "y2-4-3": {"a": "01-00-5e-01-01-01", "e": "【考え方】\nマルチキャストグループ 224.1.1.1 に対応するマルチキャストMACアドレスです。図5の①②のフレームの、宛先MACアドレスと同じ 01-00-5e-01-01-01 です。表2のアには、このマルチキャストMACアドレスが入ります。\n\n【補足】\nIGMP leave（③）は、224.0.0.2（全ルータ宛）なので、宛先MACアドレスは 01-00-5e-00-00-02 です。これは、表2のエントリには、登録されません。"}, "y2-4-4": {"a": "p1", "e": "【考え方】\nIGMPスヌーピング機能をもつL2SWは、IGMP join / leave から、指定されたマルチキャストグループが存在するポートを知り、マルチキャストMACアドレスのエントリを作成します。\n①PC1（p1）からのIGMP join：マルチキャストMACアドレス 01-00-5e-01-01-01 に、p1 を登録。\n\n【補足】\n表2には、同じMACアドレス（マルチキャストMACアドレス）が複数のポートに存在することがあります。通常のMACアドレスは、1つのポートにしか存在しません。マルチキャストMACアドレスは例外です。"}, "y2-4-5": {"a": "p1、p3", "e": "【考え方】\n②PC3（p3）からのIGMP join：同じグループのエントリに p3 を追加。ポートIDは、p1 と p3 になります。"}, "y2-4-6": {"a": "p3", "e": "【考え方】\n③PC1（p1）からのIGMP leave：PC1が離脱するので、p1を削除し、p3だけが残ります。\n\n【補足】\nIGMPスヌーピングにより、グループに属するPCがいるポートだけに、マルチキャストフレームを転送できます。PC2（p2）は、グループに参加していないので、フレームが届きません。"}, "y2-5-1": {"a": "224のVXLANセグメントが構成できるから", "e": "【考え方】\nVXLANヘッダのVNI（VXLANネットワーク識別子）は、24ビットです。2^24＝約1,677万通りのVXLANセグメントを構成できます。VLAN IDの12ビット（4,094個）を大きく超えるので、VLAN数の制限が緩和されます。\n\n【補足】\n解答の要点は、「224（2の24乗）のVXLANセグメントが構成できる」、又は「膨大な数の論理セグメントが構成できる」です。VNIごとにVXLANセグメントができ、通信路が論理的に分離されます。"}, "y2-5-2": {"a": "宛先となるVMの存在場所が不明だから", "e": "【考え方】\n図8の(ii)は、VM2がARP要求でVM3のMACアドレスを調べるとき、VTEP1が、VXLANでカプセル化して送るものです。この時点では、宛先のVM3が、どのVTEP（どの物理サーバ）にいるのか、不明です。宛先が分からないので、ユニキャストで送れず、同じVNIのVXLANセグメントに属するVTEP全部に届くよう、マルチキャストで送ります。\n\n【補足】\nVM3は、VNI 5002のVXLANセグメントに属し、マルチキャストグループ 224.1.1.2 に割り当てられています（図7の注記3）。"}, "y2-5-3": {"a": "224.1.1.2", "e": "【考え方】\n(ii)のVXLANフレームの宛先IPアドレスは、VM3が属するVNI 5002に割り当てられたマルチキャストグループ 224.1.1.2 です。"}, "y2-5-4": {"a": "10.0.0.254", "e": "【考え方】\n送信元は、VM2がいる物理サーバ1のVTEP1のIPアドレス 10.0.0.254 です（図7）。"}, "y2-5-5": {"a": "マルチキャストグループ224.1.1.2のIGMP joinメッセージを、L3SW2に送信する。", "e": "【考え方】\nVM3が物理サーバ2に移動してくると、VTEP2は、VNI 5002のVXLANセグメントに、新しく参加するVMがいるので、そのVNIのマルチキャストグループ（224.1.1.2）に、参加する必要があります。そのため、VTEP2は、IGMP joinメッセージを、マルチキャストグループ 224.1.1.2 宛てに（所属するサブネットのルータ）、L3SW2に送信します。これにより、(iii)でVTEP1が送ったマルチキャストパケットが、L3SW2経由で、VTEP2に届きます。\n\n【補足】\nIPA講評は、設問5は正答率が比較的高かったとしています。VXLANの知識や経験がなくても、TCP/IP通信の基本的な技術と、本文の記述から、導けます。"}, "y2-5-6": {"a": "不要なマルチキャストパケットがネットワーク内に転送されるので、L3SWやネットワークの負荷が高まる。", "e": "【考え方】\nVTEP間の通信が、全てマルチキャストで行われると、その通信を必要としない物理サーバやVMにも、マルチキャストパケットが転送されます。物理サーバ、VM及びL3SWの数が多いネットワークでは、不要なマルチキャストパケットが多数流れて、L3SWやネットワークの負荷が高まります。\n\n【補足】\nそのため、VXLANでは、宛先のVTEPが分からないときだけ（ARP要求など）マルチキャストを使い、宛先が分かったあとは、ユニキャストで通信します。"}, "y2-5-7": {"a": "10.0.0.254", "e": "【考え方】\n(vi)は、VTEP2が、ARP応答をカプセル化してVTEP1に送るユニキャストです。宛先は、VM2がいる物理サーバ1のVTEP1のIPアドレス 10.0.0.254 です。ARP要求（ii）を受け取ったVTEP2が、送信元のVTEP1のアドレスを学習しているので、ユニキャストで返せます。"}, "y2-5-8": {"a": "10.10.0.254", "e": "【考え方】\n送信元は、VM3がいる物理サーバ2のVTEP2のIPアドレス 10.10.0.254 です（図7）。"}};
  var PROBLEM_NOTES = {"7": "IPA採点講評（要旨）：全体として正答率は低め。設問1（TLSのバージョン・プロトコル選定）、設問2(1)（暗号スイート中のアルゴリズムの用途）、設問2(2)（動作方式の選定根拠）は特に低かった一方、設問3・設問4は高かった。設問4は、L3SWに隣接するFWの設定を考慮しない誤答も見られた。", "8": "IPA採点講評（要旨）：全体として正答率は高め。設問2(2)の広域イーサ網の計算は低かった。設問2(3)は利点への言及がない解答が散見された。設問3(2)は「パケットを破棄する」と誤答した受験者が多く、シェーピングとポリシングの違いの理解が課題。", "9": "IPA採点講評（要旨）：設問2(1)（トランスポートモードを選んだ根拠）と設問4（二つのVPNトンネルを監視する目的）は正答率が低かった。設問3(4)は、経路ループの防止策としてSTPと誤答する例が散見された。", "13": "IPA採点講評（要旨）：全体として正答率は低め。設問1はウ（Set-Cookie）、設問3(2)（Secure属性）が特に低かった。設問4はアドレス重複検知の仕組みと対処の理解が課題。", "14": "IPA採点講評（要旨）：全体として正答率は高め。設問2(1)は4つのアドレスが全て正しい解答が少なかった。設問3(2)「い」は、「社内NW⇔(インターネット・DMZ)は全てProxy経由」「LB4はFWとProxyの負荷分散を併用」の条件の見落としが多かった。", "15": "IPA採点講評（要旨）：全体として正答率は高め。設問1は専門用語（ミラーポート・ICMPの設定など）の正答率が低かった。設問2(2)はFWとの連携、設問3(1)(2)はIPSの機能の理解が課題。", "16": "IPA採点講評（要旨）：全体として正答率は高め。設問2(4)（2種類のポートの使い分け）と(5)（STARTTLS方式のポート番号）、設問3(1)（SMTPの基本的なシーケンス）の正答率が低かった。", "17": "IPA採点講評（要旨）：全体として正答率は低め。設問2(1)はステルス機能の効果を答える誤りが多く、(2)はSSID・MACアドレスが暗号化できないことの理解が不足。設問4(1)は、利用者認証を含めたログ取得の観点が課題。", "18": "IPA採点講評（要旨）：全体として正答率は低め。設問1(4)は、負荷が偏りやすくなる条件を答えられた解答が少なかった。設問3(2)(3)は、未変更社員・実施済み社員・社外の三者間の転送経路を図3に書き込めば導けるとされている。", "19": "IPA採点講評（要旨）：全体として正答率は低め。設問1はウ・エ（QoS用語）、設問2(1)〜(3)が低かった。(1)は通信経路の説明にとどまらず、デフォルトゲートウェイの冗長化と仮想ルータに着目するのが要点。設問3(2)も低かった。設問2(4)は高かった。", "20": "IPA採点講評（要旨）：全体として正答率は低め。設問1はイ（ステートフルフェールオーバ）が低かった。設問2(1)はアプリケーション間の通信に着目する、(3)はSW2を挟むことで第2層を透過しつつ第1層を分離している観点、(5)aは第2層と第3層の違いが課題。設問3(2)は配置の具体性が不足する解答が多かった。", "21": "IPA採点講評（要旨）：全体として正答率は高め。設問1はDNSの用語の正答率が低かった。設問3(2)は、本文の条件を読まず経験や一般知識だけで答えた解答が非常に多かった。設問4はPDCAサイクルに従った改善手法が重要。", "22": "IPA採点講評（要旨）：全体として正答率は高め。設問1はアとイの正答率が低かった。設問2(1)(2)の正答率が低く、基本的な知識と、本文をしっかり読むことが必要。設問4は全体として正答率が低く、本文の要件と状況設定を整理して読むことが必要。", "23": "IPA採点講評（要旨）：全体として正答率は高め。設問1はアとオが低かった。設問2(3)は低かった（一般的なBBルータの構成の知識で導ける）。設問3(1)のb・cが低く、(4)は目的を答えたり構成を曖昧に書いたり、タグVLANで結ぶ構成を挙げる誤りが目立った。", "24": "IPA採点講評（要旨）：全体として正答率は低め。設問1はイ（VLAN数の制約の理由）が特に低かった。設問2は(2)と(3)が低く、L3SWがL2SWとしても動作すること、フレームフォーマットを意識することが必要。設問3は(1)の図示は高く、(3)は低かった。", "25": "IPA採点講評（要旨）：設問1(2)の正答率が低く、導入構成例（図1）に三つのFWがあることを踏まえて、Xシステムの記述を注意深く読むことが必要。設問2(2)（QoSレベルの考え方）の正答率が低かった。通信シーケンス（図3）を読んで仕組みを理解しておくこと。設問3は比較的高いが、リダイレクトに関する(1)シの誤答が見られた。設問4は、メッセージ交換システムの拡張性と、NATで二つのネットワークを接続したときの制約を理解して解答すること。", "26": "IPA採点講評（要旨）：設問1はイ（ステートフル）の正答率が低かった。設問2は全体として低く、(3)は仮想サーバの移動に不可欠な設定なので理解しておくこと。設問4は(1)が低く、仮想FWに設定するネットワーク情報は通常のFWとほぼ同じ。設問5は(1)が低く（図4の配置では物理サーバ3の障害で3顧客が同時に停止する）、(2)(3)(4)は高かった。", "27": "IPA採点講評（要旨）：設問1は正答率が高かった。設問2は正答率が高く、SDNへの理解がうかがえたが、(2)〜(4)に誤答が目立った（パケット識別条件とActionの定義・読解）。設問3は正答率が低い問題が複数あり、(1)はDNSの正しい知識、(4)(5)はCDNを使ったネットワークの動作の理解が必要。設問4は全体に低く、(3)は自社要員だけで構成変更ができること、(4)は準備作業全体、(5)はIaaS利用とアウトソーシングの混同が目立った。", "28": "IPA採点講評（要旨）：設問1はa、b、cは高く、eが低かった（IEEE 802.11i）。設問2は(2)が高く、(1)が低かった。設問3は全体に高く、(5)（PoE+の呼称）が低かった。設問4は(1)が低かった（認証に必要な情報）。設問5は(1)のオーセンティケータ（WLC）と、(5)の理由（PMKの保持）が低く、(2)と(6)は高かった。", "29": "IPA採点講評（要旨）：全体としてよく理解されていた。設問2(2)は基本問題だが、IP層とTCP層の動作を取り違えたり不正確な解答が散見された。設問3(3)(4)は、マルチホーミング環境でのWebRTC利用という応用問題で、やや低かった。設問4(1)は、図6やHTTPの一般知識からの推論を期待したが、SIPに引きずられた誤答が多かった。設問5は、設計の(2)(7)と運用の(5)(6)が低く、時間切れと思われる誤答が多かった。", "30": "IPA採点講評（要旨）：設問1はアとイが踏み込んだ内容で、正答率が低かった。設問2は(1)が高く、(2)が低かった（フェーズ2の認証方式は、IPsec通信のデータの完全性を認証するもの）。設問3は(3)が低く、図で示した通信手順とパケット形式を基にじっくり考えること。設問4は、GREパケットをIPsecでカプセル化する方法で、午後では初出題だが正答率は高かった。設問5は、(3)(4)と(6)のえを除いて正答率は高く、(4)は経路テーブルの変化の理解、(6)のうは、本文の見落としが目立った。", "31": "IPA採点講評（要旨）：設問1〜4に正答率の大きな偏りはなく、全体としてよく理解されていた。設問1(1)と設問3(2)（TCP/IPの基本）、設問4(5)(6)（HTTP）の正答率が比較的低かった。設問1は、ヘッダ内のアドレスの変化を落ち着いて確実に答えること。設問2は、HTTP/1.1の基本知識と通信シーケンス例から読み解く問題で、(2)(5)(6)は経験によって差が出た。設問4は、TCPコネクション解放によるFWの論理資源節約という逆の要件に注意すること。", "32": "IPA採点講評（要旨）：全体としてよく理解されていた。設問1は、cの正答率が低かった（FTPのアクティブモード）。設問2は(1)が低く、設問の趣旨を理解して答えること。設問3は、IPsec NATトラバーサルに関して正答率が高かった。設問4(1)(2)は低かった（マルチキャストでは、送信元は必ずユニキャストのアドレスで、スイッチのMACアドレス学習は送信元アドレスで行う）。設問5は、VXLANの知識がなくても導ける問題で、正答率は比較的高かった。"};


  var STORE_KEY = "nw-r03h-pm1-cbt-mock-v3";

  /* ============================= STATE ============================= */
  var state = {
    screen:"cover",
    current:null,
    answers:{},
    marked:{},
    memos:{},
    history:{},
    correct:{},
    marks:{},
    timers:{}
  };
  (function hydrate(){
    var saved=null;
    try{ var raw=localStorage.getItem(STORE_KEY); if(raw) saved=JSON.parse(raw); }catch(e){}
    if(saved){
      state.answers = saved.answers || {};
      state.marked = saved.marked || {};
      state.memos = saved.memos || {};
      state.history = saved.history || {};
      state.correct = saved.correct || {};
      state.marks = saved.marks || {};
      state.timers = saved.timers || {};
    }
  })();
  var zoomLevel = 100;
  var memoOpen = false;
  var resumeScroll = false;
  var markerTool = null, markerSize = 3, invertOn = false, statusOpen = false, calcOpen = false, memoTrans = false;
  var activeItemId = null, splitH = 54, splitV = 50;
  var modelShown = false, resultProblemOpen = false, resZoom = 100;
  var EXAM_LIMIT_MIN = 45, EXAM_LIMIT_SEC = EXAM_LIMIT_MIN*60;
  var HISTORY_LIMIT = 20;

  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        answers:state.answers, marked:state.marked, memos:state.memos, history:state.history, correct:state.correct, marks:state.marks, timers:state.timers
      }));
    }catch(e){}
  }
  function clearProblemData(problemId){
    allItems(findProblem(problemId)).forEach(function(it){ delete state.answers[it.id]; delete state.marked[it.id]; });
    delete state.memos[problemId];
    Object.keys(state.marks).forEach(function(k){ if(k.indexOf(problemId+':')===0) delete state.marks[k]; });
    save();
  }
  function snapshotAnswers(problem){
    var out={};
    allItems(problem).forEach(function(it){
      if(state.answers[it.id]!=null) out[it.id]=JSON.parse(JSON.stringify(state.answers[it.id]));
    });
    return out;
  }
  function pushHistory(problem){
    var snap = snapshotAnswers(problem);
    if(!Object.keys(snap).length) return;
    var list = state.history[problem.id] || [];
    var lastJson = list.length ? JSON.stringify(list[0].answers) : null;
    if(lastJson===JSON.stringify(snap)) return;
    list.unshift({ts:Date.now(), answers:snap});
    if(list.length>HISTORY_LIMIT) list = list.slice(0,HISTORY_LIMIT);
    state.history[problem.id]=list;
    save();
  }
  function fmtDateTime(ts){
    var d=new Date(ts);
    function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function findProblem(id){ for(var i=0;i<PROBLEMS.length;i++){ if(PROBLEMS[i].id===id) return PROBLEMS[i]; } return null; }
  function timerKey(){ return state.current==null ? null : 'p'+state.current; }
  function timerLabel(){
    var pr = state.current==null ? null : findProblem(state.current);
    return pr ? examLabelFor(pr.id)+' '+pr.label : '';
  }
  function fmtHMS(sec){
    sec = Math.max(0, sec);
    function p(n){ return (n<10?'0':'')+n; }
    return p(Math.floor(sec/60))+':'+p(sec%60);
  }
  function timerHtml(){
    var k = timerKey();
    var used = k ? (state.timers[k]||0) : 0;
    var lim = limitMinFor(state.current), left = lim*60 - used;
    return '<div class="timer'+(left<=0?' over':(left<=300?' low':''))+'" id="examTimer" title="'+examPartFor(state.current)+'（'+lim+'分）の残り時間。この問題を解いている間だけ進みます">'
      + '<span class="tl">残り時間</span><span class="tv mono" id="timerVal">'+fmtHMS(left)+'</span>'
      + '<button class="ghost small" id="timerReset" title="この問題の試験時間を'+lim+'分に戻す">リセット</button></div>';
  }
  function updateTimerUI(){
    var el = document.getElementById('timerVal'), box = document.getElementById('examTimer');
    var k = timerKey();
    if(!el || !k) return;
    var left = limitMinFor(state.current)*60 - (state.timers[k]||0);
    el.textContent = fmtHMS(left);
    box.classList.toggle('low', left>0 && left<=300);
    box.classList.toggle('over', left<=0);
  }
  function bindTimerReset(){
    var b = document.getElementById('timerReset');
    if(!b) return;
    b.addEventListener('click', function(){
      var k = timerKey();
      if(!k || !confirm(timerLabel()+'の試験時間を'+limitMinFor(state.current)+'分に戻します。よろしいですか？')) return;
      delete state.timers[k]; save(); updateTimerUI();
    });
  }
  setInterval(function(){
    if((state.screen!=='exam' && state.screen!=='review') || document.hidden) return;
    var k = timerKey();
    if(!k) return;
    var used = (state.timers[k]||0) + 1;
    state.timers[k] = used;
    updateTimerUI();
    if(used===limitMinFor(state.current)*60) toast('試験時間の'+limitMinFor(state.current)+'分が経過しました（続けて解答できます）');
    if(used%5===0) save();
  }, 1000);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });

  function groupOf(problemId){
    for(var i=0;i<EXAM_GROUPS.length;i++){ if(EXAM_GROUPS[i].ids.indexOf(problemId)>=0) return EXAM_GROUPS[i]; }
    return null;
  }
  function examPartFor(problemId){ var g = groupOf(problemId); return g && g.part ? g.part : '午後I'; }
  function examLabelFor(problemId){
    var g = groupOf(problemId);
    return g ? g.title + (g.part ? ' ' + g.part : '') : '';
  }
  function examTitleFor(problemId){
    var g = groupOf(problemId);
    return (g ? g.title : '') + ' ネットワークスペシャリスト試験 ' + examPartFor(problemId);
  }
  function limitMinFor(problemId){ var g = groupOf(problemId); return g && g.limit ? g.limit : EXAM_LIMIT_MIN; }
  function allItems(problem){
    var out=[];
    problem.groups.forEach(function(g){ g.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function isAnswered(it){
    var v = state.answers[it.id];
    if(v==null) return false;
    if(it.type==="text") return String(v).trim().length>0;
    if(it.type==="multi") return Array.isArray(v) && v.length>0;
    if(it.type==="fields"){
      if(!v) return false;
      return it.fields.some(function(f){
        var fv=v[f.key];
        if(f.type==="multi") return Array.isArray(fv)&&fv.length>0;
        return fv && String(fv).trim().length>0;
      });
    }
    return false;
  }
  function progressOf(problem){
    var items = allItems(problem);
    var done = items.filter(isAnswered).length;
    return {done:done, total:items.length};
  }
  function ucount(str){ return Array.from(String(str||"")).length; }

  function toast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h=setTimeout(function(){ t.classList.remove("show"); },1800);
  }

  var currentPageIdx = {};

  function inputChanged(it, value, fieldKey){
    if(fieldKey){
      var obj = state.answers[it.id] || {};
      obj[fieldKey]=value;
      state.answers[it.id]=obj;
    } else {
      state.answers[it.id]=value;
    }
    save();
  }

  function renderTextField(it, opts){
    opts = opts||{};
    var val = opts.value!=null?opts.value:"";
    var limit = opts.limit!=null?opts.limit:it.limit;
    var big = !limit || limit>=15;
    var idAttr = opts.id;
    var html;
    if(big){
      html = '<textarea rows="'+(limit && limit<=30?2:3)+'" id="'+idAttr+'" data-ans="1"'+(limit?' data-limit="'+limit+'"':'')+'>'+escapeHtml(val)+'</textarea>';
    } else {
      html = '<input type="text" id="'+idAttr+'" data-ans="1"'+(limit?' data-limit="'+limit+'"':'')+' value="'+escapeHtml(val)+'">';
    }
    return html;
  }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function renderMultiOptions(it, selectedArr, groupId, selectCount){
    selectedArr = selectedArr||[];
    var atLimit = selectCount>0 && selectedArr.length>=selectCount;
    var html='<div class="opt-grid" data-group="'+groupId+'">';
    it.options.forEach(function(pair){
      var key=pair[0], text=pair[1];
      var checked = selectedArr.indexOf(key)>=0;
      var disabled = (!checked && atLimit);
      html += '<label class="opt-chip'+(checked?' checked':'')+(disabled?' disabled':'')+'">';
      html += '<input type="checkbox" value="'+key+'" '+(checked?'checked':'')+(disabled?' disabled':'')+' data-multi="'+groupId+'">';
      html += '<span>'+escapeHtml(text===key?key:(key+"："+text))+'</span></label>';
    });
    html+='</div>';
    if(selectCount>0){
      html += '<div class="opt-hint">'+selectedArr.length+' / '+selectCount+' 個選択中'+(atLimit?'（上限に達しました。解除すると他を選べます）':'')+'</div>';
    } else {
      html += '<div class="opt-hint">該当するものを全て選択（'+selectedArr.length+'個選択中）</div>';
    }
    return html;
  }

  function renderQCard(it){
    var answered = isAnswered(it);
    var marked = !!state.marked[it.id];
    var html = '<div class="qcard'+(answered?' answered':'')+(marked?' marked':'')+'" id="card-'+it.id+'">';
    html += '<div class="qcard-head"><span class="status-dot"></span>';
    if(it.sub) html+='<span class="sub">'+escapeHtml(it.sub)+'</span>';
    html += '<span class="prompt">'+escapeHtml(it.prompt)+'</span>';
    html += '<label class="later-chk"><input type="checkbox" data-mark="'+it.id+'"'+(marked?' checked':'')+'>後で見直す</label>';
    html += '</div>';

    if(it.type==="text"){
      var val = state.answers[it.id]||"";
      html += '<div class="field-row">'+renderTextField(it,{id:"in-"+it.id, value:val});
      if(it.limit){
        var n=ucount(val);
        html += '<div class="counter'+(n>it.limit?' over':'')+'">'+n+' / '+it.limit+' 文字</div>';
      }
      html += '</div>';
    } else if(it.type==="multi"){
      html += renderMultiOptions(it, state.answers[it.id]||[], it.id, it.selectCount||0);
    } else if(it.type==="fields"){
      var fv = state.answers[it.id]||{};
      html += '<div class="field-pair">';
      it.fields.forEach(function(f){
        html += '<div class="field-row"><label>'+escapeHtml(f.label)+'</label>';
        if(f.type==="multi"){
          html += renderMultiOptions(f, fv[f.key]||[], it.id+"__"+f.key, 0);
        } else {
          html += renderTextField(it,{id:"in-"+it.id+"__"+f.key, value:fv[f.key]||"", limit:f.limit});
          if(f.limit){
            var nn=ucount(fv[f.key]||"");
            html += '<div class="counter'+(nn>f.limit?' over':'')+'">'+nn+' / '+f.limit+' 文字</div>';
          }
        }
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderAnswerPane(problem){
    var html='';
    problem.groups.forEach(function(g){
      html += '<div class="mon-group"><div class="mon-title">'+escapeHtml(g.mon)+(g.note?'　'+escapeHtml(g.note):'')+'</div>';
