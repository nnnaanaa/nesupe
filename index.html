EP全部に届くように、マルチキャストで送ります。\n\n【補足】\nVNI 5002には、マルチキャストグループ 224.1.1.2 が割り当てられています（図7の注記3）。VTEPは、自分がVNI 5002のVMをもつときに、このグループに参加しておくので、マルチキャストで、届きます。"}, "y2-5-3": {"a": "224.1.1.2", "e": "【考え方】\n(ii)のVXLANフレームの宛先IPアドレスは、VM3が属するVNI 5002 に割り当てられた、マルチキャストグループ 224.1.1.2 です（図7）。"}, "y2-5-4": {"a": "10.0.0.254", "e": "【考え方】\n送信元は、(ii)でカプセル化を行う、VTEP1のIPアドレスです。VM2は物理サーバ1にいて、物理サーバ1の仮想スイッチのVTEP1は、10.0.0.254 です（図7）。"}, "y2-5-5": {"a": "マルチキャストグループ224.1.1.2のIGMP joinメッセージを、L3SW2に送信する。", "e": "【考え方】\n図8の(iii)で、VTEP1が送ったマルチキャストパケットが、VTEP2に届く条件を考えます。\n・VTEP2が、マルチキャストグループ 224.1.1.2 に参加していないと、届かない。\n・VM3が、物理サーバ2に移動してきたので、VTEP2は、VNI 5002のVMを、新しくもつことになる。\nそのため、VTEP2は、マルチキャストグループ 224.1.1.2 に参加する必要があります。参加は、IGMP joinメッセージで行い、所属するサブネットのルータ、つまりL3SW2に送ります。\nしたがって、「マルチキャストグループ 224.1.1.2 のIGMP joinメッセージを、L3SW2に送信する」が答えです。\n\n【補足】\nIPA講評は、設問5は、VXLANの知識や経験がなくても、TCP/IP通信の基本的な技術と、本文に記述された内容から、解答が導き出せる問題だとしています。受信者が、マルチキャストグループに加わるときは、IGMP joinを使う、という設問4の知識を、使います。"}, "y2-5-6": {"a": "不要なマルチキャストパケットがネットワーク内に転送されるので、L3SWやネットワークの負荷が高まる。", "e": "【考え方】\nVTEP間の通信が、すべてマルチキャストで行われるとします。\n・マルチキャストは、グループに参加しているすべての受信者に届く。\n・物理サーバ、VM、L3SWの数が多いネットワークでは、不要な（宛先でない）VTEPやL3SWにまで、パケットが流れる。\nその結果、不要なマルチキャストパケットがネットワーク内に転送されて、L3SWやネットワークの負荷が高まります。\n\n【補足】\nそのため、VXLANでは、宛先のVTEPが分からないとき（ARP要求など）にだけ、マルチキャストを使います。宛先のVTEPが分かったあとは、ユニキャストで通信します（図8の(vi)）。マルチキャストは便利ですが、大規模なネットワークでは、負荷が大きくなります。"}, "y2-5-7": {"a": "10.0.0.254", "e": "【考え方】\n図8の(v)〜(vi)の流れです。\n・(v)：VM3が、ARP要求に対して、ARP応答を送る。\n・(vi)：ARP応答を受けたVTEP2が、VXLANでカプセル化して、送る。\nこのとき、VTEP2は、(iv)で受け取った、ARP要求（VXLANフレーム）の送信元IPアドレスから、VM2がいるVTEPが、VTEP1であることを知っています。そのため、ユニキャストで返せます。宛先IPアドレスは、VTEP1のIPアドレス 10.0.0.254 です。"}, "y2-5-8": {"a": "10.10.0.254", "e": "【考え方】\n送信元は、(vi)でカプセル化を行う、VTEP2のIPアドレスです。VM3は、物理サーバ2に移動しており、物理サーバ2の仮想スイッチのVTEP2は、10.10.0.254 です（図7）。\n\n【補足】\nVM2とVM3の通信では、次の2種類の、VXLANフレームが出てきます。\n・(ii)：VTEP1 → マルチキャスト 224.1.1.2（送信元 10.0.0.254、宛先 224.1.1.2）。\n・(vi)：VTEP2 → VTEP1（送信元 10.10.0.254、宛先 10.0.0.254）。"}, "m33-1-1": {"a": "ゾーン", "e": "【考え方】\nプライマリDNSサーバ（DNS-P）の登録内容を、セカンダリDNSサーバ（DNS-S）に写して同期させる操作を、ゾーン転送といいます。ゾーンは、1つのドメインの管理範囲（リソースレコードの集まり）のことです。\n\n【補足】\nDNS-Pのゾーンファイルを更新すると、シリアル番号が上がり、DNS-Sがそれを検知してゾーン転送（AXFR、差分ならIXFR）を行います。"}, "m33-1-2": {"a": "事業継続", "e": "【考え方】\n「長期間又は復旧不能なサービス停止による利益損失を防ぐ」ための考え方は、事業継続（BCP：Business Continuity Plan）です。他のデータセンタにもサーバを置き、ディザスタリカバリにも対応する方針は、事業継続の観点です。"}, "m33-1-3": {"a": "A", "e": "【考え方】\nFQDNに対応するIPアドレス（IPv4）を登録するレコードは、Aレコードです。同じFQDNに10個のAレコードを登録して、DNSラウンドロビンで負荷を分散します。"}, "m33-1-4": {"a": "権威", "e": "【考え方】\n自分のゾーンの情報を、正式なものとして応答するDNSサーバを、権威DNSサーバ（権限をもつDNSサーバ）といいます。DNS-PとDNS-Sは、Webサイトのドメイン（サブドメイン）の管理を、SLB-Mに委任し、「権威DNSサーバはSLB-M」と応答します（NSレコードによる委任）。\n\n【補足】\n対になる用語は、キャッシュDNSサーバ（フルリゾルバ）です。キャッシュDNSサーバは、権威DNSサーバに問い合わせて、結果を保持するサーバです。"}, "m33-2-1": {"a": "DC-C", "e": "【考え方】\nWebアクセスを処理する能力は、DC-Cが約70,000セッション/秒、DC-Dが約30,000セッション/秒で、分散割合は7対3です。IPアドレス10個のうち、7個をDC-C、3個をDC-Dに割り当てます。DNSラウンドロビンは、10個のアドレスを順に返すので、回答の7/10がDC-Cになります。"}, "m33-2-2": {"a": "DC-D", "e": "【考え方】\n10個のうち3個は、DC-Dに割り当てます（処理能力が3/10）。"}, "m33-2-3": {"a": "DC-C障害時にもDNS-Sを使ってDC-Dでサービス提供を可能とするため", "e": "【考え方】\nDNS-PはDC-Cに、DNS-SはDC-Dに置きます。もし2台とも同じデータセンタに置くと、そのデータセンタが障害になったときに、DNSの名前解決自体ができなくなり、他方のデータセンタが生きていても、Webサイトが利用できなくなります。セカンダリを別のデータセンタに置くことで、DC-Cが使えなくても、DNS-Sが名前解決に応答し、DC-Dのサービスを使えます。"}, "m33-2-4": {"a": "Webアクセス数とWebサーバの負荷が比例しないから", "e": "【考え方】\nDNSラウンドロビンが分散するのは、名前解決の回数（＝Webアクセスの数）です。ところが、Webサーバの負荷は、アクセスの数だけで決まらず、1アクセスあたりの処理の重さ（検索や大きなファイルの転送など）によって違います。そのため、アクセス数を均等に分けても、サーバの負荷が均等にはなりません。"}, "m33-2-5": {"a": "故障したデータセンタの仮想サーバのIPアドレスのAレコードを削除する。", "e": "【考え方】\nDNSラウンドロビンは、サーバの稼働状態を見ずに、登録されたAレコードを順に返します。データセンタが故障しても、故障したDCのIPアドレスを返し続けるので、そのDCへのアクセスが続きます。そこで、故障したDCのIPアドレス（仮想サーバのアドレス）のAレコードを、DNSサーバから削除します。\n\n【補足】\nキャッシュDNSサーバに残る古い情報は、TTLの時間だけ残ります。DNSラウンドロビンを使う場合は、TTLを短くしておくと、障害時の切替えが早くなります。"}, "m33-3-1": {"a": "SLB-MにWebサイトのドメインの権限を委譲する。", "e": "【考え方】\nSLB-Mを、Webサイトのドメイン（j-sha.example.comのサブドメイン web.j-sha.example.com）の権威DNSサーバとして動かすためには、DNS-Pが、そのサブドメインのNSレコードを、SLB-M（ns1.web.j-sha.example.com、ns2.web.j-sha.example.com）に向けて登録します。これが、権限の委譲（サブドメインの委任）です。\n\n【補足】\nIPA講評は、設問3(1)の正答率が低かった問題だとしています。「サーバ種別やサーバごとの役割、また、各サーバがどのように連携してDNSシステムを構成しているのか」の理解が必要です。"}, "m33-3-2": {"a": "インターネット接続回線の帯域圧迫", "e": "【考え方】\nSLB-Mは、データセンタをまたいで（DC-CとDC-Dの間）、Webサーバの負荷情報とセッション情報を、共有します。この管理用通信が、インターネット接続回線を通るので、回線の帯域を圧迫するおそれがあります。"}, "m33-3-3": {"a": "Webサーバへのアクセス遅延", "e": "【考え方】\nSLB-M間の通信で、帯域が圧迫されると、そのインターネット接続回線を使っているWebブラウザの通信（Webアクセス）も、遅くなります。したがって、懸念された事象は、Webサーバへのアクセス遅延です。"}, "m33-3-4": {"a": "Webサーバの応答時間", "e": "【考え方】\nSLB-Mが「最適な」IPアドレスを選ぶために、Webサーバの負荷情報として使えるのは、次のものです。\n・Webサーバの応答時間。\n・Webサーバのデータ通信量。\n（ほかにも、CPU使用率、同時接続数などが考えられますが、解答例は、この2つです。）"}, "m33-3-5": {"a": "Webサーバのデータ通信量", "e": "【考え方】\n2つ目は、Webサーバのデータ通信量です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m33-3-6": {"a": "Webブラウザのセッションを維持しているWebサーバ", "e": "【考え方】\n処理手順(6)は、SLBが保持しているセッション情報を確認して、そのWebブラウザのセッション情報が既に存在する場合の処理です。この場合は、新しいサーバを選ばず、同じブラウザのセッションを維持しているWebサーバに、継続して接続します。これを、パーシステンス（セッション維持）といいます。\n\n【補足】\n別のWebサーバに振り分けると、ログイン状態などのセッションが失われるので、同じブラウザは、同じサーバにつなぎ続けます。"}, "m34-1-1": {"a": "802.3", "e": "【考え方】\nPoE（Power over Ethernet）は、イーサネット（IEEE 802.3）のケーブルで電力を供給する規格で、IEEE 802.3af として規格化されています。"}, "m34-1-2": {"a": "PSE", "e": "【考え方】\n給電側の機器は、PSE（Power Sourcing Equipment）です。L2SWなどが該当します。PSEは、機器が接続されると、PoE（受電側の規格）に対応しているかを確認してから給電します。したがって、同じネットワーク内に、対応機器と非対応機器が混在できます。"}, "m34-1-3": {"a": "PoE", "e": "【考え方】\nPSEが、接続された機器に対して、PoE（IEEE 802.3af）に対応しているかをチェックします。対応していない機器には、給電しません。"}, "m34-1-4": {"a": "4,5,7,8", "e": "【考え方】\n10BASE-T/100BASE-TXでは、データ伝送に、1、2、3、6番のピンを使います。残りの 4、5、7、8番が使われていないので、これを給電に使う方式が、Alternative B です。（Alternative A は、データ用の1、2、3、6番のピンに、電力を重ねて供給する方式です。）"}, "m34-1-5": {"a": "IEEE802.3at", "e": "【考え方】\nPoEの後継で、1ポートあたり最大30Wを供給できる規格は、IEEE 802.3at（PoE+）です。導入予定のAPの最大消費電力は12Wなので、802.3afで足り、今回は採用しません。"}, "m34-1-6": {"a": "AP4：1台目のL2SWの5番ポート、AP5：2台目のL2SWの8番ポート。スタック接続：1台目のoutと2台目のin、2台目のoutと3台目のin、3台目のoutと1台目のinを接続し、リングにする。", "e": "【考え方】\nL2SWの給電能力は、装置全体で56Wです。APは、最大消費電力が12Wなので、56 ÷ 12 ＝ 4.67 より、1台のL2SWで接続できるAPは4台までです（4×12＝48W）。\n・AP4：1台目のL2SWの、8、7、6に続く5番ポートに接続する（4台まで）。\n・AP5：1台目では給電能力が足りないので、2台目のL2SWの8番ポートに接続する（上段の L2SW から順に、8番から降順）。\nスタック接続は、本文のとおり、1台のoutポートと別の1台のinポートをつなぎ、リングを構成します。\n\n【補足】\n公式の解答は図で示されています。AP4、AP5の接続は図のとおりです。スタック接続の細部（どのoutとどのinをつなぐか）は、図の太線から読み取った私の整理で、本文の「outとinを接続し、リングを構成する」と合う形で書いています。"}, "m34-2-1": {"a": "PC1 → AP1 → L2SW1 → L3SW1 → WLC → L3SW1 → L3SW2 → サーバ1", "e": "【考え方】\nモードBでは、データ用通信も、WLCとAPの間のトンネルを通ります。図1の構成で、PC1からサーバ1への流れは、次のとおりです。\n1. PC1 → AP1 → L2SW1 → L3SW1（APからWLCへのトンネルの途中）。\n2. L3SW1 → WLC（WLCがトンネルを終端する）。\n3. WLC → L3SW1 → L3SW2 → サーバ1。\nしたがって、WLCを経由するぶん、L3SW1を2回通ります。\n\n【補足】\nモードAは、WLCを経由せず、PC1 → AP1 → L2SW1 → L3SW1 → L3SW2 → サーバ1 と、直接つながります（図3）。"}, "m34-2-2": {"a": "データ用通信はWLCを経由していないので、影響はない。", "e": "【考え方】\nモードAでは、データ用通信が、WLCを経由せず、ノード間（AP、L2SW、L3SWなど）で直接行われます。WLCは、接続時の制御用通信にだけ使います。そのため、WLCが停止しても、すでに接続済みのPCのデータ通信には影響がありません。"}, "m34-2-3": {"a": "PC再起動", "e": "【考え方】\n接続済みのPCでも、WLCが停止していると、WLCとの制御用通信（認証など）ができません。再認証が必要になるのは、次の2つの場合です。\n・PCの再起動（接続し直すので、再認証が必要）。\n・ローミング（別のAPに移るときの再接続）。"}, "m34-2-4": {"a": "ローミング", "e": "【考え方】\n2つ目は、ローミング（別のAPに切り替わること）です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m34-3-1": {"a": "WLCの障害時に無線LAN経由の通信ができなくなるから", "e": "【考え方】\nモードBでは、すべての通信（制御用もデータ用も）が、WLCを経由します。そのため、WLCが障害になると、無線LAN経由の通信が、すべてできなくなります。WLCが単一障害点（SPOF）になるので、冗長化が必要です。"}, "m34-3-2": {"a": "WLCの処理能力", "e": "【考え方】\nモードBで、WLCがデータ用通信を全部引き受け、さらに本社のAPも一元管理する場合、当初のB君の計画（BCだけの管理、モードA想定）に対して、次の2つの性能要件を再検討する必要があります。\n・WLCの処理能力（BCと本社の全通信が集まる）。\n・広域イーサ網の帯域（データ用通信がWLCに集まり、WLCに向かう通信が増える）。"}, "m34-3-3": {"a": "広域イーサ網の帯域", "e": "【考え方】\n2つ目は、広域イーサ網の帯域です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m34-3-4": {"a": "本社無線LANの通信もBCを経由し、BCの広域イーサ網の通信量が増加する。", "e": "【考え方】\nWLCをBCに設置して、本社のAPも管理すると、本社の無線LANの通信（データ用通信）も、WLCがあるBCを経由します。そのぶん、BCの広域イーサ網の通信量が増加します。"}, "m34-3-5": {"a": "本社からDCへの通信が、BCを経由しなくなる。", "e": "【考え方】\nWLCをDCに設置すれば、本社の無線LAN端末からDCのサーバへの通信は、DCのWLCで折り返せます。BCを経由する必要がなくなるので、BCの広域イーサ網の通信量が増える問題は、解決します。"}, "m35-1-1": {"a": "チャネルボンディング", "e": "【考え方】\n隣り合う20MHzのチャネルを2つ束ねて、40MHz幅で通信する技術を、チャネルボンディングといいます。IEEE 802.11nの特徴の1つです。"}, "m35-1-2": {"a": "300", "e": "【考え方】\nIEEE 802.11nで、40MHz幅（チャネルボンディング）を使うと、20MHz幅（理論値144Mビット/秒）の2倍より少し多い、最大300Mビット/秒になります（サブキャリア数が増えるため）。"}, "m35-1-3": {"a": "MIMO", "e": "【考え方】\n送信側と受信側の両方で複数のアンテナを使い、同時に別々のデータを送って、受信側で合成する技術は、MIMO（Multiple-Input Multiple-Output）です。"}, "m35-1-4": {"a": "プリアンブル", "e": "【考え方】\nフレームの先頭に付けて、受信側が通信のタイミングをとるための信号を、プリアンブルといいます。802.11nのmixed modeでは、802.11gの端末にも通じるプリアンブルを付けて、同じチャネルで共存できるようにします。ただし、遅い方の通信速度に引きずられて、スループットが下がります。"}, "m35-1-5": {"a": "URLリライティング", "e": "【考え方】\nセッションID（SID）を、クッキーではなく、URLのパラメタに埋め込む方法を、URLリライティングといいます。クッキーを受け入れないブラウザがあるので、この方法を採用しました。"}, "m35-2-1": {"a": "宛先が同じ複数のフレームを連結して送信する。", "e": "【考え方】\nフレームアグリゲーションは、宛先が同じ複数のフレームを、1つにまとめて（連結して）送る仕組みです。送信前の待ち時間（フレームごとのアクセス制御）と、確認応答（ACK）の回数を、減らせます。"}, "m35-2-2": {"a": "無線チャネルの占有時間が長くなり、その間は他の通信が待たされる。", "e": "【考え方】\n複数のフレームを連結すると、1回の送信が長くなります。その間、同じチャネルを使う他の端末は、送信できず待たされます。そのため、リアルタイム性の高いアプリケーション（音声通信など）では、遅延が大きくなる影響があります。"}, "m35-2-3": {"a": "ファイルサーバとSWとの間", "e": "【考え方】\n無線LANが高速になると、有線側がボトルネックになります。ギガビットイーサネットにする区間は、データが集まる箇所です。次の2つです。\n・ファイルサーバとSWの間（カタログデータをダウンロードするため）。\n・SWとAPの間（APが多数の無線LAN端末の通信をまとめるため）。"}, "m35-2-4": {"a": "SWとAPとの間", "e": "【考え方】\n2つ目は、SWとAPの間です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m35-3-1": {"a": "モバイル端末の種類に対応した形式のページコンテンツを送るようにする。", "e": "【考え方】\n下線③は、「ノートPCとモバイル端末は、画面の大きさやブラウザの種類など、様々な仕様となっている」です。これに対応するには、Webアプリケーションが、端末の種類を判断して、それに合った形式のページ（画面サイズに適した内容）を返す必要があります。"}, "m35-3-2": {"a": "User-Agent", "e": "【考え方】\n端末（ブラウザ）の種類を判断するために、Webアプリケーションが参照するHTTPリクエストヘッダのフィールドは、User-Agentです。"}, "m35-3-3": {"a": "RPサーバ", "e": "【考え方】\nWebサーバの負荷を減らすために、SSLをWebサーバ以外の機器に実装します。モバイル端末は、RPサーバ（リバースプロキシ）を経由して、Webサーバにアクセスします。このRPサーバにSSLを実装すれば、暗号化・復号をRPサーバが引き受けるので、Webサーバの負荷が軽くなります。"}, "m35-3-4": {"a": "非SSLの通信時に、SIDが漏えいするおそれがある。", "e": "【考え方】\nSIDは、URLの中に埋め込まれています。図2のとおり、トップページ表示やカタログページなど、SSLを使わない（非SSL）通信では、URLが平文で流れます。その途中でSIDを盗み見られると、他人が、そのSIDを使って、ログイン中のセッションに成り済ます（セッションハイジャック）おそれがあります。"}, "m35-3-5": {"a": "非SSLの状態からSSLを利用する際は、SIDを振り直す。", "e": "【考え方】\nSIDが漏れる問題への対策です。図2で、非SSLで使ったSID（xxx）を、そのままSSLの通信（ログイン認証）で使い続けると、盗まれたSIDで成り済ませます。そのため、非SSLからSSLに移るとき（ログイン時）に、新しいSID（yyy）を発行し直します。\n\n【補足】\n図2では、ログイン認証後のSIDが、yyyに変わっています。ログアウト後（zzz）にも、新しいSIDが割り当てられます。"}, "m36-1-1": {"a": "ブロード", "e": "【考え方】\n搬送波の変調・復調でデータを送る方式は、ブロードバンド伝送方式（広帯域伝送）です。これに対し、デジタル信号をそのまま送る方式を、ベースバンド伝送方式といいます（イーサネットなど）。\n\n【補足】\nIPA講評は、アの正答率が低かった問題としています。「ベースバンド」と「ブロードバンド」の対比を押さえておきます。"}, "m36-1-2": {"a": "SX", "e": "【考え方】\n波長850nmのマルチモード光ファイバの規格は、1000BASE-SX です。1000BASE-LX は、波長1,310nmです。UTPではなくマルチモード光ファイバで配線するという本文とも合います。"}, "m36-1-3": {"a": "ポート", "e": "【考え方】\nルータが、TCP又はUDPのプロトコル種別、送信元及び宛先のポート番号とIPアドレスの組で、トラフィックを「フロー」として識別します。ポート番号は、トランスポート層のアドレスです。"}, "m36-1-4": {"a": "Trap", "e": "【考え方】\nSNMPで、管理対象の機器（V子機）が、状態の変化を、管理端末に自発的に通知するメッセージは、Trapです。リンク状態の変化を、Trapとして受け取り、アイコンの色の変化やブザー音で通知します。"}, "m36-1-5": {"a": "ディジタル著作権管理", "e": "【考え方】\nディジタルデータの著作権を保護し、利用や複製を制御する技術は、DRM（Digital Rights Management：ディジタル著作権管理）です。"}, "m36-2-1": {"a": "100", "e": "【考え方】\n1000BASE-Tのケーブル（UTP）の最大セグメント長は、100mです。"}, "m36-2-2": {"a": "主分電盤", "e": "【考え方】\n図1のとおり、製品Pは、電力線を伝送路に使います。親機は、伝送路の集線箇所に接続します。電力線の集線箇所は、変電設備にある主分電盤です。"}, "m36-2-3": {"a": "分配器", "e": "【考え方】\n製品Cは、テレビアンテナ用の同軸ケーブルを伝送路に使います。同軸ケーブルの集線箇所は、屋上の分配器です。（増幅器と分配器の間でも正解です。）"}, "m36-2-4": {"a": "伝送路が通信特性に優れている同軸ケーブルであること", "e": "【考え方】\n製品Pは電力線、製品Cは同軸ケーブル、製品Vは電話配線を使います。同じ通信技術を使う製品PとCを比べると、通信媒体の優位性は、同軸ケーブルのほうが、電力線より通信特性に優れています。電力線は、ノイズが多く、通信向けの媒体ではありません。"}, "m36-2-5": {"a": "製品Vの故障時に電話信号を素通しする機能", "e": "【考え方】\n製品Vは、電話交換機と主配線盤の間の電話配線を中継する形で、親機を接続します。親機が故障すると、電話の通信が途切れてしまいます。そこで、親機の故障時には、電話の信号をそのまま通す（素通しする）機能が必要です。"}, "m36-3-1": {"a": "4", "e": "【考え方】\nV親機1台には、V子機を25台収容できます。V子機は81台必要なので、81 ÷ 25 ＝ 3.24 より、V親機は最少で4台必要です。"}, "m36-3-2": {"a": "V子機：ポートAにPC、ポートBにSTBを接続する。V親機：ポートAは4ポートのVLAN（ルータ側）に、ポートBは3ポートのVLAN（左側）に、V親機の台数ぶんずつ接続する。VOD配信サーバ：2つのポートを、3ポートのVLANと4ポートのVLANに1つずつ接続する。ルータ：4ポートのVLANに接続する。", "e": "【考え方】\n次の順に考えます。\n1. V子機：本文から、ポートBの通信が優先されます。VODの通信（STB）は、通信帯域と遅延が重要なので、ポートBに接続します。PC（インターネット）は、ポートAです。\n2. V親機：V子機のポートA同士、ポートB同士は、同じVLANに属します。そのため、V親機のポートAは、1つのVLANに、ポートBは、別の1つのVLANに接続します。\n3. VOD配信サーバ：STBに配信するためにポートB側のVLANに、インターネットからコンテンツを蓄積するために、ルータがつながるポートA側のVLANに、それぞれ接続します。そのため、VOD配信サーバは、ポートが2つ必要です。\n4. ルータ：インターネットにつながるので、ポートA側のVLANに接続します。\n図2のL2SWは、3ポートのVLAN（左）と、4ポートのVLAN（右）の2つです。B側の3ポート（V親機のB×2、VOD配信サーバ1）と、A側の4ポート（V親機のA×2、VOD配信サーバ1、ルータ）になります。\n\n【補足】\nIPA講評は、「VOD配信サーバにポートが二つ必要なことを見抜いていない解答が散見された。未接続なポートを残したままの解答も多かった。解答に漏れがないように注意してほしい」としています。公式の解答は図で示されています。ここでは、図の接続を、本文のVLANの考え方から文章にした私の整理です。"}, "m36-3-3": {"a": "最大同時フロー数が同じであること", "e": "【考え方】\nルータの通信制御は、フロー単位で、占有帯域を均等にします。ブラウザは、1台のPCで、複数のフロー（TCPコネクション）を同時に使います。つまり、PC1台あたりの通信帯域は、「各フローの帯域 × PC1台あたりのフロー数」になります。そのため、どのPCも、最大同時フロー数が同じであれば、PC1台あたりの帯域がほぼ同じになります。\n\n【補足】\nIPA講評は、「フロー数を1にすることを指摘した解答が散見したが、ブラウザの実装としてこれは一般的でない」としています。解答は、フロー数を同じにする、という考え方です。"}, "m36-4-1": {"a": "無線アクセスポイントの設置に配線工事が発生する。", "e": "【考え方】\nXホテルの要件は、「客室内及び設備室内以外の配線工事も極力回避する」です。各階の廊下に無線LANのアクセスポイントを置くには、アクセスポイントの設置場所に、LANケーブルと電源の配線工事が必要です。これが、要件に反します。"}, "m36-4-2": {"a": "通信帯域又は通信遅延の条件を満足できないことがある。", "e": "【考え方】\nXホテルの要件は、VODの通信に、十分な帯域を確保し、遅延のゆらぎを抑えることです。無線LANは、電波を共有するので、客室の壁の影響や、同時に利用する端末の数によって、帯域や遅延が安定しません。そのため、条件を満たせないことがあります。"}, "m37-1-1": {"a": "メールデータの改ざん防止のため", "e": "【考え方】\nディジタル署名は、データが改ざんされていないこと（完全性）と、作成者を確認するための仕組みです。メールアーカイブは、メールを数年間保管し、必要なときに取り出します。保管中のメールが、あとから書き換えられていないことを、署名で証明できるようにします。"}, "m37-1-2": {"a": "24時間", "e": "【考え方】\nRPO（Recovery Point Objective）は、災害のときに、「どの時点までのデータに戻せればよいか」の目標です。表1のf（複製プロセスの所要時間の上限）は、「24時間以内（前日同時刻のメールは複製されていること）」です。本社が被災しても、副サーバには、24時間以内のメールまで複製されているので、RPOは24時間です。"}, "m37-2-1": {"a": "メールがランダムに到着する。", "e": "【考え方】\nM/M/1の1つ目のM（Markov）は、到着が、ランダム（ポアソン到着）であることを表します。つまり、到着の間隔が指数分布に従うことです。2つ目のMは、サービス時間も指数分布に従うこと、1は、窓口（処理するサーバ）が1つであることを表します。\n\n【補足】\nIPA講評で、(1)は、正答率が低かった問題です。「M/M/1ではランダム到着が前提となる。これは、単位時間の到着数がポアソン分布に従うこと、又は到着間隔が指数分布に従うことと数学的に同値である」としています。"}, "m37-2-2": {"a": "10", "e": "【考え方】\n表1の最繁時到着件数は、36,000件/時です。1秒あたりにすると、36,000 ÷ 3,600 ＝ 10 件/秒です。"}, "m37-2-3": {"a": "12.5", "e": "【考え方】\n表1の「サーバの処理能力」は、12.5件/秒です。これが、単位時間あたりの平均処理数 μ です。"}, "m37-2-4": {"a": "0.8", "e": "【考え方】\n利用率（ρ）は、到着率 λ と処理率 μ の比です。ρ ＝ λ ÷ μ ＝ 10 ÷ 12.5 ＝ 0.8 です。"}, "m37-2-5": {"a": "0.32", "e": "【考え方】\nM/M/1の平均待ち時間（待ち行列で待つ時間）は、次の式です。\nWq ＝ ρ ÷ (μ − λ) ＝ 0.8 ÷ (12.5 − 10) ＝ 0.8 ÷ 2.5 ＝ 0.32 秒。\n（平均系内数 L ＝ ρ ÷ (1 − ρ) ＝ 0.8 ÷ 0.2 ＝ 4.0 は、本文に与えられています。）\n\n【補足】\nIPA講評は、設問2では(1)と(2)エの正答率が低かった、としています。「平均待ち時間を求める公式とともに、待ち行列理論を確認していただきたい」とあります。処理中のものを含む平均系内数と、処理待ちだけの平均待ち時間（Wq）は、違う値です。"}, "m37-3-1": {"a": "0.44", "e": "【考え方】\n複製プロセスが、1日に転送するメールデータ量を、24時間で転送するために必要な回線速度を求めます。\n・1日のデータ量：189,000件 × 12.5×10^3 バイト ＝ 2,362,500,000 バイト。\n・ビットに直す：× 8 ＝ 18,900,000,000 ビット。\n・転送効率50%：必要な通信量 ＝ 18,900,000,000 ÷ 0.5 ＝ 37,800,000,000 ビット。\n・24時間（86,400秒）で割る：37,800,000,000 ÷ 86,400 ＝ 437,500 ビット/秒 ＝ 約0.4375 Mビット/秒。\n小数第3位を四捨五入して、0.44 Mビット/秒です。\n\n【補足】\n表1の「アーカイブ用の通信帯域は、0.25Mビット/秒単位で設定可能」なので、0.44を超える最小の値として、0.5Mビット/秒を割り当てます（本文）。"}, "m37-3-2": {"a": "13", "e": "【考え方】\n図3の下段（転送件数/時）は、0.5Mビット/秒のとき、1時間に9,000件（IDで2グループ）を、到着順に転送することを示しています。ID13は、上段で9:00〜10:00に到着しています。下段では、ID13が、13:00〜14:00の欄に入っています（ID11、12の次）。したがって、オは13です。"}, "m37-3-3": {"a": "14", "e": "【考え方】\nID13の転送は、13:00から14:00の間に行われます。カは14です。"}, "m37-3-4": {"a": "4", "e": "【考え方】\nID13のメール群は、9:00〜10:00に到着し、13:00〜14:00に転送されます。到着時刻と転送時刻の差は、約4時間です（9時台→13時台）。したがって、複製プロセスの所要時間は、約4時間とみなせます。"}, "m37-3-5": {"a": "42", "e": "【考え方】\n図3で、複製の所要時間が最大になるのは、到着から転送までの待ちが最も長い、最後のID（ID42）です。上段のID42は、夕方〜夜（19:00〜20:00頃）に到着し、下段のID42は、翌朝（5:00〜6:00頃）に転送されます。"}, "m37-3-6": {"a": "9", "e": "【考え方】\nID42のメール群は、到着が夜、転送が翌朝になります。その差は、約9時間と推定できます。所要時間の上限（24時間以内）より小さいので、要件を満たすと判断できます。\n\n【補足】\nIPA講評は、設問3は(2)ケと(3)の正答率が低く、「メール1件あたりの所要時間ではなく、メール全体の所要時間を算出しようとした解答などが散見された」としています。ここで求めるのは、到着から転送までの経過時間（滞留を含む）です。"}, "m37-3-7": {"a": "1", "e": "【考え方】\n割り当てる帯域を1.5Mビット/秒にすると、転送能力は、0.5Mビット/秒のときの3倍、27,000件/時です。到着件数が最も多い時間帯（9:00〜10:00の36,000件/時）では、転送能力を、9,000件上回ります。その分（最大9,000件、2グループ）は、次の時間帯に持ち越しますが、次の時間帯の到着数は少なく、そこで解消します。したがって、所要時間は、最大でも1時間です。"}, "m37-3-8": {"a": "到着件数が転送可能件数を上回るのはピーク時間帯だけで、次の時間帯には滞留が解消するため", "e": "【考え方】\n上の計算のとおり、到着件数が、転送可能件数（27,000件/時）を上回るのは、ピーク時間帯（9:00〜10:00）だけです。そのとき滞留したメールは、次の時間帯には、転送し終わります。つまり、滞留が、1つの時間帯を超えて続かないので、所要時間は、最大でも1時間です。"}, "m38-1-1": {"a": "UTM", "e": "【考え方】\nファイアウォール、VPN、Webフィルタリング、ウイルスチェックなど、複数のセキュリティ機能を、1台に統合した装置を、UTM（Unified Threat Management：統合脅威管理）といいます。"}, "m38-1-2": {"a": "再起動", "e": "【考え方】\nPCを再起動すると、そのたびに、元の状態（保護された状態）に戻る仕組みのツールを導入します。勝手に設定を変更されたり、ウイルスに感染したりしても、再起動で復旧します。"}, "m38-1-3": {"a": "TFTP", "e": "【考え方】\n簡易型のファイル転送プロトコルは、TFTP（Trivial File Transfer Protocol）です。ネットワーク機器の設定ファイルの転送などに使われます。UDPの69番ポートを使い、認証がありません。"}, "m38-1-4": {"a": "IPアドレス", "e": "【考え方】\nTFTPで構成管理SVからファイルを取得するコマンドでは、転送元のサーバを、IPアドレスで指定し、取得するファイル名を指定します。"}, "m38-1-5": {"a": "RJ-45", "e": "【考え方】\nLANのUTPケーブルの、8極8心のモジュラジャックは、RJ-45です。DSUとFWの接続にも、これを使います。電話のモジュラジャックは、RJ-11です。"}, "m38-1-6": {"a": "コミュニティ", "e": "【考え方】\nSNMP（v1/v2c）では、監視の対象範囲（管理するグループ）を表す名前を、コミュニティ名といいます。監視SVは、コミュニティ名を指定して、対象機器に問い合わせます。コミュニティ名は、簡易的なパスワードの役割ももちます。\n\n【補足】\nIPA講評は、ア、オ、カの正答率が低かった問題としています。「オ、カについては、頻繁に目にする用語である。きちんと把握しておいてほしい」とあります。"}, "m38-2-1": {"a": "T社DCのルータと店舗のFWの間", "e": "【考え方】\n本文より、「DC、店舗、監視センタの接続には、インターネットVPNを利用する」「DC及び監視センタのルータにはVPN機能をもたせ、店舗側はFWにVPN機能がある」です。VPNトンネルの設定区間は、次の3つです。\n・T社DCのルータと店舗のFWの間（業務用NWの通信）。\n・C社監視センタのルータと店舗のFWの間（監視、FWの更新）。\n・C社監視センタのルータとT社DCのルータの間（監視SVからDCの業務用NWの監視）。"}, "m38-2-2": {"a": "C社監視センタのルータと店舗のFWの間", "e": "【考え方】\n2つ目は、C社監視センタのルータと店舗のFWの間です。3つの区間は、順番が入れ替わっても構いません。"}, "m38-2-3": {"a": "C社監視センタのルータとT社DCのルータの間", "e": "【考え方】\n3つ目は、C社監視センタのルータとT社DCのルータの間です。C社は、業務用NWの監視サービスも、T社から乗り換えるので、DCの業務用NWを監視するための通信です。"}, "m38-2-4": {"a": "L2SW接続用のポートを確保する。", "e": "【考え方】\nFWの障害のとき、店舗の担当者が、利用可能なもう1台のFWに、L2SWを付け替えます。作業ミスを防ぐために、FWに対して事前に準備しておくべきことは、次の2つです。\n・もう1台のFWに、L2SW接続用のポート（空きポート）を確保しておく。\n・L2SWを付け替えた後の構成情報（設定）を、あらかじめ用意しておく。"}, "m38-2-5": {"a": "接続変更後の構成情報を用意する。", "e": "【考え方】\n2つ目は、接続変更後の構成情報（もう1台のFWに、そのL2SW配下を収容するための設定）を、事前に用意しておくことです。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m38-2-6": {"a": "FW接続ポートとPC接続ポート間は通信できる。", "e": "【考え方】\n店舗のL2SWは、FW側（アップリンク）と、会員用PC側につながります。VLANで実現する通信条件は、次の2つです。\n・FW接続ポートとPC接続ポートの間は、通信できる（許可）。\n・PC接続ポート同士では通信できない（遮断）。\n本文の「店舗内セグメントでは、L2SWの機能によって、会員用PC間の通信を遮断する」に対応します。ただし、PCは、FWを経由して、インターネットにアクセスできる必要があります（許可が通信要件になる）。\n\n【補足】\nIPA講評は、設問2(3)の正答率が低かったとしています。「通信要件には、遮断だけでなく、許可が含まれることに気づかなかったようだ。VLANの構成を設計する際には、端末側だけでなくアップリンク側も考えてほしい」とあります。"}, "m38-2-7": {"a": "PC接続ポート同士では通信できない。", "e": "【考え方】\n2つ目は、PC接続ポート同士では通信できないことです（会員用PC間の通信を遮断し、他の会員への攻撃や感染を防ぐ）。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m38-3-1": {"a": "S社の担当者にメールが大量に送られ、重要なものを見落としてしまう。", "e": "【考え方】\n店舗のFWが故障すると、FWの先につながる、店舗内の多数の機器（L2SW、PC、POS端末など）が、同時に監視SVから見えなくなります。監視SVは、対象機器ごとに、異常を検知して、S社の担当者にメールで通知します。そのため、1つの原因（FW故障）で、同時に多数の通知メールが、S社の担当者に大量に送られ、他の重要な通知を見落としてしまうおそれがあります。"}, "m38-3-2": {"a": "複数の検知内容を一つのメールにまとめるようにする。", "e": "【考え方】\n大量のメールが送られる問題の回避方法は、監視SVの設定で、複数の検知内容を、1つのメールにまとめて通知するようにすることです。（ほかに、上位機器が故障しているときは、下位機器の通知を抑止する方法も考えられます。）"}, "m38-3-3": {"a": "L2SWの設定情報を構成管理SVから転送する", "e": "【考え方】\n表1の手順は、次のとおりです。\n① 故障したL2SWのケーブルを抜く。\n② 予備のL2SWにログインして、IPアドレスを設定する。\n③ L2SWをFWに接続する。\n④ 設定情報を、構成管理SVから、TFTPで転送する（L2SWにログインして、構成管理SVのIPアドレスとファイル名を指定したコマンドを投入）。\n⑤ L2SWに設定情報を保存し、それをリブートする。\n⑥ 会員用PCをL2SWに接続する。\n⑦ 会員用PCが利用できることを確認する。\n④は、③でFWに接続して、構成管理SVと通信できるようになった後に、設定を取り込む作業です。"}, "m38-3-4": {"a": "会員用PCをL2SWに接続する", "e": "【考え方】\n⑥は、⑤で設定が反映された後、会員用PCを、L2SWに接続し直す作業です。接続順を、③のFW側の接続を先にして、PCの接続を最後にするのは、設定が済む前の、L2SWへの不要な通信を避けるためです。\n\n【補足】\nIPA講評は、設問3は(1)と(2)の正答率が低く、(3)は高かったとしています。"}, "m39-1-1": {"a": "対話型データ転送", "e": "【考え方】\nHTTPクライアントとサーバの通信には、2種類あります。\n・バルクデータ転送：大量のデータを一方向に転送する（ファイルのダウンロードなど）。\n・対話型データ転送：少量のデータを、交互にやり取りする（Webページの要求と応答など）。\nラウンドトリップ時間（往復時間）の影響を、直接受けるのは、1回ごとに応答を待つ、対話型データ転送です。"}, "m39-1-2": {"a": "バルクデータ転送", "e": "【考え方】\nバルクデータ転送の応答性能は、ラウンドトリップ時間のほかに、ボトルネックとなる中継路の帯域幅と、確認応答を待たずに送信できるデータ量（ウィンドウサイズ）によっても変化します。大量のデータを連続して送るので、帯域幅とウィンドウサイズが効きます。"}, "m39-1-3": {"a": "ウィンドウサイズ（Window Size）", "e": "【考え方】\n確認応答（ACK）を待たずに送信できるデータ量は、TCPのウィンドウサイズです。実効転送速度は、「ウィンドウサイズ ÷ ラウンドトリップ時間」に抑えられます。帯域幅を広げても、ウィンドウサイズが小さければ、速度は、ある値以上に上がりません。"}, "m39-1-4": {"a": "③", "e": "【考え方】\n図3のシーケンスを順に読みます。\n① SYN（接続要求）。\n（サーバからSYN, ACK）。\n② ACK（3ウェイハンドシェイクの最後。TCPコネクションの確立完了）。\n③ GETリクエスト（情報の取得要求）。\n④ 以降は、サーバからのデータの転送と、ACKです。\n⑤ ACK（最後の確認応答）。\nFIN（切断）が続きます。したがって、GETリクエストは③です。\n\n【補足】\nIPA講評は、オ〜キの正答率が低く、「図3は単純な通信シーケンス例であり、読み解く力を養ってほしい」としています。矢印の向き（クライアントからか、サーバからか）と、順序を、1本ずつ確認します。"}, "m39-1-5": {"a": "t2", "e": "【考え方】\nTCPコネクションの確立が完了するまでの時間は、URLの入力完了から、①SYNを送り、SYN, ACKを受けて、②ACKを送るまでです。t1（入力完了→SYN送信）と、t2（SYN→SYN,ACK受信）の合計です。したがって、エは t2 です。"}, "m39-1-6": {"a": "t3＋t4＋t5", "e": "【考え方】\nコネクション確立の完了（②）から、ダウンロードの完了（⑤の直前まで）にかかる時間は、t3＋t4＋t5 です。この間に、GETリクエスト、サーバからのデータ転送が行われます。"}, "m39-1-7": {"a": "t6＋t7＋t8", "e": "【考え方】\nダウンロードの完了から、TCPコネクションの切断（FIN、ACK、FIN、ACK）と、情報の表示が、ともに完了するまでの時間は、t6＋t7＋t8＋t9 です。カは、t6＋t7＋t8 です。"}, "m39-1-8": {"a": "t4＋t5", "e": "【考え方】\nキャッシュの情報が最新だと確認できた場合、サーバは、「304 Not Modified」だけを返し、コンテンツ本体は送りません。そのため、本体のダウンロードにかかる時間（t4＋t5）が省けます。したがって、TATは、t4＋t5 だけ短縮されます。"}, "m39-2-1": {"a": "プロキシ1上のプロキシサーバの定義を削除する。", "e": "【考え方】\n今の順序は、PC → プロキシ1（キャッシュ・URLフィルタ、先読みあり） → プロキシ2（ウイルスチェック） → Webサイトです。対策は、これを、PC → プロキシ2 → プロキシ1 → Webサイトに入れ替えることです（先読みをするプロキシ1を、Webサイト側（後ろ）にする）。\nPC側のproxy.pacの設定を変えないために、プロキシ1とプロキシ2のIPアドレスを入れ替えると、次の3つの作業が必要になります。\n1. プロキシ1上のプロキシサーバの設定から、上位のプロキシとして登録されているプロキシ2の定義を、削除する。\n2. プロキシ2（新しく前段になる側）のプロキシサーバの設定に、上位のプロキシとして、プロキシ1を定義する。\n3. proxy.pacを、プロキシ1からプロキシ2に移す（PCが取得するproxy.pacのURLのIPアドレスが、プロキシ2になるため）。"}, "m39-2-2": {"a": "プロキシ2のプロキシサーバとしてプロキシ1を定義する。", "e": "【考え方】\n2つ目は、プロキシ2のプロキシサーバ（上位のプロキシ）として、プロキシ1を定義することです。順番を入れ替えるので、プロキシ2が、プロキシ1に転送します。"}, "m39-2-3": {"a": "proxy.pacをプロキシ1からプロキシ2に移す。", "e": "【考え方】\n3つ目は、proxy.pacを、プロキシ1からプロキシ2に移すことです。proxy.pacの中には、PCがアクセスするプロキシのIPアドレスが書かれているので、新しく前段になる機器に置く必要があります。3つの作業は、順番が入れ替わっても構いません。\n\n【補足】\nIPA講評は、設問2(1)の正答率が低かったとしています。「本文を注意深く読めば、正答を導き出せるはずだが…変更が不要な、ファイアウォール、DNS、PCに関する誤った解答が目立った」とあります。"}, "m39-2-4": {"a": "ファイアウォールの処理能力", "e": "【考え方】\n問題の原因は、プロキシ1の先読み機能が、Cサイトのリンク先に対して、大量のTCPコネクションを作り、そのコネクションがプロキシ2を通って、プロキシ2の上限に達したことでした。順番を入れ替えると、先読みのコネクションは、プロキシ1から、ファイアウォールを直接通って、Webサイトに出ていきます。プロキシ2の過負荷はなくなりますが、大量のコネクションが、ファイアウォールを通るので、ファイアウォールの処理能力が、別のボトルネックになるおそれがあります。\n\n【補足】\nIPA講評は、設問2(2)の正答率が低かったとしています。「環境変更によって、問題となっていた通信特性がどのように変化するのかを理解する必要がある。設問3の作図とともに、再度、確認してほしい」とあります。"}, "m39-3-1": {"a": "左から、PC（ブラウザ）、プロキシ2、プロキシ1、ファイアウォールの順に並べる。PCとプロキシ2の間、プロキシ2とプロキシ1の間は、Cサイトアクセスによる、TCPコネクションを1本ずつ引く。プロキシ1とファイアウォールの間は、Cサイトアクセスによる1本と、先読みによる複数本を引く。ファイアウォールとCサイトの間は、Cサイトアクセスによる1本。ファイアウォールとほかのWebサイトの間は、先読みによる複数本を引く。", "e": "【考え方】\n対策後は、PC → プロキシ2 → プロキシ1 → ファイアウォール → インターネットの順です。\n・PC ⇔ プロキシ2：Cサイトのアクセスによる、TCPコネクション（1本）。\n・プロキシ2 ⇔ プロキシ1：同じく、Cサイトアクセスによる1本（プロキシ2は先読みをしないので、永続的接続の1本ですむ）。\n・プロキシ1 ⇔ ファイアウォール：Cサイトアクセスによる1本と、プロキシ1の先読みによる、複数本。\n・ファイアウォール ⇔ Cサイト：Cサイトアクセスによる1本。\n・ファイアウォール ⇔ ほかのWebサイト：先読みによる、複数本。\n先読みのコネクションが、プロキシ1から直接ファイアウォールに出るので、プロキシ2のコネクション数の上限（過負荷）の問題が、解消します。\n\n【補足】\n公式の解答は図です。ここでは、図の内容を文章で説明しました。凡例は、太い矢印（⇔）がCサイトアクセス、細い矢印（↔）が先読みによるTCPコネクションです。IPA講評は、設問3は、「本文を注意深く読み、その内容を正しく図示する必要がある。おおむねよくできていた」としています。"}, "m40-1-1": {"a": "統計", "e": "【考え方】\n独立した複数のトラフィック（それぞれにバーストがある）を、1つの伝送路に多重化すると、同時にピークが来る確率は低いので、帯域を効率よく共有できます。この効果を、統計多重効果といいます。\n\n【補足】\nIPA講評は、設問1のア、イの正答率が低かったとしています。「通信概論の領域についても、押さえておいてほしい」とあります。"}, "m40-1-2": {"a": "コーデック", "e": "【考え方】\n映像や音声の符号化（圧縮）と復号を行う装置、又はソフトウェアを、コーデック（CODEC：Coder/Decoder）といいます。動画の再生には、コーデックが必要です。"}, "m40-1-3": {"a": "エージェント", "e": "【考え方】\nSNMPの管理対象の機器（ここではRT2）で動作して、管理情報を提供するソフトを、SNMPエージェントといいます。SNMPマネージャが、エージェントに問い合わせます。"}, "m40-1-4": {"a": "MIB", "e": "【考え方】\nSNMPで管理される情報（オブジェクト）の集まりを、MIB（Management Information Base）といいます。ifInOctets（受信した総バイト数）、ifOutOctets（送信した総バイト数）は、MIBのオブジェクトです。"}, "m40-1-5": {"a": "FIFO", "e": "【考え方】\n入力パケットの量が、出力パケットの量以下のとき（混雑していないとき）は、パケットを入力した順に出力します。この仕組みを、FIFO（First In First Out：先入れ先出し）といいます。"}, "m40-2-1": {"a": "1,000", "e": "【考え方】\nTC1台あたりの平均使用帯域は、20kビット/秒です。40台なので、20 × 40 ＝ 800 kビット/秒。IP-VPNの伝送効率が0.8なので、確保すべき帯域は、800 ÷ 0.8 ＝ 1,000 kビット/秒です。\n\n【補足】\nIP-VPNの伝送効率は、「回線の速度のうち、実際にデータの転送に使える割合」です。IP-VPNのヘッダなどの分を引くので、必要な帯域は、その分を上乗せします（割り算）。"}, "m40-2-2": {"a": "データ圧縮", "e": "【考え方】\n画面転送時の伝送情報量を減らす技術（下線①の前半）は、次のようなものです。\n・データ圧縮（画面情報を圧縮して送る）。\n・差分伝送（画面の変化した部分だけを送る）。\n・プログレッシブ符号化（最初は粗く、徐々に細かく送る）。\nいずれか1つが答えです。"}, "m40-2-3": {"a": "帯域制御", "e": "【考え方】\n通信のバースト性を低減する技術（下線①の後半）は、帯域制御（トラフィックシェーピングなど）です。送信するデータの量を、一定の帯域に平準化して、バースト（一時的な増加）を抑えます。"}, "m40-2-4": {"a": "仮想PCと仙台拠点のプリンタ間の通信", "e": "【考え方】\nTCへ移行すると、PCの機能は、本社の仮想化SV上の仮想PCで動作します。仙台拠点のプリンタへの印刷データは、仮想PCから、仙台拠点のプリンタへ送られます。これは、新たに発生する、本社と仙台拠点間のIP-VPNを通る通信です。（以前は、仙台拠点のPCから、同じ拠点のプリンタに送っていた。）\n（「仮想化SVと仙台拠点のプリンタ間の通信」でも、正解です。）"}, "m40-2-5": {"a": "仙台拠点のPCと業務管理SV間の通信", "e": "【考え方】\n仙台拠点のPCが、TCになり、PCの処理は、仮想PCが行います。そのため、仙台拠点のPCから、本社の業務管理SVやファイルSVに直接アクセスする通信はなくなります（かわりに、本社内の仮想PCがアクセスする）。\n・仙台拠点のPCと業務管理SV間の通信。\n・仙台拠点のPCとファイルSV間の通信。"}, "m40-2-6": {"a": "仙台拠点のPCとファイルSV間の通信", "e": "【考え方】\n2つ目は、仙台拠点のPCとファイルSV間の通信です。1つ目と2つ目は、順番が入れ替わっても構いません。\n\n【補足】\nIPA講評は、設問2(3)について、「TC及び仮想PCの通信の関係を本文から読み取れていない解答が散見された」としています。"}, "m40-3-1": {"a": "7,500", "e": "【考え方】\nカウンタ値（ifInOctets、ifOutOctets）は、バイトの累計です。1分間の増分（バイト）を、kビット/秒にします。\n・ビットに直す：× 8。\n・k（1,000）で割る：÷ 1,000。\n・1分間（60秒）で割る：÷ 60。\n増分 × 8 ÷ 1,000 ÷ 60 ＝ 増分 ÷ 7,500。したがって、bは 7,500 です。"}, "m40-3-2": {"a": "SNMPの通信によるカウンタ値の増加を排除するため", "e": "【考え方】\nRT2のWAN側ポートのカウンタ値には、SNMPマネージャとの調査用通信（SNMPの通信）自体が、含まれてしまいます。LAN側ポートのカウンタ値には、SNMPの通信が含まれません（SNMPマネージャは本社にいる）。そこで、SNMPの通信によるカウンタ値の増加を排除するために、LAN側ポートのカウンタ値を取得します。"}, "m40-3-3": {"a": "カウンタのけたあふれ", "e": "【考え方】\nカウンタ値は、一定の桁数で、最大値に達すると、0に戻ります（ラップアラウンド）。この桁あふれが起きると、次の取得値が、前の値より小さくなり、増分が負になります。この場合は、カウンタの最大値を足して補正します（本文の「定数を加えて補正する」）。"}, "m40-3-4": {"a": "パケットの破棄による再送とウィンドウサイズの縮小が起こるから", "e": "【考え方】\nRTの優先制御では、優先パケットを先に転送し、非優先パケットは待たされます。待ち行列の長さが上限に達すると、非優先パケットは、破棄されます。TCPは、パケットが破棄されると、再送を行います。さらに、輻輳を検知して、ウィンドウサイズを小さくします。そのため、非優先の通信のTCP転送速度が、極端に低下します。"}, "m40-3-5": {"a": "動画一つの再生に必要な通信帯域", "e": "【考え方】\n画面転送とは別セッションで、動画情報が、仮想PCからTCに送られます。動画に必要な通信帯域が、IP-VPNの余剰帯域以下になるように、運用条件を検討します。想定すべき項目は、次の2つです。\n・動画1つの再生に必要な通信帯域。\n・拠点における動画の同時再生数。\nこの2つの積が、動画に必要な通信帯域の合計です。\n\n【補足】\nIPA講評は、設問3(5)について、「正答である二つの項目を指摘していない、あいまいな解答が多かった。仮想PCとTC間の別セッションの通信速度が、動画の再生情報量に相当することに気づいていない、又は通信帯域を確保することと優先制御を行うことの違いを理解していないと見られる解答が多かった」としています。"}, "m40-3-6": {"a": "拠点における動画の同時再生数", "e": "【考え方】\n2つ目は、拠点における動画の同時再生数です。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m41-1-1": {"a": "ホスト", "e": "【考え方】\nIDSには、2種類あります。\n・ネットワーク型IDS：監視対象のネットワークに設置して、流れるパケットを監視する。\n・ホスト型IDS：監視対象のWebサーバなどにインストールして、そのサーバのログなどを監視する。\nアは、ホスト型です。"}, "m41-1-2": {"a": "シグネチャ", "e": "【考え方】\n侵入検知の方法には、2つあります。\n・シグネチャ型（不正検知型）：不正なパケットの、一定のルールやパターン（シグネチャ）を使って検知する。\n・アノマリ型（異常検知型）：平常時のしきい値を超える異常なアクセスを、不正とみなす。\nイは、シグネチャです。\n\n【補足】\nIPA講評は、設問1のイの正答率が低かったとしています。「基本的な用語については基礎知識として習得してほしい」とあります。"}, "m41-1-3": {"a": "SQLインジェクション", "e": "【考え方】\nWebサーバへのアクセスを通じて、不正なSQL文を実行させる攻撃を、SQLインジェクションといいます。データベースの不正な操作や情報の漏えいにつながります。"}, "m41-1-4": {"a": "クロスサイトスクリプティング", "e": "【考え方】\nWebフォームなどに、不正なスクリプトを埋め込んで送り、別の利用者のブラウザで実行させる攻撃を、クロスサイトスクリプティング（XSS）といいます。"}, "m41-1-5": {"a": "シーケンス番号", "e": "【考え方】\nステートフルパケットインスペクションは、通過したパケットの、TCPヘッダのシーケンス番号などをセッションログとして保管して、パケットの到着順序に矛盾がないかを確認する機能です。矛盾したパケットは、遮断します。"}, "m41-2-1": {"a": "80番ポートに対するDoS攻撃", "e": "【考え方】\n表のアクセスログを見ます。\n・80番ポート：受信件数が 8,976,340 件で、通過可。\n・443番ポート：638件で、通過可。\n・その他のポート（1〜65535）：150件程度ずつで、通過否。\n80番ポートは、Webの通信に使うので、FWが通過を許可しています。この80番ポートに、大量のアクセスが来ているのは、不正なアクセスと思われます。通過が許可されたパケットなので、FWでは防げません。したがって、80番ポートに対するDoS攻撃です。"}, "m41-2-2": {"a": "データ部分の内容", "e": "【考え方】\nSQLインジェクションやクロスサイトスクリプティングは、TCPヘッダのチェックでは分かりません。パケットの、データ部分（HTTPリクエストの内容）に、不正なSQLやスクリプトが含まれているかを、調べる必要があります。したがって、着目すべきは、データ部分の内容です。"}, "m41-2-3": {"a": "不正な通信だけでなく適正な通信も異常として検知されてしまう。", "e": "【考え方】\nアノマリ型は、平常時のしきい値を超えるアクセスを、不正とみなします。\n・しきい値が高すぎる：不正なアクセスを、見逃します。\n・しきい値が低すぎる：正常な（適正な）アクセスまで、異常として検知してしまいます。\nこれが、下線①の弊害です。\n\n【補足】\nIPA講評は、設問2(3)について、「しきい値の高低とアクセス数の多少を混同している解答が多かった。また、しきい値を高く設定したときと低く設定したときを、全く逆に捉えている解答も散見された」としています。"}, "m41-3-1": {"a": "仮想IPアドレス", "e": "【考え方】\nFWの切替えが発生しても、通信が継続するように、FW1からFW2へ引き継がれる情報は、OSI基本参照モデルの第3層以下（ネットワーク層、データリンク層）では、次の2つです。\n・仮想IPアドレス（第3層）。\n・仮想MACアドレス（第2層）。\nFW1とFW2が、同じ仮想IPアドレスと仮想MACアドレスを共有し、切り替わっても、周りの機器は、設定を変えずにすみます（VRRPと同様の考え方）。"}, "m41-3-2": {"a": "仮想MACアドレス", "e": "【考え方】\n2つ目は、仮想MACアドレスです。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m41-3-3": {"a": "切り替わる前のFW1で保持していた、モバイル端末との接続のセッションログ情報", "e": "【考え方】\n下線②は、「営業部員は、FWが切り替わったことを意識せずに営業支援システムを継続利用できる」です。FWが切り替わっても、通信が切れないようにするには、FW2が、FW1がもっていた、通信中のセッション（TCPコネクション）の情報を、引き継ぐ必要があります。具体的には、FW1が保持していた、モバイル端末との接続のセッションログ情報（ステートフルパケットインスペクションが使うセッション情報）です。これを、FW1からFW2に、一定間隔で複製しておきます。"}, "m41-3-4": {"a": "営業支援システムの利用を一時制限して、切り戻し作業を行う。", "e": "【考え方】\n本文のとおり、FW2からFW1への管理情報の複製は、自動では行われないので、切り戻しは手動です。切り戻すと、FW2が保持していたセッション情報が引き継がれないので、利用中の営業部員は、システムを継続利用できず、セッションが切れます。そのため、営業支援システムの利用を、一時的に制限（利用者に周知して、利用を停止）して、切り戻しの作業を行います。"}, "m42-1-1": {"a": "BPDU", "e": "【考え方】\nスパニングツリープロトコル（STP）で、スイッチどうしが交換する制御フレームを、BPDU（Bridge Protocol Data Unit）といいます。BPDUで、ルートブリッジの選出や、ポートのブロック状態の決定を行い、ループを回避します。"}, "m42-1-2": {"a": "PoE", "e": "【考え方】\nIEEE 802.3af は、LANケーブルで電力を供給する規格で、PoE（Power over Ethernet）と呼ばれます。APのように、電源コンセントの近くに置きにくい機器に使われます。"}, "m42-1-3": {"a": "確認応答", "e": "【考え方】\nTCPは、受信側から返信される、確認応答（ACK）に基づいて、データの到達確認と再送を行います。無線LANの速度が下がっても、再送によって、HTとSK-SVの通信が、ある程度続けられた、と推測しています。"}, "m42-1-4": {"a": "ミラー", "e": "【考え方】\n特定のポートを流れるフレームを、別のポートにコピーして出力する機能を、ポートミラーリングといいます。コピー先のポートを、ミラーポートといいます。ミラーポートにトラフィックモニタを接続すると、通信されているフレームを解析できます。"}, "m42-1-5": {"a": "Auto MDI/MDI-X", "e": "【考え方】\n接続された機器のポートの属性（MDIかMDI-X）を識別して、自分のポートの結線を、ストレートかクロスに自動で切り替える機能を、Auto MDI/MDI-Xといいます。これがあると、機器どうしを、ストレートケーブルでもクロスケーブルでも接続できるので、誤接続でループができやすくなります。\n\n【補足】\nIPA講評は、設問1は、ア、イ及びオの正答率が低かったとしています。「基本的な技術用語は、確実に把握しておいてほしい」とあります。"}, "m42-2-1": {"a": "11", "e": "【考え方】\nIEEE 802.11bの最大伝送速度は、11Mビット/秒です。（802.11aと802.11gは54Mビット/秒です。）"}, "m42-2-2": {"a": "2", "e": "【考え方】\nUTPの4対のより対線のうち、IEEE 802.3af（PoE）は、2対を使って電力を供給します。（10BASE-T/100BASE-TXでは、通信に使う1、2、3、6番ピンの2対、又は、空いている4、5、7、8番ピンの2対のどちらかを使います。）"}, "m42-2-3": {"a": "広域イーサ網に接続しているポート", "e": "【考え方】\nL2SWは、受信したフレームの、送信元MACアドレスを学習して、そのMACアドレスがあるポートを、MACアドレステーブルに登録します。L2SW1は、本社にあります。HT（配送所）のMACアドレスのフレームは、広域イーサ網を経由して届きます。したがって、HTのMACアドレスのエントリが示すポートは、広域イーサ網に接続しているポートです。\n\n【補足】\nIPA講評は、設問2(2)について、「ブリッジテーブルの構造を理解していない解答が散見された」としています。HTのMACアドレスは、HTのいる側（配送所＝広域イーサ網の先）に向かうポートに登録されます。HTのつなぎ先のAPが切り替わると、L2SW3では、このエントリのポートが切り替わります。"}, "m42-2-4": {"a": "通信をESS IDごとにVLANと対応付ける機能", "e": "【考え方】\n下線②は、「ノートPCを無線LANに接続してHK-SVにアクセスする」です。HK-SVは、VLAN10です。HT（VLAN20）とは別のVLANです。APでは、無線LANの、ESS ID（ネットワーク名）ごとに、VLANを割り当てる機能が必要です。そうすると、同じAPで、HTはESS ID Aに（VLAN20）、ノートPCはESS ID Bに（VLAN10）、それぞれ接続させられます。L2SW3とAPの間は、タグVLANで接続されています。\n\n【補足】\nIPA講評は、設問2(3)について、「L2SW3とAP間がタグVLANで接続されていることと、字句に“ESS ID”を用いる指示があることに気付いていない受験者が多く、正答率は低かった」としています。"}, "m42-3-1": {"a": "ブロードキャストフレーム", "e": "【考え方】\n大量に通信されていたのは、ループによって繰り返し転送されたフレームです。ループが起きると、ブロードキャストフレーム（宛先MACアドレスがFF-FF-FF-FF-FF-FF）が、増え続けます。ブロードキャストフレームは、受信したポート以外の全ポートに転送されるので、ループの中を、いつまでも回り続けるからです。"}, "m42-3-2": {"a": "L2SWでの転送処理ではIPヘッダは評価されないから", "e": "【考え方】\nTTL（Time To Live）は、IPヘッダのフィールドで、ルータを通るたびに1減り、0になるとパケットが破棄されます。しかし、L2SWは、MACアドレスでフレームを転送する機器で、IPヘッダを見ません。そのため、L2SWの間をループしているフレームは、TTLが減らず、転送回数が制限されません。"}, "m42-3-3": {"a": "SWの4つのポートのうち2つにPCをつなぎ、残りの2つのポートを、それぞれL2SW2のVLAN1の2つのポートに接続した（SWとL2SW2の間を、同じVLAN1で、2本のケーブルでつないだ）。", "e": "【考え方】\n本文から、次のことが分かります。\n・SWとL2SW2の間を、2本のケーブルで接続した。\n・2本のケーブルをつないだL2SW2のポートは、今までどちらも未使用のポートであった。\n・工場出荷時のL2SWは、すべてのポートに、VLAN1が割り当てられている（未使用のポートはVLAN1のまま）。\n・大量に通信されていたのは、タグなしのフレームである（VLAN1は、タグを付加しない特別なVLAN）。\nしたがって、SWの2つのポートを、L2SW2の未使用のポートの、VLAN1の2つに接続しており、同じVLAN1の2つのポートがSWを介してつながるので、ループができます。\n\n【補足】\nIPA講評は、設問3(2)の図示について、「ループが発生する条件に着目しつつ、本文で説明されている接続を描けば解答できる問題であったが、SWのポートを接続するL2SW2のVLAN IDを間違えた解答が散見された」としています。公式の解答は図で示されています。ここでは、図を文章にしました（SWの4つのポートのうち、2つにPC、2つがL2SW2のVLAN1へ）。"}, "m42-3-4": {"a": "PCを接続しても直ちに通信が可能な状態にはならない。", "e": "【考え方】\nSTPを動作させると、ポートは、リンクアップ後に、すぐに転送状態にならず、ブロッキング、リスニング、ラーニングを経て、転送状態になります（30秒〜50秒程度かかる）。そのため、PCを接続しても、直ちには、通信できません。また、トポロジが変わるたびに、MACアドレステーブルが消去されるので、再学習までの間、フレームがフラッディングされ、VLAN内へのユニキャストフレームの流出が増加します。（どちらか1つを答えれば、正解です。）"}, "m42-3-5": {"a": "使用できないように閉そく状態にする。", "e": "【考え方】\n未使用のポートを、通信から隔離する設定方法は、次の2つです。\n・ポートを使用できないように、閉そく（shutdown）状態にする。\n・未使用のポートに、別のVLANを割り当てて、タグVLANでの中継から外す（他のVLANと通信できなくする）。\n誤接続があっても、ループなどが起きないようにします。"}, "m42-3-6": {"a": "別のVLANを割り当ててタグVLANでの中継から外す。", "e": "【考え方】\n2つ目は、未使用のポートに、別のVLANを割り当てて、タグVLANでの中継から外すことです。広域イーサ網側（タグVLANで中継されるVLAN1など）と、同じVLANにならないようにします。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m43-1-1": {"a": "Ajax", "e": "【考え方】\nJavaScriptの非同期通信で、画面全体を再読み込み（画面遷移）せずに、動的に画面を更新する技術を、Ajax（Asynchronous JavaScript + XML）といいます。Googleなどの、評判の高いWebメールに使われています。"}, "m43-1-2": {"a": "SMTP", "e": "【考え方】\nTCPのポート番号が25のプロトコルは、SMTP（メール送信）です。表の並びは、SMTP(25)、HTTP(80)、POP3(110)、IMAP(143)、HTTPS(443)、SUBMISSION(587)、IMAPS(993)、POP3S(995) です。"}, "m43-1-3": {"a": "POP3S", "e": "【考え方】\nTCPのポート番号が995のプロトコルは、POP3S（SSLを使ったPOP3）です。IMAPS(993) と並んで、受信用の暗号化プロトコルです。"}, "m43-1-4": {"a": "NAPT", "e": "【考え方】\n1つのグローバルアドレスを、複数のPCで共有するための、アドレスとポート番号の変換機能は、NAPT（IPマスカレード）です。"}, "m43-1-5": {"a": "CONNECT", "e": "【考え方】\nHTTPSでは、PCは、プロキシサーバに、CONNECTメソッドで、接続先（ASPサーバ）を指定します。プロキシサーバは、そのあと、通信の中身を見ずに、SSLセッションを中継します。そのため、プロキシサーバのウイルスチェックは、HTTPSの通信には効果がありません。"}, "m43-2-1": {"a": "アクセス設定でプロキシサーバのIPアドレスだけを許可する。", "e": "【考え方】\nX社のPCからインターネットへのアクセスは、プロキシサーバ経由です。J社のメールサービスの「アクセス設定（接続を許可するクライアントのIPアドレスを設定する）」で、プロキシサーバのIPアドレスだけを許可すれば、社内（プロキシサーバ経由）からだけの利用に限定できます。\n\n【補足】\nIPA講評は、設問2(1)(3)について、「表中の機能を選択し、その設定内容を解答する設問であったが、題意をよく理解しておらず、表中の機能を記述していない解答が多かった」としています。「アクセス設定」という機能名を、解答に入れます。"}, "m43-2-2": {"a": "社内から社内あてのメールのログが残っていないから", "e": "【考え方】\nメールのトラフィックを調べるために、R君は、内部メールサーバのログを使いました。外部メールサーバは、社外とのメールだけを中継します。社内から社内宛てのメールは、内部メールサーバだけで処理され、外部メールサーバを通らないので、外部メールサーバのログには残っていません。\n\n【補足】\nIPA講評は、設問2(2)について、「社内メールのSMTPトラフィックのルートに関する理解を問う簡単な設問であったが、POP3のトラフィックに着目した解答が多かった」としています。"}, "m43-2-3": {"a": "HTMLメールの表示機能を無効にする。", "e": "【考え方】\n下線①は、「OSやブラウザの脆弱性を悪用され、メールを閲覧するだけでPCがウイルスに感染することを防ぐ」対策です。悪意のあるスクリプトなどを含むHTMLメールを表示すると、閲覧するだけで感染するおそれがあります。表の「Webメール設定」の機能から、HTMLメールの表示機能を無効にします。"}, "m43-3-1": {"a": "MX", "e": "【考え方】\nドメイン宛てのメールの配送先（メールサーバ）を示すDNSのレコードは、MXレコード（Mail Exchanger）です。インターネットからのメールがASPサーバに保存されるように、X社のドメインのMXレコードの値を、ASPサーバに変更します。"}, "m43-3-2": {"a": "FQDN", "e": "【考え方】\nMXレコードの値は、メールサーバの、FQDN（ホスト名）です（IPアドレスではない）。ASPサーバのFQDNへ変更します。"}, "m43-3-3": {"a": "SMTPの機能を停止する。", "e": "【考え方】\n下線②は、「内部メールサーバの設定を変更すれば、PCのメールソフトでのメール送信はできなくなる」です。PCのメールソフトは、内部メールサーバのSMTPで、メールを送信しています。内部メールサーバの、SMTPの機能を停止すれば、PCのメールソフトからは、送信できなくなります（誤って使い続けても、新規メールが内部メールサーバに保存され続けることがなくなる）。"}, "m43-3-4": {"a": "受信プロトコルをIMAPにする。", "e": "【考え方】\n手順(e)は、PCのメールソフトの設定変更です。目的は、ASPサーバへの、メールデータのアップロード（f）の準備です。変更内容は、次の2つです。\n・受信プロトコルを、POP3から、IMAPにする（IMAPなら、メールデータをASPサーバにアップロードできる）。\n・受信サーバを、プロキシサーバにする（PCのメールソフトは、IMAPSに対応していないため、プロキシサーバのSSLゲートウェイ機能で、IMAPとIMAPSを変換する）。\n\n【補足】\nIPA講評は、設問3(3)について、「IMAPサーバとしてASPサーバを設定する誤った解答が多く、SSLゲートウェイを経由した通信方法への理解が不足していた」としています。"}, "m43-3-5": {"a": "受信サーバをプロキシサーバにする。", "e": "【考え方】\n2つ目は、受信サーバをプロキシサーバにすることです。PCのメールソフトは、IMAPSに対応していないので、直接ASPサーバにはつなげません。プロキシサーバのSSLゲートウェイ機能が、IMAPとIMAPSを相互に変換します。1つ目と2つ目は、順番が入れ替わっても構いません。"}, "m43-3-6": {"a": "作業期間ごとにIMAPを利用できる送信元IPアドレスを制限する。", "e": "【考え方】\n下線③は、「割り当てられた作業期間以外は、アップロード作業ができないようにするFWの設定」です。作業期間は、社員のグループ単位で割り当てられています。FWに、IMAPのアクセスを許可するときの、送信元IPアドレス（グループのPCのアドレス）を、作業期間ごとに制限します。PCのIPアドレスは固定なので、IPアドレスで、グループを区別できます。\n\n【補足】\nIPA講評は、設問3(4)について、「ファイアウォールを設定する上で必要になる、送信元IPアドレスやプロトコル名の記述が不足している解答が多かった。また、メールソフトはIMAPSに対応していないことが明記されているにもかかわらず、プロトコル名にIMAPSを記述している解答が多かった」としています。「作業期間ごと」「IMAP」「送信元IPアドレス」の3つの要素を入れます。"}, "m44-1-1": {"a": "セッション", "e": "【考え方】\nLBの機能は、次の3つです。\n・(i)処理の振分け：サーバへ処理を振り分ける。\n・(ii)セッション維持：同じユーザの通信を、同じサーバへ振り分け続ける。\n・(iii)ヘルスチェック：サーバの稼働状況を監視する。\nアは、セッション（維持機能）です。"}, "m44-1-2": {"a": "Cookie", "e": "【考え方】\nWebページにアクセスしたユーザに関する情報（セッションIDなど）を、ブラウザ側に保持する仕組みは、Cookie です。セッション維持を、レイヤ7（アプリケーション層）で行う方式では、CookieのセッションIDに基づいて、同じサーバに振り分けます。"}, "m44-1-3": {"a": "監視対象のポートに対して、コネクションの確立を試みる。", "e": "【考え方】\nLBのヘルスチェックには、3つのレイヤの方式があります。\n・レイヤ3：pingなどで、サーバ（IPアドレス）の応答を確認。\n・レイヤ4：TCPなどのポートに、コネクションの確立（3ウェイハンドシェイク）を試みて、確認。\n・レイヤ7：アプリケーションのレベル（HTTPのリクエストなど）で確認。\n本文では、eシステムのサービスポートの稼働状況を監視するために、レイヤ4方式を利用します。つまり、監視対象のポートに対して、コネクションの確立を試みる方法です。\n\n【補足】\nIPA講評は、設問1(2)について、「レイヤ4で稼働状況を監視する方式を問うたが、広く利用されているpingコマンドによるレイヤ3方式についての解答が多く、TCPの3ウェイハンドシェイクを記述した解答は非常に少なかった。各層で行われる稼働監視の目的と方式をよく理解してほしい」としています。"}, "m44-1-4": {"a": "三つのホスト名に、それぞれ3台のサーバのIPアドレスを設定する。", "e": "【考え方】\n通常時は、社内のPCを3つのブロックに分け、各ブロックのPCに、異なるeSVRのホスト名を指定させます。DNSで、3つのホスト名に、1つのVIP（LBの仮想IPアドレス）を対応付けて、LB経由でeSVRに接続します。LBが故障したときは、DNSの設定を変更して、3つのホスト名のそれぞれに、3台のサーバ（eSVR）のIPアドレスを設定します。そうすると、LBを経由せずに、DNSラウンドロビンのような形で、3台のeSVRに、処理を振り分けられます。"}, "m44-1-5": {"a": "サーバに接続したPCのIPアドレス", "e": "【考え方】\nソースNAT機能を使うと、LBは、PCからVIP宛てのパケットの、送信元IPアドレスを、LBの実アドレスに変換して、eSVRに転送します。eSVRから見ると、すべてのアクセスの送信元が、LBのIPアドレスになるので、eSVRのログには、サーバに接続したPCの本当のIPアドレスが残りません。これが、管理上必要な情報が取得できなくなる問題です。"}, "m44-2-1": {"a": "HRTMAC", "e": "【考え方】\n表1は、PC-y1（営業所、172.16.0.1）が、LBのVIP（10.10.0.1）に接続するときに、本社のLANで観測されたフレームです。\n項番1：PC-y1 → LB（VIP）。営業所から、IP-VPNを通って、本社のルータ1に届き、ルータ1から、LBにフレームが送られます。本社のLANで見えるフレームの、送信元MACアドレスは、ルータ1のMACアドレス（HRTMAC）、宛先MACアドレスは、LBのMACアドレス（LBMAC）です。\nしたがって、aは HRTMAC です。"}, "m44-2-2": {"a": "LBMAC", "e": "【考え方】\n項番1の宛先MACアドレスは、VIP（10.10.0.1）をもつLBのMACアドレス、LBMACです。"}, "m44-2-3": {"a": "SVR1MAC", "e": "【考え方】\n項番2：LB → eSVR1。LBが、eSVR1（10.10.10.1）に転送するときの、フレームです。宛先MACアドレスは、eSVR1のMACアドレス、SVR1MACです。"}, "m44-2-4": {"a": "172.16.0.1", "e": "【考え方】\n項番2の送信元IPアドレスです。本文のとおり、ソースNAT機能は利用しないことにしました。そのため、LBは、宛先IPアドレスだけを、eSVR1の実アドレス（10.10.10.1）に変換し、送信元IPアドレスは、PC-y1のまま（172.16.0.1）で転送します。dは 172.16.0.1 です。\n\n【補足】\nIPA講評は、設問2(1)cについて、「本文中に、負荷分散装置のソースNAT機能は利用しないと記述したが、これを理解していない解答が多かった。機器の動作については本文中に記述されているので、記述内容をしっかりと読み、理解してほしい」としています。"}, "m44-2-5": {"a": "通信相手でないサーバからのパケットを受信したこと", "e": "【考え方】\n表1の項番3を見ます。eSVR1が、PC-y1に返したフレームは、送信元IPアドレスが10.10.10.1（eSVR1自身）、宛先IPアドレスが172.16.0.1、宛先MACアドレスがルータ1（HRTMAC）です。eSVR1は、デフォルトゲートウェイのルータ1経由で、LBを通らずに、PC-y1に直接応答しています。\nPC-y1は、VIP（10.10.0.1）に要求を送ったので、VIPからの応答を待っています。ところが、届いたのは、10.10.10.1（通信相手ではないサーバ）からのパケットです。そのため、PC-y1は、それを自分の通信の応答とは認めず、処理が継続されません。"}, "m44-2-6": {"a": "サブネットマスク", "e": "【考え方】\n一度目の障害は、営業所のPC-y1（ルータ1を経由するPC）の問題で、eSVRのネットワーク設定を変更して解決しました。二度目の障害は、本社のPC-x1（10.128.1.1）からの利用です。本文のとおり、IPアドレスは、サブネットを設定せずに、クラスA（10.0.0.0/8）が使われています。eSVR1（10.10.10.1）から見ると、PC-x1（10.128.1.1）は、同じネットワーク（10.0.0.0/8）にあります。そのため、eSVRは、PC-x1へ、LBを経由せずに直接返します。\neSVRのサブネットマスクを、もっと長いもの（例：255.255.255.0）にすると、PC-x1は、別のネットワークと判断され、デフォルトゲートウェイ（LB）を経由して返送されるようになります。したがって、変更したのは、サブネットマスクです。\n\n【補足】\nIPA講評は、設問2(3)について、「同一ネットワークのPCに転送するパケットを、負荷分散装置経由に変える方法を問うた。本文の理解が不十分だったためか、サブネットマスクに言及した解答が非常に少なかった」としています。"}, "m44-3-1": {"a": "LBでの、PCあてのパケットのロスによる再送などに起因する転送遅延", "e": "【考え方】\nLBは、PC宛てのパケットを中継する経路にあります。音声や動画のように、リアルタイム性が必要な通信では、次の2つが原因になります。\n・LBでの、PC宛てのパケットのロスによる、再送などに起因する転送遅延。\n・LBの負荷（処理量）による、eSVRから返送されたパケットの転送遅延。\nどちらも、LBを経由するパケットが遅れ、音声が聞き取りにくくなったり、動画が停止したりするクレームにつながります。"}, "m44-3-2": {"a": "送信元IPアドレスが、仮想IPアドレスに変わったもの", "e": "【考え方】\nDSRは、eSVRから返送されたパケットを、LBを経由せず、PCに直接送信できるようにする機能です。DSRを機能させると、eSVRは、PCからのパケットの宛先IPアドレス（VIP）が、ループバックインタフェースの、IPアドレスと同じとき、そのアドレスを、eSVR自身のものとして使い、返送パケットの送信元にします。したがって、表2のフレームのうち、送信元IPアドレスが、eSVR1の実アドレス（10.10.10.1）から、仮想IPアドレス（10.10.0.1）に変わります。宛先IPアドレス（PC-x1）と、宛先MACアドレス（PCx1MAC）は、同じです。"}, "z45-1-1": {"a": "URL 又は 統一資源位置指定子", "e": "【考え方】\n空欄aの前後は、「マルウェアが仕込まれたWebサイトへのリンク先を示す［ a ］が本文に記載されていたりする」です。Webサイトの場所を示す文字列は、URL（Uniform Resource Locator、統一資源位置指定子）です。\n標的型メール攻撃の手口は、本文に、次の二つのいずれかを仕込むことです。\n・マルウェアが埋め込まれたファイルを、添付する。\n・マルウェアが仕込まれたWebサイトへのリンク（URL）を、書いておく。\n\n【補足】\n設問2(1)の「添付ファイルを開いたり、リンク先にアクセスしたりする」は、この二つの手口に対応します。設問5(2)で定める規程（添付ファイルを開かない、リンク先にアクセスしない）は、この裏返しです。"}, "z45-1-2": {"a": "HTTP", "e": "【考え方】\n空欄bは、「HTMLで作成されたコンテンツの送受信用プロトコルである［ b ］」です。HTMLコンテンツのやり取りに使うプロトコルは、HTTPです。\n本文は、バックドア（攻撃者のサーバとの通信路）の通信が、HTTPで行われると、業務での通信（Webアクセス）との区別が困難になると述べています。FWやプロキシサーバを通りやすく、通常のWebアクセスに紛れるので、発見しにくくなります。\n\n【補足】\nこの困難さへの対策が、本問の出口対策です。既設のプロキシサーバを、認証機能と復号機能をもつ機種に交換して、「マルウェアによるプロキシサーバ経由の通信を困難にする」ことと、「取得できるログの情報を増やす」ことが、ねらいです。IPA講評では、a、bは、c、d、eに比べて、正答率が高かったとしています。"}, "z45-1-3": {"a": "IPアドレス", "e": "【考え方】\n本文は、SMTPでは、送信者が自分のメールアドレスを容易に詐称できると述べたあとで、「しかし、送信元のMTA又はMUAが稼働するサーバ又はPCに設定されている［ c ］を書き換えることは困難である」と続けます。サーバやPCに設定されている情報のうち、通信の送信元を表すのは、IPアドレスです。\nここで、「困難」の理由を考えます。TCP/IP通信では、応答のパケットは、送信元IPアドレス宛てに返ります。送信元IPアドレスを偽ると、応答が偽ったアドレスの方へ行ってしまい、SMTPのようなTCP通信が成立しません。そのため、実際に接続してきた相手のIPアドレスは、詐称が困難です。\n\n【補足】\nIPA講評は、cは、TCP/IP通信の基本動作に関わる問いなので、正答を導き出してほしかったとしています。この「詐称が困難な情報」が、設問2(2)の、SPFが検証に使う情報（送信元MTAのIPアドレス）につながります。"}, "z45-1-4": {"a": "コンテンツフィルタリング", "e": "【考え方】\n空欄dの前後は、「SSL通信でも、受信したデータ中に不適切な言葉や文字列などが含まれていたとき、その通信を遮断する［ d ］や、Webサーバからダウンロードされるファイルに対するウイルスチェックなどの、セキュリティ対策が行えるようになる」です。通信の内容（言葉や文字列）を見て、遮断する機能は、コンテンツフィルタリングです。\n\n【補足】\n暗号化されたSSL通信は、通常のプロキシサーバでは、内容を見られません。そのため、コンテンツフィルタリングやウイルスチェックが、SSLの通信には効きませんでした。復号機能をもつプロキシサーバに交換すると、SSL通信の内容も検査できるようになります。"}, "z45-1-5": {"a": "トンネリング", "e": "【考え方】\n空欄eは、復号機能をもたない既設のプロキシサーバの動作の説明にあります。\n・PCは、WebサーバとSSL通信を行うとき、プロキシサーバ宛てにconnect要求を送る。\n・プロキシサーバは、connect要求に含まれる接続先サーバとの間で、指定された宛先ポート番号に対して、TCPコネクションを確立する。\n・その後、PCにconnect応答を送り、それ以降に受信したTCPデータを、そのまま接続先に転送する［ e ］処理の準備が整ったことを知らせる。\nデータの中身を見ずに、そのまま通す処理を、トンネリングといいます。\n\n【補足】\nこのとき、SSLセッションは、PCとWebサーバの間で、直接確立されます（設問3(1)）。プロキシサーバは、暗号化された内容を見られないので、検査ができません。IPA講評は、eは、c、dとともに正答率が低かったとしています。"}, "z45-2-1": {"a": "添付ファイルを開いたり，メールに記載されたリンク先にアクセスしたりする。", "e": "【考え方】\n下線（ア）は、「攻撃対象者と関係がありそうな組織、機関及び実在の人物を装ったメール」です。受信者が、そのメールを信用すると、次のどちらかの行動をとる可能性が高くなります。\n・添付されたファイルを開く。\n・メール本文に記載されたリンク先にアクセスする。\nどちらも、マルウェア（悪意のあるコードや、仕込まれたWebサイト）への感染につながります。メール送信者は、受信者に、これらの行動をとらせることを、誘導しようとしています。\n\n【補足】\n解答は、「添付ファイルを開く」「リンク先にアクセスする」の両方を書くのが無難です。設問5(2)の規程は、この行動を防ぐ内容になっています。"}, "z45-2-2": {"a": "メール送信元のMTAのIPアドレスが所属するドメインと，送信者のメールアドレスのドメイン", "e": "【考え方】\n本文は、「送信元のMTA又はMUAが稼働するサーバ又はPCに設定されているIPアドレスを書き換えることは困難である。そこで、（イ）ドメインを比較するだけでも、送信者のメールアドレスが詐称されているかどうかが、ある程度判別できる」と述べています。比較する二つのドメインは、次のとおりです。\n・実際にSMTPで接続してきた、送信元MTAのIPアドレスが所属するドメイン（詐称が困難な情報）。\n・メールに書かれた、送信者のメールアドレスのドメイン（詐称が可能な情報）。\n図2のSPFでも、エンベロープ中のメールアドレスのドメインのSPFレコードを問い合わせ、そこに登録されたメールサーバのIPアドレスと、実際の送信元を照合します。\n\n【補足】\n「メールアドレスのドメイン」だけでなく、「送信元MTAのIPアドレスの所属ドメイン」と対にして書くことが大切です。IPA講評は、(2)の誤った解答の例から、SMTPによるメール転送で、詐称が可能な情報と、詐称が困難な情報の違いが、十分には理解されていないことが推測されたと述べています。"}, "z45-2-3": {"a": "社外に送信されるメールの送信元IPアドレスになるから", "e": "【考え方】\n下線（ウ）は、「Y社でSPFを導入するときは、DMZの社外向けDNSサーバに、メール中継サーバのIPアドレスを記述したSPFレコードを追加する」です。Y社には、メールサーバが3台（本社メールサーバ、工場メールサーバ、メール中継サーバ）あります。そのうち、メール中継サーバのIPアドレスだけを書く理由は、表1のメールの転送経路から分かります。\n・本社から社外へのメール：PC → 本社メールサーバ → メール中継サーバ → 社外。\n・工場から社外へのメール：PC → 工場メールサーバ → 本社メールサーバ → メール中継サーバ → 社外。\nどの発信元でも、社外に最後に送出するのは、メール中継サーバです。社外のメールサーバから見た、Y社からのメールの送信元IPアドレスは、必ず、メール中継サーバのものになります。SPFレコードには、「このドメインのメールを送信するサーバ」を書くので、メール中継サーバだけで足ります。\n\n【補足】\n本社メールサーバと工場メールサーバは、社内のプライベートアドレスのサーバで、社外に直接メールを送りません。IPA講評は、(3)(4)は、本文の記述を理解すれば、SPFに関連する前提知識がなくても正答が導き出せる問いだったが、記述内容を読みこなせなかったのではないかと思われる解答が散見されたとしています。"}, "z45-2-4": {"a": "メール中継サーバ", "e": "【考え方】\nSPFの認証処理は、図2のとおり、メールを受信したサーバが行います。メールサーバ1（受信側）が、エンベロープ中のメールアドレスを基に、DNSサーバにSPFレコードを問い合わせ、回答されたメールサーバのIPアドレスと、実際の送信元を照合します。\nY社で、社外から送られてくるメールを、最初に受信するサーバは、メール中継サーバです（表1の、社外からのメールの経路：社外 → メール中継サーバ → 本社メールサーバ）。したがって、認証処理を実施させるサーバは、メール中継サーバです。\n\n【補足】\n理由は、次の(4)理由で問われます。"}, "z45-2-5": {"a": "社外からY社宛てに送信されたメールを直接受信するから", "e": "【考え方】\nSPFでは、SMTPで接続してきた相手の、IPアドレスを、SPFレコードのIPアドレスと照合します。表1のとおり、社外からのメールは、社外 → メール中継サーバ → 本社メールサーバ（→ 工場メールサーバ）の順に転送されます。\n・メール中継サーバ：社外のメールサーバと、直接SMTP接続します。接続相手のIPアドレスが、社外の送信元そのものです。\n・本社メールサーバ、工場メールサーバ：接続してくる相手は、社内のメール中継サーバや本社メールサーバです。接続相手のIPアドレスは、本来の送信元ではなく、社内のサーバのものです。\n後者で、SPFの認証をしても、本来の送信元のIPアドレスが分からないので、正しく検証できません。そのため、社外からY社宛てのメールを、直接受信する、メール中継サーバで、認証処理を行います。\n\n【補足】\n解答は、「社外から送信されたメールを直接受信する（送信元のIPアドレスが分かる）」ことを書きます。IPA講評は、(4)の理由の正答率が低かったとしています。"}, "z45-3-1": {"a": "PCとWebサーバの間", "e": "【考え方】\n設問は、復号機能をもたない、既設のプロキシサーバの場合です。図3の前の本文の説明のとおり、PCは、プロキシサーバ宛てにconnect要求を送ります。プロキシサーバは、接続先サーバとTCPコネクションを確立して、connect応答を返し、以降は、受信したTCPデータをそのまま転送するだけです。\nしたがって、SSLのやり取り（暗号化交渉、サーバ証明書の送付、共通鍵の生成）は、プロキシサーバを素通りして、PCとWebサーバの間で行われます。SSLセッションは、PCとWebサーバの間で、開設されます。\n\n【補足】\n復号機能をもつプロキシサーバでは、PCとプロキシサーバの間（④〜⑥）と、プロキシサーバとWebサーバの間（①〜③）で、別々のSSLセッションを開設します。この違いを、図3の名称（PC、プロキシサーバ、Webサーバ）で書きます。IPA講評は、設問3は、SSL関連の問題で、正答率が低かったとしています。"}, "z45-3-2": {"a": "プロキシサーバのルート証明書", "e": "【考え方】\n本文のとおり、復号機能をもつプロキシサーバは、図3の⑤で、サブジェクトのコモン名（CN）に、Webサーバのサーバ証明書1と同じ情報をもたせた、サーバ証明書2を生成して、PCに送ります。PCは、サーバ証明書2を検証して、認証できたら、⑥に進みます。\nサーバ証明書は、発行した認証局（CA）の署名を、PCが検証して、初めて、正当なものと判断されます。サーバ証明書2は、プロキシサーバが自分で（自分の認証局として）作った証明書です。そのため、PCが、これを正当と判断するには、サーバ証明書2を発行した認証局のルート証明書、すなわち、プロキシサーバのルート証明書を、PCに保有（信頼するものとして登録）させておく必要があります。\n\n【補足】\n20字以内で、「プロキシサーバのルート証明書」と書きます。これがないと、PCのブラウザは、証明書の検証に失敗して、警告を出します。"}, "z45-3-3": {"a": "プロキシサーバが，暗号化されたプリマスタシークレットを復号できないから", "e": "【考え方】\n下線（オ）は、「図3の⑤で、プロキシサーバがWebサーバから取得したサーバ証明書1をPCに送った場合、PCによるプロキシサーバの認証は成功する。しかし、⑥においてプリマスタシークレットの共有に失敗する」という説明です。\nSSLのハンドシェイクで、PCは、プリマスタシークレットを、サーバ証明書に含まれる公開鍵で暗号化して、サーバへ送ります。（RSAによる鍵交換の場合）\n・サーバ証明書1の公開鍵は、Webサーバの鍵のペアのものです。PCは、これで、プリマスタシークレットを暗号化します。\n・復号できるのは、対応する秘密鍵をもつ、Webサーバだけです。プロキシサーバは、Webサーバの秘密鍵をもっていません。\nそのため、プロキシサーバは、暗号化されたプリマスタシークレットを復号できず、共通鍵を生成できません。SSLセッションは、開設できません。\n\n【補足】\nプロキシサーバが、自分の鍵のペアで作った、サーバ証明書2を送るのは、このためです。サーバ証明書2の公開鍵に対応する秘密鍵は、プロキシサーバがもっているので、プリマスタシークレットを復号できます。IPA講評は、設問3(3)で、問題の趣旨に沿わない解答が散見されたとしています。「何が」「なぜ」できないのかを、SSLの手順に沿って、書きます。"}, "z45-4-1": {"a": "P3、IN", "e": "【考え方】\nポートA、Bは、L3SW1のP1〜P6のいずれかです。ルールの「送信元IPアドレス」と「宛先IPアドレス」から、どのセグメントを通る通信かを考えます。\n表4は、送信元が 192.168.1.0/24（部署1のセグメント）です。この送信元のパケットは、部署1のセグメントが接続されたポートから、L3SW1に入ってきます。したがって、ポートAは、図1で部署1のセグメントが接続されたP3です。方向は、L3SW1に入る方向のINです。\n\n【補足】\n表4の宛先は、192.168.11.0/24（本社サーバセグメント）、192.168.10.0/24（管理セグメント）、202.abc.1.0/28（DMZ）です。部署1のPCが、各セグメントに対して、どの通信を許可するかを決めています。IPA講評は、設問4は、業務で取り組むことが多かったためか、正答率が高かったとしています。"}, "z45-4-2": {"a": "P5、OUT", "e": "【考え方】\n表5は、送信元が、192.168.10.0/24（管理セグメント）、192.168.11.0/24（本社サーバセグメント）、202.abc.1.0/28（DMZ）で、宛先が、192.168.48.0/21（工場と営業所のセグメント）、192.168.51.128/25（工場サーバセグメント）です。本社側から、広域イーサ網の先（工場、営業所）へ向かう通信を制御するルールです。\nL3SW1から見ると、広域イーサ網に出ていくパケットなので、方向は、OUTです。ポートは、図1で、広域イーサ網側のL3SWに接続されたP5です。\n\n【補足】\nポートの位置は、図1のP1〜P6の接続先から決めます。表4の「部署1から入る」（P3、IN）と、表5の「広域イーサ網へ出る」（P5、OUT）で、方向が違う点を押さえます。"}, "z45-4-3": {"a": "部署1と本社サーバセグメント間の疎通テスト", "e": "【考え方】\n図4のパケットフィルタリングポリシは、次のとおりです。\n①PCからサーバへの業務用通信及びサーバ間の業務用通信を、表2、3どおり許可する。\n②上記①に加え、業務用通信区間における疎通テストのための通信を許可する。\n③管理PCについては、上記①、②の他に、他のセグメントのPC及びサーバへのリモート接続と疎通テストのための通信を許可する。\n④上記①〜③以外の通信を禁止する。\n表4の項番1は、部署1から本社サーバセグメント宛ての、TCPの許可（業務用通信）です。項番2は、同じ区間のICMPの許可です。ICMPは、pingなど、疎通確認に使うプロトコルです。ポリシ②の「業務用通信区間における疎通テストのための通信」に当たります。\n\n【補足】\n同様に、項番5（管理セグメント宛て）と、項番7（DMZ宛て）も、ICMP（疎通テスト）の許可です。目的は、25字以内で、「部署1と本社サーバセグメント間の疎通テストのため」のように書きます。"}, "z45-4-4": {"a": "動作：許可、送信元IPアドレス：192.168.1.0/24、宛先IPアドレス：192.168.11.0/24、プロトコル：UDP、送信元ポート番号：any、宛先ポート番号：53、TCP制御ビット：any", "e": "【考え方】\n下線（カ）は、「表4にルールの漏れが一つあるので、項番1、2の間に追加する」です。どのルールが漏れているかを、表3から考えます。\n表3のとおり、社内向けDNSサーバ（本社サーバセグメント、192.168.11.0/24）には、「全社のPC及びメールサーバからの名前解決要求への応答」という用途があります。部署1のPCも、名前解決のために、社内向けDNSサーバにアクセスします。DNSの問合せは、通常、UDPの宛先ポート53番です。\n表4の項番1は、TCPの許可、項番2は、ICMPの許可です。UDPの許可がありません。UDPの通信は、項番8（全て禁止）に該当してしまい、部署1のPCは、名前解決ができません。そこで、次のルールを追加します。\n・動作：許可\n・送信元IPアドレス：192.168.1.0/24\n・宛先IPアドレス：192.168.11.0/24\n・プロトコル：UDP\n・送信元ポート番号：any\n・宛先ポート番号：53\n・TCP制御ビット：any\n\n【補足】\nTCP制御ビットは、TCPの項目なので、UDPのルールではチェックしません（any）。表5の項番4（192.168.11.0/24 から 192.168.51.128/25 へのUDP、送信元ポート番号53）は、DNSの応答を、工場メールサーバへ返すルールで、向きが逆の例です。"}, "z45-4-5": {"a": "部署1のPCから管理PCに対して確立するTCPコネクションは禁止するが，逆方向に確立するTCPコネクションは許可する。", "e": "【考え方】\n表4の項番3と4は、宛先が 192.168.10.0/24（管理セグメント）で、TCPのルールです。\n・項番3：禁止。TCP制御ビットが SYN=1、ACK=0。\n・項番4：許可。TCP制御ビットは any。\nルールは、項番の小さい順に参照され、最初に該当したルールが適用されます。\n・SYN=1、ACK=0 のパケットは、TCPコネクションを新しく確立するときの、最初のパケットです。項番3で禁止されます。\n・それ以外のTCPパケット（ACK=1 など）は、項番4で許可されます。これは、すでに確立されたコネクションの、後続のパケットです。\nしたがって、部署1のPCから、管理PCに対して、新しくTCPコネクションを確立することは禁止されます。しかし、管理PCが、部署1のPCに対して確立したコネクションの、戻りのパケット（部署1から管理セグメントへ向かう）は、許可されます。\n\n【補足】\n図4のポリシ③「管理PCについては、他のセグメントのPC及びサーバへのリモート接続を許可する」の実現方法です。方向を明確にして書くのが、ポイントです。IPA講評は、(4)について、制御内容はおおむね理解できていても、その内容を適切に説明できていない解答が散見されたとしています。"}, "z45-5-1": {"a": "社外のWebサーバとの間のSSLで暗号化された通信においても，認証された利用者と通信内容が取得できる。", "e": "【考え方】\n本文は、プロキシサーバを、認証機能と復号機能をもつ機種に交換することで、「認証機能によって、マルウェアによるプロキシサーバ経由の通信を困難にさせるだけでなく、取得できるログの情報が増える」と述べています。新たにログとして取得できる情報は、次のとおりです。\n・認証機能によって、どの利用者がアクセスしたか（認証された利用者）。\n・復号機能によって、SSLで暗号化された通信の内容。\n・認証の失敗が連続した記録（マルウェアが、認証できずに、繰り返しアクセスしている）。\n解答例は、「SSLで暗号化された通信でも、認証された利用者と通信内容が取得できる」と、「認証に連続して失敗したログから、マルウェアの活動と推測できる情報が取得できる」の二つを挙げています。\n\n【補足】\n設問は60字以内です。「認証によって利用者を特定できる」ことと、「復号によってSSL通信の内容が分かる」ことを、短くまとめて書きます。IPA講評は、設問5は、実務で直面している課題だったためか、受験者の理解度が高かったとしています。"}, "z45-5-2": {"a": "・メールに添付されたファイルを開かない。", "e": "【考え方】\n下線（キ）は、「利用者が不審メールを発見したときの対応に関する規程を定め、運用規程に組み入れる」です。規程の内容は、次の五つが解答例です。この中から三つを挙げます。\n・メールに添付されたファイルを開かない。\n・メール本文に記載されたリンク先にアクセスしない。\n・メールが、正しい送信者から送信されたものか確認する。\n・不審なメールの内容を、セキュリティ担当者に報告する。\n・発見した不審なメールに関する情報を、全社で共有する。\n\n【補足】\n前の二つは、標的型メール攻撃の手口（添付ファイル、リンク先）に対する、利用者の行動の規程です。後の三つは、確認と、組織としての報告・情報共有の規程です。順番は問われません。"}, "z45-5-3": {"a": "・メール本文に記載されたリンク先にアクセスしない。", "e": "【考え方】\n五つの規程の中の一つです。1つ目〜3つ目で、重複しない内容を書きます。\n「メール本文に記載されたリンク先にアクセスしない」は、マルウェアが仕込まれたWebサイトへの誘導を防ぎます。ここで、アクセスしてしまうと、プロキシサーバ経由の通信になり、プロキシサーバの認証ログなどに、記録が残ります。"}, "z45-5-4": {"a": "・不審なメールの内容を，セキュリティ担当者に報告する。", "e": "【考え方】\n五つの規程の中の一つです。「セキュリティ担当者に報告する」と、「全社で共有する」は、別の項目です。利用者個人の対応だけでは、被害を防げません。報告を受けた担当者が、同じメールが他の社員にも届いていないかを調べたり、全社に注意喚起したりすることで、被害の拡大を防げます。"}, "z45-5-5": {"a": "マルウェアの社内での活動を，早期に発見できること", "e": "【考え方】\n下線（ク）は、「ログの検査間隔を可能な限り短縮して、定期的に検査を行う」です。検査の間隔を短くすると、ログに残ったマルウェアの活動（例：プロキシサーバの認証失敗の連続）を、早く見つけられます。期待される効果は、社内に侵入したマルウェアの活動を、早期に発見できることです。\n\n【補足】\n会話の中で、S主任は、「不審なメールへの対応と、社内に侵入したマルウェアの活動を発見するためのログの検査が、適切には行われていなかった」と調査結果を述べています。入口対策（SPF）で、完全に侵入を阻止することはできないので、侵入後の活動を、いかに早く見つけるかが、出口対策の重要な点です。"}, "z46-1-1": {"a": "インスタントメッセージ 又は チャット", "e": "【考え方】\n空欄aは、「音声データだけなら電話、テキストだけなら［ a ］、音声と動画を組み合わせることでビデオ会議」という列挙の中にあります。SIPのセッションで運ぶデータが、テキストだけの場合の用途は、インスタントメッセージ（チャット）です。\n\n【補足】\n本文は、SIPがセッションの生成、変更、切断を行うプロトコルで、セッション上でやり取りされるデータそのものは規定していないと述べています。データの種類は、通信相手とのネゴシエーション（SDP）で決まるので、電話のほかにも、チャットやビデオ会議にも応用できます。"}, "z46-1-2": {"a": "RTP 又は RTP と RTCP", "e": "【考え方】\n空欄bは、「音声データを転送する場合の一般的なプロトコルは、RFC 3550で規定された［ b ］」です。RFC 3550は、RTP（Real-time Transport Protocol）のRFCです。品質の報告に使うRTCPも、同じRFCで規定されているので、「RTP又はRTPとRTCP」が解答例です。"}, "z46-1-3": {"a": "UDP", "e": "【考え方】\n空欄cは、「RTPのトランスポート層のプロトコルには、リアルタイム性を重視し、再送制御を行わない［ c ］が使われる」です。再送制御を行わないトランスポート層のプロトコルは、UDPです。音声は、遅れて届いたパケットを再送しても役に立たないので、遅延が少ないUDPを使います。"}, "z46-1-4": {"a": "テキスト", "e": "【考え方】\n空欄dは、「SIPで使われるメッセージは、［ d ］形式で記述されるので、判読しやすい」です。図3のINVITEリクエストのように、SIPのメッセージは、HTTPと同様に、人が読めるテキスト形式です。解答例は「テキスト」です。\n\n【補足】\n図3は、先頭行、SIPヘッダ、空白行、ボディ（SDP）で構成されています。どの行も、文字で書かれていて、判読できます。"}, "z46-1-5": {"a": "URIから相手のIPアドレスを求め，相手にINVITEメッセージを送る。", "e": "【考え方】\n下線①は、「セッションの生成を仲介するサーバ」（SIPサーバ）の動作です。本文のとおり、UAは起動後、自分の利用者識別子とIPアドレスを含む登録メッセージを、SIPサーバに送って、初期登録します。SIPサーバは、この登録情報（URIとIPアドレスの対応）をもっています。\n図2のシーケンスで、発呼側が、通話相手のURIを指定して、INVITEをSIPサーバに送ります。SIPサーバは、次のように動作します。\n・INVITEのURIから、登録情報を基に、相手のIPアドレスを求める。\n・相手に、INVITEメッセージを送る（中継する）。\nこれで、発呼側は、相手のIPアドレスを知らなくても、通話を始められます。\n\n【補足】\nUA間で直接セッションを生成することも、できます。しかし、規模が大きい組織では、利用者が多く、URIの登録に手間がかかるので、SIPサーバを置きます。"}, "z46-2-1": {"a": "公衆IP電話網のSIPサーバ，IP-PBX", "e": "【考え方】\n下線②は、「VoIP-GWは、両方のSIPネットワークに対してUAとして振る舞う特殊なUAであるB2BUAになる」です。B2BUAは、通話の両側に、それぞれ別のUAとして動作して、メッセージを中継します。\n本文のとおり、UAは起動後に、SIPサーバへ初期登録します。図1と図2で、VoIP-GWがつながるSIPネットワークは、次の二つです。\n・公衆IP電話網（その中にも、SIPサーバがある）。\n・IP-PBX（A社のIPTシステムの、SIPサーバの役割を果たす）。\nしたがって、VoIP-GWが、UAとして初期登録する必要がある登録先は、公衆IP電話網のSIPサーバと、IP-PBXです。\n\n【補足】\n図2では、VoIP対応電話機（発呼側）→ 公衆IP電話網のSIPサーバ → VoIP-GW → IP-PBX → IPTEL（着呼側）の順にINVITEが流れます。VoIP-GWは、両側にUAとして登録されているので、この中継ができます。"}, "z46-2-2": {"a": "アドレス変換対象外のSIPメッセージ内に送信者のプライベートIPアドレスが含まれている。", "e": "【考え方】\n下線③は、「標準的なNAT装置では、通話セッションが生成できないという問題が発生する」です。原因を、図3から読み取ります。\nNAT（NAPT）は、IPヘッダのアドレスとTCP/UDPのヘッダのポート番号だけを変換します。ところが、図3のINVITEリクエストには、IPアドレスが、IPヘッダ以外の場所にも書かれています。\n・SIPヘッダのViaとContact：「発信元のIPアドレス」。\n・SDPのボディのo=とc=：「発信元のIPアドレス」。\n企業内のUAは、プライベートIPアドレスなので、これらの欄にも、プライベートIPアドレスが入ります。NAT装置が、SIPメッセージの中身（ヘッダやボディ）まで書き換えないと、相手には、インターネットから到達できないプライベートIPアドレスが伝わってしまい、相手は、そのアドレス宛てにセッション（RTP）を生成できません。\nしたがって、原因は、アドレス変換の対象外の、SIPメッセージ内に、送信者のプライベートIPアドレスが含まれていることです。\n\n【補足】\nIPA講評は、設問2(2)の正答率は低かったとしています。SIPメッセージの内容が、セッションの生成に、どのように使われるかの理解が必要です。"}, "z46-2-3": {"a": "SIPメッセージ内のIPアドレス情報を送信元であるVoIP-GWのグローバルアドレスに書き換える。", "e": "【考え方】\n下線④は、「この問題への対応機能をもつSBC」です。SBC（Session Border Controller）は、SIPネットワークの境界で、セッション生成を仲介するとともに、RTPパケットの中継も行います。\n問題は、SIPメッセージ内のプライベートIPアドレスです。図2の電話接続シーケンス例では、IPTELが着呼側で、公衆IP電話網のSIPサーバ側から見ると、VoIP-GWがSBCとして動作しています。SBCは、通過するSIPメッセージの、次の部分の「発信元のIPアドレス」を、VoIP-GWのグローバルアドレスに書き換えます。\n・Via、Contactヘッダ。\n・SDPのo=とc=。\nこれで、相手は、VoIP-GWのグローバルアドレス宛てに、シグナリングとRTPを送ります。VoIP-GWが、そのRTPを、本来の宛先に中継します。\n\n【補足】\n解答は、「SIPメッセージ内のIPアドレス情報（IPヘッダのアドレスではない）を、VoIP-GWのグローバルアドレスに書き換える」という内容が要点です。60字以内で、具体的に書きます。"}, "z46-3-1": {"a": "仮想スイッチのポートに該当するVLANの全てのフレームを出力し，仮想NIC側でそれらを全て取り込む動作", "e": "【考え方】\n下線⑤は、「ロガーの仮想NICと仮想スイッチの接続ポート間で、適切な動作をさせる」です。背景は、次のとおりです。\n・L2SWのポート3とポート6に入力したミラーポート出力フレームが、トランクで、物理サーバのNICから、仮想スイッチへ転送される。\n・仮想スイッチは、接続する仮想サーバのMACアドレスを、仮想化の仕組みで把握していて、通過するフレームによるMACアドレスの学習は行わない。\nミラーされたフレームの宛先MACアドレスは、VoIP-GWやIPTELのMACアドレスで、ロガーの仮想NICのMACアドレスではありません。通常のスイッチの動作では、宛先MACアドレスが、ロガーの仮想NICと一致しないフレームは、ロガーのポートに出力されません。\nそこで、次の動作をさせます。\n・仮想スイッチのポートは、該当するVLANの全てのフレームを、宛先MACアドレスに関係なく、出力する。\n・ロガーの仮想NICは、それらのフレームを、宛先MACアドレスに関係なく、全て取り込む（プロミスキャスモード）。\n\n【補足】\n60字以内で、仮想スイッチ側（全フレームの出力）と、仮想NIC側（全フレームの取込み）の、両方の動作を書きます。"}, "z46-3-2": {"a": "流入するフレームの宛先MACアドレスが既にポート3側に存在するとして登録されている。", "e": "【考え方】\n図4の構成を整理します。\n・ポート1は、利用企業1のVoIP-GWが接続された、VLAN 801のアクセスポートです。\n・ポート2は、ポート1を通過するフレームの、ミラーフレーム出力ポートで、VLAN 802です。\n・ポート2とポート3は、ケーブルでつながれ、ポート3もVLAN 802です。ミラーされたフレームは、ポート3から、L2SWに再入力されます。\n・ポート3の先のVLAN 802は、トランクポートの7を通って、物理サーバのNIC 8へ、仮想スイッチへと転送されます。\nこのL2SWは、VLAN単位に独立したMACアドレステーブルをもちます。\nミラーフレームは、VoIP-GWが送受信したフレームのコピーです。そのため、送信元MACアドレスは、VoIP-GWや通信相手のMACアドレスです。これらが、ポート3から流入するので、L2SWは、「そのMACアドレスは、ポート3側にある」と学習します。すると、流入するフレームの宛先MACアドレスも、すでに、ポート3側にあると登録されている状態になります。L2SWは、宛先が、入力ポートと同じ側にあるフレームを、転送せずに、破棄します。\nその結果、ミラーされたフレームが、トランクポートから出ていかず、(B)の位置を通過しません。原因は、L2SWのMACアドレステーブルで、流入するフレームの宛先MACアドレスが、すでにポート3側に存在するとして登録されていることです。\n\n【補足】\nIPA講評は、設問3は、スイッチのミラーポートの出力フレームを、トランクを使って仮想環境のサーバに取り込む方法を問う問題で、正答率が低かったとしています。ミラーポートの出力フレームでは、あるフレームの宛先MACアドレスが、別のフレームでは送信元MACアドレスになるので、受け取るポートでMACアドレスを学習すると、宛先ポートが、入力ポートと同一になってしまうことに、気付かない受験者が多かったとしています。ブリッジの動作原理の再確認が必要です。"}, "z46-3-3": {"a": "MACアドレス学習機能を抑止できるSWを使用し，通過するポート3で学習を抑止する。", "e": "【考え方】\n原因は、ポート3で、MACアドレスを学習してしまうことです。対応策は、ポート3のMACアドレスの学習を、止めることです。\nL2SWに、MACアドレスの学習機能を抑止できる機種を使い、ミラーフレームが流入するポート3で、学習を抑止します。学習しなければ、宛先MACアドレスは、ポート3側にあるとは判断されず、MACアドレステーブルにない（不明な）宛先のフレームとして、同じVLAN内の他のポート（トランクポート7）へ転送されます。\n\n【補足】\n解答は、「MACアドレスの学習を抑止できる」ことと、「ポート3で」という対象のポートを、50字以内で書きます。IPA講評は、ミラーポートの出力フレームの送信元MACアドレスが、出力したポートのMACアドレスだと誤解している解答も散見されたとしています。ミラーポートは、フレームを、そのままコピーして出力するので、送信元MACアドレスは、元のフレームのままです。"}, "z46-4-1": {"a": "音声パケットを中継しないから", "e": "【考え方】\n下線⑦は、「図1においてSRCを実装する機器を選択する」です。アクティブ方式のSRCは、「音声パケットを中継する機器上に、録音したい音声パケットをコピーして転送する機能を実装した」ものです。つまり、音声パケット（RTP）が通る機器でなければ、SRCを実装できません。\n図2のシーケンスのとおり、IP-PBXは、SIPのシグナリング（INVITEなど）だけを扱い、RTPは、通りません。RTPは、VoIP-GWとIPTELなどの間を、直接流れます（図5(b)でも、RTPの矢印は、IP-PBXの縦線を、素通りします）。\nしたがって、IP-PBXは、音声パケットを中継しないので、SRCを実装する機器として、選択できません。\n\n【補足】\n20字以内で、「音声パケットを中継しないから」と書きます。選択できる機器は、音声パケットを中継するVoIP-GW（SBCの機能をもち、RTPパケットの中継も行う）です。"}, "z46-4-2": {"a": "VoIP-GW", "e": "【考え方】\n図5(b)は、図1のIPTシステム構成に対応した、アクティブ方式の動作シーケンスです。縦線の機器は、左から、VoIP対応電話機、［ e ］、［ f ］、IPTEL、ロガーです。\n・SRCを実装する機器は、音声パケットを中継するVoIP-GWです（設問4(1)）。VoIP対応電話機（公衆IP電話網側）と、IPTELの間で、RTPを中継するのは、VoIP-GWです。eは、VoIP-GWです。\n・fは、IP-PBXです。VoIP-GWからのINVITEを受けて、IPTELへINVITEを中継します（図2と同じ流れ）。\neからは、ロガーへ、録音用セッションのINVITEが送られます（SRC→SRSのセッション生成）。\n\n【補足】\n図5(a)の概念図で、UA-A、SRC、UA-B、SRSと並ぶ順序は、図5(b)の、VoIP対応電話機、e（VoIP-GW）、f（IP-PBX）、IPTEL、ロガーの並びに対応します。"}, "z46-4-3": {"a": "IP-PBX", "e": "【考え方】\nfは、IP-PBXです。図5(b)では、VoIP-GWから届いたINVITEを、IPTELに中継し、200 OKを返します。呼制御（SIPのシグナリング）の仲介をしますが、音声（RTP）は、中継しません。"}, "z46-4-4": {"a": "(C)のシーケンス：VoIP-GW（e）とIPTELの間にRTP（双方向）、VoIP-GW（e）とロガーの間にRTP（VoIP-GWからロガーへの一方向）", "e": "【考え方】\n(C)には、「RTPパケットの送受信の繰返し」の間の、処理シーケンスを書きます。図5(a)の概念図と、図5(b)の構成を重ねて考えます。\n・VoIP対応電話機とVoIP-GWの間のRTP（双方向）は、すでに図に書かれています。\n・VoIP-GW（e）は、IPTELとの間で、RTPを、双方向でやり取りします。IP-PBXは中継しないので、矢印は、IP-PBXの縦線を通り越して、IPTELまで伸びます。\n・VoIP-GW（e）は、受信した音声パケットを、コピーして、ロガーへ転送します。録音用セッションのRTPで、方向は、VoIP-GWからロガーへの、一方向です。\nしたがって、(C)の枠内に、「eとIPTELの間のRTP（双方向）」と、「eからロガーへのRTP（一方向）」の、二本の矢印を書き加えます。\n\n【補足】\n図は、文章で答える形に直しています。IPAの解答例の図では、(C)の枠内に、この二本のRTPが書かれています。録音用セッションのINVITEが、図の上のほうで、すでに、VoIP-GWからロガーに送られている点も、手掛かりになります。"}, "z46-4-5": {"a": "VoIP-GWには呼制御に関するSIPセッション情報も送られてくるから", "e": "【考え方】\n図1の構成で、アクティブ方式を使うと、音声パケットだけでなく、「通話の属性情報」（呼情報）も、録音用セッションを介して取得できます。理由は、SRCを実装するVoIP-GWが、B2BUAとして、通話の両側のSIPセッションを終端していて、呼制御に関するSIPのセッション情報（誰から誰への通話か、いつ始まり、いつ終わったか）が、VoIP-GWに送られてくるからです。VoIP-GWは、その情報も、ロガーに通知できます。\n一方、パッシブ方式は、ミラーポートで、音声パケット（RTP）を含むフレームを受け取るだけです。呼制御のSIPメッセージが、別のポートや機器を通る場合には、別途、収集する必要があります。\n\n【補足】\nIPA講評は、設問4(4)で、通話する相手間で交わされるSIPメッセージと、ロガーサーバとの間で交わされるSIPメッセージが、同一と誤解している解答も見られたとしています。シーケンス図の表面的なメッセージ名だけでなく、具体的にやり取りされるメッセージの内容にも注意してほしい、とのことです。"}, "z46-4-6": {"a": "ミラーポート出力フレームの転送用設定が不要だから", "e": "【考え方】\nパッシブ方式の弱点は、これまでの設問のとおりです。\n・ミラーポートごとに、NICが必要になる（NIC搭載数が限られる環境では使いにくい）。\n・仮想サーバで動作させるには、ミラーフレームを転送するためのVLANを定義し、物理サーバのNICとL2SWをトランク接続にし、ミラーポート出力のためのケーブル接続（図4のポート2とポート3）や、MACアドレスの学習抑止などの設定が必要になる。\nアクティブ方式は、VoIP-GWが、音声パケットをコピーして、SIPで確立した録音用セッションで、ロガーに転送します。ミラーポートの出力フレームを、転送するための、L2SWや仮想スイッチの特別な設定が、不要です。\nしたがって、パッシブ方式に比べて、アクティブ方式の有利な点は、ミラーポート出力フレームの転送用設定が不要なことです。\n\n【補足】\nT君が、「音声パケットを収集するためのネットワークを構成する作業が大変だったので、別の手段を調査するよう」アドバイスしたことが、アクティブ方式を調べるきっかけです。"}, "z46-5-1": {"a": "IP01", "e": "【考え方】\n図6と表1から、FWのポート1、ポート2のルールを整理します。\n・FWのポート1は、IPsec-VPN装置（IP03）につながります。\n・FWのポート2は、SSL-VPN装置（IP04）につながります。\n・IP01は、利用企業拠点のIPsec-VPN装置の、固定のグローバルIPアドレスです。IP02は、拠点側のFWのアドレスです。\n表1の、ポート1の行は、宛先IPアドレスが IP03（IPsec-VPN装置）です。IPsecのトンネルを張る相手は、利用企業拠点のIPsec-VPN装置（IP01）です。したがって、送信元IPアドレスの欄アは、IP01です。\n\n【補足】\nIPsecのトンネルの端点は、IPsec-VPN装置どうし（IP01とIP03）です。FWは、拠点側でも、A社センタ側でも、通信を通すだけです。アに、IP02（拠点側のFW）を入れるのは、誤りです。"}, "z46-5-2": {"a": "Any", "e": "【考え方】\n表1のポート2の行は、宛先IPアドレスが IP04（SSL-VPN装置）、プロトコル番号が any です。接続してくるのは、モバイル環境のPCです。図6で、IP01〜IP05は、固定のグローバルIPアドレスですが、モバイル環境のPCには、固定のグローバルIPアドレスがありません（出張先などから接続するので、接続元のIPアドレスが定まりません）。\nしたがって、送信元IPアドレスの欄イは、制限をかけられないので、Any（チェックしない）にします。\n\n【補足】\n表の注記のとおり、any は、パケットフィルタリングにおいてチェックしないことを示します。モバイル環境のPCは、セキュリティ確保のために、接続PCごとに認証を行います（本文）。送信元IPアドレスで制限しない代わりに、SSL-VPN装置での認証で、接続を制御します。"}, "z46-5-3": {"a": "Any", "e": "【考え方】\n表1のポート1の行は、宛先 IP03（IPsec-VPN装置）に対して、2種類の通信を許可しています。\n・ポート番号 500、プロトコル 17（UDP）：IKE（鍵交換）。\n・ポート番号［ ウ ］、プロトコル 50（ESP）：IPsecのデータ通信（ESPで暗号化されたパケット）。\nESP（プロトコル番号50）は、IPの上位プロトコルの一つで、TCPやUDPと違い、ポート番号がありません。ポート番号が存在しないので、ウは、Any（チェックしない）です。\n\n【補足】\nIPsecのファイアウォール設定では、IKEのUDP 500番と、ESP（プロトコル番号50）を許可します。NATトラバーサルを使う場合は、UDP 4500番も必要ですが、この表には、ありません。"}, "z46-5-4": {"a": "443", "e": "【考え方】\n表1のポート2の行は、SSL-VPN装置（IP04）宛てで、プロトコルは any です。本文のとおり、モバイル環境のPCは、A社センタへの接続に、HTTPSを使います。HTTPSの宛先ポート番号は、443です。したがって、エは、443です。\n\n【補足】\nSSL-VPN装置は、HTTPS（SSL/TLS）の通信を終端して、認証されたPCに対して、レイヤ2のトンネルを提供します（下線⑧）。FWでは、そのHTTPS（TCP 443）を、許可すれば足ります。"}, "z46-5-5": {"a": "サービス提供用内部LANのネットワークに属するIPアドレス", "e": "【考え方】\n下線⑧は、「認証されたPCは、新たな仮想NICを生成し、レイヤ2のトンネルを通して、サービス提供用内部LANとの通信が可能になる」です。\nPCが、サービス提供用内部LAN上のIP-PBXなどと通信するには、PCの仮想NICが、そのLANと、同じネットワークに属している必要があります。レイヤ2のトンネルで延長されているので、PCは、サービス提供用内部LANの一員のように見えます。そのため、生成された仮想NICには、サービス提供用内部LANのネットワークに属するIPアドレスを、付与する必要があります。\n\n【補足】\nアドレスの付与は、通常、SSL-VPN装置やDHCPなどから行います。35字以内で、「サービス提供用内部LANのネットワークに属するIPアドレス」と書きます。"}, "z46-5-6": {"a": "ネットワーク機器ごとに異なるハードウェアを用意せずに済むから", "e": "【考え方】\n下線⑨は、「FWやVPN装置などのネットワーク機器が仮想化されている場合、ハードウェア障害に備えた冗長化を実現する上で、コスト面での利点もある」です。\n従来は、FW、IPsec-VPN装置、SSL-VPN装置など、機能ごとに別々のハードウェアを用意し、それぞれ冗長化するには、機器の種類ごとに予備のハードウェアが必要でした。\nネットワーク機器が、仮想サーバで動作するソフトウェアとして提供されると、すべての機能が、同じ種類の物理サーバ（仮想サーバ用のハードウェア）の上で動きます。ハードウェア障害に備えるときも、予備の物理サーバを共通に用意すれば足ります。ネットワーク機器ごとに、異なるハードウェアを用意せずに済むので、コスト面で利点があります。\n\n【補足】\nIPA講評は、設問5(3)では、ハードウェア障害に対応するための冗長化構成のコストメリットを問うたのに対し、一般論の解答が散見されたとしています。設問の趣旨に沿って、「予備のハードウェアを、機器ごとに用意する必要がない」ことを、明確に解答するよう、心掛ける必要があります。"}, "z47-1-1": {"a": "L3SW 又は レイヤ3スイッチ", "e": "【考え方】\nVLAN間（サブネット間）の通信を中継する機器は、レイヤ3スイッチ（L3SW）です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。空欄の前後の文脈は、問題文で確認してください。"}, "z47-1-2": {"a": "最小", "e": "【考え方】\nSTPで、ルートブリッジへのパスコストが最小の経路を選ぶ、という動作を指しています。ルートポートは、ルートブリッジまでのパスコストが最小のポートです。\n\n【補足】\nこの解説は、解答例の確認と、STPの一般的な動作に基づいています。"}, "z47-1-3": {"a": "802.11", "e": "【考え方】\n無線LANの最初の標準規格は、IEEE 802.11です。IPA講評では、ウ、エ、オは、無線LANの最初の標準規格に関連するもので、忘れられていたのではないか、と推測されています。基本となる技術なので、理解しておくことが求められています。"}, "z47-1-4": {"a": "暗号化", "e": "【考え方】\n最初の無線LANの規格では、セキュリティ機能として、WEPによる「暗号化」が定められていました。後の802.11i（WPA2）で、暗号化方式が強化されました。"}, "z47-1-5": {"a": "RC4", "e": "【考え方】\nWEPの暗号化アルゴリズムは、ストリーム暗号のRC4です。WEPは、鍵の予測が容易なので、その後、WPA（TKIP）、WPA2（CCMP、AES）に置き換えられました。"}, "z47-1-6": {"a": "ESSID 又は SSID", "e": "【考え方】\n無線LANのネットワークを識別する名前は、SSIDです。複数のAPで、同じネットワークを構成するときは、ESSID（拡張SSID）といいます。"}, "z47-2-1": {"a": "L2SW3のP21とL2SW4のP21の組", "e": "【考え方】\n図1で、物理サーバは、スタック接続されたL2SW3とL2SW4の両方に接続されています。L2SW3のP21とL2SW4のP21は、同じ物理サーバに接続された組です。この組が、リンクアグリゲーションの組になっています。\n\n【補足】\nこの解説は、図1の構成の読み取りです。もう一組は、次の(1)2組目です。1組目と2組目は、順番が入れ替わっても構いません。"}, "z47-2-2": {"a": "L2SW3のP22とL2SW4のP22の組", "e": "【考え方】\nもう一組は、L2SW3のP22とL2SW4のP22の組です。もう一方の物理サーバに接続されたポートの組です。"}, "z47-2-3": {"a": "L3SW1", "e": "【考え方】\nVRRPのマスタルータは、VRRPの優先度が高い機器がなります。表1の設定から、仮想ルータVR1の優先度は、L3SW1のほうが高いので、L3SW1がマスタです。\n\n【補足】\nこの解説は、解答例とVRRPの一般的な動作に基づく説明です。表1の優先度の数値は、問題文で確認してください。"}, "z47-2-4": {"a": "L3SW1からL2SW2のP11への経路のパスコスト値が最も大きいから", "e": "【考え方】\nSTPでは、ルートブリッジ以外のスイッチは、ルートブリッジまでのパスコストが最小のポートを、ルートポートに選びます。そのほかのポートは、ブロッキングポートになります。L2SW2には、P11（L3SW1側）とP12（L3SW2側）があります。ルートブリッジからの合計のパスコストは、P11のほうが大きいので、P11がブロッキングポートになります。\n\n【補足】\nIPA講評は、STPに関する問題は正答率が高かったとしています。ルートブリッジからのパスコストの合計の比較（図1のcst1〜cst3の合計）が、根拠になります。"}, "z47-2-5": {"a": "L2SW4のP23", "e": "【考え方】\nL2SW3とL2SW4は、スタック接続されているので、論理的には一つのスイッチとして扱われます。L3SW1とL3SW2の両方にそれぞれ接続されているP23のうち、一方がブロッキングポートになります。解答例では、L2SW4のP23です。\n\n【補足】\n機器名とポートIDの両方を書きます。この解説は、図1の構成とSTPの一般的な動作を基にした説明です。"}, "z47-2-6": {"a": "L2SW1→L3SW1", "e": "【考え方】\nPC1から仮想サーバ3への経路です。PC1は、L2SW1に接続しています。L2SW1のブロッキングポートを考えると、通常、L3SW1側へ向かいます。そこから、L2SW3とL2SW4を経由して、仮想サーバ3に届きます。\n\n【補足】\n(A)は「L2SW1→L3SW1」です。この解説は、図1の構成の読み取りです。"}, "z47-2-7": {"a": "L3SW1→L3SW2→L3SW1→L2SW1", "e": "【考え方】\n仮想サーバ3からPC1への戻りの経路です。L2SW3とL2SW4を出たフレームは、まずL3SW1に入ります。仮想サーバ3の側のデフォルトゲートウェイ（VRRPのマスタ）がL3SW2であるため、L3SW1からL3SW2へ転送され、L3SW2で、PC1宛てにルーティングされます。次に、再びL3SW1を経由して、L2SW1からPC1に届きます。行きと戻りで、経路が異なります。\n\n【補足】\nIPA講評は、設問2は、STP、VRRP及びリンクアグリゲーションが混在した複雑な動作に関する設問だったが、全体として正答率は高かったとしています。この解説は、解答例と図1の構成からの推論を含みます。"}, "z47-3-1": {"a": "暗号化されたデータが盗聴されてしまうこと", "e": "【考え方】\n下線（あ）は、無線LANの暗号化に使う鍵（共有鍵など）に関するセキュリティリスクです。鍵が知られると、暗号化された通信データを、第三者が盗聴できてしまいます。解答例は、「暗号化されたデータが盗聴されてしまうこと」です。\n\n【補足】\nこの解説は、解答例の確認に基づいています。"}, "z47-3-2": {"a": "・IEEE 802.1Xの認証が不要になるから ・再認証が不要になるから", "e": "【考え方】\nローミングの際に、接続先のAPで、改めてIEEE 802.1Xの認証をやり直すと、時間がかかります。下線（い）の方式では、WLC（無線LANコントローラ）などが認証情報を共有して、接続先のAPで再認証が不要になるので、ローミング時間が短縮されます。解答例は、「IEEE 802.1Xの認証が不要になる」又は「再認証が不要になる」です。\n\n【補足】\n図2の手順は、問題文で確認してください。"}, "z47-3-3": {"a": "・MN1のデフォルトゲートウェイに接続できないから ・MN1と通信相手の間でコネクションが確立できないから", "e": "【考え方】\nMN1が、別のサブネットに移動しても、MN1に設定されているネットワーク情報（IPアドレス、デフォルトゲートウェイなど）は変更されません。そのため、移動先のサブネットでは、元のデフォルトゲートウェイに接続できず、通信できなくなります。また、そのままでは、通信相手との間で、TCPコネクションなどを維持・確立できません。\n\n【補足】\nIPA講評は、(3)で、「ネットワーク情報が変更されない」ことに着目しない、曖昧な解答が散見されたとしています。設問で何が求められているか、十分に把握してほしい、との趣旨です。"}, "z47-4-1": {"a": "マルチキャストアドレス 又は 限定的ブロードキャストアドレス", "e": "【考え方】\nモバイルIPで、FA（Foreign Agent）が、MNに向けて送るAdvertisementメッセージは、サブネット内のMNを探すものなので、宛先は、マルチキャストアドレス（224.0.0.1など）か、限定的ブロードキャストアドレス（255.255.255.255）です。特定のMNのアドレスが分からないからです。\n\n【補足】\nIPA講評は、モバイルIPは、午後問題で初めて出題されたが、正答率が高かったとしています。"}, "z47-4-2": {"a": "GARP（Gratuitous ARP）", "e": "【考え方】\nHA（Home Agent）は、転送先テーブルを更新して、MNが移動中であることを知ると、MNの代わりに受信するために、サブネット内のホストに、GARP（Gratuitous ARP）を送ります。\n\n【補足】\n目的は、次の問い（(2)目的）の答えです。"}, "z47-4-3": {"a": "同一サブネット内のIPノードがもつARPキャッシュを更新させるため", "e": "【考え方】\nGARPは、自分のIPアドレスとMACアドレスの対応を、ほかのホストに一方的に知らせるARPです。HAがGARPを送ると、サブネット内の各ホストのARPキャッシュ（ARPテーブル）が、MN宛てのIPアドレスに対するMACアドレスを、HAのMACアドレスに更新します。その結果、MN宛てのフレームがHAに届くようになります。\n\n【補足】\nIPA講評は、(2)の通信の目的に関する問題の正答率が低かったとしています。ARPテーブルの働きと更新に関連する問題です。サブネット内のホストが保持するARPテーブルの操作は、ARPスプーフィングでも行われるので、十分に理解しておいてほしい、とのことです。"}, "z47-4-4": {"a": "プロキシARPで代理応答する。", "e": "【考え方】\nMNが移動してサブネットにいないとき、MN宛てのARP要求に対して、HAが、MNの代わりに、HA自身のMACアドレスで応答します。これを、プロキシARPといいます。これで、MN宛てのフレームが、HAに届き、HAがMNへ転送できます。"}, "z47-4-5": {"a": "HAプロキシ", "e": "【考え方】\n図6は、モバイルIPの機能を、WLC（無線LANコントローラ）で実現した構成です。表2の機能の名称で答えます。ホームネットワークで、HAの機能を、AP側に代わって行う機能は、HAプロキシです。\n\n【補足】\nこの解説は、解答例の確認です。表2と図6の構成は、問題文で確認してください。"}, "z47-4-6": {"a": "FA", "e": "【考え方】\nbは、FA（Foreign Agent）です。訪問先ネットワークで、移動してきたMNを受け入れる機能です。"}, "z47-4-7": {"a": "HA", "e": "【考え方】\ncは、HA（Home Agent）です。MN宛てのパケットを、MNの現在の位置に転送する機能です。"}, "z47-4-8": {"a": "FAプロキシ", "e": "【考え方】\ndは、FAプロキシです。訪問先で、MNの代わりにFAとして動作する機能です。"}, "z47-4-9": {"a": "FA", "e": "【考え方】\neは、FA（Foreign Agent）です。a〜eの組合せは、HAプロキシ、FA、HA、FAプロキシ、FAです。"}, "z47-5-1": {"a": "・社外から送信される無線LANの電波状態", "e": "【考え方】\n下線（お）の問題（導入後に通信できないエリアが発生する、他社の無線LANの影響を受ける、期待どおりの通信速度が得られない）を避けるために、サイトサーベイで調べる電波の状態は、次のとおりです。解答例は、三つのうちの二つを求めています。\n・社外から送信される無線LANの電波状態（他社の無線LANの影響）。\n・APからの電波到達範囲。\n・壁やパーティションの電波の透過状態。\n\n【補足】\nIPA講評は、(1)で、どのような方法で測定するのかが想像できないような、曖昧で局所的な電波の状態の記述が多く見られたとしています。"}, "z47-5-2": {"a": "・APからの電波到達範囲", "e": "【考え方】\n2つ目は、解答例の三つのうち、1つ目と異なるものを選びます。順番は問われません。"}, "z47-5-3": {"a": "・APの設置場所の設計", "e": "【考え方】\nサイトサーベイの結果を基に、導入作業の前に確定すべき設計項目は、次のとおりです。解答例は、四つのうちの二つを求めています。\n・APの設置場所の設計。\n・使用するチャンネルの設計。\n・APの設置方法の設計。\n・APの出力電波強度の設計。\n\n【補足】\nIPA講評は、(2)は十分に理解されていたとしています。"}, "z47-5-4": {"a": "・使用するチャンネルの設計", "e": "【考え方】\n2つ目は、解答例の四つのうち、1つ目と異なるものを選びます。順番は問われません。"}, "z47-5-5": {"a": "・FTPなどによる実効通信速度のテスト", "e": "【考え方】\n無線LANを設置した後、pingによる接続確認のほかに、MNを使って実施すべきテストは、次のとおりです。\n・FTPなどによる実効通信速度のテスト（期待どおりの通信速度が得られるか）。\n・MNを移動させてのローミング可否のテスト。"}, "z47-5-6": {"a": "・MNを移動させてのローミング可否のテスト", "e": "【考え方】\n2つ目は、MNを移動させて、APの切替え（ローミング）ができるかを確認するテストです。順番は問われません。"}, "z48-1-1": {"a": "SDN 又は Software Defined Network(ing)", "e": "【考え方】\nOpenFlowなどの、ソフトウェアでネットワークを制御する技術は、SDN（Software Defined Networking）と呼ばれます。"}, "z48-1-2": {"a": "ブリッジ 又は レイヤ2スイッチ", "e": "【考え方】\naとbとcは、オーバレイ方式とOF方式の比較に関わる字句です。bは、レイヤ2の機能の説明で、ブリッジ（レイヤ2スイッチ）です。\n\n【補足】\nこの解説は、解答例の確認です。文脈は、問題文の表3の前後で確認してください。"}, "z48-1-3": {"a": "ルータ 又は レイヤ3スイッチ", "e": "【考え方】\ncは、レイヤ3の機能の説明で、ルータ（レイヤ3スイッチ）です。"}, "z48-1-4": {"a": "接続用トンネルを終端 又は カプセル化用ヘッダを追加・削除", "e": "【考え方】\nオーバレイ方式では、物理サーバ上の仮想スイッチなどが、トンネルの端点（VTEPなど）になります。トンネルの端点の機能は、接続用のトンネルを終端する、又は、カプセル化用のヘッダを追加・削除する、というものです。\n\n【補足】\nこの解説は、解答例とオーバレイ方式の一般的な説明に基づきます。"}, "z48-1-5": {"a": "中継路でのフラグメンテーション発生", "e": "【考え方】\nオーバレイ方式は、元のフレームに新しいヘッダを追加して送るので、パケットが大きくなります。中継路のMTUを超えると、フラグメンテーション（断片化）が発生して、性能が下がります。"}, "z48-1-6": {"a": "最短経路以外の経路が利用できること", "e": "【考え方】\nTRILL方式は、最短経路（同コストの複数経路）を使います。OF方式は、OFC（コントローラ）がフローごとに経路を決められるので、最短経路以外の経路も使えます。そのため、回線を有効に利用できます。"}, "z48-2-1": {"a": "Flow Mod、Packet Out", "e": "【考え方】\n下線①の場合の、(A)に入るメッセージは、Flow ModとPacket Outです。解答例の表は、次のとおりです。\n・下線①の場合：(A) Flow Mod、Packet Out。(B) Flow Mod。(C) Flow Mod。\n・下線②の場合：(A) なし。(B) Packet Out。(C) Packet Out。\nなお、注記のとおり、下線①の場合の Packet Out は、(A)ではなく(C)で使われてもよいとされています。\n\n【補足】\nFlow Modは、OFC（コントローラ）が、OFS（スイッチ）にフローエントリを登録するメッセージです。Packet Outは、OFCが、OFSに、指定したパケットを送出させるメッセージです。この解説は、OpenFlowの一般的な説明に基づきます。"}, "z48-2-2": {"a": "Flow Mod", "e": "【考え方】\n下線①の場合の、(C)に入るメッセージは、Flow Modです。"}, "z48-2-3": {"a": "なし", "e": "【考え方】\n下線②の場合の、(A)に入るメッセージはありません。該当するメッセージがない場合には、「なし」と記入します。"}, "z48-2-4": {"a": "Packet Out", "e": "【考え方】\n下線②の場合の、(C)に入るメッセージは、Packet Outです。"}, "z48-2-5": {"a": "別テナントネットワークのPC4のMACアドレスをPC7のものとしてPC1が登録してしまう。", "e": "【考え方】\nテナントごとにネットワークが分かれているのに、PC4とPC7のIPアドレスが重複していると、PC1が、PC4のMACアドレスを、PC7のものとしてARPテーブルに登録してしまう可能性があります。その結果、PC1が、PC7宛てのつもりで、別テナントのPC4に、通信してしまいます。"}, "z48-2-6": {"a": "別テナントネットワークのPC1のMACアドレスをPC2のものとしてPC4が登録してしまう。", "e": "【考え方】\n同様に、PC1とPC2のIPアドレスが重複していると、PC4が、PC1のMACアドレスを、PC2のものとしてARPテーブルに登録してしまう可能性があります。\n\n【補足】\nIPA講評は、設問2では、(3)の正答率が低かったとしています。ARPテーブルの登録・更新に関する動作の本質的な理解が必要で、仮想サーバを収容する物理サーバの切替時にも、ARPテーブルの強制更新にARPの仕組みを使っているなど、新技術を支える従来技術が重要です、と述べています。"}, "z48-3-1": {"a": "登録されていない送信元MACアドレスのパケットを破棄させる。", "e": "【考え方】\nOFCが、OFSに対して、登録されていない送信元MACアドレスのパケットを破棄する、というフローを設定します。これで、接続を許可されていないPCからの通信を遮断でき、接続制御が実現します。"}, "z48-3-2": {"a": "EAPフレームの透過転送機能", "e": "【考え方】\nEAPのフレームは、特別なMACグループアドレス（01-80-C2-00-00-03）を宛先とします。通常のスイッチは、このアドレスのフレームを転送しません。中継SWが、これを、そのまま転送する機能（EAPフレームの透過転送機能）をもっていないと、PCとオーセンティケータの間で、認証のやり取りができません。\n\n【補足】\nIPA講評は、IEEE 802.1Xの基本的な方式や動作（(2)のEAPフレームの透過転送など）を問う問題の正答率が低かったとしています。"}, "z48-3-3": {"a": "1台のPCが認証されると，後続のPCは認証なしで接続できる。", "e": "【考え方】\n中継SWを使って、複数のPCを一つのポートに接続すると、ポートベースの認証では、最初の1台のPCが認証されれば、ポートが開き、後続のPCは、認証なしで接続できてしまいます。これがセキュリティ問題です。"}, "z48-3-4": {"a": "認証されたPCのMACアドレスをf-TBLに反映させ，転送を許可する。", "e": "【考え方】\nOF方式では、OFCが、認証されたPCのMACアドレスを、フローテーブル（f-TBL）に反映させて、そのMACアドレスの転送だけを許可します。これで、MACアドレスごとに接続を制御して、後続の不正なPCを防げます。"}, "z48-3-5": {"a": "OFC", "e": "【考え方】\nIEEE 802.1Xのオーセンティケータは、認証を中継する機器（RADIUSサーバへの問合せ）です。図6では、その役割を、OFC（OpenFlowコントローラ）が行っています。\n\n【補足】\nIPA講評は、オーセンティケータとして動作している装置を問う問題の正答率が低かったとしています。"}, "z48-3-6": {"a": "中継SW経由だとPC接続ポートがリンクアップしても，認証スイッチでは検出できないから", "e": "【考え方】\nPCが認証スイッチに直接接続している場合、PCとのリンクアップを検出して、認証スイッチが EAP-Request を発行できます。ところが、中継SWを経由すると、PCが接続されたポートがリンクアップしても、認証スイッチ（OFS）側では検出できません。そのため、PCが EAPOL-Start を送って、認証を始める必要があります。"}, "z48-3-7": {"a": "DHCPDISCOVER用ブロードキャストフレームを入力ポート以外のポートへ送出する。", "e": "【考え方】\n(D)の処理は、PCが送ったDHCPDISCOVER（ブロードキャスト）を、OFSが、入力されたポート以外の全てのポートへ送出するよう、OFCが指示する、というものです。ブロードキャストのフレームを、全ポートに送ります。"}, "z48-3-8": {"a": "入力されたPC宛てユニキャストフレームをOFS1のPC側ポートから送出するようf-TBLを設定する。", "e": "【考え方】\n(E)は、DHCPサーバからの応答（DHCPOFFERなど）のユニキャストフレームを、PC宛てに、OFS1のPC側ポートから送出するよう、OFCが、フローテーブル（f-TBL）を設定する処理です。\n\n【補足】\nIPA講評は、全体として、知識を問う問題の正答率は高く、考え方についての理解を問う問題の正答率は低い傾向があるとしています。"}, "z49-1-1": {"a": "あふれ 又は 枯渇", "e": "【考え方】\nFCoEなどのロスレスなイーサネット（拡張イーサネット）では、フレームを落とさないことが要求されます。受信側のバッファの「あふれ（枯渇）」が起こると、フレームが失われるので、これを防ぐ仕組み（PAUSEフレームによるフロー制御）が必要になります。\n\n【補足】\nこの解説は、解答例とデータセンタ向けイーサネットの一般的な説明に基づきます。空欄の前後の文は、問題文で確認してください。"}, "z49-1-2": {"a": "10", "e": "【考え方】\n解答例は10です。データセンタ向けの高速ネットワーク（10Gビット/秒のイーサネット）を前提とした空欄です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。前後の文脈は、問題文で確認してください。"}, "z49-1-3": {"a": "SPOF 又は Single Point of Failure 又は 単一障害点", "e": "【考え方】\nその機器が止まると、システム全体が止まってしまう箇所を、単一障害点（SPOF）といいます。信頼性の高いネットワーク設計では、SPOFをなくすために、機器や経路を冗長化します。\n\n【補足】\nIPA講評は、ウの「単一障害点」の正答率が低かったとしています。実務で信頼性の高いネットワークを設計する際の重要なキーワードなので、理解しておくことが期待されています。"}, "z49-2-1": {"a": "(1, 2)、(2, 2)、(3, 2)", "e": "【考え方】\nRB（ルーティングブリッジ）の経路制御テーブルは、宛先RBごとに、最小ホップ数の経路を、（出力ポート, ホップ数）の形で表します。宛先がRB2の場合は、最小ホップ数が2で、その経路に使える出力ポートは、ポート1、ポート2、ポート3の三つです。つまり、(1, 2)、(2, 2)、(3, 2) です。\n\n【補足】\nこの解説は、解答例の表記と、RB4の場合の表記を参考にした読み取りです。図3の接続の確認が必要です。IPA講評は、設問2は全体として正答率が高かったとしています。"}, "z49-2-2": {"a": "(1, 1)、(2, 1)", "e": "【考え方】\n宛先がRB3の場合は、最小ホップ数が1で、その経路に使える出力ポートは、ポート1とポート2の二つです。RB3は、RB1と直接つながっているので、ホップ数は1になります。\n\n【補足】\nこの解説は、解答例を基にした記述です。ルーティングブリッジは、STPと違い、最小ホップ数の複数の経路（等コストの複数経路）を同時に使えます。"}, "z49-2-3": {"a": "3以上に設定する。", "e": "【考え方】\nHC（ホップカウント）は、RB間転送フレームの、生存期間を示す値です（IPのTTLのようなもの）。RB1からRB4への最小ホップ数は2です。HCを2に設定すると、最小ホップ数の経路しか使えません。3以上にしておくと、最小ホップ数より長い経路（代替経路）も使えるようになります。"}, "z49-2-4": {"a": "RB4への最小ホップ数以外の経路を障害時の代替経路として使えるようにするため", "e": "【考え方】\nHCを最小ホップ数より大きくしておくと、最小ホップ数の経路で障害が起きたときに、より長い経路でも、フレームが途中で捨てられずに、RB4へ届きます。これが冗長性を確保する目的です。"}, "z49-2-5": {"a": "エッジポート", "e": "【考え方】\nRBファブリックの外側（ホスト側）に接続するポートでは、通常のイーサネットフレームを受け取ります。このポートを、エッジポート（アクセスポート）といいます。MACアドレスは、エッジポートで学習します。ファブリック内（RB間）のポートは、転送フレームを扱うので、MACアドレスの学習を行いません。"}, "z49-2-6": {"a": "IEEE 802.1Q", "e": "【考え方】\n複数のVLANのフレームを一つのポートで扱うには、フレームにVLAN IDを付けるタグVLANの規格、IEEE 802.1Qが必要です。解答例は IEEE 802.1Q です。"}, "z49-2-7": {"a": "MA2：VLAN ID 20、RB名 RB2、ポート番号 3 ／ MA3：VLAN ID 20、RB名 RB3、ポート番号 4 ／ MA4：VLAN ID 10、RB名 RB4、ポート番号 3", "e": "【考え方】\nMACアドレステーブルは、宛先MA（MACアドレス）ごとに、VLAN ID、そのMACアドレスが接続されているRB名（出口RB）、ポート番号を記録します。解答例のとおり、宛先MA2、MA3、MA4について、それぞれ上の値になります。\n\n【補足】\n表は、文章で答える形に直しています。表の値は、図3の接続と、MA1の場合の表記を参考に、読み取るものです。"}, "z49-2-8": {"a": "全ての経路の中での最大ホップ数とする。", "e": "【考え方】\nループが発生したときに、フレームが流れ続けるのを防ぐには、HCが小さいほうが有利です。冗長化のための複数経路を確保するには、全ての経路が使えなければなりません。両者を満たすHCの値は、全ての経路の中で最大のホップ数です。これより大きくしなくても、全ての経路が使え、かつ、ループしたフレームは、最大ホップ数を超えた時点で捨てられます。"}, "z49-2-9": {"a": "ファブリックの出口RB名", "e": "【考え方】\n共通のMACアドレステーブル（宛先MAに対する出口RB名を含む）は、RB間転送フレームフォーマットの、「宛先RB名（ファブリックの出口RB名）」のフィールドを決めるために使われます。ホストのフレームを受けた入口RBが、宛先MAから、出口RBを求めて、RB間転送フレームの宛先RBに入れます。"}, "z49-3-1": {"a": "ログインしたFCF", "e": "【考え方】\nFCoEでは、ホストが、FIPでFCFにログインします。ログインしたFCFは、FC対応のストレージにFCフレームを渡す前の、FCoEフレームの宛先として、ホストがもつ宛先MACアドレスを提供します。そのため、FCファブリックに入力されるFCoEフレームの宛先MACアドレスは、ログインしたFCFのMACアドレスです。\n\n【補足】\nこの解説は、FCoEの一般的な動作に基づく推論を含みます。IPA講評は、設問3は、全体的に正答率は高かったとしています。"}, "z49-3-2": {"a": "FCoEフレーム", "e": "【考え方】\n図5のaは、FCoEフレームです。ホストのCNAと、FCFの間を、FCoEフレームが流れます。"}, "z49-3-3": {"a": "FCoEフレーム", "e": "【考え方】\nbも、FCoEフレームです。FCFからストレージへ、FCファブリックを介さずに、イーサネット上のFCoEフレームのまま流れる区間です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。図5の構成は、問題文で確認してください。"}, "z49-3-4": {"a": "FCフレーム", "e": "【考え方】\ncは、FCフレームです。FC対応のストレージ側では、FCoEのヘッダを外した、FCフレームが流れます。FCF（FCoE Forwarder）が、FCoEフレームとFCフレームを相互に変換します。"}, "z49-4-1": {"a": "ホストとストレージ1間のホップ数が増大し，性能の問題が発生する。", "e": "【考え方】\nLANとSANのスイッチを統合する前の構成案では、ホストとストレージの間に、複数のスイッチ（FCF）を経由する必要があるため、ホップ数が増えて、性能の問題が起きる、とS主任が指摘した、と考えられます。\n\n【補足】\n下線②の内容は、問題文で確認してください。この解説は、解答例からの推測を含みます。IPA講評は、設問4は「FCoE over TRILL」の動作を問う問題で、全体的に正答率が低かったとしています。FCF間をルーティングブリッジで接続するという論理的な接続を理解できていない解答が、散見されました。"}, "z49-4-2": {"a": "転送先RB名：RB2、転送元RB名：RB1", "e": "【考え方】\n図7の(E)は、FCF間をRBファブリックで転送する場面です。転送先RB名はRB2、転送元RB名はRB1です。ファブリック内の転送では、RB間転送フレームのヘッダ（TRヘッダ）の、宛先RBと送信元RBに、これらが入ります。\n\n【補足】\nこの解説は、解答例の確認にとどまります。図7の構成は、問題文で確認してください。"}, "z49-4-3": {"a": "FCF間を転送されるごとに行われる。", "e": "【考え方】\nFCoE over TRILLでは、FCF間をRBファブリックでつないでいます。ホストとストレージ間の転送では、FCFが、FCoEフレームの中継のたびに、TRヘッダでのカプセル化と、その解除を行います。FCF間を転送されるごとに、カプセル化と解除が繰り返されます。"}, "z49-4-4": {"a": "D", "e": "【考え方】\nFCFは、FCoEフレーム（図7のフレームの中のFC部分）の、FCの宛先情報（D_ID）を見て、転送処理を行います。解答例は D です。ファブリック内で使うTRヘッダやイーサネットヘッダは、RBが扱います。\n\n【補足】\nこの解説は、解答例の確認にとどまります。図7のフィールドの記号C1、C2、C3、D、Eは、問題文で確認してください。"}, "z49-5-1": {"a": "HBA1→SC1→LU，HBA1→SC2→LU，HBA2→SC1→LU，HBA2→SC2→LU", "e": "【考え方】\n図8の構成では、各HBAと各SC（ストレージコントローラ）が、FCファブリックを介して、全て接続されています。したがって、HBA1とHBA2のそれぞれから、SC1とSC2のそれぞれを通ってLUに至る、4通りの経路が冗長化されています。"}, "z49-5-2": {"a": "各HBAから互いに独立したFCファブリック経由でストレージへの経路を確保する。", "e": "【考え方】\nSANには、LANとは異なり、非常に高い信頼性が求められます。FCファブリックを利用する場合は、片方のFCファブリックが故障しても通信が止まらないよう、各HBAから、互いに独立した二つのFCファブリックを経由して、ストレージへの経路を確保する必要があります。\n\n【補足】\nIPA講評は、設問5の(2)の正答率が低かったとしています。SANのネットワークが、LANとは異なる信頼性の要求をもつことを認識する問題でした。"}, "z50-1-1": {"a": "ICMP", "e": "【考え方】\nネットワーク機器の疎通確認（ping）に使うプロトコルは、ICMP（Internet Control Message Protocol）です。IPA講評では、アは基本的なプロトコルの働きを問う問題なので、もう少し高い正答率を期待していたとしています。"}, "z50-1-2": {"a": "IPアドレス", "e": "【考え方】\n解答例は「IPアドレス」です。IPv4アドレスとIPv6アドレスの変換（トランスレータ）に関する記述で、IPアドレスを変換する対象を指します。\n\n【補足】\nこの解説は、解答例の確認にとどまります。前後の文は、問題文で確認してください。"}, "z50-1-3": {"a": "拡張", "e": "【考え方】\nIPv6では、基本ヘッダのあとに、必要に応じて「拡張ヘッダ」をつなげます。IPA講評は、ウはIPv6パケットに関する知識を問う問題だったが、比較的よく理解されている正答率だったとしています。"}, "z50-1-4": {"a": "管理", "e": "【考え方】\n解答例は「管理」です。作業手順書などのドキュメントに関する記述で、管理に関わる文脈の空欄です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。前後の文は、問題文で確認してください。"}, "z50-2-1": {"a": "SW1，社内用DNSサーバ", "e": "【考え方】\n業務サーバ以外で、故障すると、全社員の業務システム利用が止まる可能性がある機器は、次の二つです。\n・SW1：業務サーバと本社のPCなどを接続する、スイッチです。\n・社内用DNSサーバ：業務サーバの名前解決に使うサーバです。止まると、名前でアクセスする全業務システムが使えなくなります。\n\n【補足】\nIPA講評は、設問2は基本的な障害対応事例を基にした設問であり、正答率は非常に高かったとしています。"}, "z50-2-2": {"a": "ルーティングテーブルに，営業所のLANへの経路情報が登録されている。", "e": "【考え方】\n営業所のLANにアクセスするとき、余計なパケット転送を避けるには、PCに、営業所のLANへの経路情報を、ルーティングテーブルに登録しておきます。登録しないと、デフォルトゲートウェイ経由で、いったん別のルータへ送ってから転送されるので、余計な転送が発生します。"}, "z50-2-3": {"a": "業務サーバ1を接続するSW1のポート", "e": "【考え方】\n下線①の三つの障害箇所は、業務サーバ1が通信できなくなる原因として想定したものです。\n・業務サーバ1を接続するSW1のポート。\n・業務サーバ1を接続するケーブル。\n・業務サーバ1、又は、業務サーバ1のLANポート。\n三つとも、サーバとスイッチの間の物理的な部分です。順番は問われません。"}, "z50-2-4": {"a": "業務サーバ1を接続するケーブル", "e": "【考え方】\n二つ目は、サーバとスイッチを接続しているケーブルです。順番は問われません。"}, "z50-2-5": {"a": "業務サーバ1 又は 業務サーバ1のLANポート", "e": "【考え方】\n三つ目は、業務サーバ1自体、又は、そのLANポートです。"}, "z50-3-1": {"a": "40", "e": "【考え方】\n解答例は 40 です。トランスレータの変換用プレフィックスなど、IPv6アドレスの構成に関わる数値です。bのIPv6アドレス全体の長さ128ビット、cの変換用プレフィックスの長さ96ビットと、併せて、本文の記述から求めます。\n\n【補足】\nこの解説は、解答例の確認にとどまります。aの具体的な求め方は、問題文の記述で確認してください。"}, "z50-3-2": {"a": "128", "e": "【考え方】\nIPv6アドレスの長さは128ビットです。"}, "z50-3-3": {"a": "96", "e": "【考え方】\nIPv4アドレス（32ビット）を、IPv6アドレスの下位32ビットに埋め込みます。したがって、変換用プレフィックスの長さは、128−32＝96ビットです。"}, "z50-3-4": {"a": "SWa", "e": "【考え方】\nトランスレータのIPv4ポートは、FWの外側にあるSWaに接続します。そうすると、Webサーバへの通信が、FW経由になるので、セキュリティを維持できます。SWbはDMZで、FWの内側にあるので、トランスレータをSWbに接続すると、FWを経由しない通信経路ができてしまいます。"}, "z50-3-5": {"a": "Webサーバへの通信がFW経由になるので，セキュリティが維持できる。", "e": "【考え方】\nトランスレータをSWa（FWの外側）に接続すると、IPv6端末からのWebサーバへの通信は、トランスレータを通ったあと、FWを経由してWebサーバに届きます。FWのフィルタリングを受けるので、セキュリティが維持されます。"}, "z50-3-6": {"a": "2001:db8:1:2:0:ffff:203.0.113.1 又は 2001:db8:1:2:0:ffff:cb00:7101", "e": "【考え方】\nAAAAレコードのIPv6アドレスは、変換用プレフィックスに、Webサーバ（のトランスレータ側）のIPv4アドレスを、32ビットとして埋め込んだものです。IPv4アドレス 203.0.113.1 を16進数にすると、203→cb、0→00、113→71、1→01 なので、cb00:7101 です。変換用プレフィックスは 2001:db8:1:2:0:ffff です。したがって、2001:db8:1:2:0:ffff:cb00:7101、又は、下位32ビットをIPv4アドレス形式で書いた 2001:db8:1:2:0:ffff:203.0.113.1 です。\n\n【補足】\nIPA講評は、(3)のIPv6アドレス表記に関する設問の正答率が低かったとしています。IPv4は8ビットごとに10進数、IPv6は16ビットごとに16進数で表記するので、IPv4アドレスをIPv6アドレスに埋め込むときに、10進数から16進数への変換が必要です。"}, "z50-3-7": {"a": "IPv6とIPv4の両方のネットワークに接続できる環境", "e": "【考え方】\nキャッシュDNSサーバは、IPv6端末からの問合せを受け、A社のDNSサーバ（IPv4側にある）に問い合わせます。そのため、キャッシュDNSサーバは、IPv6とIPv4の両方のネットワークに接続できる環境に設置される必要があります。"}, "z50-4-1": {"a": "MACアドレステーブルがクリアされたから", "e": "【考え方】\nツリーの再構成（STPのトポロジ変更）が起きると、スイッチはMACアドレステーブルをクリアします。そのため、SW2は、サーバ宛てのフレームの宛先MACアドレスがテーブルにない状態になり、未知のユニキャストフレームとして、フラッディング（受信ポート以外の全ポートへの転送）します。その結果、SW2のP2からも転送されます。\n\n【補足】\nIPA講評は、設問4(1)の正答率が低かったとしています。MACアドレステーブルを基にしたスイッチのフォワーディング動作は、スイッチの基本動作なので、ぜひ理解しておいてほしい、とのことです。"}, "z50-4-2": {"a": "パケットがSW4からSW1に転送されず，サーバのアクティブLANポートに到達しないから 又は パケットがSW1に転送されず，サーバのスタンバイLANポートだけに到達することになったから", "e": "【考え方】\nサーバには、アクティブとスタンバイの二つのLANポートがあり、SW1とSW4に接続されています。下線②の状態は、パケットが、SW1を経由せずに、スタンバイ側だけに到達する、あるいは、SW4からSW1に転送されずに、アクティブLANポートに届かない状態です。その結果、サーバが通信できなくなります。\n\n【補足】\n解答例は、二つの言い方で書かれており、いずれかで正解になります。この解説は、解答例を基に、状況を言い換えたものです。"}, "z50-4-3": {"a": "SW3のP2", "e": "【考え方】\nMSTPで動作させると、ループを防ぐために、二つのポートがブロッキングポートになります。解答例は、SW3のP2とSW5のP2です。表3に記述された形式（スイッチ名とポート名）で答えます。順番は問われません。\n\n【補足】\nこの解説は、解答例の確認にとどまります。図4の構成は、問題文で確認してください。"}, "z50-4-4": {"a": "SW5のP2", "e": "【考え方】\nもう一つのブロッキングポートは、SW5のP2です。"}, "z50-4-5": {"a": "IEEE 802.1Q 又は タグVLAN 又は トランクポート", "e": "【考え方】\n利用者PCと管理PCが、同じ業務サーバにアクセスするには、サーバのLANポートと、SW1・SW4の接続ポートが、複数のVLANを扱える必要があります。そのための規格・機能が、IEEE 802.1Q（タグVLAN、トランクポート）です。"}, "z50-5-1": {"a": "ISPから取得したIPv6プレフィックスの情報", "e": "【考え方】\nトランスレータ導入の詳細設計で、A社がB社に提供すべき情報は、設置場所、ネットワーク構成、IPv4アドレスの情報以外に、次の二つです。\n・ISPから取得したIPv6プレフィックスの情報。\n・トランスレータに割り当てるIPv6プレフィックス。\nいずれかで正解になると見られます。ただし、この判断は、解答例の書き方からの推測です。"}, "z50-5-2": {"a": "機器のラックへの設置構成", "e": "【考え方】\n詳細設計書の中で、作業手順書で参照されるべき項目は、次の五つのうち三つです。\n・機器のラックへの設置構成。\n・ラック収容機器の配線。\n・フロア設置機器間の配線。\n・機器への詳細な設定情報。\n・動作確認テストの方法。\nいずれも、現場で作業をする人が、そのまま使う情報です。"}, "z50-5-3": {"a": "ラック収容機器の配線", "e": "【考え方】\n五つの項目のうちの一つです。順番は問われません。"}, "z50-5-4": {"a": "動作確認テストの方法", "e": "【考え方】\n五つの項目のうちの一つです。順番は問われません。1つ目〜3つ目で、重複しない項目を書きます。\n\n【補足】\nIPA講評は、設問5はドキュメントに関する設問で、正答率は高かったが、(3)では、何を求められているのか理解できていない解答が散見されたとしています。設問もよく読んで、求められていることを理解することが必要です。"}, "z50-5-5": {"a": "アクティブLANポートで，経路障害を検出する方法", "e": "【考え方】\nサーバが、バックアップ経路（スタンバイのLANポート）に切り替えるときの処理方法について、方式設計書に書くべき内容は、次の二つです。\n・アクティブLANポートで、経路障害を検出する方法。\n・アクティブLANポートが切り替わるときの、情報の引継方法。\n切替えの契機（検出）と、切替え時の情報の引継ぎ（IPアドレス、MACアドレスなど）が、方式設計の要点です。"}, "z50-5-6": {"a": "アクティブLANポートが切り替わるときの，情報の引継方法", "e": "【考え方】\nもう一つは、アクティブLANポートが切り替わるときの、情報の引継方法です。順番は問われません。"}, "z51-1-1": {"a": "無線LAN", "e": "【考え方】\nCE用のPCは、外出先からインターネット経由で、保守サービスサーバにアクセスします。図1で、CEは「無線アクセスによって接続したインターネットを介して」、保守サービスサーバにアクセスします。アは、無線LAN（又は無線アクセス）です。\n\n【補足】\nIPA講評は、設問1は、身近に接しているためか、正答率が高かったとしています。"}, "z51-1-2": {"a": "GPS", "e": "【考え方】\nCEの現在位置を把握して、出動の手配に使える機能として、GPSが挙げられます。解答例はGPSです。"}, "z51-1-3": {"a": "SSL", "e": "【考え方】\nCEが様々な場所からネットワーク接続を行う観点から、適切なプロトコルは、SSL（SSL-VPN）です。IPsecは、拠点間の接続や、事前に設定したクライアントソフトを必要としますが、SSLは、Webブラウザの標準機能で使えるので、様々な場所から接続するCEに向いています。\n\n【補足】\nこの解説は、解答例を基にした一般的な説明です。"}, "z51-2-1": {"a": "音声通話を前提とした圧縮率の高いコーデックが利用できるから", "e": "【考え方】\nTC-V（VoIP対応TC）方式では、TC自体が音声処理を行い、VoIPの音声コーデック（圧縮率の高いもの）を使って送ります。USBリダイレクト方式では、USBヘッドセットの信号を、そのまま（圧縮の少ない形で）サーバへ送るので、帯域を多く使います。そのため、TC-V方式のほうが、音声転送用の帯域が少なくなります。"}, "z51-2-2": {"a": "仮想PCで音声処理を行う処理時間増加に起因する、音声遅延", "e": "【考え方】\nUSBリダイレクト方式では、仮想PC上で音声処理を行うので、仮想PCの処理時間が増えると、音声の遅延が起こります。解答例の「事象と音質劣化要因」は、次の二つの組合せです。\n・事象：仮想PCで音声処理を行う処理時間が増加する。要因：音声遅延。\n・事象：負荷変動によって、仮想PCの音声処理時間がばらつく。要因：音声遅延のジッタ。\n\n【補足】\nIPA講評は、仮想PCの振る舞いと音質への影響を正答するには、出題されたシステムの具体的な動きを考える力が必要だったとしています。"}, "z51-2-3": {"a": "負荷変動による仮想PCの音声処理時間のばらつきに起因する、音声遅延のジッタ", "e": "【考え方】\n2組目は、仮想PCの負荷の変動によって、音声処理時間がばらつき、その結果、音声の遅延のジッタ（揺らぎ）が起こる、という組合せです。順番は問われません。"}, "z51-3-1": {"a": "36", "e": "【考え方】\n待ち行列理論の用語に関する数値の計算です。解答例は a＝36 です。呼量（アーラン）などの用語の定義に基づいて計算します。\n\n【補足】\nIPA講評は、設問3(1)では、待ち行列理論の用語の定義に誤解のある解答が散見され、正答率は低
