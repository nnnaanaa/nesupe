かったとしています。計算の過程は、問題文の数値で確認してください。この解説は、解答例の確認にとどまります。"}, "z51-3-2": {"a": "6", "e": "【考え方】\n解答例は b＝6 です。本文中の通話時間や件数などから、計算します。\n\n【補足】\nこの解説は、解答例の確認にとどまります。"}, "z51-3-3": {"a": "10", "e": "【考え方】\n解答例は c＝10 です。a、bから求める数値です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。"}, "z51-3-4": {"a": "4.3", "e": "【考え方】\n従来の呼損率は、表1の数値で4.3（%）です。呼損率は、通話要求のうち、回線が全て使用中のために接続できなかったものの割合です。"}, "z51-3-5": {"a": "67", "e": "【考え方】\n従来と同等以下の呼損率（4.3%）を維持するために、必要最小限の回線数は、表1から求めて、67回線です。\n\n【補足】\n表1は、回線数と呼損率の対応を示す表（アーラン損失式の結果）です。求めた呼量に対して、呼損率が4.3%以下となる最小の回線数を、表から読み取ります。"}, "z51-3-6": {"a": "通話要求の待ち行列を許すモデル", "e": "【考え方】\n呼損率を計算する場合に使われるのは、待ちを許容しない即時系（M/M/s/s、アーラン損失）です。対策後の方式は、通話要求を待たせるので、待ちを許す系になります。解答例は「通話要求の待ち行列を許すモデル」です。\n\n【補足】\nIPA講評は、設問3(3)は、正答率が低かったとしています。単に暗記するだけでなく、実際のシステムの動きと関連付けて理解することが大切だ、とのことです。"}, "z51-4-1": {"a": "e", "e": "【考え方】\n表2は、ルーティングテーブルなどの設定を示す表です。VPNトンネルのインタフェースは、解答例では e です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。表2の内容は、問題文で確認してください。IPA講評は、VPNトンネルが、どことどこの間に存在するのか、理解できていない解答が多かったとしています。"}, "z51-4-2": {"a": "192.168.32.0/24", "e": "【考え方】\n表2のNo.6の行は、VPNトンネルがActiveでない間、暗号化されないパケットが、インターネット側に送出されないようにする設定です。ウは、宛先のアドレス（192.168.32.0/24）、エは、デフォルト（0.0.0.0）、オは、メトリック値（2又はそれ以上）です。\n\n【補足】\nVPNトンネルがActiveの間は、メトリック値の小さい経路（VPNトンネル経由）が使われます。Activeでないときは、メトリック値の大きい経路（捨てるための経路）が使われ、暗号化されないパケットが送出されません。この解説は、解答例とルーティングの一般的な動作を基にした推論を含みます。"}, "z51-4-3": {"a": "0.0.0.0", "e": "【考え方】\nエは、0.0.0.0（デフォルトルート）です。"}, "z51-4-4": {"a": "2，又はそれ以上の値", "e": "【考え方】\nオは、メトリック値です。VPNトンネル経由の経路（メトリック1）より、大きい値（2又はそれ以上）にして、トンネルがActiveでないときだけ、使われる経路にします。\n\n【補足】\nこの解説は、解答例とルーティングの一般的な動作を基にした推論を含みます。"}, "z51-4-5": {"a": "ポート番号443をもつパケットだけを，ポートマッピングによって10.0.0.1宛てにアドレス変換して転送する設定", "e": "【考え方】\nMPC（モバイルPC）が、モバイル端末接続装置（SSL-VPN）に接続できるようにするには、VPN1（VPN装置）に、ポート番号443（HTTPS）のパケットだけを、ポートマッピングによって、モバイル端末接続装置のアドレス（10.0.0.1）宛てに変換して、転送する設定が必要です。"}, "z51-4-6": {"a": "モバイル端末接続装置", "e": "【考え方】\nMPCのアプリケーションで使うポートによって、パケットを制限する設定は、モバイル端末接続装置で行います。理由は次の問いのとおりです。"}, "z51-4-7": {"a": "パケットの内容は，暗号化してカプセル化されており，中継する装置では内容を認識できないから", "e": "【考え方】\nMPCとモバイル端末接続装置の間のパケットは、暗号化されてカプセル化（トンネリング）されています。途中で中継する装置（VPN1など）は、パケットの内容を認識できないので、アプリケーションのポート番号によるフィルタリングができません。トンネルを終端するモバイル端末接続装置で、復号した後で、制限します。"}, "z51-5-1": {"a": "ブレードサーバの外部インタフェースの接続スペースの節約や配線数の削減", "e": "【考え方】\nSANとLANを統合すると、ブレードサーバが、FC用（HBA）とイーサネット用（NIC）の別々のインタフェースをもつ必要がなくなり、1本のイーサネット（CNA）に統合できます。そのため、外部接続インタフェースの接続スペースが節約できて、配線数が削減できます。"}, "z51-5-2": {"a": "隣接ノード間の局所的なバッファ枯渇に対しても対処できる。", "e": "【考え方】\nTCPのウィンドウサイズによるフロー制御は、エンドツーエンドで行われるので、途中の隣接ノード間で起きる局所的なバッファの枯渇には、対処しきれません。FCPのフロー制御（クレジットベース）は、隣接ノード間で行うので、局所的なバッファ枯渇に対しても、パケットロスを防げます。"}, "z51-5-3": {"a": "優先度の低い通信によるバッファ枯渇で優先度の高い通信のパケットが送信されない状態の発生", "e": "【考え方】\n優先度別制御（PFC）をしない場合は、優先度の低い通信がバッファを使い切ると、優先度の高い通信（ストレージのFCoEなど）のパケットまで、送信できなくなります。優先度別制御は、優先度ごとに別々にフロー制御するので、このような状態を回避できます。"}, "z51-5-4": {"a": "複数経路が同一コストをもつようにする。", "e": "【考え方】\n下線⑥は、複数の経路を同時に使って、帯域を増やすことです。そのための経路のコスト設計は、複数経路が同一コストをもつようにすることです。"}, "z51-5-5": {"a": "帯域を増加させることができる。", "e": "【考え方】\nスパニングツリープロトコルは、一つの経路だけを使い、ほかの経路をブロッキングします。同一コストの複数経路を同時に使える方式（TRILLなど）では、帯域を増加させることができます。"}, "z51-5-6": {"a": "FC-SWとFCoE-SW、FCoE-SW同士、FCoE-SWとL3SWを、それぞれ線で接続する（図6の破線内に線を追加）", "e": "【考え方】\n解答例は、図6に線を追加して完成させる形です。追加する接続（太線）は、次のとおりです。\n・FC-SW（二つ）と、FCoE-SW（二つ）を、それぞれ接続する。\n・FCoE-SW（二つ）の間を接続する。\n・FCoE-SWと、L3SW（二つ）を接続する。\nFCoE-SWとCNAは、図に示されている接続です。\n\n【補足】\n図は、文章で答える形に直しています。実際の試験では、図6に線を書き足します。図の細部（どの線が太線か）は、IPAの解答例の図で確認してください。この解説は、解答例の図を読み取ったものです。"}, "z52-1-1": {"a": "帯域拡大", "e": "【考え方】\nチーミング（複数のNICを束ねて一つの論理的なNICにする）で、2本の回線を一つの回線として使うと、帯域が拡大します。解答例は「帯域拡大」です。\n\n【補足】\nIPA講評は、アの正答率が低かったとしています。チーミングで2本の回線を一つの回線として束ねたときの効果に着目すれば、「帯域拡大」が導き出せたはずだ、とのことです。"}, "z52-1-2": {"a": "バックアップ", "e": "【考え方】\nVRRPでは、マスタルータのほかに、バックアップルータを用意します。マスタが故障したときに、バックアップルータが引き継ぎます。"}, "z52-1-3": {"a": "マルチ", "e": "【考え方】\nVRRPの広告メッセージは、マルチキャスト（224.0.0.18）で送られます。解答例は「マルチ」（キャスト）です。"}, "z52-1-4": {"a": "大きい", "e": "【考え方】\nVRRPでは、優先度（Priority）が「大きい」ルータが、マスタになります。"}, "z52-2-1": {"a": "利用者名とプロファイル名", "e": "【考え方】\nTC（シンクライアント）システムで、利用者が、どのPC（TC）からログインしても、自分の環境（デスクトップや設定）を使えるようにするには、利用者名と、利用者のプロファイル名を、対応付ける必要があります。"}, "z52-2-2": {"a": "営業所からFS利用時の，レスポンス速度の低下", "e": "【考え方】\n営業所のFS（ファイルサーバ）を、第1段階でNAS（データセンタ側）に統合すると、営業所からのファイル利用は、WAN経由になり、レスポンス速度が低下します。そこで、第2段階で、第1段階の導入、運用経験を生かして、対策した上で、統合します。"}, "z52-2-3": {"a": "P0とP1のVLANが異なるから", "e": "【考え方】\nL3SWAのP0とP1に接続されるのは、L2SW1とL2SW2の側です。P0とP1のVLANが異なるので、L2SW1、L2SW2、L3SWA、L3SWBの間では、レイヤ2のループが発生しません。\n\n【補足】\nIPA講評は、設問2(3)で、バックアップルータのL3SWが動作しないので、ループが発生しない、という誤った解答が散見されたとしています。このL3SWも、スイッチとしての動作は、通常どおり行われます。"}, "z52-2-4": {"a": "監視対象インタフェース", "e": "【考え方】\n下線②の動作（障害のとき、マスタが切り替わる）のために、VRRPで設定している項目は、「監視対象インタフェース」です。監視対象のインタフェース（ポート）がリンクダウンしたら、優先度を下げて、別のルータをマスタにします。"}, "z52-2-5": {"a": "監視対象のポートがリンクダウンしたときに，Priority値を50に再設定する。", "e": "【考え方】\n監視対象インタフェースを設定すると、そのポートがリンクダウンしたときに、VRRPのPriority値を、50に再設定します。それによって、バックアップルータの優先度のほうが大きくなり、バックアップがマスタに切り替わります。"}, "z52-2-6": {"a": "VRRPグループID、Priority値、仮想IPアドレス（順不同）", "e": "【考え方】\nVRRPメッセージ（広告）に含まれる情報は、表1中の項目で、次の三つです。\n・VRRPグループID。\n・Priority値。\n・仮想IPアドレス。\n順番は問われません。"}, "z52-3-1": {"a": "パスワードの再使用となるから", "e": "【考え方】\nトークンの数字（ワンタイムパスワード）が変わる間隔を長くすると、同じパスワードが長時間使えます。利用者が、同じ数字を2度使う可能性が生まれて、サーバ側では、「パスワードの再使用」として、不正パスワード扱いになります。\n\n【補足】\nIPA講評は、設問3(1)の正答率が、期待に届かなかったとしています。時刻同期型ワンタイムパスワードは、一般的に1分間隔で生成されます。"}, "z52-3-2": {"a": "認証できたパスワードが生成された時刻と，パスワードを受信した時刻の差から推定する。", "e": "【考え方】\n時刻同期方式のトークンは、時刻でパスワードを生成します。認証サーバが、ずれた時刻を推定するには、認証できたパスワードが生成された時刻（そのパスワードに対応する時刻）と、パスワードを受信した時刻の差を求めます。その差が、トークンの時計のずれです。"}, "z52-4-1": {"a": "PCに作成されたフォルダのメールのバックアップ", "e": "【考え方】\n現在のメールシステムでは、メールを、PCの中に作ったフォルダに保存して、利用者が管理しています。社員に任せている、障害時に備えた対応作業は、PCに作成されたフォルダに入っているメールの、バックアップです。"}, "z52-4-2": {"a": "複数のPCから，同じメールを読むことができない。", "e": "【考え方】\nPOP3は、メールをサーバからPCにダウンロードして、サーバから削除するのが基本の使い方です。そのため、下線③のとき（複数のPCを使うとき）に、同じメールを、複数のPCから読むことができなくなります。"}, "z52-4-3": {"a": "43,200秒（12時間）", "e": "【考え方】\nDNSのSOAレコードの、リフレッシュ値（セカンダリDNSサーバが、プライマリDNSサーバに、ゾーン情報の更新を確認する間隔）が、43,200秒（12時間）です。図4のゾーンデータファイルで、確認します。"}, "z52-5-1": {"a": "項番2の設定を行っていない利用者は，メールサービスのメールボックスから受信できないから", "e": "【考え方】\n項番2の作業は、1週間以上を費やして、利用者が、メールソフトの設定を、メールサービスに切り替える作業です。その期間中は、設定を終えていない利用者もいます。メール送受信を、社内メールサーバだけで行わせないと、項番2の設定を行っていない利用者は、メールサービスのメールボックスから受信できません。\n\n【補足】\nIPA講評は、設問5(1)の正答率が低かったとしています。図6の項番2の作業が、1週間以上を費やして行われることに着目すると、正答が導き出せる、とのことです。"}, "z52-5-2": {"a": "メールサービス，メール中継サーバ及び社内メールサーバ間をループする。", "e": "【考え方】\n社内メールサーバが受信したメールを、そのままメールサービスに転送し、メールサービス側にアカウントがないと、メールサービスは、そのメールを、メール中継サーバ経由で、社内メールサーバに返します。すると、メールが、メールサービス、メール中継サーバ、社内メールサーバの間をループします。\n\n【補足】\nIPA講評は、設問5(2)の、ループが発生する問題に関する正答率は高かったとしています。"}, "z52-5-3": {"a": "メールサービス → メール中継サーバ → 社内メールサーバ → メール中継サーバ", "e": "【考え方】\n図6の項番4の実施後（メールの送受信をメールサービスに切り替えた後）、項番6でMLが登録されるまでの間、MLのアドレス宛てのメールは、次の経路で転送されます。\n・社内からメールサービスへ送信される。\n・メールサービスにはMLが登録されていないので、メール中継サーバへ転送する。\n・メール中継サーバから社内メールサーバへ転送する（社内メールサーバにMLがある）。\n・社内メールサーバから、メール中継サーバを通って、メールサービスのメールボックスに配信される。\n解答例は、【転送経路】の表記で、「メールサービス → メール中継サーバ → 社内メールサーバ → メール中継サーバ」です。続きは、メールサービス → メールボックスです。\n\n【補足】\nこの解説は、解答例を基にした経路の説明です。"}, "z52-6-1": {"a": "TCとして使用するPCに保存されたファイル（移動先：NAS）", "e": "【考え方】\n第1段階のTCシステム導入で、移動すべきデータは、次の二つです。移動先は、どちらもNASです。\n・TCとして使用するPCに保存されたファイル。\n・本社のFSに保管されたファイル。\n①と②は、順不同です。"}, "z52-6-2": {"a": "本社のFSに保管されたファイル（移動先：NAS）", "e": "【考え方】\n2つ目は、本社のFSに保管されたファイルで、移動先はNASです。順番は問われません。"}, "z52-6-3": {"a": "L3SW1のルーティングテーブル", "e": "【考え方】\n本社の既設のPCとL3SW1で、ネットワーク関連情報のうち、機器のインタフェースのIPアドレス以外に変更されるべき情報は、次の二つです。\n・L3SW1のルーティングテーブル。\n・PCのデフォルトゲートウェイアドレス。\nIPA講評は、設問6(2)は正答率が高かったとしています。PCのデフォルトゲートウェイや、L3SW1の経路表は、日々の業務で扱うネットワーク関連情報で、よく理解されていました。"}, "z52-6-4": {"a": "PCのデフォルトゲートウェイアドレス", "e": "【考え方】\n2つ目は、PCのデフォルトゲートウェイアドレスです。順番は問われません。"}, "z53-1-1": {"a": "IP-SAN", "e": "【考え方】\niSCSIを使って、IPネットワーク上に構築するストレージネットワークを、IP-SANといいます。FCを使うFC-SANに対する言い方です。"}, "z53-1-2": {"a": "TCP", "e": "【考え方】\niSCSIは、SCSIコマンドを、TCP/IP上で運ぶプロトコルです。トランスポート層のプロトコルは、TCPです。"}, "z53-1-3": {"a": "SCSI", "e": "【考え方】\niSCSI（Internet SCSI）は、SCSIのコマンドをIPネットワーク上で運びます。ストレージ接続のコマンド体系は、SCSIです。"}, "z53-1-4": {"a": "ターゲット", "e": "【考え方】\niSCSIでは、ストレージ側（要求を受ける側）を「ターゲット」、サーバ側（要求を出す側）を「イニシエータ」といいます。\n\n【補足】\nIPA講評は、設問1では、d、eの正答率が極端に低かったとしています。dのターゲットとイニシエータは、基本用語として理解しておくことが望まれます。"}, "z53-1-5": {"a": "スケーラビリティ 又は 拡張性", "e": "【考え方】\n負荷分散装置を使うと、サーバを追加することで、処理能力を拡張できます。この効果を、スケーラビリティ（拡張性）といいます。\n\n【補足】\nIPA講評は、eの拡張性は、負荷分散装置が生み出す基本的な効果なので、知識としてもっていてほしいとしています。"}, "z53-2-1": {"a": "一つのサービスが，クラスタシステム内の複数のノードで同時に起動する。", "e": "【考え方】\nクラスタシステムでは、ノード間で「ハートビート」を交換して、相手の生死を確認します。ハートビートの回線が切れると、お互いに相手が停止したと判断して、両方のノードが同じサービスを起動してしまいます（スプリットブレイン）。その結果、一つのサービスが、複数のノードで同時に起動して、共有ディスクのデータが壊れるなどの問題が起き、サービスが正常に提供できなくなります。\n\n【補足】\nこの解説は、解答例とクラスタシステムの一般的な説明に基づきます。"}, "z53-2-2": {"a": "ハートビートのやり取りの回線を複数にする。", "e": "【考え方】\nスプリットブレインの対策は、ハートビートの回線を、複数にして冗長化することです。1本が切れても、ほかの回線で相手の生存を確認できるので、誤った判断を防げます。"}, "z53-2-3": {"a": "L2SW→L3SW→LB→L3SW", "e": "【考え方】\n図2の構成で、PCからの要求は、L2SW、L3SW、LB（負荷分散装置）、L3SWの順で、APサーバに届きます。【転送経路】の(a)は、PC→(a)→APサーバ です。したがって、(a)は、L2SW→L3SW→LB→L3SW です。\n\n【補足】\n図2は、問題文で確認してください。この解説は、解答例の確認にとどまります。"}, "z53-2-4": {"a": "L3SW→LB→L3SW→L2SW", "e": "【考え方】\nAPサーバからPCへの戻りの経路です。APサーバを出た応答は、L3SW、LB、L3SW、L2SWの順で、PCに届きます。LBを経由して、行きと同じ経路で戻ります。"}, "z53-3-1": {"a": "データが同一かどうかのチェックが高速化できる。", "e": "【考え方】\n重複除外バックアップでは、ブロックデータが、すでにバックアップされたブロックと重複しているかを判断します。ブロックの内容を全て比較するのではなく、ハッシュ値（短い固定長の値）を比べれば、同一かどうかのチェックを高速化できます。\n\n【補足】\nIPA講評は、設問3は、予想以上の正答率だったとしています。"}, "z53-3-2": {"a": "異なったデータを同じデータと判断してしまう問題", "e": "【考え方】\nハッシュ関数では、異なるデータから、同じハッシュ値ができることがあります（衝突）。衝突が起きると、異なるデータを同じデータと判断してしまい、データの一部がバックアップされなくなる問題が起きます。"}, "z53-3-3": {"a": "・ブロックデータのCRCも合わせて生成し，ハッシュ値とCRCの両方を比較して判断する。", "e": "【考え方】\n衝突の確率を、さらに低くする方法は、判断の根拠を増やすことです。解答例は、次の二つです。\n・ブロックデータのCRCも合わせて生成して、ハッシュ値とCRCの両方が一致したときだけ、同じと判断する。\n・ブロックデータを2分割して、それぞれのハッシュ値を生成し、それらをつなぎ合わせて比較する。\nどちらか一つで正解になると見られますが、この判断は、解答例の書き方からの推測です。"}, "z53-4-1": {"a": "PCに対して検疫のためのプログラムをダウンロードする。", "e": "【考え方】\n新SSL-VPN装置は、PCがVPNに接続する際に、検疫（セキュリティチェック）のためのプログラムを、PCにダウンロードして、実行させます。この処理を、すべてのPCに対して行います。\n\n【補足】\nこの解説は、解答例を基にした記述です。手順(i)〜(vi)の内容は、問題文で確認してください。"}, "z53-4-2": {"a": "(ⅲ)、(ⅳ)", "e": "【考え方】\n認証受付サーバと認証サーバ間の通信が発生する箇所は、連携処理手順の(ⅲ)と(ⅳ)です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。連携処理手順は、問題文で確認してください。"}, "z53-4-3": {"a": "パスワードの安全性が高まる。", "e": "【考え方】\nセキュリティ強化策（認証システムの導入）によって、セキュリティ面で改善される点は、次の二つです。解答例は、この二つを挙げています。\n・パスワードの安全性が高まる（ワンタイムパスワードなど）。\n・PCのセキュリティチェックが行われる（検疫）。"}, "z53-4-4": {"a": "PCのセキュリティチェックが行われる。", "e": "【考え方】\nもう一つの改善点は、PCのセキュリティチェック（検疫）が行われることです。順番は問われません。"}, "z53-4-5": {"a": "認証受付サーバから認証サーバへの通信", "e": "【考え方】\n認証システムを導入したときに、FWに新たに許可設定すべき通信は、送信元とあて先を明確にして、次のうち二つを挙げます。\n・認証受付サーバから認証サーバへの通信。\n・新SSL-VPN装置から認証サーバへの通信。\n・インターネットから認証受付サーバへの通信。"}, "z53-4-6": {"a": "新SSL-VPN装置から認証サーバへの通信", "e": "【考え方】\n2つ目は、解答例の三つのうち、1つ目と異なるものです。「インターネットから認証受付サーバへの通信」でも正解になります。順番は問われません。"}, "z53-4-7": {"a": "8", "e": "【考え方】\n本文中のアに入れる数値の計算で、解答例は 8 です。小数点以下は切り上げて整数で求めます。\n\n【補足】\nこの解説は、解答例の確認にとどまります。計算に使う数値は、問題文で確認してください。"}, "z53-5-1": {"a": "指定された範囲内のIPアドレスあてにpingを発行し，応答の有無でホストの存在を判断する。", "e": "【考え方】\n管理システムが、ネットワーク上のノード（機器）を発見する方法です。指定された範囲内のIPアドレス宛てに、pingを発行して、応答があれば、そのホストが存在する、と判断します。\n\n【補足】\nIPA講評は、設問5(1)は、プロトコルの基本動作を理解することが重要だとして、ping、arpのユニキャストとブロードキャストの動作に加え、arpテーブルから何が分かるかなどを、改めて考えてほしいとしています。"}, "z53-5-2": {"a": "仮想サーバと，仮想サーバが稼働する物理サーバの稼働状態とを対比して監視できるようにする。", "e": "【考え方】\n仮想化環境で性能管理を効果的に行うには、仮想サーバだけでなく、その仮想サーバが稼働する物理サーバの状態も、あわせて監視する必要があります。仮想サーバの性能が落ちた原因が、物理サーバの負荷にあることがあるからです。そのため、両者を対比して監視できる方法が必要です。"}, "z53-5-3": {"a": "障害に結びつくログだけを検出するようにする。", "e": "【考え方】\n運用管理で、大量のログから障害の兆候を探すとき、全てのログを見ると、見落としや負担が増えます。障害に結びつくログだけを検出するようにチューニングすれば、監視の精度と効率が上がります。"}, "z53-6-1": {"a": "CPU使用率の低いAPサーバに処理を振り分ける。", "e": "【考え方】\n負荷テストで、APサーバごとに負荷が偏る状況が判明した場合、ラウンドロビンなどの単純な分散ではなく、サーバの負荷（CPU使用率）を見て、使用率の低いAPサーバに処理を振り分ける方式（動的な負荷分散）が、効果が高くなります。"}, "z53-6-2": {"a": "・データ抽出，加工ロジックの正当性の確認", "e": "【考え方】\nデータ移行テストの目的は、次の三つのうち一つを挙げれば足ります。\n・データ抽出、加工ロジックの正当性の確認。\n・新業務システムにおけるマスタデータの完全性の確認。\n・データ移行に要する時間の確認（図6のシステム切替スケジュールに収まるか）。"}, "z53-6-3": {"a": "・データ移行時に予測できる問題を事前に明確化して，対応策を作っておく。", "e": "【考え方】\nシステム切替スケジュールの立案で、問題発生時の措置の面から、明確にすべき事項は、次の二つです。\n・データ移行時に予測できる問題を、事前に明確化して、対応策を作っておく。\n・システム切替えを断念するときの判断基準と、それを決定する時間を、明確化する。\n\n【補足】\nIPA講評は、設問6(3)は、ネットワーク技術者としての体験や学んだ知識を生かして、必要事項を的確に指摘した解答が過半数を占め、予想以上の正答率だったとしています。"}, "z53-6-4": {"a": "・システム切替えを断念するときの判断基準と，それを決定する時間を明確化する。", "e": "【考え方】\n2つ目は、システム切替えを断念する（元に戻す）ときの判断基準と、決定する時間を明確にすることです。順番は問われません。"}, "z54-1-1": {"a": "ハイパーバイザ", "e": "【考え方】\n仮想化機構（物理サーバ上で、複数のOS実行環境を作る仕組み）は、ハイパーバイザと呼ばれます。\n\n【補足】\nIPA講評は、設問1は、(1)アを除き、正答率は高かったとしています。仮想化技術の基本的な知識は、身に付けておくことが望まれます。"}, "z54-1-2": {"a": "信頼性", "e": "【考え方】\n物理NICを複数使って仮想サーバのネットワーク接続を構成するねらいは、「信頼性」（冗長化）と「通信帯域の確保」です。イとウは順不同です。"}, "z54-1-3": {"a": "通信帯域の確保", "e": "【考え方】\n複数の物理NICを使うもう一つのねらいは、通信帯域の確保です。イとウは順不同です。"}, "z54-1-4": {"a": "チーミング", "e": "【考え方】\n複数の物理NICを束ねて、一つの論理的なNICのように扱う技術を、チーミング（NICチーミング、ボンディング）といいます。冗長化や負荷分散を実現します。"}, "z54-1-5": {"a": "リンク", "e": "【考え方】\nオは「リンク」です。リンクアグリゲーションなど、物理NICと外部スイッチの間の接続（リンク）に関する記述の空欄です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。前後の文は、問題文で確認してください。"}, "z54-1-6": {"a": "仮想NIC", "e": "【考え方】\n仮想サーバから見えるネットワークインタフェースは、仮想NICです。物理NICから外部スイッチに送信されるパケットの送信元MACアドレスは、仮想サーバの仮想NICのMACアドレスになっています。\n\n【補足】\nこの解説は、仮想化機構（仮想スイッチ）の一般的な動作に基づく推論を含みます。"}, "z54-1-7": {"a": "③、④", "e": "【考え方】\n下線(ii)の技術の適用部分は、図2の③と④です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。図2は、問題文で確認してください。"}, "z54-2-1": {"a": "IPベース方式", "e": "【考え方】\n4種類の物理NIC選択方式のうち、動作させる仮想サーバが1台でも、物理NICの負荷分散効果が得られるのは、IPベース方式です。通信相手のIPアドレスごとに、使う物理NICを選ぶので、1台の仮想サーバでも、通信相手が異なれば、別の物理NICが使われます。"}, "z54-2-2": {"a": "通信する相手のIPアドレスによって通過する物理NICが動的に変化するから", "e": "【考え方】\nIPベース方式では、通信する相手のIPアドレスによって、通過する物理NICが動的に変わります。そのため、仮想サーバが1台でも、複数の物理NICを使えて、負荷分散効果が得られます。"}, "z54-2-3": {"a": "③、④", "e": "【考え方】\n冗長化できていない部分は、図3のリンク番号の③と④です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。図3は、問題文で確認してください。"}, "z54-2-4": {"a": "上位リンクに障害が発生した場合，下位リンクを強制的にリンクダウンさせる機能", "e": "【考え方】\n外部スイッチの上位リンクが故障しても、下位リンク（サーバ側）がリンクアップのままだと、サーバのNICが、故障を検出できず、通信できない経路を使い続けます。外部スイッチに、上位リンクの障害時に、下位リンクを強制的にリンクダウンさせる機能をもたせると、サーバ側が障害を検出して、別の経路に切り替えられます。"}, "z54-2-5": {"a": "スパニングツリープロトコル", "e": "【考え方】\n構成パターンで、スイッチ間にループができる構成では、ループを回避する設定が必要です。必要な設定は、スパニングツリープロトコルです。"}, "z54-2-6": {"a": "a、b", "e": "【考え方】\n構成パターンIIで、ループを回避する設定が不要なポートは、図3中のaとbです。\n\n【補足】\nこの解説は、解答例の確認にとどまります。図3の構成は、問題文で確認してください。"}, "z54-2-7": {"a": "同一の送信元MACアドレスをもつパケットが二つのスイッチに送られるので，MACアドレスの学習が適切に行われないから", "e": "【考え方】\nIPベース方式では、一つの仮想サーバが、通信相手によって、別々の物理NIC（別々のスイッチ）を使って通信します。そのため、同じ送信元MACアドレスのパケットが、二つのスイッチに送られます。スイッチのMACアドレステーブルの学習が、不適切になり（MACアドレスのフラップなど）、構成パターンI、IIとは組み合わせられません。\n\n【補足】\nIPA講評は、設問2(4)と(5)の正答率が低かったとしています。負荷分散と可用性を高めるリンクアグリゲーションは、ネットワークの基礎的な技術として理解しておいてほしい、とのことです。"}, "z54-2-8": {"a": "L2SW1とL2SW2の物理NIC接続ポートにリンクアグリゲーションを設定する。", "e": "【考え方】\nIPベース方式は、物理NICの選択を、IPアドレスごとに分散するので、受信側の外部スイッチでは、複数のポートを一つの論理リンクとして扱う設定、すなわち、リンクアグリゲーションが必要です。構成パターンIIIと組み合わせる場合は、L2SW1とL2SW2の物理NICを接続するポートに、リンクアグリゲーションを設定します。"}, "z54-3-1": {"a": "LAN間接続をする必要があるから", "e": "【考え方】\nIPsecのトンネルモードは、元のIPパケット全体を、新しいIPヘッダでカプセル化します。拠点のLAN同士を接続する、LAN間接続には、トンネルモードが適しています。\n\n【補足】\nIPA講評は、設問3は、全体的に正答率が低かったとしています。IPsec-VPNは、LAN間接続を実現する場合の基本的な手法であり、仮想ネットワークという概念が、具体的にどのように実現されているかの理解を深めてほしい、とのことです。"}, "z54-3-2": {"a": "展示会場側では固定IPアドレスが使えないから", "e": "【考え方】\nIKEのメインモードは、通信相手のIPアドレスで相手を識別するので、固定IPアドレスが前提です。アグレッシブモードは、ID情報で相手を識別できるので、展示会場側のように、固定IPアドレスが使えない（DHCPなどで割り当てられる）場合でも、VPNを構築できます。"}, "z54-3-3": {"a": "ルータのLAN側ポートに接続し，DHCPで割り当てられたグローバルアドレスを取得する。", "e": "【考え方】\n主催者が準備する展示会場側ルータのLAN側ポートに、持ち込むVPNルータを接続し、VPNルータのWAN側が、DHCPで割り当てられたグローバルアドレスを取得して、インターネットに接続します。固定IPアドレスが使えないので、アドレスをDHCPで取得する前提です。\n\n【補足】\nこの解説は、解答例を基にした記述です。"}, "z54-3-4": {"a": "プライベートアドレスを使用しデフォルトゲートウェイ設定をD社開発拠点のVPNルータのIPアドレスに設定する。", "e": "【考え方】\n事前確認のために、D社開発拠点のVPNルータの配下に接続する、展示会場用のVPNルータには、プライベートアドレスを設定し、デフォルトゲートウェイを、D社開発拠点のVPNルータのIPアドレスにします。D社内のLANの延長として、接続して動作確認をする形です。"}, "z54-3-5": {"a": "VPNパススルー，IPsecパススルー，NATトラバーサルのいずれか", "e": "【考え方】\nモバイルルータは、NAT（NAPT）機能を持ち、ESPなどのIPsecのパケットを、そのままでは通せないことがあります。そのため、モバイルルータでは、VPNパススルー、IPsecパススルー、NATトラバーサルのいずれかの設定が必要でした。展示会場のVPNルータにはNATがなく、この設定は不要でした。"}, "z54-4-1": {"a": "共有ディスクとし，仮想サーバのプログラムとデータを格納しておく。", "e": "【考え方】\n物理サーバに障害が発生したとき、速やかに自動切替えを行うには、仮想サーバのプログラムとデータを、共有ディスク（ストレージ1と2）に格納しておきます。別の物理サーバが、その共有ディスクを使って、仮想サーバを起動できるので、データの移動が不要になります。\n\n【補足】\nIPA講評は、設問4(1)の正答率が低かったとしています。共有ディスクを使ったクラスタリング方式はよく知られた技術であり、ネットワーク技術者も、幅広い技術的視野をもつことが期待されています。"}, "z54-4-2": {"a": "既設のネットワーク環境を使って共有ストレージ環境が構築できる。", "e": "【考え方】\niSCSIは、IPネットワーク（イーサネット）上でストレージにアクセスします。FCのような専用のネットワークを新設せずに、既設のネットワーク環境を使って、共有ストレージ環境を構築できます。"}, "z54-4-3": {"a": "・管理ポートから管理サーバへのネットワークの冗長化", "e": "【考え方】\n下線(v)の「管理システムの可用性に配慮した設計」として、ネットワーク設計上の具体的な対策は、次の三つが挙げられます。解答例は、そのうちの一つで足りると見られます（この判断は、解答例の書き方からの推測です）。\n・管理ポートから管理サーバへのネットワークの冗長化。\n・ほかのトラフィックの影響を受けない、優先転送や通信帯域の確保。\n・管理サーバの冗長化。"}, "z55-1-1": {"a": "⑫", "e": "【考え方】\nIEEE 802.1X（EAP-TLS）で、PCがクライアント証明書を送出するシーケンスは、図2中の⑫です。\n\n【補足】\nIPA講評は、設問1は、無線LANのセキュリティ確保について出題し、(3)(4)の正答率が低かったとしています。この解説は、解答例の確認にとどまります。図2は、問題文で確認してください。"}, "z55-1-2": {"a": "クライアント署名", "e": "【考え方】\nEAP-TLSでは、PCは、クライアント証明書を送るとともに、自分が秘密鍵の所有者であることを示すために、「クライアント署名」を送ります。サーバ側は、証明書の公開鍵で署名を検証して、クライアントを認証します。"}, "z55-1-3": {"a": "送り合った乱数を使ってミキシングすることでランダム性を実現したこと", "e": "【考え方】\nWEPは、暗号鍵（IV＋固定鍵）の予測が容易でした。新しい方式（WPA2など）では、AP（認証サーバ）とPCが、お互いに乱数を送り合い、それらを使って、暗号鍵（セッション鍵）を、ミキシング（混ぜ合わせ）して生成します。これによって、暗号鍵のランダム性が高まり、予測を困難にしています。"}, "z55-1-4": {"a": "アソシエーション", "e": "【考え方】\n無線LANで、端末が無線APに接続するための手続きを、アソシエーションといいます。アは、「アソシエーション」です。"}, "z55-1-5": {"a": "認証が端末と無線APの1対1の関係で行われるから", "e": "【考え方】\n有線LANでは、一つのポートに、複数の端末（ハブなどを介して）がつながる場合があり、ポート単位の認証では、接続制御が不十分になることがあります。無線LANでは、認証が、端末と無線APの1対1の関係で行われるので、端末ごとに接続を制御しやすく、接続制御上の問題が少なくなります。\n\n【補足】\nIPA講評は、(3)(4)の正答率が低かったとしています。無線LANでのポートの概念と、接続制御について、確実に理解してほしい、とのことです。"}, "z55-2-1": {"a": "PKI 又は 公開鍵基盤", "e": "【考え方】\n電子証明書を使った認証を実現するために必要な、認証基盤は、PKI（Public Key Infrastructure、公開鍵基盤）です。"}, "z55-2-2": {"a": "秘密鍵", "e": "【考え方】\n電子証明書は、公開鍵を証明するものです。その公開鍵と対になる「秘密鍵」を、本人だけがもっていることが、本人確認の前提です。利用者認証には、認証を要求する者が、秘密鍵を所有していることが必要です。"}, "z55-2-3": {"a": "（証明書）失効リスト 又は CRL（Certificate Revocation List）", "e": "【考え方】\n紛失や盗難などで、無効にした証明書の一覧を、証明書失効リスト（CRL）といいます。認証サーバは、CRLを確認して、失効した証明書の利用者の接続を拒否します。"}, "z55-2-4": {"a": "許可されていない利用者でも当該PCを使えばネットに接続できること", "e": "【考え方】\nクライアント証明書を、PCに格納する方式では、PCを盗まれたり、許可されていない人が使ったりしても、そのPCを使えば、ネットワークに接続できてしまいます。B主任が指摘した問題点です。"}, "z55-2-5": {"a": "PCへの利用者パスワードの設定を徹底する。", "e": "【考え方】\n問題点への対策として、C君が考えたPCの運用方法の改善案は、PCに利用者パスワード（OSのログオンパスワードなど）を設定することを徹底することです。許可されていない人が、PCを使えなくなります。"}, "z55-2-6": {"a": "秘密鍵を読み出すことなく処理できるので秘匿性が増す。", "e": "【考え方】\nトークン（ICカードなど）の内部で、暗号処理（署名など）を行うと、秘密鍵をトークンから読み出さずに、処理できます。秘密鍵が外部に出ないので、秘匿性が増し、漏えいしにくくなります。\n\n【補足】\nIPA講評は、設問2では、(4)の正答率が低かったとしています。利用者認証には、認証要求者が秘密鍵を所有していることに加えて、唯一の所有者であることが必要です。"}, "z55-3-1": {"a": "CSMA/CA", "e": "【考え方】\n無線LANのアクセス制御方式は、CSMA/CA（搬送波感知多重アクセス／衝突回避）です。有線LANのCSMA/CDと違い、無線では衝突を検出できないので、衝突を避ける方式を採ります。"}, "z55-3-2": {"a": "802.11n", "e": "【考え方】\n無線LAN規格の混在による影響に関する問いです。解答例は、IEEE 802.11n です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。前後の文は、問題文で確認してください。IPA講評は、設問3の正答率は高かったとしています。"}, "z55-3-3": {"a": "端末間で電波が直接届かない位置関係にある場合", "e": "【考え方】\n自己CTS方式は、送信を始める前に、自分宛てのCTSを送って、周囲に通信を予告し、衝突を避ける方式です。RTS/CTS方式は、送信元と受信側の両方から、周囲に予告できます。端末同士が、電波の届かない位置にいる（隠れ端末）場合、自己CTSでは、相手に予告が届かず、衝突を回避できません。"}, "z55-3-4": {"a": "CTS", "e": "【考え方】\n同一の無線APに接続する、すべての無線端末で受信される必要がある制御フレームは、CTSです。CTSは、無線APが送るので、全端末に届き、NAV（送信禁止期間）を設定させます。\n\n【補足】\nこの解説は、解答例とRTS/CTS方式の一般的な説明に基づきます。"}, "z55-3-5": {"a": "無線LANでは衝突の検出ができないので，確実に届いたことを通知する必要があるから", "e": "【考え方】\n無線LANでは、有線LANのように、送信中に衝突を検出できません。そのため、受信側が、ACKを返して、データが確実に届いたことを、送信側に通知する必要があります。ACKが返らなければ、衝突などで失敗したと判断して、再送します。"}, "z55-3-6": {"a": "203", "e": "【考え方】\n本文中の a に入れる数値の計算です。解答例は 203 です。小数点以下は切り上げて、整数で求めます。\n\n【補足】\nこの解説は、解答例の確認にとどまります。計算に使う数値は、問題文で確認してください。"}, "z55-4-1": {"a": "⑱", "e": "【考え方】\nIEEE 802.1X認証を用いた場合に、VLAN IDが有効になる契機は、認証成功の通知（EAP-Success、RADIUSのAccess-Accept）に、VLAN IDが含まれて、無線APに通知されるときです。図2中のシーケンス番号は、⑱です。\n\n【補足】\nIPA講評は、設問4は、全体として正答率が低かったとしています。認証技術とVLAN制御を組み合わせた、システムの構築を、具体的に考えて解答してほしかった、とのことです。この解説は、解答例とIEEE 802.1Xの一般的な動作に基づきます。"}, "z55-4-2": {"a": "ESS-IDには同一のIDを設定し，認証サーバから通知されたVLAN IDを無線APにセットする。", "e": "【考え方】\n全ての無線APで同じESS-IDを使い、認証サーバから通知されたVLAN IDを、無線APが、認証を受けた端末の通信に割り当てます。これによって、社員は、どのエリアの無線APに接続しても、所属する部門LANのVLANに接続できます（ポータビリティの実現）。"}, "z55-4-3": {"a": "無線APが認証失敗の時に割り当てるVLANに配布サーバを設置する。", "e": "【考え方】\nクライアント証明書を配布する配布サーバは、まだ認証されていない端末（証明書を持たない端末）がアクセスする必要があります。そこで、無線APが認証失敗の時に割り当てるVLANに、配布サーバを設置します。そのVLANからは、配布サーバだけにアクセスでき、社内ネットワークにはアクセスできません。"}, "z55-4-4": {"a": "ダウンロードされた証明書は，それ以降ダウンロードできないよう削除する。", "e": "【考え方】\n配布サーバに格納した証明書類を、不正にダウンロードされにくくする方法は、利用者が一度ダウンロードした証明書は、サーバから削除して、それ以降、ダウンロードできないようにすることです。複数回のダウンロードによる、なりすましを防げます。"}, "z55-4-5": {"a": "認証サーバ内の該当社員に付与するVLAN IDの設定を変更するだけで済む。", "e": "【考え方】\n無線APに設定を入れる方式（MACアドレスやSSIDごとの設定）では、部署が変わるたびに、無線AP側の設定を変更する必要があります。認証サーバのVLAN ID方式では、認証サーバ内の該当社員に付与するVLAN IDの設定を変更するだけで済み、運用が容易になります。"}, "z56-1-1": {"a": "ITサービス", "e": "【考え方】\nネットワークは、ITサービスの構成要素です。運用管理に関わる用語や考え方（ITサービスマネジメント、ITILなど）の、基本的なものは知っておく必要があります。\n\n【補足】\nIPA講評は、設問1は、アの正答率が非常に低かったとしています。"}, "z56-1-2": {"a": "ディスプレイ", "e": "【考え方】\nリモートKVMスイッチのKVMは、キーボード（K）、ビデオ（ディスプレイ、V）、マウス（M）の略です。サーバの操作に使うディスプレイを共用する、という説明の空欄です。\n\n【補足】\nこの解説は、解答例とKVMスイッチの一般的な説明に基づきます。"}, "z56-1-3": {"a": "ブレーカ", "e": "【考え方】\nサーバの電源容量は、電源タップや、ブレーカの許容電流を超えないように設計します。超えると、ブレーカが落ちて、全体が停止します。"}, "z56-1-4": {"a": "ホットスワップ", "e": "【考え方】\n電源を入れたまま（稼働中のまま）、部品を交換できる機能を、ホットスワップといいます。冗長な電源ユニットなどで使われます。"}, "z56-1-5": {"a": "コンティンジェンシ", "e": "【考え方】\n移設計画で、問題が発生したときに、どう対処するかを定める計画を、コンティンジェンシプラン（緊急時対応計画）といいます。"}, "z56-1-6": {"a": "リハーサル", "e": "【考え方】\n本番の作業の前に、手順どおりに実施して、問題点や所要時間を確認する作業を、リハーサルといいます。"}, "z56-1-7": {"a": "作業時間", "e": "【考え方】\n移設計画で、各作業に必要な時間を見積もるとき、リハーサルで確認した「作業時間」を、基にします。"}, "z56-1-8": {"a": "ミラーリング", "e": "【考え方】\nディスクを二重化して、同じデータを二つのディスクに書く方式を、ミラーリングといいます。サーバの移設中に、データを保護する対策などで使われます。\n\n【補足】\nキ、クは、解答例の確認にとどまります。前後の文は、問題文で確認してください。"}, "z56-2-1": {"a": "リモートKVMスイッチのIPアドレス", "e": "【考え方】\nリモートKVMスイッチを使って、サーバβを操作するには、操作するPCから、リモートKVMスイッチにネットワーク経由でアクセスします。そのため、aには、リモートKVMスイッチのIPアドレスを指定します。"}, "z56-2-2": {"a": "6", "e": "【考え方】\n表1の電源の数値を使った計算で、解答例は 6 です。100Vと200Vの電源効率が同じとして、電流などの値を求めます。\n\n【補足】\nこの解説は、解答例の確認にとどまります。表1の数値は、問題文で確認してください。"}, "z56-2-3": {"a": "L3SW-1の電源ユニット#1とL3SW-2の電源ユニット#1を、一方の電源系統（電源タップ2個と電源）に接続し、L3SW-1の電源ユニット#2とL3SW-2の電源ユニット#2を、別系統の電源（電源タップ2個と電源）に接続する。", "e": "【考え方】\n冗長な電源ユニットをもつL3SWは、電源ユニット#1と#2を、別々の電源系統に接続すると、片方の電源が停止しても動作を続けられます。図2に、別系統の電源（100V、30A）と電源タップ2個を追加して、次のように接続します。\n・L3SW-1の電源ユニット#1とL3SW-2の電源ユニット#1：現在の系統（電源タップ、電源）。\n・L3SW-1の電源ユニット#2とL3SW-2の電源ユニット#2：追加した別系統（電源タップ、電源）。\n\n【補足】\n図は、文章で答える形に直しています。実際の試験では、解答欄の図に、電源と電源タップを書き足して、線でつなぎます。IPA講評は、設問2(3)は正答率が高かったとしています。"}, "z56-2-4": {"a": "バックアップの取得", "e": "【考え方】\n図3の作業項目の cは、移設作業の前に必要な「バックアップの取得」です。問題が起きたときに、元に戻せるようにします。"}, "z56-2-5": {"a": "サーバαのIPアドレス変更", "e": "【考え方】\ndは、「サーバαのIPアドレス変更」です。移設に伴って、サブネットを本社側からDC側へ移すため、サーバのIPアドレスを変更する作業です。\n\n【補足】\nこの解説は、解答例の確認にとどまります。図3は、問題文で確認してください。"}, "z56-2-6": {"a": "本社側L3SWからサブネットを削除し，DC側L3SWに追加する。", "e": "【考え方】\n項番⑧の「ネットワークの移行」とは、サブネットを、本社側のL3SWから削除し、DC側のL3SWに追加する作業です。これで、サーバが、DCから、同じサブネットで通信できるようになります。"}, "z56-2-7": {"a": "この作業が完了しないと，複数のサーバ間接続が正しく行えないから", "e": "【考え方】\n項番⑧（ネットワークの移行）が完了しないと、複数のサーバ同士の接続が、正しく行えません。そのため、⑧の後で、作業の完了を確認するチェックポイントが必要です。\n\n【補足】\nIPA講評は、設問2(6)は、複数の担当者が関係する作業でのチェックポイントの意義を理解していないと思われる解答が多かったとしています。"}, "z56-2-8": {"a": "この作業が完了しないと，翌日の利用者を含めた業務確認が行えないから", "e": "【考え方】\n項番⑩の作業が完了しないと、翌日に、利用者を含めた業務確認を行うことができません。そのため、⑩の後で、チェックポイントを設けます。"}, "z56-3-1": {"a": "④：ARP応答（あて先MAC：サーバβ、送信元MAC：サーバα）／⑥：ICMP echo要求（あて先MAC：サーバα、送信元MAC：サーバβ）／⑦：ARP要求（あて先MAC：ブロードキャスト、送信元MAC：サーバα）／⑧：ARP応答（あて先MAC：サーバα、送信元MAC：L3SW）／⑨：ICMP echo応答（あて先MAC：L3SW、送信元MAC：サーバα）", "e": "【考え方】\nサーバ間の通信は、同じサブネット内ならARPで相手のMACアドレスを調べてから、ICMP echoのやり取りをします。異なるサブネットの場合は、デフォルトゲートウェイ（L3SW）のMACアドレスを宛先にします。\n・④：ARP応答。サーバαがサーバβに返す。\n・⑥：ICMP echo要求。サーバβからサーバαへ。\n・⑦：ARP要求。サーバαが、ブロードキャストで、L3SW（ゲートウェイ）のMACアドレスを問い合わせる。\n・⑧：ARP応答。L3SWがサーバαへ返す。\n・⑨：ICMP echo応答。サーバαが、L3SWのMACアドレスを宛先に送る（相手が別のサブネットにあるため、ゲートウェイのL3SW経由）。\n\n【補足】\n表は、文章で答える形に直しています。この解説は、解答例の表と、図5の構成からの推論を含みます。IPA講評は、設問3は、L3SWの基本的な技術に関するものだったが、正答率は低かったとしています。L3SWは、ルータではなく、L2SWの機能ももっていることを、理解しておいてほしい、とのことです。"}, "z56-3-2": {"a": "サーバγに対するゲートウェイとして，172.28.42.126が誤って設定されていたから", "e": "【考え方】\nサーバγからサーバαへのpingが失敗した原因は、サーバγに、デフォルトゲートウェイとして、172.28.42.126 が誤って設定されていたことです。正しいゲートウェイ（L3SWのIPアドレス）にパケットが届かず、通信できませんでした。"}, "z56-3-3": {"a": "手順にないことを担当者だけの判断で実施しないことを徹底する。", "e": "【考え方】\n障害の原因は、設定の誤りで、手順にない作業を、担当者の判断で行った結果と考えられます。対策として、手順にないことを、担当者だけの判断で実施しない、ことを徹底します。\n\n【補足】\nこの解説は、解答例を基にした記述です。"}, "z56-4-1": {"a": "①ア、②ア、③エ、④ア、⑤エ、⑥ウ", "e": "【考え方】\n図4のポートの、STPでの正常時の状態です。選択肢は、ア 代表ポート、イ バックアップポート、ウ ブロッキングポート、エ ルートポートです。\n・ルートブリッジ側に向かうポートが、ルートポート（エ）です。③と⑤です。\n・ルートブリッジから先に向かうポートが、代表ポート（ア）です。①、②、④です。\n・ループを避けるために、ブロックされるポートが、ブロッキングポート（ウ）です。⑥です。\n\n【補足】\nIPA講評は、設問4はスパニングツリーに関するもので、正答率は低かったとしています。ネットワークの冗長構成を実現するために、よく使われる技術なので、その仕組みについて理解しておいてほしい、とのことです。この解説は、解答例とSTPの一般的な動作に基づきます。"}, "z56-4-2": {"a": "L2SW-1のポート⑥がフォワード状態になり，フレームのループが発生し，L3SW-1の処理に影響を与えたから", "e": "【考え方】\nL2SW-1がBPDUを処理できなくなると、L2SW-1は、STPの計算ができず、ブロッキングだったポート⑥が、フォワード状態になります。すると、レイヤ2のループが発生して、フレームが回り続け、L3SW-1の処理が圧迫されます。L3SW-1を経由する、ほかのL2SWに接続されたサーバの通信にも、影響が及びます。"}, "z56-4-3": {"a": "L2SW-1のポート⑥のケーブルを抜く。", "e": "【考え方】\nループを止める、障害復旧の処置です。ループの原因である、L2SW-1のポート⑥のケーブルを抜いて、ループを断ちます。"}, "z56-5-1": {"a": "窓口担当者を中心に、窓口担当者とS担、NW担、OP、F部長、運用SEを線で結び、S担とSI業者、NW担と保守業者、運用SEと監視オペレータ、通信事業者、保守業者を、それぞれ線で結ぶ。", "e": "【考え方】\n解答例の図は、窓口担当者を中心にした連絡体制です。F部長の要望は、「運用SEの役割に、E社設置機器の保守業者と通信事業者への対応も含める」ことと、「窓口担当者に、D社内部の情報を一元管理させる」ことです。これを反映して、次のとおりに線で結びます。\n・窓口担当者：S担、NW担、OP、F部長、運用SEと結ぶ。\n・S担：SI業者と結ぶ。\n・NW担：保守業者と結ぶ。\n・運用SE：監視オペレータ、通信事業者、保守業者（E社設置機器）と結ぶ。\n\n【補足】\n図は、文章で答える形に直しています。実際の試験では、解答欄の図に線を書き込みます。IPA講評は、設問5は運用体制に関する設問で、本文の状況設定を整理して解答してほしいとしています。この解説は、解答例の図の読み取りです。"}, "z56-5-2": {"a": "構成情報が最新になっていないことが問題点であり，構成情報の更新手順を明確にする。", "e": "【考え方】\n「構成管理の不備」は、現状を調べるのに時間がかかった、構成情報などの文書が導入時のままで、その後の変更が反映されていなかったことを指します。問題点は、構成情報が最新になっていないことです。対応は、構成情報の更新手順を明確にすることです。"}};
  var PROBLEM_NOTES = {"7": "IPA採点講評（要旨）：全体として正答率は低め。設問1（TLSのバージョン・プロトコル選定）、設問2(1)（暗号スイート中のアルゴリズムの用途）、設問2(2)（動作方式の選定根拠）は特に低かった一方、設問3・設問4は高かった。設問4は、L3SWに隣接するFWの設定を考慮しない誤答も見られた。", "8": "IPA採点講評（要旨）：全体として正答率は高め。設問2(2)の広域イーサ網の計算は低かった。設問2(3)は利点への言及がない解答が散見された。設問3(2)は「パケットを破棄する」と誤答した受験者が多く、シェーピングとポリシングの違いの理解が課題。", "9": "IPA採点講評（要旨）：設問2(1)（トランスポートモードを選んだ根拠）と設問4（二つのVPNトンネルを監視する目的）は正答率が低かった。設問3(4)は、経路ループの防止策としてSTPと誤答する例が散見された。", "13": "IPA採点講評（要旨）：全体として正答率は低め。設問1はウ（Set-Cookie）、設問3(2)（Secure属性）が特に低かった。設問4はアドレス重複検知の仕組みと対処の理解が課題。", "14": "IPA採点講評（要旨）：全体として正答率は高め。設問2(1)は4つのアドレスが全て正しい解答が少なかった。設問3(2)「い」は、「社内NW⇔(インターネット・DMZ)は全てProxy経由」「LB4はFWとProxyの負荷分散を併用」の条件の見落としが多かった。", "15": "IPA採点講評（要旨）：全体として正答率は高め。設問1は専門用語（ミラーポート・ICMPの設定など）の正答率が低かった。設問2(2)はFWとの連携、設問3(1)(2)はIPSの機能の理解が課題。", "16": "IPA採点講評（要旨）：全体として正答率は高め。設問2(4)（2種類のポートの使い分け）と(5)（STARTTLS方式のポート番号）、設問3(1)（SMTPの基本的なシーケンス）の正答率が低かった。", "17": "IPA採点講評（要旨）：全体として正答率は低め。設問2(1)はステルス機能の効果を答える誤りが多く、(2)はSSID・MACアドレスが暗号化できないことの理解が不足。設問4(1)は、利用者認証を含めたログ取得の観点が課題。", "18": "IPA採点講評（要旨）：全体として正答率は低め。設問1(4)は、負荷が偏りやすくなる条件を答えられた解答が少なかった。設問3(2)(3)は、未変更社員・実施済み社員・社外の三者間の転送経路を図3に書き込めば導けるとされている。", "19": "IPA採点講評（要旨）：全体として正答率は低め。設問1はウ・エ（QoS用語）、設問2(1)〜(3)が低かった。(1)は通信経路の説明にとどまらず、デフォルトゲートウェイの冗長化と仮想ルータに着目するのが要点。設問3(2)も低かった。設問2(4)は高かった。", "20": "IPA採点講評（要旨）：全体として正答率は低め。設問1はイ（ステートフルフェールオーバ）が低かった。設問2(1)はアプリケーション間の通信に着目する、(3)はSW2を挟むことで第2層を透過しつつ第1層を分離している観点、(5)aは第2層と第3層の違いが課題。設問3(2)は配置の具体性が不足する解答が多かった。", "21": "IPA採点講評（要旨）：全体として正答率は高め。設問1はDNSの用語の正答率が低かった。設問3(2)は、本文の条件を読まず経験や一般知識だけで答えた解答が非常に多かった。設問4はPDCAサイクルに従った改善手法が重要。", "22": "IPA採点講評（要旨）：全体として正答率は高め。設問1はアとイの正答率が低かった。設問2(1)(2)の正答率が低く、基本的な知識と、本文をしっかり読むことが必要。設問4は全体として正答率が低く、本文の要件と状況設定を整理して読むことが必要。", "23": "IPA採点講評（要旨）：全体として正答率は高め。設問1はアとオが低かった。設問2(3)は低かった（一般的なBBルータの構成の知識で導ける）。設問3(1)のb・cが低く、(4)は目的を答えたり構成を曖昧に書いたり、タグVLANで結ぶ構成を挙げる誤りが目立った。", "24": "IPA採点講評（要旨）：全体として正答率は低め。設問1はイ（VLAN数の制約の理由）が特に低かった。設問2は(2)と(3)が低く、L3SWがL2SWとしても動作すること、フレームフォーマットを意識することが必要。設問3は(1)の図示は高く、(3)は低かった。", "25": "IPA採点講評（要旨）：設問1(2)の正答率が低く、導入構成例（図1）に三つのFWがあることを踏まえて、Xシステムの記述を注意深く読むことが必要。設問2(2)（QoSレベルの考え方）の正答率が低かった。通信シーケンス（図3）を読んで仕組みを理解しておくこと。設問3は比較的高いが、リダイレクトに関する(1)シの誤答が見られた。設問4は、メッセージ交換システムの拡張性と、NATで二つのネットワークを接続したときの制約を理解して解答すること。", "26": "IPA採点講評（要旨）：設問1はイ（ステートフル）の正答率が低かった。設問2は全体として低く、(3)は仮想サーバの移動に不可欠な設定なので理解しておくこと。設問4は(1)が低く、仮想FWに設定するネットワーク情報は通常のFWとほぼ同じ。設問5は(1)が低く（図4の配置では物理サーバ3の障害で3顧客が同時に停止する）、(2)(3)(4)は高かった。", "27": "IPA採点講評（要旨）：設問1は正答率が高かった。設問2は正答率が高く、SDNへの理解がうかがえたが、(2)〜(4)に誤答が目立った（パケット識別条件とActionの定義・読解）。設問3は正答率が低い問題が複数あり、(1)はDNSの正しい知識、(4)(5)はCDNを使ったネットワークの動作の理解が必要。設問4は全体に低く、(3)は自社要員だけで構成変更ができること、(4)は準備作業全体、(5)はIaaS利用とアウトソーシングの混同が目立った。", "28": "IPA採点講評（要旨）：設問1はa、b、cは高く、eが低かった（IEEE 802.11i）。設問2は(2)が高く、(1)が低かった。設問3は全体に高く、(5)（PoE+の呼称）が低かった。設問4は(1)が低かった（認証に必要な情報）。設問5は(1)のオーセンティケータ（WLC）と、(5)の理由（PMKの保持）が低く、(2)と(6)は高かった。", "29": "IPA採点講評（要旨）：全体としてよく理解されていた。設問2(2)は基本問題だが、IP層とTCP層の動作を取り違えたり不正確な解答が散見された。設問3(3)(4)は、マルチホーミング環境でのWebRTC利用という応用問題で、やや低かった。設問4(1)は、図6やHTTPの一般知識からの推論を期待したが、SIPに引きずられた誤答が多かった。設問5は、設計の(2)(7)と運用の(5)(6)が低く、時間切れと思われる誤答が多かった。", "30": "IPA採点講評（要旨）：設問1はアとイが踏み込んだ内容で、正答率が低かった。設問2は(1)が高く、(2)が低かった（フェーズ2の認証方式は、IPsec通信のデータの完全性を認証するもの）。設問3は(3)が低く、図で示した通信手順とパケット形式を基にじっくり考えること。設問4は、GREパケットをIPsecでカプセル化する方法で、午後では初出題だが正答率は高かった。設問5は、(3)(4)と(6)のえを除いて正答率は高く、(4)は経路テーブルの変化の理解、(6)のうは、本文の見落としが目立った。", "31": "IPA採点講評（要旨）：設問1〜4に正答率の大きな偏りはなく、全体としてよく理解されていた。設問1(1)と設問3(2)（TCP/IPの基本）、設問4(5)(6)（HTTP）の正答率が比較的低かった。設問1は、ヘッダ内のアドレスの変化を落ち着いて確実に答えること。設問2は、HTTP/1.1の基本知識と通信シーケンス例から読み解く問題で、(2)(5)(6)は経験によって差が出た。設問4は、TCPコネクション解放によるFWの論理資源節約という逆の要件に注意すること。", "32": "IPA採点講評（要旨）：全体としてよく理解されていた。設問1は、cの正答率が低かった（FTPのアクティブモード）。設問2は(1)が低く、設問の趣旨を理解して答えること。設問3は、IPsec NATトラバーサルに関して正答率が高かった。設問4(1)(2)は低かった（マルチキャストでは、送信元は必ずユニキャストのアドレスで、スイッチのMACアドレス学習は送信元アドレスで行う）。設問5は、VXLANの知識がなくても導ける問題で、正答率は比較的高かった。", "33": "IPA採点講評（要旨）：全体として正答率は高かった。設問1はア〜ウが高く、エ（権威DNSサーバ）が低かった。設問2はDNSラウンドロビン方式の問題で、全体に高かった。設問3(1)はサブドメイン作成時のDNSの設定（権限の委譲）で、正答率が低く、DNSの各サーバの役割と連携の理解が必要。(2)は高く、(3)(4)はサーバ選択方式やパーシステンスの基本知識で、高かった。", "34": "IPA採点講評（要旨）：全体として正答率は高かった。設問1(1)は基本的な用語だが、ア、エ、オの正答率が低かった。(2)と設問2(1)は図示の問題で、正答率は高かった。設問2は通信の流れで高く、設問3は構成に条件を加えて設計をやり直す問題で、(1)(2)は高く、(3)(4)と進むに従い低くなった。誤答は、本文の記述の読み落としや、本文にない条件の追加が多かった。", "35": "IPA採点講評（要旨）：全体として正答率は低めで、IEEE 802.11nの基礎知識が不足していた。設問1は全体に低かった。設問2(3)、設問3(2)は図中の機器名で答える問題だが、機器名を正確に書いていない解答が多かった。設問2(3)と設問3(3)は、本文の条件を前提に図を読み解く問題で、自身の経験や一般知識だけで答えた誤りが散見された。設問3(3)(4)はおおむね理解されていた。", "36": "IPA採点講評（要旨）：全体として、おおむねできていた。設問1はアの正答率が低かった（ベースバンドとブロードバンドの区別）。設問3(2)は、要件とV製品のポート間の優先設定の関係が理解できれば容易で、VOD配信サーバにポートが二つ必要なことを見抜けていない解答や、未接続ポートが残った解答があった。(3)は正答率が低く、PC1台あたりの帯域が、各フローの帯域とフロー数の積であることに気づけるかが要点。", "37": "IPA採点講評（要旨）：おおむね良くできていた。設問1は正答率が高かった。設問2は(1)と(2)エの正答率が低く、M/M/1ではランダム到着が前提（ポアソン分布・指数分布と同値）。平均待ち時間の公式とあわせて待ち行列理論を確認すること。設問3は(2)ケと(3)の正答率が低かった。空白や、メール1件あたりではなく全体の所要時間を算出した解答があった。図3の内容は単純なので、本文を注意深く読めば解ける。", "38": "IPA採点講評（要旨）：全体として、あまり出来はよくなかった。設問1は、ア、オ、カの正答率が低かった（オ、カは頻出用語）。設問2は(2)と(3)が低く、(2)の事前準備は構築フェーズから考慮すること、(3)の通信要件には遮断だけでなく許可も含まれる。設問3は(1)と(2)が低く、運用フェーズの考慮が足りないと正答に至りにくい。(3)は正答率が高かった。", "39": "IPA採点講評（要旨）：おおむね予想どおりの正答率。設問1はア〜エはよくできていたが、オ〜キが低かった（図3は単純な通信シーケンス例で、読み解く力を養うこと）。設問2(1)は本文を注意深く読めば導けるが低く、変更が不要なFW、DNS、PCに関する誤答が目立った。(2)も低く、環境変更によって通信特性がどう変化するかを理解する必要がある。設問3の図示は、おおむねよくできていた。", "40": "IPA採点講評（要旨）：全体として正答率はやや低めで、基礎知識が不足している受験者が少なくない。設問1はア、イ（統計多重効果、コーデック）が低かった。設問2(3)は、TC及び仮想PCの通信の関係を本文から読み取れていない解答が散見された。設問3(1)は正答率が低く、提示された論理や条件から計算式を導く力が必要。(2)はIP-VPNではなくインターネットVPNの影響を挙げた誤答、(5)は二つの項目を指摘しないあいまいな解答が多かった。", "41": "IPA採点講評（要旨）：比較的平易な設問だったが、予想に比べて正答率は低かった。設問1はイ（シグネチャ）の正答率が低かった。設問2(1)は表から不正侵入のパターンを見いだす問題だが、単に問題文から抜き出している解答が多かった。(3)はしきい値の高低とアクセス数の多少を混同した解答が多かった。設問3(3)は、運用まで含めた実践的な知識が問われ、比較的正答率が高かった。", "42": "IPA採点講評（要旨）：全体として正答率は低めで、ネットワークの基礎知識が不足していると思われる解答が多かった。設問1は、ア、イ、オの正答率が低かった。設問2(2)はブリッジテーブルの構造を理解していない解答が散見された。(3)は、L2SW3とAP間がタグVLANであることと、“ESS ID”を使う指示に気づいていない受験者が多かった。設問3(2)の図示は、ループが発生する条件に着目して、SWのポートを接続するL2SW2のVLAN IDを間違えないこと。", "43": "IPA採点講評（要旨）：全体として正答率は高かった。設問2(1)(3)は表中の機能を選択して設定内容を答える問題で、表中の機能を記述していない解答が多かった。(2)は社内メールのSMTPトラフィックのルートの理解を問う簡単な設問だが、POP3に着目した解答が多かった。設問3(3)は、IMAPサーバとしてASPサーバを設定する誤答が多かった。(4)は、送信元IPアドレスやプロトコル名の記述が不足し、IMAPSと書いた誤答が多かった。", "44": "IPA採点講評（要旨）：全体として正答率は高かった。設問1(2)は、レイヤ4の稼働監視（コネクション確立の試行）を問うたが、レイヤ3のping方式の解答が多く、TCPの3ウェイハンドシェイクを述べた解答は非常に少なかった。設問2(1)cは、ソースNAT機能を利用しないという本文の記述を理解していない解答が多かった。(3)は、同一ネットワークのPCに転送するパケットを、LB経由に変える方法で、サブネットマスクに言及した解答が非常に少なかった。", "45": "IPA採点講評（要旨）：全体としてよく理解されていた。特に設問5の正答率が高かった。設問3(3)と設問4(4)では、問題の趣旨に沿わない解答が散見された。設問1ではcの正答率が低く、TCP/IP通信の基本動作から導いてほしかった。設問2は(2)(3)(4)の理由の正答率が低かった。SMTPで詐称が可能な情報と困難な情報の理解が十分でなかった。設問3はSSL関連で正答率が低かった。設問4はパケットフィルタリングで正答率が高かった。", "46": "IPA採点講評（要旨）：設問2(2)は、SIPメッセージ内の情報の書換えの必要性を問うたが、正答率が低かった。設問3は、ミラーポートの出力フレームを仮想環境のサーバに取り込む方法を問う問題で、正答率が低かった（宛先MACアドレスが別のフレームでは送信元MACアドレスになり、受け取るポートでMACアドレスを学習すると、宛先ポートが同一ポートになってしまう）。設問4と設問5は正答率が高かったが、設問4(4)でロガーとのSIPメッセージを同一と誤解したものや、設問5(3)の一般論の解答が見られた。", "47": "IPA採点講評（要旨）：全体としてよく理解されていた。特にモバイルIPは午後問題で初めての出題だったが、正答率が高かった。設問1ではウ、エ、オの正答率が低かった（無線LANの最初の標準規格に関するもの）。設問2はSTP、VRRP、リンクアグリゲーションが混在したが、正答率は高かった。設問3(3)では、MN1のネットワーク情報が変更されないことに着目しない解答があった。設問4(2)の通信の目的は正答率が低かった。設問5(1)では、曖昧で局所的な電波の状態の記述が多く見られた。", "48": "IPA採点講評（要旨）：設問1は、オーバレイ方式とOF方式の比較で、正答率は高かった。設問2は全体的に正答率が高かったが、(3)は低かった（ARPテーブルの登録・更新の本質的な理解が必要）。設問3では、IEEE 802.1X認証の基本的な方式や動作（EAPフレームの透過転送、オーセンティケータとして動作する装置）を問う問題の正答率が低かった。全体として、知識を問う問題の正答率は高く、考え方の理解を問う問題の正答率は低い傾向が見られた。", "49": "IPA採点講評（要旨）：新しいレイヤ2技術（拡張イーサネット、TRILL）を使ったデータセンタネットワークがテーマ。設問1はウの「単一障害点」の正答率が低かった。設問2はルーティングブリッジ（複数経路の同時利用）で、全体として正答率が高かった。設問3はFCoEで、全体的に正答率が高かった。設問4は「FCoE over TRILL」で、全体的に正答率が低かった（FCF間をルーティングブリッジで接続するという論理的な接続が理解できていない解答が散見）。設問5は、(2)の正答率が低かった。", "50": "IPA採点講評（要旨）：障害対応事例、IPv4とIPv6を変換するトランスレータ、STP、設計時のドキュメントがテーマ。全体としてよく理解されていた。IPv6関連は午後問題では初出題だったが、正答率が高かった。設問1ではアが基本的なプロトコルの問題なので、もう少し高い正答率を期待していた。設問2は正答率が非常に高かった。設問3は、(3)のIPv6アドレス表記（16進変換）の正答率が低かった。設問4は(1)（MACアドレステーブルを基にしたフォワーディング動作）の正答率が低かった。設問5(3)では、何を求められているのか理解できていない解答が散見された。", "51": "IPA採点講評（要旨）：保守サポートのコールセンタをデータセンタ側に集約する再構築がテーマ。技術範囲が広く、受験者によって得手・不得手の差が大きかった。設問1は正答率が高かった。設問3(1)は待ち行列理論の用語の定義に誤解のある解答が散見され、正答率が低かった。設問3(3)も正答率が低かった。設問4(1)(2)では、VPNトンネルがどことどこの間に存在するのか理解できていない解答が多かった。設問5はFCoE対応スイッチの動作で、利点の把握が必要だった。", "52": "IPA採点講評（要旨）：TC（シンクライアント）化とメールサービスへの移行がテーマ。全体としてよく理解されていた。設問1ではアの正答率が低かった（チーミングの効果は帯域拡大）。設問2(3)では、バックアップルータのL3SWが動作しないのでループが発生しない、という誤答が散見された。設問3(1)は期待した正答率に届かなかった（時刻同期型ワンタイムパスワードは一般に1分間隔で生成される）。設問5(1)の正答率が低かった（図6の項番2の作業が1週間以上かかることに着目する）。設問6(2)は正答率が高かった。", "53": "IPA採点講評（要旨）：仮想環境への基幹システム再構築を題材に、サーバの冗長化と負荷分散、重複除外バックアップ、認証、仮想化システム監視、システム切替えを問うた。全体として正答率はほぼ予想どおり。設問1はd（ターゲット）、e（拡張性）の正答率が極端に低かった。設問3（ハッシュ関数を利用した照合）は予想以上の正答率。設問5(1)はノード発見の方法で、pingやarpの基本動作を理解してほしい。設問6(3)は予想以上の正答率だった。", "54": "IPA採点講評（要旨）：仮想化技術を利用したヘルプデスクシステムの構築を題材に、仮想化機構のネットワーク機能、仮想サーバと外部ネットワークの接続方式、サービス利用者との接続方式、可用性確保を問うた。設問1は(1)アを除き正答率が高かった。設問2は(4)(5)の正答率が低かった（リンクアグリゲーションの理解）。設問3は全体的に正答率が低かった（IPsec-VPNの仮想ネットワークの理解）。設問4(1)は正答率が低かった（共有ディスクを使ったクラスタリング）。", "55": "IPA採点講評（要旨）：無線LANシステムの構築を題材に、セキュリティの確保方式、接続制御方式、ポータビリティの実現方式を問うた。全体として正答率は低かった。設問1は(3)(4)の正答率が低かった（無線LANでのポートの概念と接続制御）。設問2は(4)の正答率が低かった（秘密鍵の漏えい防止。認証要求者が唯一の所有者であることが必要）。設問3は正答率が高かった。設問4は全体として正答率が低かった（認証技術とVLAN制御を組み合わせたシステム構築を、具体的に考える）。", "56": "IPA採点講評（要旨）：サーバの移設プロジェクトを題材に、移設計画の策定やネットワーク障害への対応を問うた。全体として正答率は高かった。設問1はアの正答率が非常に低かった（ITサービスの運用管理に関わる基本用語）。設問2(3)は正答率が高く、(6)はチェックポイントの意義を理解していない解答が多かった。設問3は、L3SWはルータではなくL2SWの機能ももつという基本技術に関するもので、正答率が低かった。設問4はスパニングツリーで、正答率が低かった。設問5は運用体制で、本文の状況設定を整理して解答してほしい。"};


  var STORE_KEY = "nw-r03h-pm1-cbt-mock-v3";

  /* ============================= STATE ============================= */
  var state = {
    screen:"cover",
    current:null,
    answers:{},
    marked:{},
    memos:{},
    history:{},
    correct:{},
    marks:{},
    timers:{}
  };
  (function hydrate(){
    var saved=null;
    try{ var raw=localStorage.getItem(STORE_KEY); if(raw) saved=JSON.parse(raw); }catch(e){}
    if(saved){
      state.answers = saved.answers || {};
      state.marked = saved.marked || {};
      state.memos = saved.memos || {};
      state.history = saved.history || {};
      state.correct = saved.correct || {};
      state.marks = saved.marks || {};
      state.timers = saved.timers || {};
    }
  })();
  var zoomLevel = 100;
  var memoOpen = false;
  var resumeScroll = false;
  var markerTool = null, markerSize = 3, invertOn = false, statusOpen = false, calcOpen = false, memoTrans = false;
  var activeItemId = null, splitH = 54, splitV = 50;
  var modelShown = false, resultProblemOpen = false, resZoom = 100;
  var EXAM_LIMIT_MIN = 45, EXAM_LIMIT_SEC = EXAM_LIMIT_MIN*60;
  var HISTORY_LIMIT = 20;

  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        answers:state.answers, marked:state.marked, memos:state.memos, history:state.history, correct:state.correct, marks:state.marks, timers:state.timers
      }));
    }catch(e){}
  }
  function clearProblemData(problemId){
    allItems(findProblem(problemId)).forEach(function(it){ delete state.answers[it.id]; delete state.marked[it.id]; });
    delete state.memos[problemId];
    Object.keys(state.marks).forEach(function(k){ if(k.indexOf(problemId+':')===0) delete state.marks[k]; });
    save();
  }
  function snapshotAnswers(problem){
    var out={};
    allItems(problem).forEach(function(it){
      if(state.answers[it.id]!=null) out[it.id]=JSON.parse(JSON.stringify(state.answers[it.id]));
    });
    return out;
  }
  function pushHistory(problem){
    var snap = snapshotAnswers(problem);
    if(!Object.keys(snap).length) return;
    var list = state.history[problem.id] || [];
    var lastJson = list.length ? JSON.stringify(list[0].answers) : null;
    if(lastJson===JSON.stringify(snap)) return;
    list.unshift({ts:Date.now(), answers:snap});
    if(list.length>HISTORY_LIMIT) list = list.slice(0,HISTORY_LIMIT);
    state.history[problem.id]=list;
    save();
  }
  function fmtDateTime(ts){
    var d=new Date(ts);
    function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function findProblem(id){ for(var i=0;i<PROBLEMS.length;i++){ if(PROBLEMS[i].id===id) return PROBLEMS[i]; } return null; }
  function timerKey(){ return state.current==null ? null : 'p'+state.current; }
  function timerLabel(){
    var pr = state.current==null ? null : findProblem(state.current);
    return pr ? examLabelFor(pr.id)+' '+pr.label : '';
  }
  function fmtHMS(sec){
    sec = Math.max(0, sec);
    function p(n){ return (n<10?'0':'')+n; }
    return p(Math.floor(sec/60))+':'+p(sec%60);
  }
  function timerHtml(){
    var k = timerKey();
    var used = k ? (state.timers[k]||0) : 0;
    var lim = limitMinFor(state.current), left = lim*60 - used;
    return '<div class="timer'+(left<=0?' over':(left<=300?' low':''))+'" id="examTimer" title="'+examPartFor(state.current)+'（'+lim+'分）の残り時間。この問題を解いている間だけ進みます">'
      + '<span class="tl">残り時間</span><span class="tv mono" id="timerVal">'+fmtHMS(left)+'</span>'
      + '<button class="ghost small" id="timerReset" title="この問題の試験時間を'+lim+'分に戻す">リセット</button></div>';
  }
  function updateTimerUI(){
    var el = document.getElementById('timerVal'), box = document.getElementById('examTimer');
    var k = timerKey();
    if(!el || !k) return;
    var left = limitMinFor(state.current)*60 - (state.timers[k]||0);
    el.textContent = fmtHMS(left);
    box.classList.toggle('low', left>0 && left<=300);
    box.classList.toggle('over', left<=0);
  }
  function bindTimerReset(){
    var b = document.getElementById('timerReset');
    if(!b) return;
    b.addEventListener('click', function(){
      var k = timerKey();
      if(!k || !confirm(timerLabel()+'の試験時間を'+limitMinFor(state.current)+'分に戻します。よろしいですか？')) return;
      delete state.timers[k]; save(); updateTimerUI();
    });
  }
  setInterval(function(){
    if((state.screen!=='exam' && state.screen!=='review') || document.hidden) return;
    var k = timerKey();
    if(!k) return;
    var used = (state.timers[k]||0) + 1;
    state.timers[k] = used;
    updateTimerUI();
    if(used===limitMinFor(state.current)*60) toast('試験時間の'+limitMinFor(state.current)+'分が経過しました（続けて解答できます）');
    if(used%5===0) save();
  }, 1000);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });

  function groupOf(problemId){
    for(var i=0;i<EXAM_GROUPS.length;i++){ if(EXAM_GROUPS[i].ids.indexOf(problemId)>=0) return EXAM_GROUPS[i]; }
    return null;
  }
  function examPartFor(problemId){ var g = groupOf(problemId); return g && g.part ? g.part : '午後I'; }
  function examLabelFor(problemId){
    var g = groupOf(problemId);
    return g ? g.title + (g.part ? ' ' + g.part : '') : '';
  }
  function examTitleFor(problemId){
    var g = groupOf(problemId);
    return (g ? g.title : '') + ' ネットワークスペシャリスト試験 ' + examPartFor(problemId);
  }
  function limitMinFor(problemId){ var g = groupOf(problemId); return g && g.limit ? g.limit : EXAM_LIMIT_MIN; }
  function allItems(problem){
    var out=[];
    problem.groups.forEach(function(g){ g.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function isAnswered(it){
    var v = state.answers[it.id];
    if(v==null) return false;
    if(it.type==="text") return String(v).trim().length>0;
    if(it.type==="multi") return Array.isArray(v) && v.length>0;
    if(it.type==="fields"){
      if(!v) return false;
      return it.fields.some(function(f){
        var fv=v[f.key];
        if(f.type==="multi") return Array.isArray(fv)&&fv.length>0;
        return fv && String(fv).trim().length>0;
      });
    }
    return false;
  }
  function progressOf(problem){
    var items = allItems(problem);
    var done = items.filter(isAnswered).length;
    return {done:done, total:items.length};
  }
  function ucount(str){ return Array.from(String(str||"")).length; }

  function toast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h=setTimeout(function(){ t.classList.remove("show"); },1800);
  }

  /* ============================= RENDER: COVER ============================= */
  var PART_KEY = "nw-cover-part";
  function groupPart(g){ return g.part || '午後I'; }
  function getCoverPart(){
    var v = null;
    try{ v = localStorage.getItem(PART_KEY); }catch(e){}
    if(v==='午後I' || v==='午後II') return v;
    var g = state.current ? groupOf(state.current) : null;
    return g ? groupPart(g) : '午後I';
  }
  function setCoverPart(v){ try{ localStorage.setItem(PART_KEY, v); }catch(e){} }

    html += '<p>記述式の過去問題を、CBT形式の画面で1問ずつ演習できる学習用ツール</p></div>';

    html += '<div class="part-tabs">'
      + '<button data-part="午後I" class="'+(part==='午後I'?'on':'')+'">午後I<small>1問 '+EXAM_LIMIT_MIN+'分・3問</small></button>'

      + '</div>';

    html += '<div><div class="k">出題年度</div><div class="v">'+groups.length+'年度分</div></div>';

    html += '<li>下から<b>1問ずつ選んで</b>演習できます。途中で他の問題に切り替えても、それぞれの解答は個別に保存されます。</li>';

    var modelYears = groups.filter(function(g){

    }).map(function(g){ return g.title; });
    html += '<li>自動採点はありません。解答一覧で自分の解答を確認し、自己採点してください。'
      + (modelYears.length ? 'IPA公式の解答例と解説（解説は当ツール作成者によるもの）が付いているのは、'+escapeHtml(modelYears.join('、'))+'です。' : '')
      + 'それ以外の年度は、IPA公式サイトの解答例と照らしてください。</li>';
    html += '</ul>';

    groups.forEach(function(group){
      html += '<h2>'+escapeHtml(group.title)+'</h2>';
      if(group.note) html += '<div class="group-note">'+escapeHtml(group.note)+'</div>';
      html += '<div class="pick-grid">';
      group.ids.forEach(function(pid){
        var p = findProblem(pid);
        var pr = progressOf(p);

        html += '<button class="pick-card select" data-select="'+p.id+'">';

    root.querySelectorAll('[data-part]').forEach(function(btn){

      btn.addEventListener('click', function(){
        var pid = Number(btn.getAttribute('data-select'));

        state.current = pid;

  /* ============================= RENDER: EXAM ============================= */
  var currentPageIdx = {};

  function inputChanged(it, value, fieldKey){
    if(fieldKey){
      var obj = state.answers[it.id] || {};
      obj[fieldKey]=value;
      state.answers[it.id]=obj;
    } else {
      state.answers[it.id]=value;
    }
    save();
  }

  function renderTextField(it, opts){
    opts = opts||{};
    var val = opts.value!=null?opts.value:"";
    var limit = opts.limit!=null?opts.limit:it.limit;
    var big = !limit || limit>=15;
    var idAttr = opts.id;
    var html;
    if(big){
      html = '<textarea rows="'+(limit && limit<=30?2:3)+'" id="'+idAttr+'" data-ans="1"'+(limit?' data-limit="'+limit+'"':'')+'>'+escapeHtml(val)+'</textarea>';
    } else {
      html = '<input type="text" id="'+idAttr+'" data-ans="1"'+(limit?' data-limit="'+limit+'"':'')+' value="'+escapeHtml(val)+'">';
    }
    return html;
  }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function renderMultiOptions(it, selectedArr, groupId, selectCount){
    selectedArr = selectedArr||[];
    var atLimit = selectCount>0 && selectedArr.length>=selectCount;
    var html='<div class="opt-grid" data-group="'+groupId+'">';
    it.options.forEach(function(pair){
      var key=pair[0], text=pair[1];
      var checked = selectedArr.indexOf(key)>=0;
      var disabled = (!checked && atLimit);
      html += '<label class="opt-chip'+(checked?' checked':'')+(disabled?' disabled':'')+'">';
      html += '<input type="checkbox" value="'+key+'" '+(checked?'checked':'')+(disabled?' disabled':'')+' data-multi="'+groupId+'">';
      html += '<span>'+escapeHtml(text===key?key:(key+"："+text))+'</span></label>';
    });
    html+='</div>';
    if(selectCount>0){
      html += '<div class="opt-hint">'+selectedArr.length+' / '+selectCount+' 個選択中'+(atLimit?'（上限に達しました。解除すると他を選べます）':'')+'</div>';
    } else {
      html += '<div class="opt-hint">該当するものを全て選択（'+selectedArr.length+'個選択中）</div>';
    }
    return html;
  }

  function renderQCard(it){
    var answered = isAnswered(it);
    var marked = !!state.marked[it.id];
    var html = '<div class="qcard'+(answered?' answered':'')+(marked?' marked':'')+'" id="card-'+it.id+'">';
    html += '<div class="qcard-head"><span class="status-dot"></span>';
    if(it.sub) html+='<span class="sub">'+escapeHtml(it.sub)+'</span>';
    html += '<span class="prompt">'+escapeHtml(it.prompt)+'</span>';
    html += '<label class="later-chk"><input type="checkbox" data-mark="'+it.id+'"'+(marked?' checked':'')+'>後で見直す</label>';
    html += '</div>';

    if(it.type==="text"){
      var val = state.answers[it.id]||"";
      html += '<div class="field-row">'+renderTextField(it,{id:"in-"+it.id, value:val});
      if(it.limit){
        var n=ucount(val);
        html += '<div class="counter'+(n>it.limit?' over':'')+'">'+n+' / '+it.limit+' 文字</div>';
      }
      html += '</div>';
    } else if(it.type==="multi"){
      html += renderMultiOptions(it, state.answers[it.id]||[], it.id, it.selectCount||0);
    } else if(it.type==="fields"){
      var fv = state.answers[it.id]||{};
      html += '<div class="field-pair">';
      it.fields.forEach(function(f){
        html += '<div class="field-row"><label>'+escapeHtml(f.label)+'</label>';
        if(f.type==="multi"){
          html += renderMultiOptions(f, fv[f.key]||[], it.id+"__"+f.key, 0);
        } else {
          html += renderTextField(it,{id:"in-"+it.id+"__"+f.key, value:fv[f.key]||"", limit:f.limit});
          if(f.limit){
            var nn=ucount(fv[f.key]||"");
            html += '<div class="counter'+(nn>f.limit?' over':'')+'">'+nn+' / '+f.limit+' 文字</div>';
          }
        }
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderAnswerPane(problem){
    var html='';
    problem.groups.forEach(function(g){
      html += '<div class="mon-group"><div class="mon-title">'+escapeHtml(g.mon)+(g.note?'　'+escapeHtml(g.note):'')+'</div>';
      g.items.forEach(function(it){ html+=renderQCard(it); });
      html += '</div>';
    });
    return html;
  }

  function bindAnswerPane(container, problem){
    function onAnswerInput(el){
      var lim = Number(el.getAttribute('data-limit')||0);
      if(lim){
        var chars = Array.from(el.value);
        if(chars.length>lim) el.value = chars.slice(0,lim).join('');
      }
      var id = el.id.replace(/^in-/,'');
      var parts = id.split('__');
      if(parts.length===2){ inputChanged({id:parts[0]}, el.value, parts[1]); }
      else { inputChanged({id:id}, el.value); }
      refreshLiveBits(container, problem);
    }
    container.querySelectorAll('[data-ans]').forEach(function(el){
      el.addEventListener('input', function(e){ if(!e.isComposing) onAnswerInput(el); else { var id=el.id.replace(/^in-/,''); var pp=id.split('__'); if(pp.length===2) inputChanged({id:pp[0]}, el.value, pp[1]); else inputChanged({id:id}, el.value); refreshLiveBits(container, problem); } });
      el.addEventListener('compositionend', function(){ onAnswerInput(el); });
    });
    container.addEventListener('focusin', function(e){
      var card = e.target.closest ? e.target.closest('.qcard') : null;
      setActiveItem(card ? card.id.replace(/^card-/,'') : null);
    });
    container.querySelectorAll('[data-multi]').forEach(function(el){
      el.addEventListener('change', function(){
        var group = el.getAttribute('data-multi');
        var parts = group.split('__');
        var itemId = parts[0], fieldKey = parts[1];
        var boxes = container.querySelectorAll('[data-multi="'+cssEscape(group)+'"]');
        var picked=[];
        boxes.forEach(function(b){ if(b.checked) picked.push(b.value); });
        if(fieldKey){ inputChanged({id:itemId}, picked, fieldKey); }
        else { inputChanged({id:itemId}, picked); }

        // update this option group's disabled-state / hint in place (no full re-render, keeps scroll position)
        var it=null;
        problem.groups.forEach(function(g){ g.items.forEach(function(x){ if(x.id===itemId) it=x; }); });
        var selectCount = (it && !fieldKey && it.type==="multi") ? (it.selectCount||0) : 0;
        var atLimit = selectCount>0 && picked.length>=selectCount;
        var optGrid = boxes.length ? boxes[0].closest('.opt-grid') : null;
        if(optGrid){
          optGrid.querySelectorAll('.opt-chip').forEach(function(label){
            var box = label.querySelector('input[type=checkbox]');
            var checked = box.checked;
            var disabled = (!checked && atLimit);
            box.disabled = disabled;
            label.classList.toggle('checked', checked);
            label.classList.toggle('disabled', disabled);
          });
          var hint = optGrid.nextElementSibling;
          if(hint && hint.classList.contains('opt-hint')){
            hint.textContent = selectCount>0
              ? (picked.length+' / '+selectCount+' 個選択中'+(atLimit?'（上限に達しました。解除すると他を選べます）':''))
              : ('該当するものを全て選択（'+picked.length+'個選択中）');
          }
        }
        refreshLiveBits(container, problem);
      });
    });
    container.querySelectorAll('[data-mark]').forEach(function(el){
      el.addEventListener('change', function(){
        var id = el.getAttribute('data-mark');
        if(el.checked) state.marked[id] = true; else delete state.marked[id];
        save();
        var card = document.getElementById('card-'+id);
        if(card) card.classList.toggle('marked', el.checked);
        refreshStatus(problem);
      });
    });
  }
  function cssEscape(s){ return s.replace(/[^a-zA-Z0-9_-]/g, function(c){return '\\'+c;}); }

  function refreshLiveBits(container, problem){
    // update char counters + status dot + answered class without full rerender (keeps caret position)
    container.querySelectorAll('.qcard').forEach(function(card){
      var id = card.id.replace(/^card-/,'');
      var it = null;
      problem.groups.forEach(function(g){ g.items.forEach(function(x){ if(x.id===id) it=x; }); });
      if(!it) return;
      var ans = isAnswered(it);
      card.classList.toggle('answered', ans);
    });
    // counters
    container.querySelectorAll('textarea, input[type=text]').forEach(function(inp){
      var wrap = inp.closest('.field-row');
      if(!wrap) return;
      var counter = wrap.querySelector('.counter');
      if(!counter) return;
      var limitMatch = counter.textContent.match(/\/\s*(\d+)/);
      var limit = limitMatch?Number(limitMatch[1]):0;
      var n = Array.from(inp.value).length;
      counter.textContent = n+' / '+limit+' 文字';
      counter.classList.toggle('over', n>limit);
    });
    var bd = document.getElementById('bottomDone');
    if(bd){ var pr=progressOf(problem); bd.textContent = pr.done+' / '+pr.total; }
    refreshStatus(problem);
  }

  /* ---------- floating windows (memo / calculator) ---------- */
  function makeDraggable(win, handle){
    handle.addEventListener('pointerdown', function(e){
      if(e.target.closest('button,input,label')) return;
      var r = win.getBoundingClientRect();
      var offX = e.clientX - r.left, offY = e.clientY - r.top;
      win.style.left = r.left+'px'; win.style.top = r.top+'px';
      win.style.right = 'auto'; win.style.bottom = 'auto';
      handle.setPointerCapture(e.pointerId);
      function move(ev){
        var x = Math.max(0, Math.min(window.innerWidth-60, ev.clientX-offX));
        var y = Math.max(0, Math.min(window.innerHeight-40, ev.clientY-offY));
        win.style.left = x+'px'; win.style.top = y+'px';
      }
      function up(){
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', up);
        handle.removeEventListener('pointercancel', up);
      }
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', up);
      handle.addEventListener('pointercancel', up);
    });
  }

  function setupCalc(win){
    var disp = win.querySelector('.calc-disp');
    var acc = null, op = null, entry = '0', fresh = true;
    function show(v){ disp.textContent = String(v); }
    function compute(a, b, o){
      if(o==='+') return a+b;
      if(o==='-') return a-b;
      if(o==='*') return a*b;
      if(o==='/') return b===0 ? NaN : a/b;
      return b;
    }
    function fmt(n){
      if(!isFinite(n)) return 'エラー';
      return String(Math.round(n*1e10)/1e10);
    }
    function press(k){
      if(/^[0-9]$/.test(k)){
        entry = (fresh || entry==='0') ? k : entry+k; fresh = false; show(entry);
      } else if(k==='.'){
        if(fresh){ entry='0.'; fresh=false; }
        else if(entry.indexOf('.')<0) entry+='.';
        show(entry);
      } else if(k==='C'){
        acc=null; op=null; entry='0'; fresh=true; show(entry);
      } else if(k==='B'){
        if(!fresh && entry.length>1) entry = entry.slice(0,-1); else entry='0';
        show(entry);
      } else if(k==='='){
        if(op!==null && acc!==null){
          var r = compute(acc, parseFloat(entry), op);
          entry = fmt(r); acc=null; op=null; fresh=true; show(entry);
        }
      } else {
        var cur = parseFloat(entry);
        if(op!==null && acc!==null && !fresh){ acc = compute(acc, cur, op); show(fmt(acc)); }
        else if(acc===null || op===null){ acc = cur; }
        op = k; fresh = true;
      }
    }
    win.querySelectorAll('[data-k]').forEach(function(b){
      b.addEventListener('click', function(){ press(b.getAttribute('data-k')); });
    });
    win.querySelectorAll('[data-size]').forEach(function(b){
      b.addEventListener('click', function(){
        win.classList.remove('s-s','s-m','s-l');
        win.classList.add('s-'+b.getAttribute('data-size'));
      });
    });
    show(entry);
  }

  var MARK_COLORS = {y:'rgba(250,208,30,0.5)', b:'rgba(60,140,240,0.42)', r:'rgba(235,70,70,0.42)'};

  function neighborProblemId(problemId, dir){
    for(var i=0;i<EXAM_GROUPS.length;i++){
      var idx = EXAM_GROUPS[i].ids.indexOf(problemId);
      if(idx>=0){
        var n = EXAM_GROUPS[i].ids[idx+dir];

  function itemStatusLabel(g, it){ return g.mon + (it.sub ? ' '+it.sub : ''); }

  function renderStatusPanel(problem){
    var panel = document.getElementById('statusPanel');

  function setupMarkCanvas(canvas, img, key){
    var ctx = canvas.getContext('2d');
    function redraw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      (state.marks[key]||[]).forEach(function(s){
        if(!s.p.length) return;
        ctx.strokeStyle = MARK_COLORS[s.c] || MARK_COLORS.y;
        ctx.lineWidth = s.w * 7;
        ctx.beginPath();
        ctx.moveTo(s.p[0][0]*canvas.width, s.p[0][1]*canvas.height);
        if(s.p.length===1) ctx.lineTo(s.p[0][0]*canvas.width+0.01, s.p[0][1]*canvas.height);
        for(var i=1;i<s.p.length;i++) ctx.lineTo(s.p[i][0]*canvas.width, s.p[i][1]*canvas.height);
        ctx.stroke();
      });
    }
    function fit(){
      canvas.width = img.naturalWidth || 1075;
      canvas.height = img.naturalHeight || 1520;
      redraw();
    }
    if(img.complete && img.naturalWidth){ fit(); }
    else { canvas.width = 1075; canvas.height = 1520; img.addEventListener('load', fit); }
    canvas.redrawMarks = redraw;

    var stroke = null;
    function pt(e){
      var r = canvas.getBoundingClientRect();
      return [Math.round((e.clientX-r.left)/r.width*10000)/10000, Math.round((e.clientY-r.top)/r.height*10000)/10000];
    }
    canvas.addEventListener('pointerdown', function(e){
      if(!markerTool) return;
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      stroke = {c:markerTool, w:markerSize, p:[pt(e)]};
      if(!state.marks[key]) state.marks[key] = [];
      state.marks[key].push(stroke);
      redraw();
    });
    canvas.addEventListener('pointermove', function(e){
      if(!stroke) return;
      stroke.p.push(pt(e));
      redraw();
    });
    function end(){ if(stroke){ stroke = null; save(); } }
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
  }

  function initSplitter(workArea, leftPane, splitter){
    var mq = window.matchMedia('(max-width: 880px)');
    function apply(){
      var pct = mq.matches ? splitV : splitH;
      leftPane.style.setProperty('--split', pct+'%');
    }
    apply();
    if(mq.addEventListener) mq.addEventListener('change', apply);
    splitter.addEventListener('pointerdown', function(e){
      e.preventDefault();
      splitter.setPointerCapture(e.pointerId);
      splitter.classList.add('drag');
      function move(ev){
        var r = workArea.getBoundingClientRect();
        var vertical = mq.matches;
        var p = vertical ? (ev.clientY-r.top)/r.height : (ev.clientX-r.left)/r.width;
        p = Math.max(0.2, Math.min(0.8, p)) * 100;
        if(vertical) splitV = p; else splitH = p;
        apply();
      }
      function up(){
        splitter.classList.remove('drag');
        splitter.removeEventListener('pointermove', move);
        splitter.removeEventListener('pointerup', up);
        splitter.removeEventListener('pointercancel', up);
      }
      splitter.addEventListener('pointermove', move);
      splitter.addEventListener('pointerup', up);
      splitter.addEventListener('pointercancel', up);
    });
  }

  function buildTranscript(problem, answersSrc){
    answersSrc = answersSrc || state.answers;
    var lines=[];
    lines.push(examTitleFor(problem.id)+' － 解答控え');
    lines.push('■ '+problem.label+' '+problem.title);
    lines.push('');
    problem.groups.forEach(function(g){
      lines.push('['+g.mon+']');
      g.items.forEach(function(it){
        var label = (it.sub? (g.mon+it.sub):g.mon);
        if(it.type==="text"){
          lines.push('  '+label+'： '+(answersSrc[it.id]||'（未解答）'));
        } else if(it.type==="multi"){
          var v=answersSrc[it.id]||[];
          lines.push('  '+label+'： '+(v.length?v.join('、'):'（未解答）'));
        } else if(it.type==="fields"){
          var fv=answersSrc[it.id]||{};
          it.fields.forEach(function(f){
            var val = fv[f.key];
            var text = Array.isArray(val)? (val.length?val.join('、'):'（未解答）') : (val||'（未解答）');
            lines.push('  '+label+' '+f.label+'： '+text);
          });
        }
        if(state.correct[it.id]){
          lines.push('  '+label+' 正しい解答： '+state.correct[it.id]);
        }
      });
    });
    return lines.join('\n');
  }

          html+='<div class="ans-label corr-label">正しい解答（自己採点用・任意入力）</div>';
          if(opts.editableCorrect){
            html+='<textarea class="corr-input" data-correct="'+it.id+'" rows="2" placeholder="IPA公式サイトの解答例を入力すると、あなたの解答と並べて記録できます">'+escapeHtml(corr)+'</textarea>';
          } else {
            html+='<div class="ans corr-display'+(corr?'':' empty')+'">'+escapeHtml(corr||'（未入力）')+'</div>';
          }
        }
        if(opts.showModel && MODEL_DATA[it.id]){
          var mo = MODEL_DATA[it.id];
          html+='<div class="model-ans"><div class="ans-label model-label">模範解答（IPA公式解答例）</div><div class="ans model-text">'+escapeHtml(mo.a)+'</div>';
          if(mo.e) html+='<div class="ans-label model-label">解説</div><div class="model-exp">'+escapeHtml(mo.e)+'</div>';
          html+='</div>';
        }
        html+='</div>';
      });
    });
    return html;
  }

  function wireCopyButton(btnId, textareaEl, textFn){
    document.getElementById(btnId).addEventListener('click', function(){
      var text = textFn();
      function fallbackCopy(){
        textareaEl.focus();
        textareaEl.select();
        var ok=false;
        try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
        toast(ok?'コピーしました（テキスト欄からコピーしました）':'自動コピーできませんでした。テキスト欄から手動でコピーしてください。');
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast('コピーしました'); }, fallbackCopy);
      } else {
        fallbackCopy();
      }
    });
  }

  function renderProblemViewer(problem, host){
    var html = '<div class="view-tools"><div class="grp"><span class="lbl">拡大・縮小</span><input type="range" id="resZoomRange" min="60" max="200" step="10" value="'+resZoom+'" aria-label="拡大・縮小"><span class="mono" id="resZoomVal" style="min-width:40px;">'+resZoom+'%</span></div>';
    html += '<span class="lbl">問題冊子（'+problem.pages.length+'ページ）。引いたマーカーも表示されます</span></div>';
    html += '<div class="thumbrail" id="resThumbs">';
    problem.pages.forEach(function(pg,i){ html += '<button data-jump="'+pg+'" class="'+(i===0?'on':'')+'">'+(i+1)+'</button>'; });
    html += '</div><div class="page-scroll" id="resPageScroll" style="--zoom:'+resZoom+'%">';
    problem.pages.forEach(function(pg){
      var f = pg<10?('0'+pg):(''+pg);
      html += '<div class="page-frame" data-page="'+pg+'"><div class="page-img-wrap"><img src="pages/'+problem.folder+'/'+f+'.png" alt="問題冊子 '+pg+'ページ" loading="lazy"><canvas data-mkey="'+problem.id+':'+pg+'"></canvas></div></div>';
      html += '<div class="page-num-tag">p.'+pg+'</div>';
    });
    html += '</div>';
    host.innerHTML = html;
    var scrollEl = host.querySelector('#resPageScroll');
    scrollEl.querySelectorAll('.page-img-wrap').forEach(function(w){
      var c = w.querySelector('canvas'); setupMarkCanvas(c, w.querySelector('img'), c.getAttribute('data-mkey'));
    });
    host.querySelectorAll('[data-jump]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var t = scrollEl.querySelector('[data-page="'+btn.getAttribute('data-jump')+'"]');
        if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
    var zr = host.querySelector('#resZoomRange'), zv = host.querySelector('#resZoomVal');
    zr.addEventListener('input', function(){
      resZoom = Number(zr.value); scrollEl.style.setProperty('--zoom', resZoom+'%'); zv.textContent = resZoom+'%';
    });
  }

  function renderResult(){
    var root=document.getElementById('app');
    var problem=findProblem(state.current);
    var history = state.history[problem.id] || [];
    var html='';
    var tk = examLabelFor(problem.id)+' '+problem.label, usedSec = state.timers['p'+problem.id]||0;
    html+='<div class="top-bar"><div class="title">解答一覧<small>'+problem.label+' '+escapeHtml(problem.title)+'</small></div><div class="top-spacer"></div>';
    html+='<button class="small'+(resultProblemOpen?' navy':'')+'" id="btnResProblem" title="問題冊子を別ウィンドウで開きます">'+(resultProblemOpen?'問題を閉じる':'問題を確認する（別画面）')+'</button></div>';
    html+='<div class="result-wrap'+(resultProblemOpen?' with-problem':'')+'" id="resultWrap"><div class="result-problem" id="resProblem"></div><div class="result-main"><div class="result-inner">';
    html+='<h1>お疲れさまでした</h1>';
    html+='<p class="used-time">この問題（'+escapeHtml(tk)+'）で使った試験時間：'+Math.floor(usedSec/60)+'分'+(usedSec%60)+'秒（制限 '+limitMinFor(problem.id)+'分）</p>';
    var hasModelNote = allItems(problem).some(function(it){ return MODEL_DATA[it.id]; });
    html+='<div class="result-note">自動採点はありません。以下はあなたが入力した解答の控えです。'
      + (hasModelNote
          ? '「模範解答と解説を表示」でIPA公式の解答例と解説（解説は当ツール作成者によるもの）を確認できます。'
          : 'この問題には模範解答がまだ付いていません。IPA公式サイト（ipa.go.jp）で公開されている「'+escapeHtml(examTitleFor(problem.id))+' 解答例」を見ながら、')
      + (hasModelNote ? '「模範解答を「正しい解答」欄に転記」を使うと、自分の解答と並べて記録できます。' : '各設問の「正しい解答」欄に書き写すと、自分の解答と並べて記録できます。')
      + '</div>';

    var hasModel = allItems(problem).some(function(it){ return MODEL_DATA[it.id]; });
    if(hasModel){
      html+='<div class="model-bar"><div class="model-bar-btns"><button class="primary" id="btnModelToggle">'+(modelShown?'模範解答と解説を隠す':'模範解答と解説を表示')+'</button><button class="ghost" id="btnModelCopy">模範解答を「正しい解答」欄に転記</button></div>';
      html+='<p>模範解答はIPA公式の解答例です。解説は当ツールの作成者が書いたもので、IPA公式のものではありません。</p>';
      if(PROBLEM_NOTES[problem.id]) html+='<p class="model-note">'+escapeHtml(PROBLEM_NOTES[problem.id])+'</p>';
      html+='</div>';
    }
    html+='<h2 style="font-size:16px;">'+problem.label+' '+escapeHtml(problem.title)+'（今回の解答）</h2>';
    html+='<div id="qaBlock" class="'+(modelShown?'model-on':'')+'">'+buildQABlockHtml(problem, state.answers, {showCorrect:true, editableCorrect:true, showModel:true})+'</div>';

    html+='<div class="result-actions">';
    html+='<button class="primary" id="btnCopy">解答をテキストでコピー</button>';
    html+='<button class="ghost" id="btnPrint">印刷プレビュー</button>';
    html+='<button class="ghost" id="btnBackHome">他の問題を解く</button>';
    html+='<button class="ghost" id="btnRedo">この問題をやり直す（解答を消去）</button>';
    html+='</div>';
    html+='<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">コピーできない場合は、下の欄を選択して手動でコピーしてください。</div>';
    html+='<textarea id="transcriptArea" readonly style="min-height:160px;" onclick="this.select()"></textarea>';

    html+='<h2 style="font-size:16px;margin-top:32px;">過去の解答履歴</h2>';
    if(!history.length){
      html+='<p style="font-size:13px;color:var(--text-muted);">まだ履歴はありません。「解答一覧を見る」を押すと、そのときの解答が履歴として残ります。</p>';
    } else {
      html+='<p style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">この問題で過去に「解答一覧を見る」を押した時点の解答です。新しいものから表示しています。</p>';
      history.forEach(function(entry, idx){
        html+='<details class="hist-entry"><summary>'+fmtDateTime(entry.ts)+' の解答</summary>';
        html+='<div class="hist-body">';
        html+=buildQABlockHtml(problem, entry.answers, {showCorrect:true, editableCorrect:false});
        html+='<div class="result-actions">';
        html+='<button class="ghost small" id="histCopy'+idx+'">この履歴をコピー</button>';
        html+='<button class="ghost small" id="histDelete'+idx+'">この履歴を削除</button>';
        html+='</div>';
        html+='<textarea class="hist-transcript" id="histTranscript'+idx+'" readonly onclick="this.select()"></textarea>';
        html+='</div></details>';
      });
    }

    html+='</div></div></div>';
    root.innerHTML=html;
    renderProblemViewer(problem, document.getElementById('resProblem'));
    document.getElementById('btnResProblem').addEventListener('click', function(){
      if(!resultProblemOpen && openDetachedWindow(problem)) return;
      if(!resultProblemOpen) toast('別ウィンドウを開けないため、この画面の左側に表示します');
      resultProblemOpen = !resultProblemOpen;
      document.getElementById('resultWrap').classList.toggle('with-problem', resultProblemOpen);
      this.textContent = resultProblemOpen ? '問題を閉じる' : '問題を確認する（別画面）';
      this.classList.toggle('navy', resultProblemOpen);
    });

    root.querySelectorAll('[data-correct]').forEach(function(el){
      el.addEventListener('input', function(){
        state.correct[el.getAttribute('data-correct')] = el.value;
        save();
        transcriptEl.value = buildTranscript(problem, state.answers);
      });
    });

    var transcriptEl = document.getElementById('transcriptArea');
    transcriptEl.value = buildTranscript(problem, state.answers);
    wireCopyButton('btnCopy', transcriptEl, function(){ return buildTranscript(problem, state.answers); });

    history.forEach(function(entry, idx){
      var ta = document.getElementById('histTranscript'+idx);
      ta.value = buildTranscript(problem, entry.answers);
      wireCopyButton('histCopy'+idx, ta, function(){ return buildTranscript(problem, entry.answers); });
      document.getElementById('histDelete'+idx).addEventListener('click', function(e){
        e.preventDefault();
        if(!confirm(fmtDateTime(entry.ts)+' の履歴を削除します。よろしいですか？')) return;
        var list = state.history[problem.id]||[];
        list.splice(idx,1);
        state.history[problem.id]=list;
        save();
        render();
      });
    });

    if(hasModel){
      document.getElementById('btnModelToggle').addEventListener('click', function(){
        modelShown = !modelShown;
        document.getElementById('qaBlock').classList.toggle('model-on', modelShown);
        this.textContent = modelShown ? '模範解答と解説を隠す' : '模範解答と解説を表示';
      });
      document.getElementById('btnModelCopy').addEventListener('click', function(){
        var n = 0;
        allItems(problem).forEach(function(it){
          if(MODEL_DATA[it.id] && !state.correct[it.id]){ state.correct[it.id] = MODEL_DATA[it.id].a; n++; }
        });
        save();
        toast(n ? n+'件を「正しい解答」欄に転記しました' : '転記できる未入力の欄はありません');
        render();
      });
    }
    document.getElementById('btnPrint').addEventListener('click', function(){
      state.screen='print'; render();
    });
    document.getElementById('btnBackHome').addEventListener('click', function(){
      state.screen='cover'; render();
    });
    document.getElementById('btnRedo').addEventListener('click', function(){
      if(!confirm('この問題（'+problem.label+'）の解答とメモを全て消去してやり直します。解答の履歴は残ります。よろしいですか？')) return;
      clearProblemData(problem.id);
      state.screen='exam';
      render();
    });
  }

  /* ============================= RENDER: PRINT PREVIEW ============================= */
  function renderPrintPreview(){
    var root=document.getElementById('app');
    var problem=findProblem(state.current);
    var html='';
    html+='<div class="top-bar no-print"><div class="title">印刷プレビュー<small>'+problem.label+' '+escapeHtml(problem.title)+'</small></div>';
    html+='<div class="top-spacer"></div>';
    html+='<button class="ghost small" id="btnPrintBack">解答一覧に戻る</button>';
    html+='<button class="primary small" id="btnPrintNow">印刷する</button>';
    html+='</div>';

    html+='<div class="print-wrap"><div class="print-page">';
    html+='<div class="print-head">';
    html+='<h1>'+escapeHtml(examTitleFor(problem.id))+' － 解答控え</h1>';
    html+='<div class="print-sub">'+problem.label+' '+escapeHtml(problem.title)+'</div>';
    html+='<div class="print-meta">印刷日：'+fmtDateTime(Date.now())+'</div>';
    html+='</div>';
    html+=buildQABlockHtml(problem, state.answers, {showCorrect:true, editableCorrect:false});
    html+='</div></div>';

    root.innerHTML=html;

    document.getElementById('btnPrintBack').addEventListener('click', function(){
      state.screen='result'; render();
    });
    document.getElementById('btnPrintNow').addEventListener('click', function(){
      window.print();
    });
  }

  /* ============================= ROOT RENDER ============================= */
  function render(){
    var root=document.getElementById('app');
    document.documentElement.classList.toggle('invert', invertOn && state.screen==="exam");
    if(state.screen==="cover"){ renderCover(root); }
    else if(state.screen==="exam"){ renderExam(); }
    else if(state.screen==="review"){ renderReview(); }
    else if(state.screen==="result"){ renderResult(); }
    else if(state.screen==="print"){ renderPrintPreview(); }
  }

  render();
})();
</script>
