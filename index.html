<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NW午後I CBT模試</title>
<meta name="description" content="ネットワークスペシャリスト試験 午後I の過去問（令和3年度春期〜平成27年度秋期）をCBT形式で解く学習ツール">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#f2f4fb;
    --surface:#ffffff;
    --surface-alt:#c0c9ee;
    --border:#c7cef0;
    --border-strong:#a2aadb;
    --text:#2c2d54;
    --text-muted:#6a6b9a;
    --accent:#898ac4;
    --accent-strong:#5b5c96;
    --accent-soft:#c0c9ee;
    --good:#1f9463;
    --good-soft:#d9f5e6;
    --warn:#946a17;
    --warn-soft:#f6ecd6;
    --danger:#b13030;
    --danger-soft:#f8dede;
    --shadow: 0 1px 2px rgba(91,92,150,.10), 0 6px 20px rgba(91,92,150,.12);
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    font-size:15px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
    text-wrap:balance;
  }
  .mono{ font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  button{font-family:inherit;}
  ::selection{ background:var(--accent-soft); }
  [hidden]{display:none!important;}
  a{color:var(--accent);}

  button{
    cursor:pointer;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--text);
    border-radius:8px;
    padding:8px 14px;
    font-size:14px;
    font-weight:600;
    transition:background .12s, border-color .12s, transform .05s;
  }
  button:hover{ border-color:var(--accent); }
  button:active{ transform:translateY(1px); }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-within{
    outline:2.5px solid var(--accent);
    outline-offset:2px;
  }
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  button.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  button.ghost{ background:transparent; border-color:transparent; }
  button.ghost:hover{ background:var(--surface-alt); border-color:transparent; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button.small{ padding:4px 10px; font-size:12.5px; border-radius:6px; }

  textarea, input[type="text"]{
    width:100%;
    font-family:inherit;
    font-size:14.5px;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:8px;
    padding:9px 11px;
    resize:vertical;
    line-height:1.6;
  }
  textarea:focus, input[type=text]:focus{ outline:2.5px solid var(--accent); outline-offset:1px; border-color:var(--accent); }

  /* ---------- App shell ---------- */
  #app{ height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  /* ---------- Cover / start screen ---------- */
  .cover-wrap{
    flex:1;
    min-height:0;
    overflow:auto;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:56px 20px 80px;
  }
  .cover{
    width:100%;
    max-width:760px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .cover-band{
    background:var(--accent-strong);
    color:#fff;
    padding:30px 34px 26px;
  }
  .cover-band .tag{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    letter-spacing:.12em;
    background:rgba(255,255,255,.18);
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .cover-band h1{
    margin:0 0 6px;
    font-size:26px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .cover-band p{ margin:0; opacity:.92; font-size:14px; }
  .cover-body{ padding:28px 34px 32px; }
  .cover-meta{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:26px;
  }
  .cover-meta div{
    background:var(--surface-alt);
    padding:12px 14px;
  }
  .cover-meta .k{ font-size:11.5px; color:var(--text-muted); letter-spacing:.06em; white-space:nowrap; }
  .cover-meta .v{ font-size:16px; font-weight:700; margin-top:2px; white-space:nowrap; }
  @media (max-width: 480px){
    .cover-meta{ grid-template-columns:1fr; }
    .cover-meta div{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
    .cover-meta .k{ margin-top:0; }
  }
  .cover-body h2{ font-size:15px; margin:0 0 10px; }
  .rules{ margin:0 0 24px; padding-left:1.3em; color:var(--text-muted); font-size:13.5px; }
  .rules li{ margin-bottom:5px; }
  .rules b{ color:var(--text); }

  .pick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:10px;
  }
  @media (max-width: 680px){
    .pick-grid{ grid-template-columns:1fr; }
  }
  .pick-card{
    border:1.5px solid var(--border-strong);
    border-radius:12px;
    padding:14px 14px 12px;
    background:var(--surface);
  }
  .pick-card.on{ border-color:var(--accent); background:var(--accent-soft); }
  .pick-card.select{
    display:block; width:100%; text-align:left; font-weight:400;
    cursor:pointer; transition:border-color .12s, background .12s, transform .05s;
  }
  .pick-card.select:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .pick-card.select:active{ transform:translateY(1px); }
  .pick-card .num{
    font-family:"Zen Kaku Gothic New";
    font-weight:700;
    font-size:13px;
    color:var(--accent-strong);
    margin-bottom:4px;
  }
  .pick-card .ttl{ font-weight:700; font-size:14.5px; margin-bottom:4px; color:var(--text); }
  .pick-card .desc{ font-size:12.5px; color:var(--text-muted); }
  .pick-status{
    display:inline-block; margin-top:10px; font-size:11.5px; font-weight:700;
    padding:3px 9px; border-radius:999px; background:var(--surface-alt); color:var(--text-muted);
  }
  .pick-status.partial{ background:var(--warn-soft); color:var(--warn); }
  .pick-status.done{ background:var(--good-soft); color:var(--good); }


  /* ---------- Exam screen ---------- */
  .top-bar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:10px;
    padding:9px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:var(--shadow);
    flex-wrap:wrap;
    row-gap:6px;
  }
  .top-bar .title{ font-weight:700; font-size:14px; min-width:0; }
  .top-bar .title small{ display:block; font-weight:500; color:var(--text-muted); font-size:11px; }
  .top-spacer{ flex:1; min-width:8px; }

  .switch{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); cursor:pointer; user-select:none; }
  .switch input{
    appearance:none; -webkit-appearance:none; width:34px; height:18px; border-radius:9px;
    background:var(--border-strong); position:relative; cursor:pointer; margin:0; transition:background .15s;
  }
  .switch input:after{
    content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
    background:#fff; transition:left .15s;
  }
  .switch input:checked{ background:var(--accent-strong); }
  .switch input:checked:after{ left:18px; }
  button.navy{ background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
  button.navy:hover{ background:var(--text); border-color:var(--text); }
  html.invert #app{ filter:invert(1); }

  .fwin{
    position:fixed; z-index:60; background:var(--surface); border:1.5px solid var(--accent);
    border-radius:10px; box-shadow:var(--shadow); display:none; flex-direction:column; overflow:hidden;
  }
  .fwin.open{ display:flex; }
  .fwin-head{
    display:flex; align-items:center; gap:8px; padding:7px 10px 7px 14px;
    background:var(--accent-soft); font-size:13px; cursor:move; touch-action:none; user-select:none;
  }
  .fwin-head .sp{ flex:1; }
  #memoPanel{
    right:18px; bottom:76px; width:min(360px, calc(100vw - 24px)); height:300px;
    min-width:240px; min-height:190px; resize:both;
  }
  #memoPanel textarea{
    flex:1; min-height:0; border:none; border-radius:0; resize:none; padding:12px 14px; font-size:13.5px;
    background:var(--surface);
  }
  #memoPanel textarea:focus{ outline:none; }
  #memoPanel.trans{ opacity:.55; }
  .memo-count{ text-align:right; font-size:11px; color:var(--text-muted); padding:3px 12px 6px; border-top:1px solid var(--border); }
  #calcWin{ right:18px; top:130px; }
  #calcWin.s-s{ width:190px; } #calcWin.s-m{ width:240px; } #calcWin.s-l{ width:300px; }
  .calc-disp{
    margin:8px; padding:8px 10px; background:#fff; color:#141414; border:1px solid var(--border); border-radius:6px;
    text-align:right; font:600 20px "JetBrains Mono",monospace; overflow:hidden; white-space:nowrap;
  }
  .calc-keys{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:0 8px 8px; }
  .calc-keys button{ padding:9px 0; font-size:15px; }

  .work-area{ flex:1; min-height:0; display:flex; position:relative; }
  .pane{ min-height:0; min-width:0; display:flex; flex-direction:column; }
  .pane.left{ flex:0 0 var(--split,54%); }
  .pane.right{ flex:1 1 0; }
  .splitter{
    flex:0 0 10px; background:var(--surface-alt); border-left:1px solid var(--border); border-right:1px solid var(--border);
    cursor:col-resize; touch-action:none; position:relative;
  }
  .splitter:after{
    content:""; position:absolute; left:50%; top:50%; width:3px; height:40px; margin:-20px 0 0 -1.5px;
    border-radius:2px; background:var(--border-strong);
  }
  .splitter:hover, .splitter.drag{ background:var(--accent-soft); }
  @media (max-width: 880px){
    .work-area{ flex-direction:column; }
    .splitter{ flex:0 0 14px; cursor:row-resize; border:none; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .splitter:after{ width:40px; height:3px; margin:-1.5px 0 0 -20px; }
  }

  .view-tools{
    display:flex; align-items:center; gap:6px 14px; flex-wrap:wrap; padding:6px 12px;
    background:var(--surface); border-bottom:1px solid var(--border); font-size:12px; color:var(--text-muted);
  }
  .view-tools .grp{ display:flex; align-items:center; gap:6px; }
  .view-tools input[type=range]{ width:92px; accent-color:var(--accent-strong); }
  .tool-btn{ min-width:28px; height:26px; padding:0 8px; border-radius:6px; font-size:12px; }
  .tool-btn.on{ outline:2.5px solid var(--accent-strong); outline-offset:1px; }
  .tool-btn.sw-y{ background:#f7dc5a; color:#3a3000; border-color:#d8bd2c; }
  .tool-btn.sw-b{ background:#8ebdf5; color:#0c2a52; border-color:#5f98dc; }
  .tool-btn.sw-r{ background:#f29a9a; color:#4a0d0d; border-color:#d96a6a; }
  @media (max-width: 520px){
    .view-tools{ gap:4px 10px; padding:4px 8px; }
    .view-tools .lbl{ display:none; }
    .view-tools input[type=range]{ width:70px; }
    .thumb-note{ display:none; }
  }
  .thumbrail{
    display:flex; align-items:center; gap:6px; padding:6px 10px; overflow-x:auto;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .thumbrail button{
    flex:none; width:28px; height:28px; padding:0; font-size:12px;
    border-radius:6px; display:flex; align-items:center; justify-content:center;
  }
  .thumbrail button.on{ background:var(--accent-strong); color:#fff; border-color:var(--accent-strong); }
  .thumb-note{ margin-left:6px; font-size:11.5px; color:var(--text-muted); white-space:nowrap; }

  .page-scroll{
    flex:1; overflow:auto; background:var(--surface-alt);
    padding:16px; display:flex; flex-direction:column; align-items:stretch; gap:14px;
  }
  .page-frame{ display:flex; justify-content:center; }
  .page-img-wrap{ position:relative; width:var(--zoom,100%); flex:none; }
  .page-img-wrap img{
    display:block; width:100%; max-width:none; background:#fff; box-shadow:var(--shadow); border-radius:4px;
    -webkit-user-drag:none; user-select:none;
  }
  .page-img-wrap canvas{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .page-scroll.marking .page-img-wrap canvas{ pointer-events:auto; touch-action:none; cursor:crosshair; }
  .page-num-tag{ font-size:11px; color:var(--text-muted); text-align:center; }

  .answer-scroll{ flex:1; overflow:auto; padding:16px 16px 60px; background:var(--bg); }
  .mon-group{ margin-bottom:22px; }
  .mon-group > .mon-title{
    font-family:"Zen Kaku Gothic New";
    font-weight:700; font-size:14.5px; color:var(--accent-strong);
    margin:0 0 10px; padding-bottom:6px; border-bottom:2px solid var(--accent-soft);
  }

  .qcard{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:11px;
    padding:13px 15px 14px;
    margin-bottom:12px;
    scroll-margin-top:14px;
  }
  .qcard.marked{ border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset; }
  .qcard.active{ border-color:var(--warn); box-shadow:0 0 0 2px var(--warn) inset; }
  .qcard-head{ display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .qcard-head .sub{
    font-family:"JetBrains Mono"; font-weight:700; font-size:12.5px;
    color:#fff; background:var(--accent); border-radius:6px;
    padding:2px 7px; margin-top:1px; flex:none;
  }
  .qcard-head .prompt{ flex:1; font-size:13.8px; }
  .later-chk{
    flex:none; display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-muted);
    cursor:pointer; user-select:none;
  }
  .later-chk input{ accent-color:var(--danger); width:15px; height:15px; margin:0; }
  .qcard.marked .later-chk{ color:var(--danger); font-weight:700; }
  .qcard .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--border-strong); flex:none; margin-top:6px; }
  .qcard.answered .status-dot{ background:var(--good); }
  .field-row{ margin-top:6px; }
  .field-row label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:3px; }
  .counter{ text-align:right; font-size:11px; color:var(--text-muted); margin-top:3px; }
  .counter.over{ color:var(--danger); font-weight:700; }
  .field-pair{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px){ .field-pair{ grid-template-columns:1fr; } }

  .opt-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .opt-chip{
    display:flex; align-items:center; gap:6px;
    border:1.5px solid var(--border-strong);
    border-radius:8px; padding:5px 10px; font-size:12.8px;
    background:var(--surface); cursor:pointer; user-select:none;
  }
  .opt-chip input{ accent-color:var(--accent); }
  .opt-chip.checked{ border-color:var(--accent); background:var(--accent-soft); }
  .opt-chip.disabled{ opacity:.4; cursor:not-allowed; }
  .opt-hint{ font-size:11px; color:var(--text-muted); margin-top:4px; }
  .opt-hint b{ color:var(--accent); }

  .bottom-bar{
    display:flex; align-items:center; gap:8px; padding:8px 12px; flex-wrap:wrap;
    background:var(--surface-alt); border-top:1px solid var(--border);
  }
  .bottom-bar .grp{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .bottom-bar .grp.right{ margin-left:auto; }
  .bottom-bar .stat{ font-size:12.5px; color:var(--text-muted); margin:0 6px; white-space:nowrap; }
  .bottom-bar .stat b{ color:var(--text); }
  .bb{ padding:6px 14px; border-radius:6px; font-size:13px; }
  .bb.green{ background:var(--good); border-color:var(--good); color:#fff; }
  .bb.on{ outline:2.5px solid var(--accent-strong); outline-offset:1px; }
  @media (max-width: 520px){
    .bottom-bar{ padding:6px 8px; gap:6px; }
    .bb{ padding:6px 9px; font-size:12px; }
    .bottom-bar .grp.right{ margin-left:0; }
    .bottom-bar .stat{ order:5; width:100%; margin:0; }
  }

  .status-panel{ position:absolute; inset:0; z-index:25; background:var(--bg); display:none; overflow:auto; padding:14px; }
  .status-panel.open{ display:flex; gap:16px; align-items:flex-start; }
  .status-main{ flex:1; min-width:0; }
  .status-row{ margin-bottom:16px; }
  .status-row h3{ font-size:13px; margin:0 0 7px; }
  .status-boxes{ display:flex; flex-wrap:wrap; gap:8px; }
  .sbox{
    position:relative; min-width:88px; padding:8px 12px; font-size:12px; font-weight:600; border-radius:4px;
    border:1.5px solid var(--border-strong); background:#fff; color:var(--text);
  }
  .sbox.done{ background:var(--good-soft); border-color:var(--good); }
  .sbox.mk{ border-color:var(--danger); }
  .sbox.act{ border:3px solid var(--warn); padding:6.5px 10.5px; }
  .stag{ display:block; font-size:10px; font-weight:700; color:var(--danger); line-height:1.2; }
  .status-legend{ flex:0 0 130px; font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:8px; padding:8px; border:1px solid var(--border); background:var(--surface); border-radius:4px; }
  .status-legend .sw{ display:inline-block; width:22px; height:14px; border:1.5px solid var(--border-strong); background:#fff; vertical-align:middle; margin-right:6px; border-radius:2px; }
  .status-legend .sw.done{ background:var(--good-soft); border-color:var(--good); }
  .status-legend .sw.mk{ border-color:var(--danger); }
  .status-legend .sw.act{ border:3px solid var(--warn); }
  @media (max-width: 880px){
    .status-panel.open{ flex-direction:column-reverse; }
    .status-legend{ flex:none; flex-direction:row; flex-wrap:wrap; gap:10px; width:100%; }
  }

  /* ---------- Review screen ---------- */
  .review-wrap{ flex:1; min-height:0; overflow:auto; padding:26px 20px 70px; display:flex; justify-content:center; }
  .review-inner{ width:100%; max-width:900px; }
  .review-inner h1{ font-size:21px; margin:0 0 4px; }
  .review-inner > p{ color:var(--text-muted); font-size:13.5px; margin:0 0 22px; }
  .rv-problem{ margin-bottom:22px; }
  .rv-problem h2{
    font-size:15px; display:flex; align-items:center; gap:10px; margin:0 0 10px;
  }
  .rv-problem h2 .cnt{ font-size:12px; font-weight:600; color:var(--text-muted); }
  .rv-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .rv-chip{
    display:flex; align-items:center; gap:7px;
    border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-size:12.5px; background:var(--surface);
    cursor:pointer; text-align:left;
  }
  .rv-chip .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--border-strong); flex:none; }
  .rv-chip.done .status-dot{ background:var(--good); }
  .rv-chip.marked{ border-color:var(--warn); }
  .rv-chip .mk{ margin-left:auto; color:var(--warn); font-size:13px; }

  .finish-cta{
    margin-top:30px; padding-top:20px; border-top:1px solid var(--border);
    display:flex; align-items:center; gap:14px;
  }

  /* ---------- Result screen ---------- */
  .result-wrap{ flex:1; min-height:0; overflow:auto; padding:30px 20px 80px; display:flex; justify-content:center; }
  .result-inner{ width:100%; max-width:820px; }
  .result-inner h1{ font-size:22px; margin:0 0 6px; }
  .result-note{
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px;
    padding:14px 16px; font-size:13px; color:var(--text); margin:16px 0 26px; line-height:1.7;
  }
  .rq{
    border:1px solid var(--border); border-radius:10px; padding:12px 15px; margin-bottom:10px; background:var(--surface);
  }
  .rq .sub{ font-family:"JetBrains Mono"; font-weight:700; color:var(--accent); font-size:12px; }
  .rq .prompt{ font-size:13px; color:var(--text-muted); margin:4px 0 8px; }
  .rq .ans{ font-size:14px; white-space:pre-wrap; background:var(--surface-alt); border-radius:7px; padding:8px 10px; }
  .rq .ans.empty{ color:var(--text-muted); font-style:italic; }
  .rq .ans-label{ font-size:11px; color:var(--text-muted); font-weight:700; letter-spacing:.03em; margin-bottom:4px; }

    {"id": 14, "label": "問2", "title": "ファイアウォールの負荷分散", "lede": "D社の情報系サービス基盤の再構築。透過モードのLBによるFWのActive-Active化と、LBの性能・FWの故障対策の設計がテーマ。", "folder": "h27a", "pages": [7, 8, 9, 10, 11], "groups": [{"mon": "設問1", "note": "本文中の空欄に入れる適切な字句を答えよ。", "items": [{"id": "f1-1-1", "sub": "ア", "type": "text", "limit": 0, "prompt": "「LBの仕様には、1秒当たりの転送データ量である［ ア ］が記載されている」の ア に入る字句。"}, {"id": "f1-1-2", "sub": "イ", "type": "text", "limit": 0, "prompt": "「LBには1秒当たりの転送［ イ ］数に上限があるので」の イ に入る字句。"}, {"id": "f1-1-3", "sub": "ウ", "type": "text", "limit": 0, "prompt": "「新NWでは、FWの故障発生時にセッション［ ウ ］ができない」の ウ に入る字句。"}]}, {"mon": "設問2", "note": "〔FWの負荷分散〕について", "items": [{"id": "f1-2-1", "sub": "(1)", "type": "fields", "limit": 0, "prompt": "図2中の(A)、(B)は、機器aと機器bとの間のTCPコネクション上のパケットを表し、矢印はその転送方向を表す。また、このTCPコネクション上のパケットはFW2を経由する。(A)、(B)の宛先IPアドレスと宛先MACアドレスを、図2中の機器名を用いて答えよ。", "fields": [{"key": "aip", "label": "(A) 宛先IPアドレス"}, {"key": "amac", "label": "(A) 宛先MACアドレス"}, {"key": "bip", "label": "(B) 宛先IPアドレス"}, {"key": "bmac", "label": "(B) 宛先MACアドレス"}]}, {"id": "f1-2-2", "sub": "(2)", "type": "text", "limit": 20, "prompt": "本文中の下線①はどのような制約か。20字以内で述べよ。"}, {"id": "f1-2-3", "sub": "(3)", "type": "text", "limit": 30, "prompt": "本文中の下線②では、LBaのパケット振り分け動作とLBbのパケット振り分け動作との関係について、ある条件が成立しなければならない。その条件を、30字以内で述べよ。"}]}, {"mon": "設問3", "note": "〔新NW構成の設計〕について", "items": [{"id": "f1-3-1", "sub": "(1)", "type": "text", "limit": 20, "prompt": "本文中の下線③で、FWを3台構成とする目的を20字以内で述べよ。"}, {"id": "f1-3-2", "sub": "(2)", "type": "fields", "limit": 0, "prompt": "表2中の［ あ ］、［ い ］に入れる適切な数値を答えよ。", "fields": [{"key": "a", "label": "あ"}, {"key": "i", "label": "い"}]}, {"id": "f1-3-3", "sub": "(3)", "type": "text", "limit": 30, "prompt": "本文中の下線④は、LBが故障検出対象であるFWに対してヘルスチェック用パケットを送信する方法と比較して、どのような利点があるか。30字以内で述べよ。"}, {"id": "f1-3-4", "sub": "(4)", "type": "text", "limit": 30, "prompt": "本文中の下線⑤の動作は、この動作を行わない場合と比べて、TCPコネクションの両端のノードにどのような利点を与えるか。30字以内で述べよ。"}]}]},
    {"id": 15, "label": "問3", "title": "侵入検知・防御システムの導入", "lede": "輸入食品卸売会社F社の営業支援システム。IDSの見直し（接続方法・FW連携）とIPS追加、運用方法の設計がテーマ。", "folder": "h27a", "pages": [12, 13, 14, 15], "groups": [{"mon": "設問1", "note": "本文中の空欄に入れる適切な字句を答えよ。", "items": [{"id": "i1-1-1", "sub": "ア", "type": "text", "limit": 0, "prompt": "「他方の［ ア ］型は、定義されたプロトコルの仕様などから逸脱したアクセスがあった場合に不正とみなす」の ア に入る字句。"}, {"id": "i1-1-2", "sub": "イ", "type": "text", "limit": 0, "prompt": "「IDSは、監視対象のネットワークにあるSWの［ イ ］ポートに接続し」の イ に入る字句。"}, {"id": "i1-1-3", "sub": "ウ", "type": "text", "limit": 0, "prompt": "「IDS側のネットワークポートを［ ウ ］モードにすることで、IDS以外を宛先とする通信も取り込むことができる」の ウ に入る字句。"}, {"id": "i1-1-4", "sub": "エ", "type": "text", "limit": 0, "prompt": "「IDS側のネットワークポートに［ エ ］アドレスを割り当てなければ、IDS自体がOSI基本参照モデルの第3層レベルの攻撃を受けることを回避できる」の エ に入る字句。"}, {"id": "i1-1-5", "sub": "オ", "type": "text", "limit": 0, "prompt": "「ICMPヘッダのコードにport［ オ ］を設定したパケットを送って、更なる攻撃の抑止を試みることができる」の オ に入る字句。"}]}, {"mon": "設問2", "note": "〔IDSの見直し〕について", "items": [{"id": "i1-2-1", "sub": "(1)", "type": "fields", "limit": 0, "prompt": "IDSで検出可能な通信の範囲を追加して、表1を完成させよ。（表1で省略されている「通信の範囲」と、SW1～SW3それぞれの○／×を答える）", "fields": [{"key": "range", "label": "追加する通信の範囲"}, {"key": "sw1", "label": "SW1（○／×）"}, {"key": "sw2", "label": "SW2（○／×）"}, {"key": "sw3", "label": "SW3（○／×）"}]}, {"id": "i1-2-2", "sub": "(2)", "type": "text", "limit": 40, "prompt": "本文中の下線①で、IDSとFWが連携することで不正な接続を遮断する仕組みとは、どのようなものか。40字以内で具体的に述べよ。"}, {"id": "i1-2-3", "sub": "(3)", "type": "text", "limit": 35, "prompt": "H君が、本文中の下線②のように考えたのはなぜか。35字以内で述べよ。"}]}, {"mon": "設問3", "note": "〔IPSの追加〕について", "items": [{"id": "i1-3-1", "sub": "(1)", "type": "text", "limit": 50, "prompt": "本文中の下線③で可能としている、一時的な運用を50字以内で述べよ。"}, {"id": "i1-3-2", "sub": "(2)", "type": "text", "limit": 25, "prompt": "本文中の下線④の、IPSが実装している機能とは何か。25字以内で述べよ。"}, {"id": "i1-3-3", "sub": "(3)", "type": "text", "limit": 35, "prompt": "IDSとIPSの導入後に、セキュリティレベルの継続的な向上のために、管理用PCを使ってどのようなことを行うか。35字以内で具体的に述べよ。"}]}]},
    {"id": 16, "label": "問1", "title": "電子メールシステム", "lede": "A社のサポート業務をB社に委託する際のメール運用。OP25B環境下のSMTP-AUTH・サブミッションポートと、SPFの導入がテーマ。", "folder": "h28a", "pages": [2, 3, 4, 5, 6], "groups": [{"mon": "設問1", "note": "本文中の空欄に入れる適切な字句を答えよ。", "items": [{"id": "t1-1-1", "sub": "ア", "type": "text", "limit": 0, "prompt": "「外部のメールサーバは、DNS3に設定された資源レコードのうち、［ ア ］レコードの情報に従って、A社ドメイン宛てのメールを転送する」の ア に入る字句。"}, {"id": "t1-1-2", "sub": "イ", "type": "text", "limit": 0, "prompt": "「A社ドメイン宛てのメールを［ イ ］に転送する」（A社内PCは［ イ ］に届いたメールをPOP3で取得）の イ に入る字句。"}, {"id": "t1-1-3", "sub": "ウ", "type": "text", "limit": 0, "prompt": "「各社員のPCにインストールしたメールクライアントから、［ ウ ］にSMTPSでメールを送信しています」の ウ に入る字句。"}, {"id": "t1-1-4", "sub": "エ", "type": "text", "limit": 0, "prompt": "「MSV3は、SMTPプロトコル上でユーザ認証を行う方式である［ エ ］を導入し」の エ に入る字句。"}]}, {"mon": "設問2", "note": "〔サポート業務委託時のメール運用の検討〕について", "items": [{"id": "t1-2-1", "sub": "(1)", "type": "text", "limit": 25, "prompt": "本文中の下線①について、この設定がないことによって生じる情報セキュリティ上のリスクを、25字以内で答えよ。"}, {"id": "t1-2-2", "sub": "(2)", "type": "text", "limit": 0, "prompt": "本文中の下線②のルータ名を答えよ。"}, {"id": "t1-2-3", "sub": "(3)", "type": "fields", "limit": 0, "prompt": "表1中の［ オ ］～［ キ ］に入れる適切な字句を答えよ。", "fields": [{"key": "o", "label": "オ（プロトコル）"}, {"key": "ka", "label": "カ（送信元IPアドレス）"}, {"key": "ki", "label": "キ（宛先ポート番号）"}]}, {"id": "t1-2-4", "sub": "(4)", "type": "text", "limit": 0, "prompt": "本文中の下線③について、このポートを何と呼ぶかを答えよ。"}, {"id": "t1-2-5", "sub": "(5)", "type": "fields", "limit": 0, "prompt": "本文中の下線④について、2種類の通信の宛先ポート番号を、それぞれ答えよ。", "fields": [{"key": "p1", "label": "宛先ポート番号（1）"}, {"key": "p2", "label": "宛先ポート番号（2）"}]}]}, {"mon": "設問3", "note": "〔SPFの導入〕について", "items": [{"id": "t1-3-1", "sub": "(1)", "type": "text", "limit": 0, "prompt": "本文中の下線⑤について、送信元ドメインが得られるSMTPプロトコルのコマンドを答えよ。"}, {"id": "t1-3-2", "sub": "(2)", "type": "text", "limit": 20, "prompt": "本文中の下線⑥で行われる処理内容について、SPFレコードと照合される情報を、20字以内で具体的に答えよ。"}]}]},
    {"id": 17, "label": "問2", "title": "モバイルネットワークの検討", "lede": "運送業E社の販売管理システム向けモバイルネットワーク。無線LAN・LTE・VPN・プロキシの各要素のセキュリティ対策がテーマ。", "folder": "h28a", "pages": [7, 8, 9, 10], "groups": [{"mon": "設問1", "note": "本文中の空欄に入れる適切な字句を答えよ。", "items": [{"id": "q1-1-1", "sub": "ア", "type": "text", "limit": 0, "prompt": "「WPA2は、無線LANの暗号化アルゴリズムとして［ ア ］が初めて採用された方式である」の ア に入る字句。"}, {"id": "q1-1-2", "sub": "イ", "type": "text", "limit": 0, "prompt": "「あらかじめタブレット端末とモバイルWi-Fiルータに同じパスフレーズを設定する［ イ ］認証を用いる」の イ に入る字句。"}, {"id": "q1-1-3", "sub": "ウ", "type": "text", "limit": 0, "prompt": "「通信事業者が契約者を識別する情報が記録されている［ ウ ］が挿入されている」の ウ に入る字句。"}, {"id": "q1-1-4", "sub": "エ", "type": "text", "limit": 0, "prompt": "「LTE回線からインターネットのようなネットワークへのゲートウェイの指定を意味する、［ エ ］の情報を設定する」の エ に入る字句。"}, {"id": "q1-1-5", "sub": "オ", "type": "text", "limit": 0, "prompt": "「モバイルWi-Fiルータでは［ オ ］によるIPアドレスとポート番号の変換処理が行われる」の オ に入る字句。"}, {"id": "q1-1-6", "sub": "カ", "type": "text", "limit": 0, "prompt": "「HTTPSプロキシの場合、プロキシサーバは、タブレット端末からの［ カ ］要求によってHTTPSサーバへのTLSトンネルを中継し」の カ に入る字句。"}]}, {"mon": "設問2", "note": "〔無線LAN接続の検討〕について", "items": [{"id": "q1-2-1", "sub": "(1)", "type": "text", "limit": 25, "prompt": "本文中の下線①について、ステルス機能の動作を25字以内で述べよ。"}, {"id": "q1-2-2", "sub": "(2)", "type": "text", "limit": 30, "prompt": "本文中の下線②について、SSIDやMACアドレスは容易に取得される危険性がある。その理由を、電波を用いて通信を行う無線LANの特性に着目して、30字以内で述べよ。"}, {"id": "q1-2-3", "sub": "(3)", "type": "text", "limit": 0, "prompt": "本文中の下線③について、重複してはいけないセグメントを、図1中の(A)～(E)から選べ。"}]}, {"mon": "設問3", "note": "〔VPN接続の検討〕について", "items": [{"id": "q1-3-1", "sub": "(1)", "type": "text", "limit": 20, "prompt": "本文中の下線④について、報告を受けたモバイルネットワーク管理者が取るべき行動を、紛失したVPN接続の利用者IDに着目して、20字以内で述べよ。"}, {"id": "q1-3-2", "sub": "(2)", "type": "text", "limit": 25, "prompt": "本文中の下線⑤で、許可するとしている通信を、図1中の字句を用いて25字以内で答えよ。"}]}, {"mon": "設問4", "note": "〔プロキシサーバの検討〕について", "items": [{"id": "q1-4-1", "sub": "(1)", "type": "fields", "limit": 0, "prompt": "本文中の下線⑥について、プロキシサーバに必要な機能名を10字以内で答えよ。また、営業員を特定するために必要な設定内容を20字以内で述べよ。", "fields": [{"key": "func", "label": "機能名（10字以内）", "limit": 10}, {"key": "conf", "label": "設定内容（20字以内）", "limit": 20}]}, {"id": "q1-4-2", "sub": "(2)", "type": "fields", "limit": 0, "prompt": "本文中の下線⑦について、HTTPSのRequest-URIから取得できるログの内容を二つ挙げ、それぞれ10字以内で答えよ。", "fields": [{"key": "l1", "label": "ログの内容（1）（10字以内）", "limit": 10}, {"key": "l2", "label": "ログの内容（2）（10字以内）", "limit": 10}]}]}]},
    {"id": 18, "label": "問3", "title": "メールサーバの更改", "lede": "D社のメールサーバ更改。DNSのゾーン転送とラウンドロビン、VRRPによるActive-Active構成、利用者を巻き込む移行手順の設計がテーマ。", "folder": "h28a", "pages": [11, 12, 13, 14, 15], "groups": [{"mon": "設問1", "note": "〔現行NWの仕様〕について", "items": [{"id": "t3-1-1", "sub": "(1)", "type": "fields", "limit": 0, "prompt": "本文中の［ a ］及び表1中の［ b ］に入れる適切な字句を答えよ。", "fields": [{"key": "a", "label": "a"}, {"key": "b", "label": "b"}]}, {"id": "t3-1-2", "sub": "(2)", "type": "text", "limit": 0, "prompt": "表1中の［ c ］に入れる適切な機器名を、図1中の機器名を用いて答えよ。"}, {"id": "t3-1-3", "sub": "(3)", "type": "text", "limit": 15, "prompt": "表1中の項番4で許可されている通信では、どのような情報が送信されるか。15字以内で答えよ。"}, {"id": "t3-1-4", "sub": "(4)", "type": "fields", "limit": 0, "prompt": "本文中の下線①は、送信元によって選択される宛先に偏りが生じやすく、その偏りが長時間継続しやすいからである。宛先に偏りが生じやすくなる条件を15字以内で答えよ。また、その偏りが継続しやすい理由を40字以内で述べよ。", "fields": [{"key": "cond", "label": "偏りが生じやすくなる条件（15字以内）", "limit": 15}, {"key": "why", "label": "偏りが継続しやすい理由（40字以内）", "limit": 40}]}]}, {"mon": "設問2", "note": "〔新メールサーバの負荷分散の仕様〕について", "items": [{"id": "t3-2-1", "sub": "(1)", "type": "fields", "limit": 0, "prompt": "本文中の［ d ］、［ e ］に入れる適切な機器名を、図2中の機器名を用いて答えよ。", "fields": [{"key": "d", "label": "d"}, {"key": "e", "label": "e"}]}, {"id": "t3-2-2", "sub": "(2)", "type": "fields", "limit": 0, "prompt": "本文で定義されている仕様において必要な、社内ゾーン情報に定義する2件のAレコードについて、そのホスト名とIPアドレスの組合せを答えよ。", "fields": [{"key": "h1", "label": "ホスト名（1）"}, {"key": "ip1", "label": "IPアドレス（1）"}, {"key": "h2", "label": "ホスト名（2）"}, {"key": "ip2", "label": "IPアドレス（2）"}]}]}, {"mon": "設問3", "note": "〔MSVの移行〕について", "items": [{"id": "t3-3-1", "sub": "(1)", "type": "fields", "limit": 0, "prompt": "現行NWから移行中NWへの変更において、DNSとMGW以外で、設定変更が必要な現行NWの機器名を、図3中の機器名を用いて答えよ。また、その設定変更内容を40字以内で述べよ。", "fields": [{"key": "dev", "label": "機器名"}, {"key": "cfg", "label": "設定変更内容（40字以内）", "limit": 40}]}, {"id": "t3-3-2", "sub": "(2)", "type": "fields", "limit": 0, "prompt": "本文中の下線②が必要な理由は、移行期間中に、どのような送信元と宛先のメールが送受信されるからか。その組合せを一つ答えよ。", "fields": [{"key": "src", "label": "送信元"}, {"key": "dst", "label": "宛先"}]}, {"id": "t3-3-3", "sub": "(3)", "type": "fields", "limit": 0, "prompt": "表2中の移行工程におけるメールの転送経路の例を、次の（ア）、（イ）に示す。“旧MSV”、“新MSV”、“→”を用いて、経路を完成させよ。（ア）送信元が社外、宛先が未変更社員：送信元のメールサーバ→MGW→［ (A) ］／（イ）送信元が未変更社員、宛先が社外：送信元PC→［ (B) ］→MGW→宛先のメールサーバ", "fields": [{"key": "a", "label": "(A)"}, {"key": "b", "label": "(B)"}]}, {"id": "t3-3-4", "sub": "(4)", "type": "text", "limit": 40, "prompt": "表2中の下線③では、LDAPのどのような情報がどのように変更されるか。40字以内で述べよ。"}]}]}

  var MODEL_DATA = {"h1-1-1": {"a": "SHA-1", "e": "MD5と並んで、衝突（同じハッシュ値になる別データ）が見つかり安全性が不十分とされるハッシュアルゴリズムです。TLS 1.2以上ではSHA-256以上を使えるため、これらを使わずに済みます。"}, "h1-1-2": {"a": "1.2", "e": "TLS 1.2からは、ハンドシェイクや鍵導出でMD5・SHA-1の組合せに頼らず、SHA-256などのハッシュを使えます。そのため「MD5又はSHA-1を使わないで済む最低限のバージョン」は1.2です。"}, "h1-1-3": {"a": "Client_Hello", "e": "SSL/TLSのハンドシェイクは、クライアントがClient_Helloで「使えるバージョンと暗号スイートの一覧」を送るところから始まります。"}, "h1-1-4": {"a": "Server_Hello", "e": "サーバがServer_Helloで、クライアントの候補の中から使用するバージョンと暗号スイートを選んで返します。これで以降に使う暗号スイートが決まります。"}, "h1-1-5": {"a": "リバースプロキシ", "e": "SSL-VPNの動作方式は、リバースプロキシ方式（Webアプリ中心）、ポートフォワーディング方式（指定ポートのTCP通信）、L2フォワーディング方式（レイヤ2の中継）の3つです。"}, "h1-2-1": {"a": "暗号アルゴリズム：①鍵交換 ②認証\nハッシュアルゴリズム：メッセージ認証", "e": "暗号スイートは「鍵交換」「認証（署名）」「アプリケーション層の暗号化」「ハッシュ（メッセージ認証）」の組合せです。設問の「2種類の暗号アルゴリズム」は、アプリ層の暗号化以外の鍵交換と認証にあたり、ハッシュはメッセージ認証（改ざん検出）に使われます。"}, "h1-2-2": {"a": "顧客システムは、様々なプロトコルを利用している。", "e": "リバースプロキシ方式やポートフォワーディング方式は、対応するアプリ・ポートが限られます。H社の顧客システムは利用プロトコルが様々なので、プロトコルを問わず通せるL2フォワーディング方式が適します。"}, "h1-2-3": {"a": "vNIC", "e": "L2フォワーディング方式では、PCに仮想NIC（vNIC）が作られ、SSL/TLSトンネル上でレイヤ2の中継を行います。認証に応じて割り当てられたIPアドレスは、この仮想NICに設定されます（物理NICは元のネットワーク用のまま）。"}, "h1-3-1": {"a": "内部LAN", "e": "表1の1行目は、内部LANからDMZ（プロキシサーバ経由でインターネットへ向かう通信）のルールです。"}, "h1-3-2": {"a": "DMZ", "e": "内部LAN→DMZのルールです。内部LANのWebアクセスはDMZのプロキシサーバを経由します。"}, "h1-3-3": {"a": "172.16.0.0/16", "e": "送信元は内部LAN全体（172.16.0.0/16）です。"}, "h1-3-4": {"a": "202.y.44.2/32", "e": "インターネットからDMZへ許可するTCP/443は、SSL-VPN装置（202.y.44.2）宛のみです。DMZ内のほかの機器には通さないよう、宛先を1ホスト（/32）に絞ります。"}, "h1-4-1": {"a": "②，③，④，⑤", "e": "表2は「172.16.0.0/16宛を禁止、それ以外は許可」です。開発LAN（VLAN101＝⑤）から顧客システム構築ネットワークへの直接アクセスと、顧客システム構築ネットワーク同士（VLAN1〜3＝②③④）の通信を、それぞれの入力方向で止めるため、②③④⑤に設定します。"}, "h1-4-2": {"a": "顧客システム構築ネットワークから他社の顧客システム構築ネットワークへの通信", "e": "表2を②③④（顧客システム構築ネットワーク側）の入力方向に設定すると、「それ以外の不正な通信」として、ある顧客のネットワークから他社の顧客のネットワークへの通信が禁止されます。"}, "h1-4-3": {"a": "⑥", "e": "VPN-PCはSSL-VPN装置の内側（VLAN201）経由で入ってきます。この入口にあたる⑥の入力方向に表3を設定し、自社に対応する顧客システム構築ネットワーク以外へのアクセスを禁止します。"}, "h2-1-1": {"a": "バーストトラフィック", "e": "一時的に大量の帯域を使う、瞬間的に集中する通信のことです。プリントデータの送信がこれにあたります。"}, "h2-2-1": {"a": "導入前：ファイル転送通信\n導入後：画面転送通信、プリント通信", "e": "VDI導入後は、ファイル転送はVDIサーバとファイルサーバの間（本社内）で完結し、インターネット通信も本社の仮想PCから出るため、広域イーサ網を通らなくなります。支店のTCと本社のVDIサーバの間では画面転送通信が流れ、プリント通信は本社の仮想PCから支店のプリントサーバへ流れます。"}, "h2-2-2": {"a": "1.25", "e": "現行の安全率＝契約帯域÷ピーク時の必要帯域です。支店は100M÷（800M÷10支店＝80M）＝1.25、本社は1G÷800M＝1.25で、どちらも1.25です。"}, "h2-2-3": {"a": "100", "e": "VDI導入後に広域イーサ網を通る必要帯域は、画面転送通信のみです。支店は40人×200kビット/秒＝8Mなので、全10支店で80Mです。安全率1.25を掛けて80M×1.25＝100M。"}, "h2-2-4": {"a": "10", "e": "各支店は40人×200kビット/秒＝8Mビット/秒。安全率1.25を掛けて8M×1.25＝10Mビット/秒です。"}, "h2-2-5": {"a": "理由：インターネット通信は本社の仮想PCから行われるから。\n利点：情報セキュリティ対策を本社で集中的に行うことができる。", "e": "仮想PCは本社のVDIサーバ上にあり、インターネットへの通信は本社の仮想PCから出ます。そのため支店のインターネット回線は不要です。出口が本社の1か所になり、UTMなどの対策を集中して行えます（設問が「利点」を問うているので、利点も必ず書きます）。"}, "h2-3-1": {"a": "プリント通信が画面転送通信を圧迫するから。", "e": "プリント通信は帯域を確保しない（量も把握できない）ため、一時的に大量の帯域を使い、同じ広域イーサ網を通る画面転送通信の帯域を奪います。その結果TCの画面更新が遅れ、操作性が悪化します。"}, "h2-3-2": {"a": "送出タイミングを調整する。", "e": "シェーピングは、超過分を破棄せずバッファに溜めて送出タイミングを遅らせ、契約帯域に収める制御です。「パケットを破棄する」はポリシングの動作なので誤りです（採点講評でも誤答が多かった点として挙げられています）。"}, "h2-4-1": {"a": "仮想SW", "e": "仮想PCは仮想SWとの接続で外部と通信するので、隔離するには仮想SWから切り離します（物理的にLANケーブルを抜くことの代わり）。"}, "h2-4-2": {"a": "任意", "e": "感染した仮想PCだけでなく、他の仮想PCも含めてC&Cサーバへの通信を防ぐので、送信元は特定せず「任意」とします。"}, "h2-4-3": {"a": "C&Cサーバ", "e": "標的型攻撃対策装置が特定したC&CサーバのIPアドレスを宛先に指定し、インターネット方向の通信を拒否します。"}, "h3-1-1": {"a": "NAPT", "e": "プライベートIPアドレスの端末がインターネットに出るとき、IPアドレスとポート番号を同時に変換する仕組みです（IPマスカレード）。"}, "h3-1-2": {"a": "事前共有鍵", "e": "IKEフェーズ1の認証方式の一つで、両方の機器にあらかじめ同じ鍵（PSK）を設定します。"}, "h3-1-3": {"a": "AS", "e": "同じルーティングポリシで管理されるルータの集まりが自律システム（AS）で、BGPはAS間で経路交換を行うプロトコルです。AS番号が割り当てられます。"}, "h3-1-4": {"a": "TCP", "e": "BGPはTCPのポート179番を使い、BGPピアのコネクションを確立して経路情報を交換します。"}, "h3-1-5": {"a": "ICMP", "e": "pingはICMPのecho requestを送り、echo replyが返ることで到達性を確認します（RFC 792）。"}, "h3-1-6": {"a": "echo reply", "e": "監視対象が返すICMPのパケットはecho replyです。"}, "h3-2-1": {"a": "暗号化対象の通信がグローバルIPアドレス間の通信だから。", "e": "トランスポートモードは元のIPヘッダを残したままペイロードを暗号化します。今回はIP in IPで外側にVPNルータ間のグローバルIPアドレスのヘッダが付いており、IPsecで暗号化する通信そのものがグローバルIPアドレス間の通信です。新たにIPヘッダを付けるトンネルモードは不要になります。"}, "h3-2-2": {"a": "フラグメントとリアセンブルの処理が発生する。", "e": "IP in IPで外側のIPヘッダが加わり、さらにIPsecで暗号化すると、1,500バイトのMTUを超えます。そのためVPNルータでIPパケットの分割（フラグメント）と再構成（リアセンブル）が必要になり、処理負荷と遅延が増えます。"}, "h3-3-1": {"a": "BGPによって回線断や機器障害を検知し、トラフィックをう回できる。", "e": "静的経路では、障害が起きても経路が自動で切り替わりません。BGPでは、ピアの断絶を検知して経路を取り消し、別の経路（スタンバイ側）へ自動的に迂回できます。"}, "h3-3-2": {"a": "Helloパケットを出さない。", "e": "OSPFのパッシブインタフェースは、Helloパケットを送らず、隣接関係（ネイバー）を作りません。ただし、そのインタフェースのネットワークは経路として広告できます。トンネルインタフェースは経路交換が不要なので、パッシブにします。"}, "h3-3-3": {"a": "大きく", "e": "OSPFではコストが小さい経路が優先されます。VPNb1側をスタンバイにするには、VPNa1側よりコストを大きくします。"}, "h3-3-4": {"a": "eBGPからOSPFへ再配布された経路を、再びeBGPへ再配布しない。", "e": "OSPFとBGPの間で相互に再配布すると、経路情報がぐるぐる回るループが生じ得ます。BGPで受けてOSPFに再配布した経路を、再びBGPへ戻さないよう制御します。IPの経路制御でもループは起こり得ます（STPはレイヤ2のループ対策なので誤りです）。"}, "h3-4-1": {"a": "ネットワーク接続の冗長構成が失われたことを検出するため。", "e": "VPNトンネルは常用側とスタンバイ側の2本あります。片方のトンネルが切れても通信は続きますが、冗長が失われた状態を放置すると次の障害で全断になります。そのため両方を常に監視し、冗長構成の喪失を検知します。"}, "s1-1-1": {"a": "リバースプロキシ", "e": "SSOの方式は、各サーバにエージェントを入れるエージェント方式と、SSOサーバが全ての通信を中継するリバースプロキシ方式に分かれます。"}, "s1-1-2": {"a": "リダイレクト", "e": "アクセスチケットがない場合、Webアプリケーションサーバ内のエージェントはHTTPのリダイレクトでPCをSSOサーバへ誘導します。認証後にSSOサーバが元のサーバへ戻すときも、同じくリダイレクトです。"}, "s1-1-3": {"a": "Set-Cookie", "e": "サーバがCookieを発行するときはHTTP応答のSet-Cookieヘッダを使います。ここにDomain属性が付いていないと、Cookieが発行元のサーバにしか送られず、営業システムと広告システムに共通で使えません。"}, "s1-1-4": {"a": "内部DNS", "e": "PCがsso.a-sha.example.jpを引いたときにLBのVIPが返るよう、内部DNSサーバに登録します（図1に内部DNSサーバがあります）。"}, "s1-1-5": {"a": "ループバック", "e": "DSR方式では、SSOサーバはVIP宛のパケットを受け取れる必要があります。ただしVIPに対するARPには応答させたくないので、VIPは物理NICではなくループバックインタフェースに付与します。"}, "s1-2-1": {"a": "⑤", "e": "⑤で、SSOサーバがUserIDとPasswordの確認後にアクセスチケットを発行し、Cookieに含めてPCへ応答します。PCはこの時点でアクセスチケットを得ます。"}, "s1-3-1": {"a": "a-sha.example.jp", "e": "表1のURLは、sso／eigyou／koukokuの各ホスト名の後ろが共通の「a-sha.example.jp」です。この親ドメインをDomain属性に指定すると、3つのサーバのどれに接続してもCookieが送られ、SSOが成立します。"}, "s1-3-2": {"a": "CookieにSecure属性を付ける。", "e": "Secure属性付きのCookieは、ブラウザがHTTPS接続でしか送りません。予期しないHTTP接続が発生しても、Cookieが平文で流れません。（単に「通信を暗号化する」では不十分です。採点講評でも、Secure属性の仕組みの理解が課題とされています）"}, "s1-4-1": {"a": "SYNパケットにはレイヤ7情報が含まれていないから。", "e": "DSR方式のLBは、TCPコネクション確立のSYNパケットが届いた時点で振り分け先を決めます（要点(2)）。この時点ではCookieなどのレイヤ7情報がまだ届いていないので、それらに基づく振り分けはできません。"}, "s1-4-2": {"a": "Gratuitous ARP（GARP）", "e": "IPアドレスの重複検知には、自分のIPアドレスを問い合わせるGratuitous ARPを使います。応答があれば、同じIPアドレスを持つ機器が他にあると分かります。"}, "s1-4-3": {"a": "VIPアドレスに対するARPリクエストに応答しないように設定する。", "e": "ループバックにVIPを付けたSSOサーバがVIPのARPに応答すると、LBとSSOサーバがVIPに対して応答することになり、重複エラーになります。そのためSSOサーバ側でVIPのARPには応答しないよう設定します。"}, "f1-1-1": {"a": "スループット", "e": "LBの仕様には、1秒当たりの転送データ量としてスループット（bps）が書かれています。"}, "f1-1-2": {"a": "パケット", "e": "LBが1秒に処理できるパケット数（pps）には上限があります。そのため、パケット長が短いと、実際に出せる最大スループットは仕様値より小さくなります。"}, "f1-1-3": {"a": "維持", "e": "Active-Active構成では、FWの故障時に別のFWへ振り分けられます。ただしFWのステートフルインスペクションのセッション情報は引き継がれないので、既存のセッションを維持できません。"}, "f1-2-1": {"a": "(A) 宛先IPアドレス：機器b\n(A) 宛先MACアドレス：FW1\n(B) 宛先IPアドレス：機器b\n(B) 宛先MACアドレス：FW2", "e": "ルータaの経路表では、サブネットb1宛のゲートウェイはFW1です。そのためルータaはFW1のMACアドレスを宛先にして送ります（A）。LBaはこれをブリッジのように中継しつつ、宛先MACアドレスだけを振り分け先のFW2のものに書き換えます（B）。IPアドレスは書き換えません。"}, "f1-2-2": {"a": "宛先IPアドレスを書き換えられない。", "e": "FWはセッションの終端ノードではなく、通過するだけです。そのため、サーバ負荷分散のように仮想IPアドレスから実IPアドレスへ宛先を書き換える方式は使えず、MACアドレスの書き換えで振り分けます。"}, "f1-2-3": {"a": "セッション単位に、2台のLBが同じFWを選択する。", "e": "FWはステートフルインスペクションを行うため、行きと戻りのパケットが同じFWを通らなければ、戻りのパケットが不正と判断されて破棄されます。LBaとLBbが同じセッションに同じFWを選ぶ必要があります。"}, "f1-3-1": {"a": "故障発生時の性能を不足させないため。", "e": "必要な処理能力が現行の1.4倍以上なので、2台のActive-Activeでは1台が故障すると不足します。3台にすれば、1台故障しても残り2台で性能を満たせます。"}, "f1-3-2": {"a": "あ：99\nい：180", "e": "LB3はインターネット側にあるので、インターネット⇔社内NW（89）とインターネット⇔DMZ（10）を扱い、あ＝99です。LB4は社内NW側で、社内NWの通信は全てProxyを経由するため、PC→Proxyの通信とProxy→FW方向の通信の両方を扱います。社内NW⇔(インターネット・DMZ)の90が二重になり、い＝180です（採点講評でも「LB4が最も高負荷」と説明されています）。"}, "f1-3-3": {"a": "FWを経由するLB間の経路の障害を検出できる。", "e": "下線④は、対向するLBとの間で、経由するFWを変えながらヘルスチェックパケットをやり取りする方式です。FWそのものの故障だけでなく、FWを経由するLB間の経路の障害も検出できます。LBが直接FWに送る方式ではそこまで分かりません。"}, "f1-3-4": {"a": "タイムアウトを待たずにコネクションの切断を検知できる。", "e": "両端のノードにRSTを送ると、各ノードはFWの故障で届かなくなったコネクションを、タイムアウトを待たずに切断として認識し、すぐに再接続できます。"}, "i1-1-1": {"a": "アノマリ（異常検知）", "e": "IDSの検知方式には、既知の攻撃パターンで検知するシグネチャ型と、正常な状態や仕様からの逸脱を検知するアノマリ型（異常検知型）があります。"}, "i1-1-2": {"a": "ミラー（ミラーリング）", "e": "IDSはSWのミラーポート（ミラーリングポート）に接続し、監視対象の通信のコピーを受け取ります。"}, "i1-1-3": {"a": "プロミスキャス", "e": "プロミスキャスモードにすると、宛先が自分宛でないフレームも取り込めます。"}, "i1-1-4": {"a": "IP", "e": "監視用のポートにIPアドレスを付けなければ、そのポートはL3レベルで通信できず、IDS自体が攻撃を受けることを避けられます。"}, "i1-1-5": {"a": "unreachable", "e": "UDPの不正パケットには送信元へICMPのport unreachable（宛先ポート到達不能）を返し、攻撃の抑止を試みます。"}, "i1-2-1": {"a": "追加する通信の範囲：インターネット⇔内部LAN\nSW1：○　SW2：×　SW3：○", "e": "表1に無い組合せは「インターネット⇔内部LAN」です。この通信は、インターネット側のSW1と内部LAN側のSW3を通りますが、DMZ側のSW2は通りません。"}, "i1-2-2": {"a": "FWのACLを動的に変更して、遮断の対象とする送信元アドレスを追加する。", "e": "IDSが不正を検知すると、FWにそのアドレスを通知し、FWのアクセス制御リストに遮断対象の送信元アドレスを動的に追加させます。"}, "i1-2-3": {"a": "不正アクセスの送信元アドレスが偽装されている可能性があるから。", "e": "送信元アドレスが偽装されていると、抑止のICMPパケットが無関係な第三者に届き、その第三者への攻撃になりかねません（本文の「他のサイトへの攻撃となることもある」）。"}, "i1-3-1": {"a": "保護する機器にセキュリティパッチを適用するまでの間、脆弱性を悪用する攻撃の通信を遮断する。", "e": "いわゆる仮想パッチです。サーバに新しい脆弱性が見つかり、影響確認に時間が掛かって実パッチをすぐ当てられない間、IPSが脆弱性を突く通信を遮断して時間を稼ぎます。"}, "i1-3-2": {"a": "通信をそのまま通過させ、遮断しない機能。", "e": "IPSは通信の経路上に置かれるので、IPSが故障すると通信全体が止まります。そのため、故障時には通信をそのまま通過させるバイパス（フェイルオープン）の機能を使います。"}, "i1-3-3": {"a": "不正アクセスへの対応を最適化するために、ログを取得して解析する。", "e": "IDS・IPSは誤検知（フォールスポジティブ）と見逃し（フォールスネガティブ）が起こり得ます。管理用PCでログを収集・解析して、設定やシグネチャを見直し、対応を継続的に最適化します。"}, "t1-1-1": {"a": "MX", "e": "他のドメイン宛のメールの配送先は、DNSのMXレコードで決まります。"}, "t1-1-2": {"a": "MSV3", "e": "DNS3が答えるMXレコードはA社のメールサーバ（MSV3）です。社内PCはMSV3に届いたメールをPOP3で取得します。"}, "t1-1-3": {"a": "MSV2", "e": "B社はQ社のメールサービスを使っており、Q社のメールサーバはMSV2です。"}, "t1-1-4": {"a": "SMTP-AUTH", "e": "SMTPプロトコル上でユーザ認証を行う方式はSMTP-AUTHです。"}, "t1-2-1": {"a": "不正メールの踏み台にされてしまうリスク。", "e": "認証なしにa-sha.co.jp以外宛のメールを転送する設定だと、誰でも外部宛のメールを中継させられるオープンリレーになり、迷惑メールの踏み台にされます。"}, "t1-2-2": {"a": "ルータ4", "e": "OP25Bは、サービスネットワーク内の動的IPアドレスのホストから、サービスネットワーク外へ向かう宛先ポート25のSMTPを禁止します。サービスネットワークとインターネットの境界は、Q社のルータ4です。"}, "t1-2-3": {"a": "オ：TCP\nカ：a.b.0.0/20\nキ：25", "e": "項番1は「禁止」で、TCPのポート25宛、送信元はQ社が動的に割り当てるアドレスブロック（a.b.0.0/20）です。項番2で、それ以外のIP通信を許可します。"}, "t1-2-4": {"a": "サブミッションポート", "e": "メールクライアントからメールサーバへ送信するときは、認証付きのサブミッションポート（TCP 587）を使います。"}, "t1-2-5": {"a": "110\n587", "e": "外部（B社）からDMZのMSV3へは、受信のPOP3（110番）と、送信のサブミッション（587番）の2種類を通します。本文でSTARTTLS方式（平文で接続して途中で暗号化に切り替える方式）とされているので、暗号化専用のポート（POP3Sの995、SMTPSの465）ではなく、元のポートです（採点講評でも誤答が多い点とされています）。"}, "t1-3-1": {"a": "MAIL FROM", "e": "SMTP通信の中でやり取りされる送信元（エンベロープの送信元）は、MAIL FROMコマンドで通知されます。"}, "t1-3-2": {"a": "送信元メールサーバのIPアドレス", "e": "SPFは、DNSのSPFレコードに登録された正当なメールサーバのIPアドレスと、実際にSMTP接続してきた送信元メールサーバのIPアドレスを照合します。"}, "q1-1-1": {"a": "AES", "e": "WPA2は、暗号化にAES（CCMP）を必須とした最初の方式です。（WPAはTKIPです）"}, "q1-1-2": {"a": "事前共有鍵", "e": "あらかじめ同じパスフレーズ（鍵）を設定する認証は、事前共有鍵（PSK）方式です。"}, "q1-1-3": {"a": "SIMカード", "e": "通信事業者が契約者を識別するための情報（IMSIなど）は、SIMカードに記録されています。"}, "q1-1-4": {"a": "APN", "e": "LTE回線で接続先のネットワークを指定する情報は、APN（Access Point Name）です。"}, "q1-1-5": {"a": "NAPT", "e": "プライベートIPアドレスのタブレットが、1つのグローバルIPアドレスでインターネットと通信するため、IPアドレスとポート番号を変換するNAPTが行われます。"}, "q1-1-6": {"a": "CONNECT", "e": "HTTPSプロキシは、クライアントのHTTP CONNECTメソッドの要求で、接続先へのTLSトンネルを中継します。"}, "q1-2-1": {"a": "定期的に送信するビーコン信号を停止する。", "e": "ステルス機能は、アクセスポイントがビーコンにSSIDを載せて発信するのをやめる機能です（クライアントの一覧にSSIDが出ない、というクライアント側の効果ではなく、アクセスポイント側の動作を答えます）。"}, "q1-2-2": {"a": "SSIDやMACアドレスは暗号化できず、傍受されるから。", "e": "無線LANは電波で通信するので、誰でも傍受できます。WPA2の暗号化は通信データを守るものですが、SSIDやMACアドレスは暗号化の対象にできず、そのまま見えてしまいます。"}, "q1-2-3": {"a": "E", "e": "タブレットはDHCPで（A）のプライベートIPアドレスをもらい、VPN接続後は（E）のプライベートIPアドレスが割り当てられます。（A）と（E）のアドレスが重複すると、タブレットはE社内への通信を自分のネットワーク（A）宛と判断して、VPNに送らなくなります。"}, "q1-3-1": {"a": "VPN接続の利用者IDを停止する。", "e": "端末とハードウェアトークンの両方が紛失している場合、利用者IDが悪用されるおそれがあるため、直ちにそのIDを使えないようにします。"}, "q1-3-2": {"a": "プロキシサーバと内部DNSサーバへの通信", "e": "本文では、タブレットから販売管理サーバ及びインターネットへの通信は、プロキシサーバ経由、名前解決は内部DNSサーバと決められています。VPN接続で許可するのは、この2つへの通信に絞ります。"}, "q1-4-1": {"a": "機能名：プロキシ認証\n設定内容：営業員ごとに利用者IDを登録する。", "e": "プロキシサーバのログから営業員を特定するには、プロキシ認証を行い、営業員ごとに利用者IDを登録して、ログに利用者IDが残るようにします。"}, "q1-4-2": {"a": "接続先ホスト名\n接続先ポート番号", "e": "HTTPSでは、プロキシが見えるのはCONNECTメソッドのRequest-URI（ホスト名:ポート番号）だけで、TLSトンネルの中のURLやデータは見えません。"}, "t3-1-1": {"a": "a：ゾーン転送\nb：SMTP", "e": "セカンダリDNSは、NOTIFYを受け取ると、プライマリDNSにゾーン転送を要求して、ゾーン情報を更新します。表1の項番1と2は、MGWとMSVの間のメール転送で、プロトコルはSMTPです。"}, "t3-1-2": {"a": "DNS1", "e": "項番3の送信元はDNS3（セカンダリ）で、プライマリDNSは、セカンダリDNSとだけ通信します。DNS3の通信相手はプライマリのDNS1です。"}, "t3-1-3": {"a": "公開ゾーン情報の更新通知", "e": "項番4のDNS1→DNS3は、プライマリDNSからセカンダリDNSへのNOTIFYです。DNS3は公開ゾーン情報だけを持つので、公開ゾーン情報の更新通知が送られます。"}, "t3-1-4": {"a": "条件：送信元が少数の場合\n理由：送信元は、DNSのキャッシュが生存している間、宛先を変えないから。", "e": "MGWからMSVへの送信元はMGWの2台だけなので、DNSのキャッシュが生存する間はどちらもキャッシュした同じ宛先に送り続け、宛先が偏ります。PCからMSVへの通信と違い、送信元が少数だとラウンドロビンの平準化効果が働きません。"}, "t3-2-1": {"a": "d：新MSV1\ne：新MSV2", "e": "VRRPを2グループ設定します。VRRPg1は新MSV1の優先度を高く、VRRPg2は新MSV2の優先度を高くして、2台でActive-Activeにします。"}, "t3-2-2": {"a": "msvc：VIP1\nmsvc：VIP2", "e": "PCが共通のホスト名msvcを引くと、VIP1とVIP2の2つが順番に返るよう、同じホスト名のAレコードを2件登録します（DNSラウンドロビン）。"}, "t3-3-1": {"a": "機器名：FW\n設定変更内容：新MSVとMGWとの間のSMTP通信を、双方向とも許可する。", "e": "表1のFWの許可ルールは旧MSV（MSV1～3）が対象です。移行中NWでは新MSVとMGWの間でもSMTPが流れるので、FWに許可を追加します（MGWの転送先変更とDNSの設定変更は設問で除かれています）。"}, "t3-3-2": {"a": "送信元：メール送受信サーバの変更を実施済みの社員、又は社外\n宛先：未変更社員", "e": "移行工程では、開始工程でMGWの転送先がVIP1（新MSV1）に変わっています。新MSVに届いた未変更社員宛のメールは、MBOXがまだ旧MSVにあるので、新MSVがLDAPの情報でメールルーティングして旧MSVへ回す必要があります。"}, "t3-3-3": {"a": "(A)：新MSV→旧MSV\n(B)：旧MSV", "e": "(ア)：社外→MGW→新MSV1（転送先がVIP1）→未変更社員のMBOXがある旧MSVへ、LDAPを使ってルーティング。(イ)：未変更社員のPCは旧MSVを使い続けているので、PC→旧MSV→MGW→宛先となります。"}, "t3-3-4": {"a": "申請者のメールアドレスに対応するメールサーバが、新MSVに変更される。", "e": "LDAPには、メールアドレスと、そのMBOXを収容するMSVとの対応が登録されています。社員が申告すると、その社員のアドレスに対応するMSVが旧MSVから新MSVに書き換えられます。"}};
  var PROBLEM_NOTES = {"7": "IPA採点講評（要旨）：全体として正答率は低め。設問1（TLSのバージョン・プロトコル選定）、設問2(1)（暗号スイート中のアルゴリズムの用途）、設問2(2)（動作方式の選定根拠）は特に低かった一方、設問3・設問4は高かった。設問4は、L3SWに隣接するFWの設定を考慮しない誤答も見られた。", "8": "IPA採点講評（要旨）：全体として正答率は高め。設問2(2)の広域イーサ網の計算は低かった。設問2(3)は利点への言及がない解答が散見された。設問3(2)は「パケットを破棄する」と誤答した受験者が多く、シェーピングとポリシングの違いの理解が課題。", "9": "IPA採点講評（要旨）：設問2(1)（トランスポートモードを選んだ根拠）と設問4（二つのVPNトンネルを監視する目的）は正答率が低かった。設問3(4)は、経路ループの防止策としてSTPと誤答する例が散見された。", "13": "IPA採点講評（要旨）：全体として正答率は低め。設問1はウ（Set-Cookie）、設問3(2)（Secure属性）が特に低かった。設問4はアドレス重複検知の仕組みと対処の理解が課題。", "14": "IPA採点講評（要旨）：全体として正答率は高め。設問2(1)は4つのアドレスが全て正しい解答が少なかった。設問3(2)「い」は、「社内NW⇔(インターネット・DMZ)は全てProxy経由」「LB4はFWとProxyの負荷分散を併用」の条件の見落としが多かった。", "15": "IPA採点講評（要旨）：全体として正答率は高め。設問1は専門用語（ミラーポート・ICMPの設定など）の正答率が低かった。設問2(2)はFWとの連携、設問3(1)(2)はIPSの機能の理解が課題。", "16": "IPA採点講評（要旨）：全体として正答率は高め。設問2(4)（2種類のポートの使い分け）と(5)（STARTTLS方式のポート番号）、設問3(1)（SMTPの基本的なシーケンス）の正答率が低かった。", "17": "IPA採点講評（要旨）：全体として正答率は低め。設問2(1)はステルス機能の効果を答える誤りが多く、(2)はSSID・MACアドレスが暗号化できないことの理解が不足。設問4(1)は、利用者認証を含めたログ取得の観点が課題。", "18": "IPA採点講評（要旨）：全体として正答率は低め。設問1(4)は、負荷が偏りやすくなる条件を答えられた解答が少なかった。設問3(2)(3)は、未変更社員・実施済み社員・社外の三者間の転送経路を図3に書き込めば導けるとされている。"};


  var STORE_KEY = "nw-r03h-pm1-cbt-mock-v3";

  /* ============================= STATE ============================= */
  var state = {
    screen:"cover",
    current:null,
    answers:{},
    marked:{},
    memos:{},
    history:{},
    correct:{},
    marks:{}
  };
  (function hydrate(){
    var saved=null;
    try{ var raw=localStorage.getItem(STORE_KEY); if(raw) saved=JSON.parse(raw); }catch(e){}
    if(saved){
      state.answers = saved.answers || {};
      state.marked = saved.marked || {};
      state.memos = saved.memos || {};
      state.history = saved.history || {};
      state.correct = saved.correct || {};
      state.marks = saved.marks || {};
    }
  })();
  var zoomLevel = 100;
  var memoOpen = false;
  var resumeScroll = false;
  var markerTool = null, markerSize = 3, invertOn = false, statusOpen = false, calcOpen = false, memoTrans = false;
  var activeItemId = null, splitH = 54, splitV = 50;
  var modelShown = false;
  var HISTORY_LIMIT = 20;

  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        answers:state.answers, marked:state.marked, memos:state.memos, history:state.history, correct:state.correct, marks:state.marks
      }));
    }catch(e){}
  }
  function clearProblemData(problemId){
    allItems(findProblem(problemId)).forEach(function(it){ delete state.answers[it.id]; delete state.marked[it.id]; });
    delete state.memos[problemId];
    Object.keys(state.marks).forEach(function(k){ if(k.indexOf(problemId+':')===0) delete state.marks[k]; });
    save();
  }
  function snapshotAnswers(problem){
    var out={};
    allItems(problem).forEach(function(it){
      if(state.answers[it.id]!=null) out[it.id]=JSON.parse(JSON.stringify(state.answers[it.id]));
    });
    return out;
  }
  function pushHistory(problem){
    var snap = snapshotAnswers(problem);
    if(!Object.keys(snap).length) return;
    var list = state.history[problem.id] || [];
    var lastJson = list.length ? JSON.stringify(list[0].answers) : null;
    if(lastJson===JSON.stringify(snap)) return;
    list.unshift({ts:Date.now(), answers:snap});
    if(list.length>HISTORY_LIMIT) list = list.slice(0,HISTORY_LIMIT);
    state.history[problem.id]=list;
    save();
  }
  function fmtDateTime(ts){
    var d=new Date(ts);
    function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function findProblem(id){ for(var i=0;i<PROBLEMS.length;i++){ if(PROBLEMS[i].id===id) return PROBLEMS[i]; } return null; }
  function examLabelFor(problemId){
    for(var i=0;i<EXAM_GROUPS.length;i++){ if(EXAM_GROUPS[i].ids.indexOf(problemId)>=0) return EXAM_GROUPS[i].title; }
    return '';
  }
  function allItems(problem){
    var out=[];
    problem.groups.forEach(function(g){ g.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function isAnswered(it){
    var v = state.answers[it.id];
    if(v==null) return false;
    if(it.type==="text") return String(v).trim().length>0;
    if(it.type==="multi") return Array.isArray(v) && v.length>0;
    if(it.type==="fields"){
      if(!v) return false;
      return it.fields.some(function(f){
        var fv=v[f.key];
        if(f.type==="multi") return Array.isArray(fv)&&fv.length>0;
        return fv && String(fv).trim().length>0;
      });
    }
    return false;
  }
  function progressOf(problem){
    var items = allItems(problem);
    var done = items.filter(isAnswered).length;
    return {done:done, total:items.length};
  }
  function ucount(str){ return Array.from(String(str||"")).length; }

  function toast(msg){
    var t=document.getElementById("toast");
    t.textContent=msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h=setTimeout(function(){ t.classList.remove("show"); },1800);
  }

  /* ============================= RENDER: COVER ============================= */
  function renderCover(root){
    var html = '';
    html += '<div class="cover-wrap"><div class="cover">';
    html += '<div class="cover-band"><span class="tag">CBT方式 学習モード</span>';
    html += '<h1>ネットワークスペシャリスト試験 午後I 過去問</h1>';
    html += '<p>記述式の過去問題を、CBT形式の画面で1問ずつ演習できる学習用ツール</p></div>';
    html += '<div class="cover-body">';
    html += '<div class="cover-meta">';
    html += '<div><div class="k">出題年度</div><div class="v">'+EXAM_GROUPS.length+'年度分</div></div>';
    html += '<div><div class="k">解答方式</div><div class="v">記述式</div></div>';
    html += '<div><div class="k">採点</div><div class="v">自己採点</div></div>';
    html += '</div>';

    html += '<h2>注意事項</h2>';
    html += '<ul class="rules">';
    html += '<li>本問題は<b>紙の過去問題（ネットワークスペシャリスト試験 午後I）</b>を、CBT試験を想定した画面で解答できるようにしたものです。</li>';
    html += '<li>下から<b>1問ずつ選んで</b>演習できます。途中で他の問題に切り替えても、それぞれの解答は個別に保存されます。</li>';
    html += '<li>解答は自動的にこの端末（ブラウザ）に保存されます。閉じても続きから再開できます。</li>';
    html += '<li>本ツールに採点機能はありません。学習後に表示される解答一覧を、IPA公式サイトで公開されている解答例と照らして自己採点してください。</li>';
    html += '</ul>';

    EXAM_GROUPS.forEach(function(group){
      html += '<h2>'+escapeHtml(group.title)+'</h2>';
      html += '<div class="pick-grid">';
      group.ids.forEach(function(pid){
        var p = findProblem(pid);
        var pr = progressOf(p);
        var statusText = pr.done===0 ? '未着手' : (pr.done>=pr.total ? '解答済み' : pr.done+' / '+pr.total+' 解答済み');
        var statusClass = pr.done===0 ? '' : (pr.done>=pr.total ? 'done' : 'partial');
        html += '<button class="pick-card select" data-select="'+p.id+'">';
        html += '<div class="num">'+p.label+'</div>';
        html += '<div class="ttl">'+p.title+'</div>';
        html += '<div class="desc">'+p.lede+'</div>';
        html += '<div class="pick-status '+statusClass+'">'+statusText+'</div>';
        html += '</button>';
      });
      html += '</div>';
    });

    html += '<div style="font-size:12.5px;color:var(--text-muted);margin-top:14px;">時間の計測はありません。自分のペースで解答できます。</div>';

    html += '</div></div></div>';
    root.innerHTML = html;

    root.querySelectorAll('[data-select]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var pid = Number(btn.getAttribute('data-select'));
        var pr = progressOf(findProblem(pid));
        state.current = pid;
        state.screen = "exam";
        zoomLevel = 100;
        resumeScroll = pr.done>0 && pr.done<pr.total;
        save();
        render();
      });
    });
  }

  /* ============================= RENDER: EXAM ============================= */
  var currentPageIdx = {};

  function inputChanged(it, value, fieldKey){
    if(fieldKey){
      var obj = state.answers[it.id] || {};
      obj[fieldKey]=value;
      state.answers[it.id]=obj;
    } else {
      state.answers[it.id]=value;
    }
    save();
  }

  function renderTextField(it, opts){
    opts = opts||{};
    var val = opts.value!=null?opts.value:"";
    var limit = opts.limit!=null?opts.limit:it.limit;
    var big = !limit || limit>=15;
    var idAttr = opts.id;
    var html;
    if(big){
      html = '<textarea rows="'+(limit && limit<=30?2:3)+'" id="'+idAttr+'" data-ans="1"'+(limit?' data-limit="'+limit+'"':'')+'>'+escapeHtml(val)+'</textarea>';
    } else {
      html = '<input type="text" id="'+idAttr+'" data-ans="1"'+(limit?' data-limit="'+limit+'"':'')+' value="'+escapeHtml(val)+'">';
    }
    return html;
  }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function renderMultiOptions(it, selectedArr, groupId, selectCount){
    selectedArr = selectedArr||[];
    var atLimit = selectCount>0 && selectedArr.length>=selectCount;
    var html='<div class="opt-grid" data-group="'+groupId+'">';
    it.options.forEach(function(pair){
      var key=pair[0], text=pair[1];
      var checked = selectedArr.indexOf(key)>=0;
      var disabled = (!checked && atLimit);
      html += '<label class="opt-chip'+(checked?' checked':'')+(disabled?' disabled':'')+'">';
      html += '<input type="checkbox" value="'+key+'" '+(checked?'checked':'')+(disabled?' disabled':'')+' data-multi="'+groupId+'">';
      html += '<span>'+escapeHtml(text===key?key:(key+"："+text))+'</span></label>';
    });
    html+='</div>';
    if(selectCount>0){
      html += '<div class="opt-hint">'+selectedArr.length+' / '+selectCount+' 個選択中'+(atLimit?'（上限に達しました。解除すると他を選べます）':'')+'</div>';
    } else {
      html += '<div class="opt-hint">該当するものを全て選択（'+selectedArr.length+'個選択中）</div>';
    }
    return html;
  }

  function renderQCard(it){
    var answered = isAnswered(it);
    var marked = !!state.marked[it.id];
    var html = '<div class="qcard'+(answered?' answered':'')+(marked?' marked':'')+'" id="card-'+it.id+'">';
    html += '<div class="qcard-head"><span class="status-dot"></span>';
    if(it.sub) html+='<span class="sub">'+escapeHtml(it.sub)+'</span>';
    html += '<span class="prompt">'+escapeHtml(it.prompt)+'</span>';
    html += '<label class="later-chk"><input type="checkbox" data-mark="'+it.id+'"'+(marked?' checked':'')+'>後で見直す</label>';
    html += '</div>';

    if(it.type==="text"){
      var val = state.answers[it.id]||"";
      html += '<div class="field-row">'+renderTextField(it,{id:"in-"+it.id, value:val});
      if(it.limit){
        var n=ucount(val);
        html += '<div class="counter'+(n>it.limit?' over':'')+'">'+n+' / '+it.limit+' 文字</div>';
      }
      html += '</div>';
    } else if(it.type==="multi"){
      html += renderMultiOptions(it, state.answers[it.id]||[], it.id, it.selectCount||0);
    } else if(it.type==="fields"){
      var fv = state.answers[it.id]||{};
      html += '<div class="field-pair">';
      it.fields.forEach(function(f){
        html += '<div class="field-row"><label>'+escapeHtml(f.label)+'</label>';
        if(f.type==="multi"){
          html += renderMultiOptions(f, fv[f.key]||[], it.id+"__"+f.key, 0);
        } else {

  function bindAnswerPane(container, problem){
    function onAnswerInput(el){
      var lim = Number(el.getAttribute('data-limit')||0);
      if(lim){
        var chars = Array.from(el.value);
        if(chars.length>lim) el.value = chars.slice(0,lim).join('');
      }
      var id = el.id.replace(/^in-/,'');
      var parts = id.split('__');
      if(parts.length===2){ inputChanged({id:parts[0]}, el.value, parts[1]); }
      else { inputChanged({id:id}, el.value); }
      refreshLiveBits(container, problem);
    }
    container.querySelectorAll('[data-ans]').forEach(function(el){
      el.addEventListener('input', function(e){ if(!e.isComposing) onAnswerInput(el); else { var id=el.id.replace(/^in-/,''); var pp=id.split('__'); if(pp.length===2) inputChanged({id:pp[0]}, el.value, pp[1]); else inputChanged({id:id}, el.value); refreshLiveBits(container, problem); } });
      el.addEventListener('compositionend', function(){ onAnswerInput(el); });
    });
    container.addEventListener('focusin', function(e){
      var card = e.target.closest ? e.target.closest('.qcard') : null;
      setActiveItem(card ? card.id.replace(/^card-/,'') : null);
    });
    container.querySelectorAll('[data-multi]').forEach(function(el){
      el.addEventListener('change', function(){
        var group = el.getAttribute('data-multi');
        var parts = group.split('__');
        var itemId = parts[0], fieldKey = parts[1];
        var boxes = container.querySelectorAll('[data-multi="'+cssEscape(group)+'"]');
        var picked=[];
        boxes.forEach(function(b){ if(b.checked) picked.push(b.value); });
        if(fieldKey){ inputChanged({id:itemId}, picked, fieldKey); }
        else { inputChanged({id:itemId}, picked); }

        // update this option group's disabled-state / hint in place (no full re-render, keeps scroll position)
        var it=null;
        problem.groups.forEach(function(g){ g.items.forEach(function(x){ if(x.id===itemId) it=x; }); });
        var selectCount = (it && !fieldKey && it.type==="multi") ? (it.selectCount||0) : 0;
        var atLimit = selectCount>0 && picked.length>=selectCount;
        var optGrid = boxes.length ? boxes[0].closest('.opt-grid') : null;
        if(optGrid){
          optGrid.querySelectorAll('.opt-chip').forEach(function(label){
            var box = label.querySelector('input[type=checkbox]');
            var checked = box.checked;
            var disabled = (!checked && atLimit);
            box.disabled = disabled;
            label.classList.toggle('checked', checked);
            label.classList.toggle('disabled', disabled);
          });
          var hint = optGrid.nextElementSibling;
          if(hint && hint.classList.contains('opt-hint')){
            hint.textContent = selectCount>0
              ? (picked.length+' / '+selectCount+' 個選択中'+(atLimit?'（上限に達しました。解除すると他を選べます）':''))
              : ('該当するものを全て選択（'+picked.length+'個選択中）');
          }
        }
        refreshLiveBits(container, problem);
      });
    });
    container.querySelectorAll('[data-mark]').forEach(function(el){
      el.addEventListener('change', function(){
        var id = el.getAttribute('data-mark');
        if(el.checked) state.marked[id] = true; else delete state.marked[id];
        save();
        var card = document.getElementById('card-'+id);
        if(card) card.classList.toggle('marked', el.checked);
        refreshStatus(problem);
      });
    });
  }
  function cssEscape(s){ return s.replace(/[^a-zA-Z0-9_-]/g, function(c){return '\\'+c;}); }

  function refreshLiveBits(container, problem){
    // update char counters + status dot + answered class without full rerender (keeps caret position)
    container.querySelectorAll('.qcard').forEach(function(card){
      var id = card.id.replace(/^card-/,'');
      var it = null;
      problem.groups.forEach(function(g){ g.items.forEach(function(x){ if(x.id===id) it=x; }); });
      if(!it) return;
      var ans = isAnswered(it);
      card.classList.toggle('answered', ans);
    });
    // counters
    container.querySelectorAll('textarea, input[type=text]').forEach(function(inp){
      var wrap = inp.closest('.field-row');
      if(!wrap) return;
      var counter = wrap.querySelector('.counter');
      if(!counter) return;
      var limitMatch = counter.textContent.match(/\/\s*(\d+)/);
      var limit = limitMatch?Number(limitMatch[1]):0;
      var n = Array.from(inp.value).length;
      counter.textContent = n+' / '+limit+' 文字';
      counter.classList.toggle('over', n>limit);
    });
    var bd = document.getElementById('bottomDone');
    if(bd){ var pr=progressOf(problem); bd.textContent = pr.done+' / '+pr.total; }
    refreshStatus(problem);
  }

  function makeDraggable(win, handle){
    handle.addEventListener('pointerdown', function(e){
      if(e.target.closest('button,input,label')) return;
      var r = win.getBoundingClientRect();
      var offX = e.clientX - r.left, offY = e.clientY - r.top;
      win.style.left = r.left+'px'; win.style.top = r.top+'px';
      win.style.right = 'auto'; win.style.bottom = 'auto';
      handle.setPointerCapture(e.pointerId);
      function move(ev){
        var x = Math.max(0, Math.min(window.innerWidth-60, ev.clientX-offX));
        var y = Math.max(0, Math.min(window.innerHeight-40, ev.clientY-offY));
        win.style.left = x+'px'; win.style.top = y+'px';
      }
      function up(){
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', up);
        handle.removeEventListener('pointercancel', up);
      }
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', up);
      handle.addEventListener('pointercancel', up);
    });
  }

  function setupCalc(win){
    var disp = win.querySelector('.calc-disp');
    var acc = null, op = null, entry = '0', fresh = true;
    function show(v){ disp.textContent = String(v); }
    function compute(a, b, o){
      if(o==='+') return a+b;
      if(o==='-') return a-b;
      if(o==='*') return a*b;
      if(o==='/') return b===0 ? NaN : a/b;
      return b;
    }
    function fmt(n){
      if(!isFinite(n)) return 'エラー';
      return String(Math.round(n*1e10)/1e10);
    }
    function press(k){
      if(/^[0-9]$/.test(k)){
        entry = (fresh || entry==='0') ? k : entry+k; fresh = false; show(entry);
      } else if(k==='.'){
        if(fresh){ entry='0.'; fresh=false; }
        else if(entry.indexOf('.')<0) entry+='.';
        show(entry);
      } else if(k==='C'){
        acc=null; op=null; entry='0'; fresh=true; show(entry);
      } else if(k==='B'){
        if(!fresh && entry.length>1) entry = entry.slice(0,-1); else entry='0';
        show(entry);
      } else if(k==='='){
        if(op!==null && acc!==null){
          var r = compute(acc, parseFloat(entry), op);
          entry = fmt(r); acc=null; op=null; fresh=true; show(entry);
        }
      } else {
        var cur = parseFloat(entry);
        if(op!==null && acc!==null && !fresh){ acc = compute(acc, cur, op); show(fmt(acc)); }
        else if(acc===null || op===null){ acc = cur; }
        op = k; fresh = true;
      }
    }
    win.querySelectorAll('[data-k]').forEach(function(b){
      b.addEventListener('click', function(){ press(b.getAttribute('data-k')); });
    });
    win.querySelectorAll('[data-size]').forEach(function(b){
      b.addEventListener('click', function(){
        win.classList.remove('s-s','s-m','s-l');
        win.classList.add('s-'+b.getAttribute('data-size'));
      });
    });
    show(entry);
  }

  function setupMarkCanvas(canvas, img, key){
    var ctx = canvas.getContext('2d');
    function redraw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      (state.marks[key]||[]).forEach(function(s){
        if(!s.p.length) return;
        ctx.strokeStyle = MARK_COLORS[s.c] || MARK_COLORS.y;
        ctx.lineWidth = s.w * 7;
        ctx.beginPath();
        ctx.moveTo(s.p[0][0]*canvas.width, s.p[0][1]*canvas.height);
        if(s.p.length===1) ctx.lineTo(s.p[0][0]*canvas.width+0.01, s.p[0][1]*canvas.height);
        for(var i=1;i<s.p.length;i++) ctx.lineTo(s.p[i][0]*canvas.width, s.p[i][1]*canvas.height);
        ctx.stroke();
      });
    }
    function fit(){
      canvas.width = img.naturalWidth || 1075;
      canvas.height = img.naturalHeight || 1520;
      redraw();
    }
    if(img.complete && img.naturalWidth){ fit(); }
    else { canvas.width = 1075; canvas.height = 1520; img.addEventListener('load', fit); }
    canvas.redrawMarks = redraw;

    var stroke = null;
    function pt(e){
      var r = canvas.getBoundingClientRect();
      return [Math.round((e.clientX-r.left)/r.width*10000)/10000, Math.round((e.clientY-r.top)/r.height*10000)/10000];
    }
    canvas.addEventListener('pointerdown', function(e){
      if(!markerTool) return;
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      stroke = {c:markerTool, w:markerSize, p:[pt(e)]};
      if(!state.marks[key]) state.marks[key] = [];
      state.marks[key].push(stroke);
      redraw();
    });
    canvas.addEventListener('pointermove', function(e){
      if(!stroke) return;
      stroke.p.push(pt(e));
      redraw();
    });
    function end(){ if(stroke){ stroke = null; save(); } }
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
  }

  function initSplitter(workArea, leftPane, splitter){

    if(mq.addEventListener) mq.addEventListener('change', apply);
    splitter.addEventListener('pointerdown', function(e){
      e.preventDefault();
      splitter.setPointerCapture(e.pointerId);
      splitter.classList.add('drag');

        var r = workArea.getBoundingClientRect();
        var vertical = mq.matches;
        var p = vertical ? (ev.clientY-r.top)/r.height : (ev.clientX-r.left)/r.width;
        p = Math.max(0.2, Math.min(0.8, p)) * 100;
        if(vertical) splitV = p; else splitH = p;
        apply();
      }
      function up(){
        splitter.classList.remove('drag');
        splitter.removeEventListener('pointermove', move);
        splitter.removeEventListener('pointerup', up);
        splitter.removeEventListener('pointercancel', up);
      }
      splitter.addEventListener('pointermove', move);
      splitter.addEventListener('pointerup', up);
      splitter.addEventListener('pointercancel', up);
    });
  }
